  <title id="title">经典书导读 — 921 本豆瓣高分经典</title>
  <desc id="desc">暖纸底标题：经典书导读，副标题 921 本豆瓣高分经典，总体观点、核心观点、全书结构；右侧是三本书：《人月神话》8.4、《人件》8.2、《代码大全》9.3，带豆瓣评分。</desc>

  <rect width="1200" height="340" rx="26" fill="#faf7f0" stroke="#e8e0d0" stroke-width="1.5"/>

