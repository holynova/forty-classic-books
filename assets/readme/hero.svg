      <g><rect x="194" y="232" width="108" height="36" rx="18" fill="#ffffff" stroke="#d8d0c0" stroke-width="1.5"/><text x="248" y="256">全站搜索</text></g>
      <g><rect x="314" y="232" width="144" height="36" rx="18" fill="#ffffff" stroke="#d8d0c0" stroke-width="1.5"/><text x="386" y="256">想读 / 已读</text></g>
    </g>
  </g>

  <g id="book-covers" font-family="Georgia, serif">
