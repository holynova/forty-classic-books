<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 别让我思考：好页面不用动脑子</b> 用户打开页面时大脑处于省电模式，只想赶紧把事办完。每个按钮、每段文字都要一眼就懂。让用户犹豫超过一秒的设计，都是在添堵。</p><p class="pv1-ex"><i>例</i>注册按钮写“免费注册”，用户秒懂。写成“开启您的数字化之旅”，用户就得愣住：这是注册吗？淘宝的“立即购买”大按钮又大又红，不用想就知道点它能下单。</p></li><li><p class="pv1-idea"><b>2. 用户不读页面，他们只扫描</b> 用户像雷达一样扫页面，只抓关键词、大标题、加粗字，剩下的直接跳过。页面是写给“扫描仪”看的，得经得起扫：层级分明、重点突出。</p><p class="pv1-ex"><i>例</i>微信公众号文章没人逐字读，都是先扫标题和小标题，觉得有料才细看。所以多用小标题分段、关键词加粗、要点用列表排开。</p></li><li><p class="pv1-idea"><b>3. 差不多就行：用户不做最优选择</b> “满意即可”：用户点第一个看起来靠谱的选项，错了再回头。试错成本太低了，点错了点返回就行，谁还费脑子比较？</p><p class="pv1-ex"><i>例</i>百度搜“北京好吃的火锅”，你会点第一个标题顺眼的进去，不行再退回来。搜索结果页的关键是让每个结果都清晰可信，用户敢放心点下去。</p></li><li><p class="pv1-idea"><b>4. 点击几次无所谓，每次点击要明确</b> 用户不怕多点几下，怕的是每点一下都要赌一把：“点这个对吗？会去哪儿？”只要每一步都清清楚楚，点十次也乐意。</p><p class="pv1-ex"><i>例</i>美团外卖从首页到结算七八步，但每一步都知道自己在哪、下一步去哪，所以不累。反倒是某些网站的按钮写着“了解更多”，点下去是报价单还是广告全靠猜。</p></li><li><p class="pv1-idea"><b>5. 删掉一半文字，再把剩下的删掉一半</b> 网页上的字 90% 没人看，却全是噪音。它们让真正重要的信息更难被扫到。先删一半，再删一半，留下的每个字都得是“不写用户就办不成事”的。</p><p class="pv1-ex"><i>例</i>很多公司官网首页写“欢迎光临，我公司成立于 2003 年……”。用户只想找客服电话，这些字全是路障。苹果官网一句话：“iPhone 16，强，翻天。”</p></li><li><p class="pv1-idea"><b>6. 导航要像街头指示牌，一眼看懂</b> 好导航像马路上的指示牌：需要的时候准时出现、清晰醒目。再配上面包屑“首页 &gt; 女装 &gt; 连衣裙”。用户随时知道自己在哪、怎么回去。</p><p class="pv1-ex"><i>例</i>淘宝把“首页、购物车、我的”固定在底部。不管逛多深，一抬手就能回家。用户在网站里迷路，和在商场里迷路一样，只想赶紧出去。</p></li><li><p class="pv1-idea"><b>7. 可用性测试不用贵：找 3 个人，一个上午测一次</b> 别把可用性测试当科研项目。找 3 个普通用户，给几个典型任务，看着他们用，记下卡住的地方。一个上午就能发现 80% 的问题。精髓是早测、常测。</p><p class="pv1-ex"><i>例</i>点餐小程序原型做好，直接拉 3 个同事来“帮我点一份宫保鸡丁”。有人在支付页卡住，有人找不到优惠券入口，10 分钟问题全暴露了。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分：可用性的基本原则（第 1–6 章）</b> 三条定律加用户真实行为：用户扫描不阅读、选择差不多就行。设计手法：为扫描设计、借用惯例、视觉层级分明、删繁就简、导航清晰。</p><p class="pv1-ex"><i>例</i>就像高速公路广告牌：司机只有 3 秒钟看，字大、信息少、一眼懂。网页也一样，用户只给你几秒钟，这部分教你在这几秒里把事说清楚。</p></li><li><p class="pv1-part"><b>第二部分：让用户顺利上路（第 7 章）</b> 首页是网站的“大堂”，几秒钟内必须回答三个问题：这是什么网站？我能干什么？为什么选你不选别人？</p><p class="pv1-ex"><i>例</i>携程首页一眼就懂：订机票酒店的，搜索框在正中间。反观某些企业官网，一屏轮播图配“携手共创美好未来”，三个问题一个都没回答。</p></li><li><p class="pv1-part"><b>可用性之争：农夫和牧牛人为什么总吵架（第 8 章）</b> 团队里关于可用性的争论吵不出结果，因为人人都从自己立场出发。解法是别争对错，让真实用户投票——也就是做测试。</p><p class="pv1-ex"><i>例</i>老板要首页加轮播大图，设计师说没人看。别吵，找 5 个用户来，看看有几个人点轮播图，数据一摆出来，争论自然结束。</p></li><li><p class="pv1-part"><b>自己动手的可用性测试（第 9–10 章）</b> 低成本测试全流程：怎么招人、怎么出任务、测试时只看不说。核心一句话：可用性就是基本礼貌，别给用户添麻烦。</p><p class="pv1-ex"><i>例</i>每月抽一个上午，请 3 个用户用 20 分钟。你会发现一堆自己天天看却视而不见的问题。</p></li><li><p class="pv1-part"><b>移动时代与“救命，老板要我……”（第 11–13 章）</b> 移动端屏幕小、场景碎片化，可用性要求更高。最后一章教你怎么跟老板沟通：把“你错了”说成“我们一起让用户更爽”。</p><p class="pv1-ex"><i>例</i>老板要在首页塞 8 个入口，别硬顶。“我们找 3 个用户试试，看他们找不找得到充值入口？”争论变成一次 30 分钟的小测试。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b22">
<p class="pv1-eyebrow"><span class="no">NO.22</span><span>UI/UX 设计</span></p>
<h3>《用户体验要素》</h3>
<p class="pv1-bmeta">The Elements of User Experience · 杰西·詹姆斯·加勒特 · 机械工业出版社 · 2003</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/2297549/" target="_blank" rel="noopener">豆瓣 8.3 分 · 4517人评价 →</a></p>
<p class="pv1-lede">用“五个层面”把产品工作从战略讲到视觉。产品经理和设计师的共同语言。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>用户体验不是界面美不美。它是一个五层系统：战略、范围、结构、框架、表现，从抽象到具体。下层支撑上层：战略错了，界面再漂亮也没用。</p><p>2003 年出版时人人都在谈用户体验，却没人说得清它包括什么、从哪儿下手。这张五层面图一出来，全行业有了共同语言。吵按钮颜色是表现层的问题，争功能优先级回战略层找依据。</p><p>它确立了 UX 工作的完整版图。用户体验从公司战略就开始，而不是最后“美化一下界面”的收尾工作。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 6</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 战略层：先回答“我们为什么做，用户为什么用”</b> 这是最底层、也最重要的一层。产品目标：我们想得到什么。用户需求：用户是谁、痛点是什么。想不清楚，上面盖什么楼都是歪的。</p><p class="pv1-ex"><i>例</i>外卖 App 战略是“30 分钟必达”，首页就该突出预估时间和超时赔付。战略是“全网最低价”，首页就该突出红包补贴。战略不同，整个产品就不同。</p></li><li><p class="pv1-idea"><b>2. 范围层：把战略翻译成“做什么、不做什么”的清单</b> 把战略变成具体清单：功能型产品列功能规格，内容型产品列内容需求。“不做什么”跟“做什么”同样重要，范围不清，项目就无限膨胀。</p><p class="pv1-ex"><i>例</i>微信 1.0 只做免费文字和语音消息，不做朋友圈、公众号、支付。范围足够克制，才能快速上线、快速验证。</p></li><li><p class="pv1-idea"><b>3. 结构层：决定用户怎么走、信息怎么组织</b> 开始画产品的“骨架”。交互设计（点了按钮发生什么）和信息架构（内容怎么分类、让用户找得到）。这一层看不见，但用得顺不顺全靠它。</p><p class="pv1-ex"><i>例</i>淘宝把商品组织成“女装 &gt; 连衣裙 &gt; 夏季连衣裙”的类目树。顺着点，总能找到想要的。12306 买票：查车次→选座→填乘车人→支付，一步接一步不能跳。</p></li><li><p class="pv1-idea"><b>4. 框架层：单个页面的布局，按钮放哪儿、导航怎么摆</b> 每个房间的家具摆放图：按钮放哪儿、页面间怎么穿梭、信息怎么呈现。产出就是线框图：先摆对位置，再谈好看。</p><p class="pv1-ex"><i>例</i>微信聊天页输入框永远在底部、发送键在右下角，十年没变，因为符合拇指操作。框架层摆错了，表现层再美也救不回来。</p></li><li><p class="pv1-idea"><b>5. 表现层：视觉是最后一步，不是第一步</b> 用户直接看到的东西：颜色、字体、图标、间距。作用是把下面四层的决策用最美的方式呈现。项目一启动就先做视觉稿，做出来也只是“好看的空壳”。</p><p class="pv1-ex"><i>例</i>先定户型再买沙发：户型没定就买了欧式大沙发，可能门都进不去。先画线框图把布局定死，再上视觉，才不会返工。</p></li><li><p class="pv1-idea"><b>6. 下层决定上层：地基歪了，装修再好也白搭</b> 五层自下而上依赖：改上层容易，改下层上面层层跟着动。出问题别急着改界面，先一层层往下问：战略错了？范围不清？还是结构乱了？</p><p class="pv1-ex"><i>例</i>电商 App 转化率低，老板让按钮做大做红，改完没起色。病根在结构层：结算要填 12 项信息，用户嫌烦直接放弃。结构层的问题，表现层救不了。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>开篇：用户体验为什么重要</b> 用户体验是产品在用户手里留下的全部印象和感受。体验差，用户用脚投票，每个接触点都在塑造口碑。</p><p class="pv1-ex"><i>例</i>买手机不只看参数，还在意开箱、系统、客服。这些加起来才是用户体验：它不是某个部门的事，是产品的全部。</p></li><li><p class="pv1-part"><b>第一章：战略层——产品目标与用户需求</b> 产品目标要具体可衡量，用户需求要靠调研而不是拍脑袋。两者对齐，项目才有主心骨。</p><p class="pv1-ex"><i>例</i>滴滴早期战略很清楚。目标是“让更多人打到车”，用户痛点是“打车难、等待久”。所有功能都围着这个转，没有一个多余动作。</p></li><li><p class="pv1-part"><b>第二章：范围层——功能规格与内容需求</b> 把战略变成清单：功能型产品写功能规格，内容型产品写内容需求。排优先级、敢说“不做”，防止需求膨胀。</p><p class="pv1-ex"><i>例</i>像列购物清单去超市：写下“只买牛奶、鸡蛋、面包”，才能抵挡住零食区的诱惑。</p></li><li><p class="pv1-part"><b>第三章：结构层——交互设计与信息架构</b> 产品的骨架。交互设计管“用户一步步怎么操作”，信息架构管“内容怎么分类组织”。产出是流程图、网站地图这些看不见、但决定顺不顺的东西。</p><p class="pv1-ex"><i>例</i>宜家的路线是设计好的：你顺着箭头逛完全场，不知不觉买了一堆计划外的东西。用户以为自己在逛，其实每一步都在设计之中。</p></li><li><p class="pv1-part"><b>第四章：框架层——界面、导航、信息设计</b> 单个页面怎么布局：元素放哪儿、导航怎么做、信息怎么排版。先画线框图验证布局，再谈美观。</p><p class="pv1-ex"><i>例</i>像摆家具：沙发对电视、餐桌挨厨房，位置对了住着才顺。App 的搜索框放顶部、主按钮放拇指够得着的地方，一个道理。</p></li><li><p class="pv1-part"><b>第五章：表现层——视觉设计</b> 色彩、字体、图标、风格统一。视觉不只是好看，还要强化品牌、引导视线、传达层级。</p><p class="pv1-ex"><i>例</i>饿了么的蓝、美团的黄，瞟一眼颜色就知道是谁——这就是表现层的品牌识别力。</p></li><li><p class="pv1-part"><b>收尾：要素的应用</b> 框架在不同项目里灵活用：内容型和功能型产品侧重点不同。层与层之间来回迭代，不是一条道走到黑。</p><p class="pv1-ex"><i>例</i>做新闻 App，信息架构是重头戏；做修图 App，交互设计是重头戏。菜谱是参考，炒菜还得看火候。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b23">
<p class="pv1-eyebrow"><span class="no">NO.23</span><span>UI/UX 设计</span></p>
<h3>《设计心理学》</h3>
<p class="pv1-bmeta">The Design of Everyday Things · 唐纳德·诺曼 · 中信出版社 · 1988</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/1288844/" target="_blank" rel="noopener">豆瓣 8.2 分 · 4051人评价 →</a></p>
<p class="pv1-lede">从“门总推错”讲起：用户犯错通常不是人笨，是设计蠢，好设计顺着人的心理来。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>当用户用不好一个产品时，错的不是用户，是设计。诺曼用认知心理学解释人机交互。人靠心智模型猜测产品怎么工作，靠产品给的提示验证。设计要做的，就是填平“执行鸿沟”和“评估鸿沟”。让人知道怎么下手，也知道做成了没。</p><p>1988 年出版时设计界还在比造型，诺曼第一个系统地把认知心理学搬进设计。他开创了“以用户为中心的设计”。那扇分不清推拉的“诺曼门”，成了全世界设计课的开场案例。</p><p>它重新定义了“错误”：用户犯的每一个错，都是设计欠用户的一个解释。防呆设计、可用性测试、以用户为中心的设计流程，全都从这里生根发芽。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 不是你笨，是那扇门有问题（诺曼门）</b> 分不清推拉的门，不是用户观察力差，是设计没把“怎么开”这件事说清楚。不需要说明书、不需要试错的东西，才是好设计。</p><p class="pv1-ex"><i>例</i>双手抱着快递走到玻璃门前，推一下没开，拉一下开了，进去又被第二扇门挡住。装横杆的门只能推、装把手的门只能拉——设计本身就该把答案写好。</p></li><li><p class="pv1-idea"><b>2. 示能：东西要“长得像”它的用法</b> “示能”指东西的外形材质本身就在告诉你它能怎么用：椅子示能坐，按钮示能按。好的示能让用户不用学、不用猜，看一眼就知道怎么下手。</p><p class="pv1-ex"><i>例</i>剪刀的指环明明白白告诉你手指伸哪儿、怎么用力。微波炉上一排一模一样的按钮，每个都示能按。却没一个告诉你按了会发生什么。</p></li><li><p class="pv1-idea"><b>3. 意符：明确告诉用户“这里可以动手”</b> “意符”是“请在这里操作”的明确信号。比如按钮的阴影、链接的下划线、“向右滑动解锁”的箭头。没有意符，用户面对能用的东西也不知道从哪儿下手。</p><p class="pv1-ex"><i>例</i>App 里纯文字“提交”，用户不敢点。加上圆角边框和阴影，立刻有了“按钮感”。电梯开门键上的“◀▶”符号也是意符。</p></li><li><p class="pv1-idea"><b>4. 映射：控制器和效果的对应关系要符合直觉</b> “映射”指控制器和它控制的东西的对应关系。空间排布对应、方向对应：往上推就是开大，往左拨就是选左边，顺着人的直觉来。</p><p class="pv1-ex"><i>例</i>老式燃气灶四个炉头排成方形、四个旋钮排成一排，永远记不住哪个管哪个。把旋钮也排成方形一一对应，看一眼就会。</p></li><li><p class="pv1-idea"><b>5. 心智模型：用户脑子里对“这怎么工作”的猜想</b> 用户永远是靠猜来用产品的：猜对了用得顺，猜错了就犯错。设计师的任务是让产品符合用户已有的猜想，或帮用户建立正确的猜想。</p><p class="pv1-ex"><i>例</i>很多人以为把文件拖进回收站就是彻底删除了，结果只是挪了个地方，硬盘照样满。好的设计顺着用户的心智模型来，不嘲笑它。</p></li><li><p class="pv1-idea"><b>6. 错误分两种：手滑和想错，好设计都要防得住</b> “手滑”是想得对但手没跟上（点错按钮），“想错”是理解就错了（转错人）。手滑靠撤销、确认兜底，想错靠提示和反馈纠正。人一定会犯错，设计要把代价降到最低。</p><p class="pv1-ex"><i>例</i>微信消息两分钟内可撤回，就是给手滑兜底。某些 App“删除聊天记录”一点就没，连确认都没有。这是在惩罚人类的正常失误。</p></li><li><p class="pv1-idea"><b>7. 反馈和约束：做了要吭声，关键处要设限</b> “反馈”是操作后给个回应（声音、震动、动画），让人知道成了没成。“约束”是主动限制错误发生（插不错、跳不过）。反馈管事后安心，约束管事前防呆。</p><p class="pv1-ex"><i>例</i>洗衣机按启动键“滴”一声、亮灯、开始转，三重反馈告诉你“收到”。SIM 卡一角斜切，只能以唯一正确的方向插进去。物理约束让你想犯错都没机会。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一章：日常用品的“心理病理学”</b> 一堆“坏设计”展览。分不清推拉的门、记不清旋钮管哪个炉头的灶、总按错的电话机。用户受苦，病根在设计。</p><p class="pv1-ex"><i>例</i>读完你会发现生活中处处是“带病上岗”的设计，而你受的那些气，真不是你的错。</p></li><li><p class="pv1-part"><b>第二章：日常行为的心理学——行动的七个阶段</b> 人完成行动要经过七个阶段：定目标、定意图、定动作、执行、感知、解释、评估。好设计填平“执行鸿沟”（不知道怎么下手）和“评估鸿沟”（不知道做成了没）。</p><p class="pv1-ex"><i>例</i>调空调到 26 度：遥控器按钮太多找不到温度键，就是执行鸿沟。按了没任何显示，你不知道设没设上，就是评估鸿沟。</p></li><li><p class="pv1-part"><b>第三章：头脑中的知识与世界上的知识</b> 人做事靠两种知识：记在脑子里的和写在世界上的。好设计尽量把知识放在世界上，别考验用户的记忆力。</p><p class="pv1-ex"><i>例</i>朋友家 8 个电灯开关，你一个个试，这是在逼你瞎猜。旁边贴个小标签“客厅”“阳台”，就不用猜了。</p></li><li><p class="pv1-part"><b>第四章：知道要做什么——约束、可发现性与反馈</b> 让用户“知道该干嘛”的三大法宝：约束、可发现性、反馈。约束限制错误可能，可发现性靠示能和意符，反馈是做了给回应。这是全书最实用的设计工具箱。</p><p class="pv1-ex"><i>例</i>乐高积木凸起和凹槽只有一种拼法，拼错了根本卡不进去。约束的大师：小孩不用教就会玩。</p></li><li><p class="pv1-part"><b>第五章：人为错误？不，是糟糕的设计</b> 系统讲错误：手滑 vs 想错、为什么指责用户没用，以及防错设计的方法。从根上让错误发生不了，或让错误代价足够小。</p><p class="pv1-ex"><i>例</i>药瓶“按压再旋转”瓶盖：小孩打不开，大人一看就懂。软件里删文件前输入文件名确认，高危操作不让你手滑就酿大祸。</p></li><li><p class="pv1-part"><b>第六、七章：设计思维与商业中的设计</b> 从单品设计上升到方法论。以用户为中心的设计流程：观察、想法、原型、测试，不断迭代。以及设计如何在商业组织里落地。</p><p class="pv1-ex"><i>例</i>像做菜：先尝一口（观察用户）、想想缺啥（想法）。小火试做一份（原型）、请人试吃（测试）。不好吃就回炉。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b24">
<p class="pv1-eyebrow"><span class="no">NO.24</span><span>UI/UX 设计</span></p>
<h3>《交互设计精髓》</h3>
<p class="pv1-bmeta">About Face: The Essentials of Interaction Design · 艾伦·库珀 · 电子工业出版社 · 2007</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/3279105/" target="_blank" rel="noopener">豆瓣 8.7 分 · 1370人评价 →</a></p>
<p class="pv1-lede">交互设计的开山之作：别堆功能，先搞清用户想干成什么事。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>库珀是“交互设计”一词的提出者。他发现：软件按工程师的脑回路长大，用户用起来一头雾水。</p><p>全书核心：目标导向设计。别问用户要什么功能，问他想达成什么目标。功能是手段，目标才是目的。</p><p>人物角色、场景剧本、目标导向——源头都在这本书里。今天产品和交互设计天天用的方法，从这里来。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 别问用户要什么功能，问他想达成什么目标</b> 用户说“要个导出按钮”，真实目标可能是“月底交报表”。只给按钮，他还得自己排版；直接给到排好版的报表，问题才算解决。</p><p class="pv1-ex"><i>例</i>打车软件：用户说“我要选车型”。真实目标是“准时赶飞机”。好设计直接告诉你“现在出发，50 分钟到，赶得上”。</p></li><li><p class="pv1-idea"><b>2. 给用户起个名字、编个故事：人物角色</b> 别对着“用户”这种模糊概念设计。虚构几个具体的人——有名字、年龄、习惯和目标。每次决策都问：他会这么用吗？具体的人能让全团队想到一块去。</p><p class="pv1-ex"><i>例</i>给老年人做 App，别想“老年用户”四个字。想“王阿姨，68 岁，眼花，怕点错”。这行小字她看得清吗？这按钮她敢点吗？立刻有画面感。</p></li><li><p class="pv1-idea"><b>3. 软件别按工程师的思路长，要按用户的思路长</b> 工程师心里有“实现模型”，用户脑子里有“心理模型”。难用的软件，错在把前者直接端给用户。好设计是翻译：里面再复杂，端出来的是用户那套说法。</p><p class="pv1-ex"><i>例</i>早期数码相机菜单写“ISO 感光度”，用户想的是“屋里太暗，拍清楚点”。订酒店：系统管“房型编码”，用户只想选“大床还是双床”。</p></li><li><p class="pv1-idea"><b>4. 为“中间用户”设计：新手会长大，专家是少数</b> 用户分三类：新手会长大，专家是少数，大多数人永远“会用但不精通”。别为新手做成幼儿园，也别为专家堆满快捷键。抓住中间用户，两头都照顾得到。</p><p class="pv1-ex"><i>例</i>微信：新手只会发语音，用久了自然学会发红包。开车也一样：同一辆车，是给“会开但不飙车”的大多数人设计的。</p></li><li><p class="pv1-idea"><b>5. 每个应用都有“姿态”：干活的和打扰人的不是一回事</b> 主权姿态的应用独占屏幕、长时间使用，比如 Word，用户要它强大。瞬时姿态的应用弹出来三秒就走，比如闹钟，用户要它别烦人。用错姿态就是灾难。</p><p class="pv1-ex"><i>例</i>闹钟响时只给“关闭 / 稍后”两个大按钮就对了。要是弹窗里还让你选铃声分类、设重复规则，起床气会更大。</p></li><li><p class="pv1-idea"><b>6. 撤销是最好的后悔药：让人敢点，错了能回</b> 用户不敢探索，是怕点错了回不来。强大的撤销能把“万一错了”的焦虑清零，人就敢大胆试。确认框是偷懒设计：把软件该承担的风险转嫁给了用户。</p><p class="pv1-ex"><i>例</i>微信消息两分钟内可撤回，发错群还能抢救，大家才敢随手发。PS 里 Ctrl+Z 一路退回去，你才敢大胆调色。</p></li><li><p class="pv1-idea"><b>7. 别让用户干本该软件干的活</b> 记住单号再粘贴、同一信息填三遍、导文件前先建五个文件夹。这些“附加工作”都是软件懒、让人勤。凡是软件能记住、算出来、自动填的，都不该麻烦用户。</p><p class="pv1-ex"><i>例</i>12306 记住常用乘车人，一点就选好。手机验证码自动填充：系统能读短信，就别让人眼看手输。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一篇 认识用户（一）：目标导向与两种模型</b> 方法论地基：目标导向设计、实现模型与心理模型、用户三类划分。</p><p class="pv1-ex"><i>例</i>做外卖 App，先分清用户目标是“快点吃上”，而不是“浏览美食图”。后面所有设计才有准星。</p></li><li><p class="pv1-part"><b>第一篇 认识用户（二）：从研究到需求</b> 怎么真正了解用户：定性研究、提炼人物角色、写场景剧本、整理需求。</p><p class="pv1-ex"><i>例</i>给快递员设计 App，去跟车跑一天，而不是在办公室里脑补他需要什么。</p></li><li><p class="pv1-part"><b>第二篇 设计的行为与形式（一）：原则、姿态与流</b> 从需求到设计：设计原则、应用“姿态”选择、让操作顺滑的“流”。</p><p class="pv1-ex"><i>例</i>音乐 App：播放页是主权姿态要沉浸，音量弹窗是瞬时姿态要快。调子定错，全片垮掉。</p></li><li><p class="pv1-part"><b>第二篇 设计的行为与形式（二）：细节中的魔鬼</b> 交互细节：消除附加工作、设计好行为、用隐喻降低学习成本。</p><p class="pv1-ex"><i>例</i>删除文件拖进废纸篓——“扔东西”这个隐喻，人人一学就会。</p></li><li><p class="pv1-part"><b>第三篇 数据与操作：搜索、撤销、文件与输入</b> 硬骨头：搜索、撤销、保存按钮、数据输入、直接操作。</p><p class="pv1-ex"><i>例</i>网盘自动保存让你告别 Ctrl+S，撤销键让你敢删敢改。</p></li><li><p class="pv1-part"><b>第三篇 控件与反馈：窗口、对话框与错误处理</b> 界面零件的正确用法：窗口、控件、对话框，以及不招人烦的报错写法。</p><p class="pv1-ex"><i>例</i>动不动弹“你确定吗”是最懒的设计。好报错告诉用户“出什么事了、怎么修”，而不是甩一句“错误 404”。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b25">
<p class="pv1-eyebrow"><span class="no">NO.25</span><span>UI/UX 设计</span></p>
<h3>《写给大家看的设计书》</h3>
<p class="pv1-bmeta">The Non-Designer&#x27;s Design Book · 罗宾·威廉姆斯 · 人民邮电出版社 · 2012</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/3323633/" target="_blank" rel="noopener">豆瓣 8.6 分 · 13047人评价 →</a></p>
<p class="pv1-lede">非设计师的救星：四个简单原则，让你的 PPT、海报从“业余”变“专业”。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>很多人不是没审美，是没人告诉他规则。作者把平面设计归纳成四个原则：亲密性、对齐、重复、对比。</p><p>核心论点：设计不是天赋，是手艺。业余和专业的差距，是几个基本原则，不是灵感。</p><p>全书都是“错误示范 vs 正确示范”的对比图，看完立刻能用。无数人的设计启蒙都是它。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 亲密性：关系近的放一起，关系远的分开</b> 距离近，读者默认它们是一伙的；离得远，默认没关系。别把标题和正文隔老远，也别把不相关的字挤在一起。分组是最便宜的信息组织手段。</p><p class="pv1-ex"><i>例</i>菜单上“宫保鸡丁 38 元”：菜名价格必须挨着，一眼是一对。价格全对齐右边、菜名在左边，客人得来回找。</p></li><li><p class="pv1-idea"><b>2. 对齐：每个元素都要和另一个元素发生关系</b> 页面上任何东西都不能随手乱放。每个元素都要和另一个元素有视觉连线。左对齐、居中都行，关键是“有意识”。业余感的最大来源，就是元素各摆各的。</p><p class="pv1-ex"><i>例</i>简历里时间都右对齐、公司名都左对齐，立刻整齐。时间忽左忽右，HR 看着就累。</p></li><li><p class="pv1-idea"><b>3. 重复：让页面有“一家子”的感觉</b> 把某些视觉元素在全篇重复：同样的标题样式、色块、线条装饰。重复带来统一感和专业感，还能形成品牌记忆。一页 PPT 用五种标题颜色，看着像拼盘。</p><p class="pv1-ex"><i>例</i>咖啡店菜单、海报、外卖袋都用同一种牛皮纸色和手写体，你立刻记得住它。每次换风格，你就记不住。</p></li><li><p class="pv1-idea"><b>4. 对比：要对比就对比得彻底，犹犹豫豫最难看</b> 大小、粗细、颜色拉开差距就拉干脆。最忌“有点不一样又不太一样”：标题只比正文大一号，读者以为是排错了。对比让重点一眼跳出来。</p><p class="pv1-ex"><i>例</i>海报主标题 72 号加粗、副标题 24 号细体，一眼分清主次。主标题 36 号、副标题 32 号，看着就像没调好。</p></li><li><p class="pv1-idea"><b>5. 字体分六大家族，先认家族再谈搭配</b> 英文字体六大类：古典衬线、现代衬线、粗衬线、无衬线、手写体、装饰体。中文也有对应感觉：宋体正式，黑体利落。认出“家族”，才知道什么气质往哪儿用。</p><p class="pv1-ex"><i>例</i>婚礼请柬用手写体，科技发布会用无衬线黑体。儿童乐园海报用严肃宋体加粗，就像让会计主持婚礼，浑身别扭。</p></li><li><p class="pv1-idea"><b>6. 字体搭配的铁律：要么极像，要么极不像</b> 两种“有点像又不太像”的字体放一起，像穿错袜子。要么用同一家族的粗细变化，要么选反差极大的两种。一份设计里字体别超过三种。</p><p class="pv1-ex"><i>例</i>标题粗黑体、正文细黑体：同一家族，稳。标题宋体、正文仿宋：远看像双胞胎、细看又不是，处处别扭。</p></li><li><p class="pv1-idea"><b>7. 去掉“默认感”：软件默认样式是业余的代名词</b> Word 默认宋体五号、PPT 默认模板——这些“默认”看着业余。因为它们没经过任何设计决策。专业第一步不是加特效，是把默认的东西亲手调一遍：字号、行距、对齐、间距。</p><p class="pv1-ex"><i>例</i>同样一份通知，改成“段落间空一行、关键句加粗”。立刻从“随手一贴”变成“正式文件”。设计感来自克制，不是装饰。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分 设计原理之一：亲密性</b> 第一个原则：用距离远近分组信息，大量“改前 vs 改后”对比实例。</p><p class="pv1-ex"><i>例</i>名片上姓名电话抱团、公司信息抱团，立刻清爽。就像整理抽屉：袜子和袜子放一起。</p></li><li><p class="pv1-part"><b>第一部分 设计原理之二：对齐</b> 对齐的几种方式和威力：全篇统一、有意识，左对齐最稳。</p><p class="pv1-ex"><i>例</i>海报上时间地点联系方式左对齐成一条线，观众顺着读不费劲。每行都居中，眼睛得左右找。</p></li><li><p class="pv1-part"><b>第一部分 设计原理之三：重复</b> 用重复制造统一感：重复颜色、形状、线条、字体，让零散元素成整体。</p><p class="pv1-ex"><i>例</i>系列海报每张顶部同一条红色横线，观众立刻知道是一套的。像音乐里的副歌，一响就知道“到这儿了”。</p></li><li><p class="pv1-part"><b>第一部分 设计原理之四：对比</b> 对比的运用和禁忌：大小粗细颜色都能对比，但半吊子对比不如不做。</p><p class="pv1-ex"><i>例</i>促销海报“5 折”巨大加粗，重点自己跳出来。只大一点点，顾客还以为你心虚。</p></li><li><p class="pv1-part"><b>第二部分 字体设计之一：认识六大字体类别</b> 六大字体家族：古典衬线、现代衬线、粗衬线、无衬线、手写体、装饰体。</p><p class="pv1-ex"><i>例</i>银行年报用古典衬线体显得可信，音乐节海报用装饰体显得好玩。选错家族像穿拖鞋去面试。</p></li><li><p class="pv1-part"><b>第二部分 字体设计之二：字体对比与搭配规则</b> 字体搭配规则：对比要强烈、避免冲突，一页不超过三种字体。</p><p class="pv1-ex"><i>例</i>请柬标题用华丽手写体、正文用朴素宋体：反差大，反而互相成就。</p></li><li><p class="pv1-part"><b>第三部分 设计小知识与综合练习</b> 致命细节：寡妇孤儿行、首字下沉、标点规范，外加四个原则的综合实战。</p><p class="pv1-ex"><i>例</i>段落最后一行一个字孤零零掉下来（寡妇行），像衣服线头没剪。调一下字距就能收回去。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b26">
<p class="pv1-eyebrow"><span class="no">NO.26</span><span>UI/UX 设计</span></p>
<h3>《设计师要懂心理学》</h3>
<p class="pv1-bmeta">100 Things Every Designer Needs to Know About People · 苏珊·魏因申克 · 人民邮电出版社 · 2013</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/23708491/" target="_blank" rel="noopener">豆瓣 7.6 分 · 1812人评价 →</a></p>
<p class="pv1-lede">100 条“人就是这样”的心理学结论，每条翻译成一句设计该怎么做。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>作者是行为心理学家。她发现设计师和心理学隔着一堵墙：论文看不懂，看懂了不知怎么用。</p><p>她把跟设计最相关的 100 个原理分成十章。按“人如何看、如何读、如何记”来分。每条都是“结论 + 解释 + 设计小贴士”。</p><p>这是本案头辞典，不用从头读到尾。吵架时能甩出依据，是它给设计师最大的底气。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 人一次只能记住三四件事，别考验用户的记性</b> 短时记忆一次只能装 3 到 4 个组块。别让用户“记住验证码再填”，也别让他“记住上一页价格再回来比”。这样的设计都是在为难人。记不住是脑子说了算，不是用户笨。</p><p class="pv1-ex"><i>例</i>导航菜单一口气列 20 个选项，用户看完就忘。拆成 4 到 5 个一组，世界都清净了。背手机号你也 3-4-4 分段，大脑天生这么干。</p></li><li><p class="pv1-idea"><b>2. 开头和结尾最容易被记住，重要的放两头</b> 系列位置效应：一串东西里开头和结尾最容易记住，中间最容易忘。最重要的放开头，其次放结尾，中间放次要的。别把王牌藏中间。</p><p class="pv1-ex"><i>例</i>App 底部导航 5 个位置，最重要的“首页”和“我的”放两端。面试自我介绍开头结尾精心准备，中间经历 HR 转头就忘。</p></li><li><p class="pv1-idea"><b>3. 选择越多，人越难下手</b> 希克定律：选项越多，决策越慢；多到一定程度，人干脆不选了。别以为功能多等于好。好设计替用户做减法，或分步骤呈现。</p><p class="pv1-ex"><i>例</i>超市 30 种果酱，顾客逛一圈空手走；只摆 6 种，销量反而更高。朋友纠结吃饭，你说“火锅还是日料”他立刻能定。</p></li><li><p class="pv1-idea"><b>4. 人看别人怎么做，自己就跟着做</b> 社会认同：拿不准时，人看周围人怎么做。评分、销量、评论都在说“很多人买了，你放心”。普通人的评价比专家管用，因为用户觉得“他跟我一样”。</p><p class="pv1-ex"><i>例</i>两家奶茶店，一家排长队一家没人，你大概率去排队那家。“这么多人选”本身就是信号。</p></li><li><p class="pv1-idea"><b>5. 别让人“回忆”，要让人“认出来”</b> “再认”比“回忆”省力得多：从选项里认出一个，比凭空想起一个容易。好界面多用“选”少用“填”，多给提示少考记忆。让用户凭空回忆的设计都反人性。</p><p class="pv1-ex"><i>例</i>登录用“从相册选出设过的三张图”，比“输入密保答案”容易。就像考试：选择题永远比填空题简单。</p></li><li><p class="pv1-idea"><b>6. 人在压力下会变“笨”，关键时刻界面越简单越好</b> 耶克斯 - 多德森定律：一点紧张能专注，压力一大表现直线下降。赶时间、着急时，平时会用的功能都不会了。关键流程要简单到“闭眼走对”。</p><p class="pv1-ex"><i>例</i>赶飞机时改签，平时三步搞定，着急时每步都像迷宫。好流程只剩“改到哪班、点确定”两步。</p></li><li><p class="pv1-idea"><b>7. 人的眼睛会被“脸”和“会动的东西”吸走</b> 视觉硬连线：对人脸和运动极度敏感，这是进化留下的。页面放张人脸，目光一定先去那儿；有地方在闪，别的都看不见。用好是引导，用滥是灾难。</p><p class="pv1-ex"><i>例</i>落地页放张微笑客服照片，转化率常上涨，人脸自带信任感。表单旁放闪烁广告条，用户就填不好表了。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一章 人是如何看的</b> 视觉原理：先看整体轮廓、余光先发现运动，格式塔原理决定我们怎么分组信息。</p><p class="pv1-ex"><i>例</i>网页上两个按钮离得近，你默认它们是一对。离得远，觉得没关系——“接近性”在替你分组。</p></li><li><p class="pv1-part"><b>第二章 人是如何阅读的</b> 阅读冷知识：认词靠字形轮廓，全大写反而难读；屏幕阅读是扫读不是逐字读。</p><p class="pv1-ex"><i>例</i>没人逐字读你的长文案，用户扫小标题和加粗。重要的词加粗、段落要短，是给“扫读”准备的。</p></li><li><p class="pv1-part"><b>第三章 人是如何记忆的</b> 短时记忆 3~4 组块，开头结尾记得牢，再认比回忆容易。</p><p class="pv1-ex"><i>例</i>用户说“我上次是这么操作的”，很可能记错了。记忆每次回想都会被改写，不如直接观察他操作。</p></li><li><p class="pv1-part"><b>第四章 人是如何思考的</b> 心智模型、认知负荷和心流：人对东西怎么运转有预想，超负荷就宕机。</p><p class="pv1-ex"><i>例</i>用户默认共享单车“扫码就开锁”。你的车还要先按隐藏按钮，他的心智模型就崩了。</p></li><li><p class="pv1-part"><b>第五~六章 注意力与动机</b> 注意力与动机：一次只能好好干一件事；多巴胺爱不可预测的奖励，目标要拆小。</p><p class="pv1-ex"><i>例</i>集卡活动让人停不下来，因为“下一张是啥”不可预测。把大目标拆成“再集 2 张就换购”，比“集满 50 张”有劲。</p></li><li><p class="pv1-part"><b>第七~十章 社会性、感觉、犯错与决策</b> 社会性与情绪：从众、面子；人会犯错，要做容错；决策怕损失、爱走捷径。</p><p class="pv1-ex"><i>例</i>“仅剩 2 件”比“库存充足”更能促单。人对“失去”的敏感，远超对“得到”的渴望。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b27">
<p class="pv1-eyebrow"><span class="no">NO.27</span><span>UI/UX 设计</span></p>
<h3>《情感化设计》</h3>
<p class="pv1-bmeta">Emotional Design: Why We Love (or Hate) Everyday Things · 唐纳德·诺曼 · 电子工业出版社 · 2005</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/1314262/" target="_blank" rel="noopener">豆瓣 8.1 分 · 2348人评价 →</a></p>
<p class="pv1-lede">好用只是及格：让人掏钱、念念不忘的，是设计里的“情绪价值”。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>写完《设计心理学》讲“好用”后，诺曼发现了反例。有些东西不好用，人们却爱得不行。</p><p>他意识到漏掉了情感。认知分三层：本能层管好不好看，行为层管好不好用，反思层管有没有意义。</p><p>情绪直接参与决策：好看的东西人觉得更好用，有故事的东西人愿意多付钱。今天说的“情绪价值”，源头多从这本书来。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 设计有三层：好看、好用、有意义</b> 诺曼借脑科学提出三层认知：本能层管第一印象，是秒级直觉。行为层管顺不顺手；反思层管事后回味——这东西代表什么、跟我有什么故事。三层都讨好，才是完整设计。</p><p class="pv1-ex"><i>例</i>买跑鞋：配色戳你（本能层），上脚不磨脚（行为层）。它是你跑完首个半马那双（反思层），三层全中，这牌子你一辈子都认。</p></li><li><p class="pv1-idea"><b>2. 好看的东西，真的更好用</b> 全书最出名的结论：好看的产品，用户会觉得更好用。哪怕功能一模一样。愉悦让人放松、思路开阔，小毛病就包容了。美不是装饰，是可用性的一部分。</p><p class="pv1-ex"><i>例</i>两个功能相同的记账 App，界面精美的那个你觉得“它算得准”。界面丑的，卡一下你就想卸载。颜值自带“容错光环”。</p></li><li><p class="pv1-idea"><b>3. 开心让人有创意，焦虑让人抠细节</b> 正面情绪让人思维发散、更有创造力，也更能容忍小问题。负面情绪让人聚焦细节、谨慎小心。设计要看场景配情绪：探索型产品给松弛感，关键型产品给掌控感。</p><p class="pv1-ex"><i>例</i>旅行 App 用明亮插画和轻松文案，你才有心情慢慢逛。银行 App 转大账时，你要的是冷静清晰——这时候卖萌只会让你更慌。</p></li><li><p class="pv1-idea"><b>4. 让人掏钱的，往往是反思层</b> 反思层是最高一层：文化、身份、记忆、自我形象。好不好用只是入场券，真正让人掏钱的，是“这东西像我”“它有故事”。品牌忠诚度基本是反思层在打工。</p><p class="pv1-ex"><i>例</i>有人花几万买机械表，买的不是准时，是“匠心”“传承”的故事。老字号糕点味道不如新网红，但“小时候的味道”值三倍价钱。</p></li><li><p class="pv1-idea"><b>5. 玩乐不是不务正业：有趣让人愿意学</b> 好玩的设计降低学习门槛，让人主动探索。游戏化核心是给人“掌控感 + 小惊喜”的循环。人在玩的状态下学东西最快，也最宽容。</p><p class="pv1-ex"><i>例</i>背单词 App 做成闯关，连击给特效——枯燥背诵变成“再来一局”。宜家说明书没一个字，全是小人漫画，跟下来还有成就感。</p></li><li><p class="pv1-idea"><b>6. 机器人也得懂点“人情世故”</b> 诺曼预测：未来的机器必须处理情感。不是让它们有感情，而是能读懂人的情绪、做出合乎情境的反应。你着急时还慢悠悠讲笑话的语音助手，就是情感设计不及格。</p><p class="pv1-ex"><i>例</i>加班到半夜，智能音箱说“辛苦了，要不要来点轻音乐”。比机械报时贴心一百倍。扫地机器人卡住说“我被困住了”，卖个萌人就不想踢它。</p></li><li><p class="pv1-idea"><b>7. 有时候，一点点“不好用”是故意的</b> 诺曼的反直觉观点：不是所有东西都要极致顺滑。有些“摩擦”是设计的一部分。重要的决定就该慢一点、难一点，让人停下来想一想。反思层有时需要行为层让路。</p><p class="pv1-ex"><i>例</i>删除文件时的二次确认、转账时的人脸识别：多这一步很烦。但它逼你确认“我是认真的”。就像茶道：明明有速溶茶，人们还是愿意花半小时走流程。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>序幕：三个茶杯</b> 开篇故事：三个茶杯——好看的、好用的、有纪念意义的，引出全书问题。</p><p class="pv1-ex"><i>例</i>就像衣柜里那件起球却舍不得扔的卫衣：不好看，也不保暖了。但那是毕业旅行买的——喜欢一个东西的理由，从不止“好用”。</p></li><li><p class="pv1-part"><b>第一章 好看的东西更好用</b> 全书最出名的结论：美感提升感知可用性，情绪直接影响人对产品的评价。</p><p class="pv1-ex"><i>例</i>试驾两辆参数相同的车，内饰精致那辆你觉得“动力都更顺”。日常直觉，背后有实验撑腰。</p></li><li><p class="pv1-part"><b>第二章 情感与设计的多种面孔</b> 情绪和认知纠缠在一起：正面负面情绪各有用处，设计要“看菜下碟”。</p><p class="pv1-ex"><i>例</i>过山车故意制造紧张——负面情绪在这里是商品。医院挂号机让你紧张，就是事故。</p></li><li><p class="pv1-part"><b>第三章 设计的三个层次：本能、行为、反思</b> 理论核心：拆解三层各自管什么，以及三层怎么配合、怎么打架。</p><p class="pv1-ex"><i>例</i>买车：展厅一见钟情（本能层），试驾方向盘顺手（行为层）。跟邻居说“这是限量版”（反思层）——这就是“买买买心理学”。</p></li><li><p class="pv1-part"><b>第四章 乐趣和游戏</b> “好玩”的设计价值：游戏化、惊喜感、掌控感让人更愿学、更宽容、更忠诚。</p><p class="pv1-ex"><i>例</i>迪士尼把排队区做成游览动线还时不时互动——两小时排下来不觉得亏。铁栏杆排队两小时，能把人排抑郁。</p></li><li><p class="pv1-part"><b>第五~六章 有情感的机器与机器人的未来</b> 展望未来：机器读懂人的情绪、做出得体反应，以及人与机器人的情感关系。</p><p class="pv1-ex"><i>例</i>车载助手发现你叹气，主动问“要不要换首歌”。机器人长得太像人却差一点，会让人毛骨悚然（恐怖谷）——拟人化是技术活。</p></li><li><p class="pv1-part"><b>第七章 商业世界中的设计 + 尾声</b> 情感设计怎么做成生意：品牌、溢价、忠诚度；尾声“我们都是设计师”。</p><p class="pv1-ex"><i>例</i>苹果店的包装把拆箱做成仪式，开箱视频收获百万播放。这不是浪费钱，是反思层在印钞。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b28">
<p class="pv1-eyebrow"><span class="no">NO.28</span><span>UI/UX 设计</span></p>
<h3>《认知与设计》</h3>
<p class="pv1-bmeta">Designing with the Mind in Mind · 杰夫·约翰逊 · 人民邮电出版社 · 2011</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/6792322/" target="_blank" rel="noopener">豆瓣 8.6 分 · 1719人评价 →</a></p>
<p class="pv1-lede">把认知心理学翻译成界面设计规则：大脑怎么工作，界面就该怎么设计。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>每条 UI 规范背后都有脑科学撑腰。人眼的结构、注意力的带宽、记忆的容量，是改不了的硬件限制。设计只能顺着大脑来，不能拧着来。</p><p>懂了心理机制，就不用死记规范。错误提示放出错处旁边，菜单比命令行好用，确认页回显关键信息。这些全是同一套原理推导出来的。</p><p>每章讲一个心理事实，配一堆界面正反例。短小、好读，读完立刻能用。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 8</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 知觉自带偏见：我们看到的是以为会看到的</b> 大脑看到的不是客观世界，而是按经验“脑补”出来的。第一原则是符合预期：危险用红色、按钮长得像按钮。</p><p class="pv1-ex"><i>例</i>删除做成红色加垃圾桶图标，用户秒懂；做成绿色对勾，用户会愣住——预期被违背，用户只会当成 bug。</p></li><li><p class="pv1-idea"><b>2. 视觉天生爱找结构：用间距和对齐分组，不用画框框</b> 人脑自动把靠得近、长得像的元素看成一组。用间距和对齐就能“免费”分组，根本不用画框框。</p><p class="pv1-ex"><i>例</i>外卖 App 里菜名、价格、图片靠得近，就被自动看成一道菜；间距一乱，用户分不清哪行价格对应哪道菜。</p></li><li><p class="pv1-idea"><b>3. 注意力是稀缺资源：一次只让人认真做一件事</b> 注意力像手电，只能照亮一小块。重要信息别藏角落，别同时弹三个弹窗。每多一个抢注意力的东西，任务完成率就掉一截。</p><p class="pv1-ex"><i>例</i>支付页面把“确认支付”做大、收起其他链接；表单填到一半弹广告，用户直接关掉走人。</p></li><li><p class="pv1-idea"><b>4. 再认容易、回忆难：给选项让用户“认出来”，别让人“背出来”</b> 从一堆东西里挑出见过的很轻松，凭空想起来很费劲。好界面用菜单和历史记录让用户“认”，烂界面让人背编号、背流程。</p><p class="pv1-ex"><i>例</i>搜索框自动补全、输入法联想、外卖“再来一单”都是让人“认”；让用户输入 12 位订单号查快递，纯粹在为难记忆。</p></li><li><p class="pv1-idea"><b>5. 短期记忆只有三四格：别让用户在心里“端着”信息到处跑</b> 工作记忆只能装三四个“组块”。界面要在用到的地方直接摆出信息，别让用户记住上一页的数字再填到下一页。</p><p class="pv1-ex"><i>例</i>转账确认页完整显示“转给谁、转多少钱”，而不是只写“确认转账”四个字。</p></li><li><p class="pv1-idea"><b>6. 阅读是反天性的：用户是“扫描”页面，不是“读书”</b> 人脑为说话进化，不是为阅读进化。用户打开页面是“扫”关键词，不是读文章。</p><p class="pv1-ex"><i>例</i>更新说明写成“1. 更快了 2. 修了闪退”，比一大段散文强得多。标题、加粗、列表，就是给扫描准备的。</p></li><li><p class="pv1-idea"><b>7. 选项太多反而选不出来：给默认、做精简、分步骤</b> 选项越多、越复杂，人越难下决定、事后越不满意。这就是选择悖论。</p><p class="pv1-ex"><i>例</i>套餐页摆 12 种资费，用户看完直接关掉——不是不想买，是选不出来；给默认、分步骤，一次只呈现几个选项。</p></li><li><p class="pv1-idea"><b>8. 按钮越大越近越好点：重要操作做大，危险操作设坎</b> 点中目标的时间跟大小成反比、跟距离成正比。重要按钮做大、放顺手的位置；危险操作反其道而行之，故意做小、加二次确认。</p><p class="pv1-ex"><i>例</i>底部导航按钮又大又近，拇指一点就中；微信删聊天要先左滑再点删除，连设两道坎。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分：视觉与知觉（第 1-6 章）</b> 讲眼睛和大脑怎么“看”界面：知觉偏见、格式塔分组、色觉局限。这是全书的地基。</p><p class="pv1-ex"><i>例</i>学完就知道：错误提示为什么用红色？分组为什么靠间距？重要按钮为什么不放角落？每条规范背后都有大脑的原理。</p></li><li><p class="pv1-part"><b>第二部分：注意与记忆（第 7-8 章）</b> 注意力一次只能顾一件事，短期记忆只有三四个格子。设计必须顺着这个限制来，不能跟它较劲。</p><p class="pv1-ex"><i>例</i>表单分步填，确认页回显关键信息，验证码和提示放同一屏。都是在给大脑的小内存减负。</p></li><li><p class="pv1-part"><b>第三部分：再认、学习与决策（第 9-11 章）</b> 再认比回忆轻松，从经验中学比从零算快，人还经常不理性。顺着这些特点设计，用户“不用学就会”。</p><p class="pv1-ex"><i>例</i>“再来一单”、默认选项、选项控制在五个以内——都是在利用人的这些特点。</p></li><li><p class="pv1-part"><b>第四部分：时间要求（第 12 章）</b> 等待的忍耐按秒算：0.1 秒觉得即时，1 秒觉得卡，10 秒人就走了。快和“显得快”同样重要。</p><p class="pv1-ex"><i>例</i>按钮一点立刻变色（0.1 秒内给反馈），加载超过 1 秒给进度条。都在跟大脑的等待忍耐度赛跑。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b29">
<p class="pv1-eyebrow"><span class="no">NO.29</span><span>UI/UX 设计</span></p>
<h3>《微交互》</h3>
<p class="pv1-bmeta">Microinteractions: Designing with Details · 丹·萨弗 · 人民邮电出版社 · 2013</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/25744600/" target="_blank" rel="noopener">豆瓣 7.6 分 · 449人评价 →</a></p>
<p class="pv1-lede">伟大的产品是细节堆出来的。这本书教你设计只有一秒钟的交互：开关、点赞、解锁、提示音。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>微交互是围绕一个用例的小而完整的产品瞬间。比如设闹钟、点赞、静音开关、密码强度提示。大功能决定用户买不买，小细节决定用户留不留。</p><p>每个微交互都能拆成四个零件。触发器：怎么开始。规则：背后的逻辑。反馈：让用户感知到。循环与模式：随时间怎么变。拿着四个零件检查任何小功能，哪里别扭一目了然。</p><p>这本书第一次给细节设计立了规矩。先把微交互找出来，逐个打磨四个零件，最后装到真机上找人试。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 先找到微交互：把产品拆成几十个“一秒钟的小瞬间”</b> 登录、收藏、刷新、空状态、密码强度提示……列成清单，一个一个打磨。决定用户每天心情的，恰恰是这些一秒钟的小事。</p><p class="pv1-ex"><i>例</i>天气 App 的下拉刷新动画、微信的“拍一拍”，用户每天碰几十次。注册流程，几个月才走一次。</p></li><li><p class="pv1-idea"><b>2. 触发器分两种：用户手动触发，和系统自动触发</b> 开关有两种：用户自己发动的，比如点、滑、说；系统自动发动的，比如到点提醒、电量低警告。设计时必须回答：怎么开始？别让用户猜，更别偷偷来。</p><p class="pv1-ex"><i>例</i>微信长按头像“拍一拍”是用户触发；电量到 20% 自动弹窗是系统触发。</p></li><li><p class="pv1-idea"><b>3. 规则是隐形的逻辑：一次只做一件事，用限制提前防错</b> 规则是触发后的逻辑，用户看不见，但处处被管着。好规则符合直觉，用限制提前防止犯错，而不是等犯错了再惩罚。</p><p class="pv1-ex"><i>例</i>密码框实时提示“还需要 1 个数字”，而不是提交后才报错；日期选择器直接禁掉不存在的日期。</p></li><li><p class="pv1-idea"><b>4. 反馈让人“看见”发生了什么：要快，要克制，别放烟花</b> 规则是隐形的，用户只能通过反馈知道“成了没”。反馈要快（0.1 秒内有反应）、要克制；没有反馈的操作，用户会觉得产品“死了”。</p><p class="pv1-ex"><i>例</i>点赞后心形“砰”地变大回弹；提交按钮一点立刻变灰显示“提交中”。</p></li><li><p class="pv1-idea"><b>5. 文案也是反馈：把“Error 404”说成人话</b> 按钮上的字、报错提示、空状态文案都叫微文案。好的微文案像人说话：清楚、简短、有温度，出错时还告诉用户“怎么办”。</p><p class="pv1-ex"><i>例</i>别写“Error 404”。写“这个页面去火星了，带你回首页”就够了。</p></li><li><p class="pv1-idea"><b>6. 循环让微交互越用越聪明，模式能少则少</b> 循环是微交互随时间的变化：用得越多越懂你。模式是特殊状态，每多一个，用户的脑子就多一份负担，能少则少。</p><p class="pv1-ex"><i>例</i>输入法记住常用词，越用越顺手；一个 App 有 5 种模式，用户永远搞不清自己在哪种。</p></li><li><p class="pv1-idea"><b>7. 签名式微交互：给产品造一个让人记住的“招牌动作”</b> 每个伟大产品都有一个标志性的小瞬间，用户会拿它跟朋友炫耀。挑一个跟品牌气质最配的做到极致，让它成为产品的签名。</p><p class="pv1-ex"><i>例</i>iPhone 的滑动解锁、微信的“摇一摇”、Kindle 的翻页动画。提起任何一个，你立刻知道是哪家。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第 1 章：什么是微交互</b> 给微交互下定义：围绕一个用例的小而完整的产品瞬间——细节决定产品的生死。</p><p class="pv1-ex"><i>例</i>闹钟 App 里有“再睡 5 分钟”小睡的被留了下来，没有的被删了。差，就差在这一个微交互上。</p></li><li><p class="pv1-part"><b>第 2 章：触发器</b> 讲触发器的两种类型（用户触发和系统触发），以及触发条件怎么定。</p><p class="pv1-ex"><i>例</i>下拉刷新是用户触发的，低电量提醒是系统触发的。设计前先把每个微交互的“开关”想清楚。</p></li><li><p class="pv1-part"><b>第 3 章：规则</b> 讲触发之后发生什么：背后的逻辑、合理的限制、怎么提前防止用户犯错。</p><p class="pv1-ex"><i>例</i>点赞只能点一次，份数上限 10 份。这些看不见的逻辑，决定微交互会不会出乱子。</p></li><li><p class="pv1-part"><b>第 4 章：反馈</b> 讲怎么让用户感知结果：视觉、声音、震动反馈和微文案——快、克制、说人话。</p><p class="pv1-ex"><i>例</i>点赞的回弹动画、发送成功的“嗖”声——用户靠这些感知到“事情成了”。</p></li><li><p class="pv1-part"><b>第 5 章：循环与模式</b> 讲微交互随时间怎么变：循环让它越用越聪明，模式是负担要慎用。</p><p class="pv1-ex"><i>例</i>输入法越用越懂你是循环，勿扰模式一开全静音是模式。</p></li><li><p class="pv1-part"><b>第 6 章与附录：组合实战与测试</b> 把四个零件装起来做完整案例。小东西也要装到真机上找人试。</p><p class="pv1-ex"><i>例</i>把“开关静音”按四个零件做出来，装到真机上。找 5 个用户实际拨一下，看懂不懂、爽不爽。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b30">
<p class="pv1-eyebrow"><span class="no">NO.30</span><span>UI/UX 设计</span></p>
<h3>《简单法则》</h3>
<p class="pv1-bmeta">The Laws of Simplicity · 约翰·梅达 · 中国人民大学出版社 · 2007</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/2144413/" target="_blank" rel="noopener">豆瓣 7.7 分 · 682人评价 →</a></p>
<p class="pv1-lede">MIT 教授用十条法则讲简约。简约不是东西变少，是可以学会的设计手艺。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>这是 MIT 教授约翰·梅达的“简约”课讲义。整本书只回答一个问题：简约是什么，怎么做到。</p><p>核心论点就一句：简约不是东西少，而是处理复杂的手艺。十条法则加三把钥匙，就是这门手艺的练习手册：从减法（削减）、整理（组织）、省时间（时间）起步。</p><p>它经典在诚实：不喊“少即是多”，而是承认有些复杂永远简化不了（失败），还提醒你情感可以“多多益善”。简约不是冷冰冰的断舍离。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 8</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 削减：简约的第一步是减法，要用心地减</b> 减法的秘诀：先问“这个东西存在的理由是什么”。答不上来，再动手。</p><p class="pv1-ex"><i>例</i>电视遥控器：五六十个键，99% 的人只用开关、音量、换台。苹果后来砍到几个键——App 设置里三年没人点的开关，删了没人哭。</p></li><li><p class="pv1-idea"><b>2. 组织：东西多不可怕，乱才可怕</b> 东西多别急着扔，先理一理。记住 SLIP 口诀：分类、贴标签、整合、分轻重，一百样也能像十样。</p><p class="pv1-ex"><i>例</i>手机桌面：几十个 App 拖进文件夹按“社交、工具”分好类，东西一件没少，找起来快多了。</p></li><li><p class="pv1-idea"><b>3. 时间：省下来的时间，感觉就是“简单”</b> 等待让人觉得复杂。省不下来的时间，告诉用户“还要等多久”也是一种体贴——未知才最折磨人。</p><p class="pv1-ex"><i>例</i>外卖 App：显示“预计 30 分钟”加骑手实时位置，饭还是那顿饭，焦虑没了。反面例子：银行 App 转圈不报进度，30 秒熬出 3 分钟的感觉。</p></li><li><p class="pv1-idea"><b>4. 学习：懂了，就不觉得难了</b> 复杂的东西学会了就不觉得难。借用户已有的熟悉感，他心里冒出“这个我见过”，就敢上手了。</p><p class="pv1-ex"><i>例</i>宜家说明书：一个字没有，全是图——看图拧螺丝是全人类都懂的语言。早期 iPhone 把备忘录做成黄色便签纸，也是借了你的熟悉感。</p></li><li><p class="pv1-idea"><b>5. 差异：没有复杂，简单就显不出来</b> 全世界都极简，极简就不值钱了。该简单时干净利落，该复杂时给足信息——一收一放才抓得住注意力。</p><p class="pv1-ex"><i>例</i>谷歌首页只有一个搜索框，点开却是密密麻麻的结果页。分开看都不出彩，这一收一放才让人觉得清爽又全能。</p></li><li><p class="pv1-idea"><b>6. 情境：留白不是浪费，是主角的舞台</b> 简约的东西靠周围的留白和氛围托着。给重要的东西让路，空白一点都不多余。</p><p class="pv1-ex"><i>例</i>苹果官网：一个产品图配大片留白，眼睛无处可逃只能看它。反面：电商详情页塞满每个模块，结果一个都没记住。</p></li><li><p class="pv1-idea"><b>7. 情感：讲感情的时候，别怕“多此一举”</b> 感情这东西，多多益善。传递温度时加一点“没用”的装饰不是浪费——简约不等于冷冰冰。</p><p class="pv1-ex"><i>例</i>聊天 App 的表情包：发“微笑”两个字就够，但龇牙的表情包情绪多十倍。Mac 开机那声“噔”也是——人们记住产品的，往往就是这些。</p></li><li><p class="pv1-idea"><b>8. 唯一：减去明显的，加上“有意义的”</b> 这是全书的收束：简约不是一减了之。减去明显的，再把有意义的加回来——减是技术，加是品味。</p><p class="pv1-ex"><i>例</i>第一代 iPhone：砍掉实体键盘，但留下一个 Home 键——再懵的人都知道“按它就能回家”。全砍成一块玻璃，2007 年的人不敢买。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>开篇：先回答“简约到底是什么”</b> 梅达开篇破题：简约不是东西少，而是在技术和生活被塞满的时代保持清醒的能力。</p><p class="pv1-ex"><i>例</i>手机装 200 个 App 不是问题，问题是它们天天弹通知把你搞疯——简约治的是这种失控感。</p></li><li><p class="pv1-part"><b>基础篇 SHE：削减 · 组织 · 时间（入门三法则）</b> 入门三法则 SHE：先做减法，再理整齐，最后替用户省时间——练熟能治八成的“复杂病”。</p><p class="pv1-ex"><i>例</i>整理衣柜：扔掉三年没穿的，把常穿的放顺手处，找衣服从 10 分钟变 1 分钟。</p></li><li><p class="pv1-part"><b>中级篇：学习 · 差异 · 情境</b> 进阶讲心法：借用户的知识降门槛，用对比制造美感，别忽视留白和氛围。</p><p class="pv1-ex"><i>例</i>Switch 新手引导：靠直觉就能上手，画面极简但手柄震动丰富，开箱都有仪式感。</p></li><li><p class="pv1-part"><b>高级篇（上）：情感 · 信任</b> 简约不只冷冰冰：温度和信任也是简约的一部分——让人放松、敢用的产品才真的简单。</p><p class="pv1-ex"><i>例</i>支付宝免密支付：拿掉“输密码”，买单顺滑到无感，你愿意把一点信任交给它。</p></li><li><p class="pv1-part"><b>高级篇（下）：失败 · 唯一</b> 承认有些东西永远做不简约，别硬拗；真正的简约是“减去明显的、加上有意义的”。</p><p class="pv1-ex"><i>例</i>Photoshop 注定比美图秀秀复杂——承认它是给专业人士的工具，把裁剪、调色放在最顺手处，复杂但好用。</p></li><li><p class="pv1-part"><b>收尾：三把钥匙——远离 · 开放 · 力量</b> 最后三把钥匙：把不常用的搬远，把过程摊开让人看懂，用更少办更多的事。</p><p class="pv1-ex"><i>例</i>手机 App 资源库：不常用的不用删，滑到最后一屏收纳，桌面瞬间清爽。</p></li></ul>
</article></section><section class="pv1-domain" id="pv1-d3"><div class="pv1-dhead rv"><span class="pv1-ghost">04</span><p class="pv1-eyebrow">第肆辑 · 产品经理</p><h2>产品经理</h2><p class="pv1-dintro">产品经理就是那个要想清楚“做什么产品、为谁做、为什么值得做”的人——夹在用户、技术和生意之间，把一个个想法变成大家愿意用的产品。</p></div>
<article class="pv1-book rv" id="pv1-b31">
<p class="pv1-eyebrow"><span class="no">NO.31</span><span>产品经理</span></p>
<h3>《启示录》</h3>
<p class="pv1-bmeta">Inspired: How to Create Tech Products Customers Love · 马蒂·卡根 · 华中科技大学出版社 · 2008</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/5914587/" target="_blank" rel="noopener">豆瓣 8.4 分 · 9098人评价 →</a></p>
<p class="pv1-lede">产品经理实战手册：别闷头做功能，先验证用户要不要、能不能做出来，再动手。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>多数软件产品死掉，不是工程师不行，而是从一开始就做错了东西：根本没人想要。产品经理的核心工作，是在开发前找到一个“用户想要、用得来、做得出”的方案。</p><p>2008 年，产品经理大多是老板的传声筒。这本书第一次系统写下了硅谷的现代产品管理。作者在惠普、网景、eBay 干过一线，方法全是实战验证过的。</p><p>它改了三个认知：产品经理为成败负全责，死了别怪工程师。需求文档该被可点击原型取代，做产品要小步验证、别憋大招。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 8</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 好产品三者缺一不可：用户想要、用得来、技术做得出</b> 好产品同时满足三条：用户愿意花钱花时间、一看就会用、技术上做得出来。三者是“与”关系，不是“或”：只盯一两样，最后都白忙活。</p><p class="pv1-ex"><i>例</i>比如做“拍照识菜品热量”App：用户需要，但识别要等30秒、操作还绕弯。准确率只有50%——任何一个短板都会要它的命，先做粗糙原型把三条逐一验证。</p></li><li><p class="pv1-idea"><b>2. 产品经理是第一责任人，产品死了别怪工程师</b> 衡量产品经理的唯一标准，是产品本身成不成功。你的活儿不是传声筒，而是发现机会、定义产品，做成是你的功劳，做砸锅也是你的。</p><p class="pv1-ex"><i>例</i>就像餐厅主厨：菜不好吃，不能怪买菜和切菜的——菜单是你定的、味道是你把关的。App没人用，别怪“开发慢”“老板施压”：当初接什么需求、怎么设计，决定权在你手里。</p></li><li><p class="pv1-idea"><b>3. 别写几十页需求文档，做个能点的原型给用户试</b> 写几十页需求文档、开发照着做，做完才发现用户不买账。和设计师快速做出高仿真原型，拿给真实用户亲测：改原型便宜，推倒重来不心疼。</p><p class="pv1-ex"><i>例</i>要加“拼团”功能？别让开发吭哧干两个月。让设计师花两天做个可点击的假页面，找10个用户试。结果有人找不到入口、有人嫌流程绕：你花两天就学到教训，而不是花两个月写代码交学费。</p></li><li><p class="pv1-idea"><b>4. 每个想法先过“十问”拷问：用户是谁？解决什么问题？怎么算成功？</b> 每个产品想法，先拿问题清单拷问一遍：用户是谁？现在怎么解决问题？方案好在哪？最怕“我觉得用户需要”：答不上来就回去做功课，别直接开干。</p><p class="pv1-ex"><i>例</i>比如“老年人打车App”：用户是60岁以上不会用智能手机的老人，现在靠路边招手、子女代叫。方案：大字体一键叫车、子女可远程代叫；成功标准：三月内单城日单破千——问完这一串，是拍脑袋还是真机会一目了然。</p></li><li><p class="pv1-idea"><b>5. 定几条产品原则，吵架不用每次找老板拍板</b> 产品原则是团队共同认可的“行事准则”，比如“用户价值优先于短期收入”。日常争论一对照就有答案；老板施压时，不说“我不想做”，而说“这违反我们定下的原则”。</p><p class="pv1-ex"><i>例</i>团队定了“三步原则：核心操作三步内完成”。某天运营想在下单流程加弹窗广告：加了就四步，违反原则，不用找老板裁决。想反驳，先论证“为什么这次可破例”，而不是比谁嗓门大。</p></li><li><p class="pv1-idea"><b>6. 找一小撮铁杆用户，从头陪你打磨产品</b> 这叫“特约用户”：早期找十几个目标用户持续试用、持续给反馈，他们是“编外团队成员”。反馈来得快、够真实，他们还会因深度参与变成第一批自发传播者。</p><p class="pv1-ex"><i>例</i>做记账App，上线前找20个月光族朋友当特约用户。他们嫌“记一笔填8个字段太烦”你就砍到3个，要的“短信账单自动识别”成了下个版本核心功能。</p></li><li><p class="pv1-idea"><b>7. 警惕为大客户定制的“特例”功能，它会拖死产品</b> 大客户常说“加这个功能我们就签单”，听着诱人，但这种定制和多数用户需求背道而驰。卡根称之为“劣质收益”：短期赚了钱，长期毁了产品。</p><p class="pv1-ex"><i>例</i>SaaS卖给中小公司，大客户说“加个审批流就买1000个账号”。加了之后其他客户嫌界面复杂、续费率下降，几千行特殊逻辑让每次升级提心吊胆：这1000个账号的钱，根本cover不住产品被拖慢的代价。</p></li><li><p class="pv1-idea"><b>8. 用户做决定靠的是恐惧、贪婪和欲望，不是理性分析</b> 人买东西很少因为“理性比较参数”，更多被情绪驱动：怕错过（恐惧）、想占便宜（贪婪）、想成为更好的自己（欲望）。做产品别只讲功能参数，多想想你击中了用户的哪种情绪。</p><p class="pv1-ex"><i>例</i>知识付费文案写“你的同龄人正在抛弃你”，打的是恐惧；App爱用“限时五折”“仅剩3件”，打的是贪婪加恐惧。健身App说“算法很科学”没人理，改成“30天练出马甲线”，下载量直接翻倍。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分：人员（第1-10章）</b> 讲做产品需要哪些人、各干什么：产品经理、营销、项目经理、设计、开发怎么分工协作，以及怎么招人管人、怎么跟上司相处。</p><p class="pv1-ex"><i>例</i>第2章讲产品管理和产品营销是两回事：一个管“做什么产品”，一个管“怎么卖出去”——让厨师兼服务员，菜和客人都顾不上。</p></li><li><p class="pv1-part"><b>第二部分：流程（第11-30章）</b> 全书最厚的部分：从发现产品机会、原型验证，到上线部署、快速迭代的完整打法，外加敏捷和瀑布两种开发模式怎么配合产品工作。</p><p class="pv1-ex"><i>例</i>eBay每个重要功能上线前都先做高仿真原型实测：有次改版测完发现完成率反而下降，直接回炉——回炉发生在开发前，省的是真金白银的开发成本。</p></li><li><p class="pv1-part"><b>第三部分：产品（第31-39章）</b> 不同类型产品的实战经验：苹果为什么行、平台型产品怎么做、企业级产品怎么卖，顺带拆几个反面教材帮你避坑。</p><p class="pv1-ex"><i>例</i>第31章讲乔布斯“少即是多”：砍掉90%功能、把剩下10%做到极致——用户要的不是功能列表，是“把1000首歌装进口袋”这一个爽点。</p></li><li><p class="pv1-part"><b>总结：最佳实践与反省清单（第40-41章）</b> 全书浓缩成“最佳实践清单”和“产品经理反省清单”：贴工位上随时对照，专治“我以为”。</p><p class="pv1-ex"><i>例</i>反省清单里有一条：“你上一次和真实用户聊天是什么时候？”——很多产品经理几个月没和用户说过话，看到这句赶紧约访谈去。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b32">
<p class="pv1-eyebrow"><span class="no">NO.32</span><span>产品经理</span></p>
<h3>《精益创业》</h3>
<p class="pv1-bmeta">The Lean Startup · 埃里克·莱斯 · 中信出版社 · 2011</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/10945606/" target="_blank" rel="noopener">豆瓣 8.2 分 · 6570人评价 →</a></p>
<p class="pv1-lede">创业别靠赌：用最小成本、最快速度做实验，验证你的想法到底有没有人买单。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>创业不是“我有个绝妙想法然后做出来”，而是在极端不确定中搞清“什么才是对的”。创业公司的真正产出不是代码，而是“验证过的认知”。</p><p>方法是把创业当科学实验：提假设、做MVP、测用户真实反应，快速转完“开发-测量-学习”这个圈。2011年之前，创业要么靠商业计划书融资憋大招，要么纯打鸡血。</p><p>这本书把丰田精益、敏捷开发、客户开发拧成了一套操作系统，“快速试错”“小步快跑”从此成了创业者的标准动作。它改了三个认知：要“快速地失败、廉价地失败”；看“可执行指标”不看“虚荣指标”；转型不是认怂，是基于数据的理性决策。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 8</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 创业公司的真正产品不是代码，而是“验证过的认知”</b> 创业公司存在的目的不是生产东西、不是赚钱，而是搞清“怎样做出一门持续赚钱的生意”——这叫“验证性学习”。它不能靠“我觉得”，必须靠科学实验：提假设、做实验、看真实用户数据；不能带来认知的忙碌都是浪费。</p><p class="pv1-ex"><i>例</i>想做“上门喂猫”服务？别先开发App、租办公室、招10个人。先在小区群发接龙“周末出游需上门喂猫的报名”：20人接龙说明需求真实，没人理你只花一下午就排除了一个伪需求。</p></li><li><p class="pv1-idea"><b>2. 别憋大招，先做“最小可行产品”扔出去，看用户真金白银的反应</b> MVP就是“能验证核心假设的最小东西”：不求完整，只求测出“用户到底要不要”。视频式、贵宾式、“绿野仙踪”式都是经典做法，核心就一个：用最小成本换真实用户行为数据。</p><p class="pv1-ex"><i>例</i>想做“AI帮你写周报”？别先训练模型开发网站，先拉30个朋友进微信群，你每晚8点人工整理周报发回。两周后一半人天天用，需求真实再投入；没人理，你只花了14个晚上而不是14个月。</p></li><li><p class="pv1-idea"><b>3. 把“开发-测量-学习”这个圈转起来，转得越快赢面越大</b> 想法→做出东西→测量用户反应→学到认知→产生新想法，无限循环：创业竞争的本质不是谁想法牛，而是谁转完一圈最快。很多团队一年转一圈，精益团队一周转一圈：一年下来，认知差距是50倍。</p><p class="pv1-ex"><i>例</i>就像打靶：高手连开十枪、每枪按上一枪落点微调，而不是闭眼开一枪再分析一年弹道。做社区团购：A憋半年上线“完美版”发现没人自提，B用微信群第一周就开团、每周改一次，两个月摸清用户最在意“送货准时”。</p></li><li><p class="pv1-idea"><b>4. 数据不好就勇敢转型：换方向不丢人，死扛才丢人</b> 转型就是“换个姿势再试”：基于已验证的认知，对战略做结构性调整——换用户、换盈利模式、换核心功能。转型不是拍脑袋：在“转型还是坚持”会上，用创新核算的数据说话；伟大公司几乎都是转出来的，转型越早越便宜。</p><p class="pv1-ex"><i>例</i>“大学生二手书平台”数据惨淡：卖家多、买家少，一看数据，学生真正活跃的是“拼单买新书”和“课程资料分享”。于是转型做“开学季教材拼团”，三个月用户翻5倍——方向错了不换，等于拿着地图往悬崖开。</p></li><li><p class="pv1-idea"><b>5. 别被虚荣指标骗了，要看能指导行动的“可执行指标”</b> 虚荣指标“看起来美、指导不了行动”：总注册10万、阅读10万+；可执行指标“告诉你下一步干什么”：新增用户7天后回来多少？记住创新核算三步：MVP建基准线→小步优化看指标→决定转型或坚持；数据是用来做决定的，不是自我安慰的。</p><p class="pv1-ex"><i>例</i>App上线一月下载5万，老板很开心，但次日留存只有8%：92%的人用一次就删，5万下载全是虚荣。正确做法：别买量了，先找20个流失用户聊“为什么删”，把留存修好再谈增长——否则就是往漏水桶里倒水。</p></li><li><p class="pv1-idea"><b>6. 小步快跑别搞大批量：“死亡螺旋”专治“一次到位”</b> 大批量是“攒一大波需求、一次性开发上线”：文档50页、开发三月，上线才发现方向错了，返工成本巨大。小批量是每次只做一点、快速上线验证；大批量会陷入“死亡螺旋”：批量越大越不敢改，越不改错得越多。</p><p class="pv1-ex"><i>例</i>装修房子：大批量是“设计图一次定稿、三个月后入住”，住进去发现插座全在床头后面，砸墙重改贵到肉疼。小批量是“先装一间住两天”，发现“床头没插座”立刻改，后面全避开：做产品同理，每周上1个功能、看数据再定下周做什么。</p></li><li><p class="pv1-idea"><b>7. 增长只有三种引擎：让人留下来、让人带来人、让人花钱，先选一种死磕</b> 可持续增长只有三种：粘着式（用户来了不走，靠留存）、病毒式（用户自发带新用户）、付费式（获客成本小于用户终身价值）。关键：一次只盯一种，把核心指标做健康再考虑别的——什么都想要，等于什么都没抓住。</p><p class="pv1-ex"><i>例</i>在线课程App：老用户续费率60%（粘着式有戏），转介绍率很低（病毒式没戏）。那就别烧钱做“邀请返现”，全力让学完的人续下一期：加学习社群、加班主任督学——一次点一盏灯。</p></li><li><p class="pv1-idea"><b>8. 出了问题连问五个为什么，找到根因，而不是找人背锅</b> “五个为什么”是丰田传下来的方法：出事先别急着定责，连问五层“为什么”，通常能挖到系统和流程层面的根因。目的是建“自适应组织”：每次事故都变成组织学习而不是甩锅大会，同样的坑全公司只踩一次。</p><p class="pv1-ex"><i>例</i>App崩了别急着开除运维，连问五个为什么：为什么磁盘满了？日志没清理；为什么没清理？没自动脚本；为什么没有？上线清单三年没更新。根因是“流程没人维护”，不是“运维手滑”：修好流程，全公司以后都不再踩这个坑。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一篇：愿景（第1-4章）</b> 先讲清创业到底在干嘛：创业是一种管理，产出是“验证过的认知”，要用科学实验做产品，而不是靠赌。</p><p class="pv1-ex"><i>例</i>作者在IMVU埋头几个月做出“完美版”产品，上线后用户根本不买账：那一刻他明白，几个月的工作全是浪费，因为没带来任何关于用户的真相。</p></li><li><p class="pv1-part"><b>第二篇：驾驭（第5-8章）</b> 创业这辆车具体怎么开：把战略拆成假设、做MVP测试、用创新核算看数据，在“转型还是坚持”会上做决断。</p><p class="pv1-ex"><i>例</i>Dropbox创始人没写一行代码，先做了个3分钟演示视频，一夜之间等候名单从5000涨到75000：一个视频的成本，验证了“真有人要”，比先开发半年聪明一百倍。</p></li><li><p class="pv1-part"><b>第三篇：加速（第9-12章）</b> 跑起来后怎么提速不翻车：小批量生产、选对增长引擎、用五个为什么打造自适应组织、给颠覆式创新留空间。</p><p class="pv1-ex"><i>例</i>很多团队死在“引擎搞混”：靠广告砸钱获客（付费式），却用“用户量”自我安慰，从不算“一个用户终身赚多少、获客花多少”——账算清那天，才发现一直在赔本赚吆喝。</p></li><li><p class="pv1-part"><b>尾声：杜绝浪费（第13-14章）</b> 收束全书：精益创业的终极目标是杜绝一切不带来认知的浪费，并号召读者加入全球精益创业运动。</p><p class="pv1-ex"><i>例</i>作者算了笔账：全世界每天有无数创业者在重复制造“没人要的东西”，烧掉的钱和青春是最贵的浪费——如果每人先花一周验证假设，省下的不只是钱，是整整一代人的时间。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b33">
<p class="pv1-eyebrow"><span class="no">NO.33</span><span>产品经理</span></p>
<h3>《俞军产品方法论》</h3>
<p class="pv1-bmeta">俞军 · 中信出版集团 · 2019</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/34907971/" target="_blank" rel="noopener">豆瓣 7.8 分 · 4895人评价 →</a></p>
<p class="pv1-lede">中国“产品经理教父”俞军，把做产品还原成几个可以算账的公式：用户价值、交易设计、决策方法。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>俞军是百度贴吧之父，做过百度和滴滴的产品高管。2019年，他把十几年的思考写成这本书。</p><p>核心论点只有一句：产品经理的本质是决策者，决策要靠算账——用户模型、交易模型、决策，三件事。</p><p>它为什么经典：第一次有人把“做产品”系统化成可传授的框架，讲“道”不讲“术”。“用户价值=新体验−旧体验−替换成本”，这一个公式就值回书价。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 用户价值公式：新体验 − 旧体验 − 替换成本</b> 算三笔账：用了你的新体验，减去用户现有的旧体验，再减去换过来的替换成本。只有差值为正且足够大，用户才会换。</p><p class="pv1-ex"><i>例</i>做外卖拼单：新体验只好一点点，但拉人、凑时间、统一口味的替换成本很高，用户就不换。</p></li><li><p class="pv1-idea"><b>2. 用户不是自然人，是需求的集合</b> 同一个人在不同场景下是不同用户：白天是打工人，深夜是外卖用户。别问他是谁，问他此刻想要什么。</p><p class="pv1-ex"><i>例</i>“深夜想吃热面”背后，可能是程序员、带娃的妈妈或失眠老人——需求相同，就是同一类用户。</p></li><li><p class="pv1-idea"><b>3. 移步换景：去用户的场景里理解他</b> 别坐在会议室里推理用户，那99%是错的。走到他的生活场景里，看他怎么做决策。</p><p class="pv1-ex"><i>例</i>给菜市场大妈做买菜App，去菜市场站一天：她在乎的不是比价功能，是摊主熟不熟。</p></li><li><p class="pv1-idea"><b>4. 交易模型：一切商业都是交易</b> 用户付出时间金钱换价值，企业付出成本换收入。产品经理设计的是各方都觉得划算、能持续转的交易结构。</p><p class="pv1-ex"><i>例</i>拼多多：用户付出拉人成本得到低价，商家付出低价得到大订单，平台得到用户和交易额——三方都划算才转得起来。</p></li><li><p class="pv1-idea"><b>5. 产品经理的本质是决策者</b> 不是画原型写文档，那些只是手段。信息永远不足，产品经理就是那个替产品做选择题、承担结果的人。</p><p class="pv1-ex"><i>例</i>微信当年要不要做朋友圈？没数据、没人能证明，张小龙只能基于用户价值判断拍板。</p></li><li><p class="pv1-idea"><b>6. 效用：产品是用户获得的满足感</b> “效用”是经济学词：这东西对我有什么用。产品不是你造的那个东西，是用户用它获得的效用。</p><p class="pv1-ex"><i>例</i>同一杯奶茶：对口渴的人是解渴，对小情侣是甜蜜，对打卡的是朋友圈素材。</p></li><li><p class="pv1-idea"><b>7. 产品经理十二条：体感是最好的需求来源</b> 俞军早年总结的12条心得，流传最广。核心一句：直觉从大量亲身体验里长出来，不是想出来的。</p><p class="pv1-ex"><i>例</i>“把自己当傻瓜”：你觉得显而易见的按钮，第一次用的用户就是找不到；“每天变成用户”：高频用自己和竞品的产品。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分：用户模型</b> 全书地基：用户是需求的集合、用户价值公式、移步换景，后面所有判断都从这儿出发。</p><p class="pv1-ex"><i>例</i>用用户模型解释拼多多：命中“想买便宜好货又怕被坑”的需求集合，价值公式算下来是正的。</p></li><li><p class="pv1-part"><b>第二部分：交易模型</b> 商业本质是交易：好产品必须设计出各方都觉得划算的交易结构。</p><p class="pv1-ex"><i>例</i>知识付费：用户得到知识和安心，老师得到收入名声，平台得到抽成——三方划算才能持续。</p></li><li><p class="pv1-part"><b>第三部分：决策</b> 产品经理的核心工作：在信息不足时做决策，选期望收益最大的选项。</p><p class="pv1-ex"><i>例</i>砍不砍做了三个月但数据平平的功能：算期望效用——成功概率×收益，对比继续投入的成本。</p></li><li><p class="pv1-part"><b>第四部分：产品经理的选拔与成长</b> 什么样的人适合做产品经理：靠体验、复盘和实战练判断力。</p><p class="pv1-ex"><i>例</i>好产品经理的特质：同理心强、逻辑好、爱折腾，愿意亲手试100个产品。</p></li><li><p class="pv1-part"><b>附录：推荐书单</b> 近百本书单，覆盖经济学、心理学、社会学——产品经理的知识底盘。</p><p class="pv1-ex"><i>例</i>《经济学原理》《思考，快与慢》《影响力》：经济学帮你算账，心理学帮你懂人性。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b34">
<p class="pv1-eyebrow"><span class="no">NO.34</span><span>产品经理</span></p>
<h3>《人人都是产品经理》</h3>
<p class="pv1-bmeta">苏杰 · 电子工业出版社（博文视点） · 2010</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/4723970/" target="_blank" rel="noopener">豆瓣 7.6 分 · 9827人评价 →</a></p>
<p class="pv1-lede">阿里出身的苏杰，用一个真实项目的完整经历，带你走完从需求到上线的全过程——中国产品经理的入门圣经。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>苏杰是阿里、淘宝早期的产品经理。2010年出版时，中文世界几乎没有讲“产品经理怎么做”的书。</p><p>核心观点：产品经理首先是一种思维方式——凡事先问“为谁解决什么问题”。书里给了一套完整方法：需求怎么来、做什么、怎么做、怎么协作。</p><p>它经典在“真实”：全书围绕一个真实项目展开，像连续剧。“少做就是多做”“BRD/MRD/PRD”成了产品圈基础词汇。产品社区“人人都是产品经理”名字就来自这本书。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 人人都是产品经理：产品思维是一种通用思维</b> 产品经理不只是岗位，更是思维方式：先想为谁解决什么问题，再想方案，最后想怎么验证。装修带娃做PPT，本质都是做产品。</p><p class="pv1-ex"><i>例</i>去K歌嫌点歌面板排序不合理、装修抢着当项目经理排工期——这就是产品思维。</p></li><li><p class="pv1-idea"><b>2. 少做就是多做：砍需求是最大的勇气</b> 资源永远不够，100个需求只能做10个。把10个做到极致，别把100个做成半吊子。吸引用户的只是一两个闪光点。</p><p class="pv1-ex"><i>例</i>淘宝“自动上架”：团队讨论两周越加越多，最后一个个砍掉——“想到了又砍掉”和“没想到”完全不同。</p></li><li><p class="pv1-idea"><b>3. 一个需求的奋斗史：商业需求→用户需求→产品需求</b> 三层链条：商业需求（公司要什么）、用户需求（用户真要什么）、产品需求（我们到底做什么）。新人最大的毛病是跳过前两层直接画原型。</p><p class="pv1-ex"><i>例</i>淘宝自动上架：老板要提升卖家活跃度→发现“商品总被下架”是真痛点→做成自动上架功能。</p></li><li><p class="pv1-idea"><b>4. BRD、MRD、PRD：三种文档写给三种人</b> BRD给老板看（为什么做、值不值），MRD讲市场用户，PRD给开发看（具体怎么做）。写之前先想清楚听众是谁。</p><p class="pv1-ex"><i>例</i>拼团功能：BRD是“拼团带来30%新用户，要20人天”；PRD精确到按钮放第几屏、退款异常流程。</p></li><li><p class="pv1-idea"><b>5. 用户调研：别听用户说什么，看用户做什么</b> 用户说的和做的经常两回事。调研不是收集“想要什么功能”，而是理解“他在什么场景遇到什么麻烦”。</p><p class="pv1-ex"><i>例</i>用户说收藏“没习惯”；跟他聊才发现他靠翻聊天记录找内容——真需求是“快速找回看过的内容”。</p></li><li><p class="pv1-idea"><b>6. 四两拨千斤：好钢用在刀刃上</b> 资源永远不够，把有限开发资源押在商业价值最高的几个需求上。20%核心需求吃掉80%资源，剩下的砍。</p><p class="pv1-ex"><i>例</i>“魔方计划”：故意在BRD里放一两个可砍的需求，让老板砍完有占便宜感，不好意思再砍你真正想保的。</p></li><li><p class="pv1-idea"><b>7. 产品经理的自我修养：爱、执行力、同理心</b> 技术文档流程都能学，难的是心法：爱自己的产品、超强执行力、同理心。产品经理是“无冕之王”，全靠影响力把事推成。</p><p class="pv1-ex"><i>例</i>“有爱”：半夜想到一个bug爬起来记下来；“同理心”：钻进用户、开发、老板的脑子，用三种语言说话。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第1章：写给-1到3岁的产品经理</b> 产品经理到底是干什么的：什么样的人适合做，新人最常见的困惑。</p><p class="pv1-ex"><i>例</i>看到难用App第一反应是“改成那样会不会更好”——你骨子里就是个产品经理。</p></li><li><p class="pv1-part"><b>第2章：一个需求的奋斗史</b> 全书最精彩：一个真实需求从诞生到上线的完整过程。</p><p class="pv1-ex"><i>例</i>跟着淘宝案例走一遍：商业需求→用户需求→产品需求，你就知道需求是怎么“奋斗”出来的。</p></li><li><p class="pv1-part"><b>第3章：项目的坎坷之路</b> 需求确定之后：写BRD、开产品会争资源、项目管理、写PRD。</p><p class="pv1-ex"><i>例</i>“魔方计划”：两个老产品整合成一个，BRD怎么写让老板点头，资源评估精确到“人天”。</p></li><li><p class="pv1-part"><b>第4章：产品经理的自我修养</b> 产品经理的心法：爱、执行力、同理心，以及职业成长路径。</p><p class="pv1-ex"><i>例</i>定期“体检”：这个月有没有真正理解用户？有没有为KPI做短视功能？</p></li><li><p class="pv1-part"><b>附录：用户调研问卷实例</b> 一份可直接套用的用户调研问卷模板，附完整实例。</p><p class="pv1-ex"><i>例</i>从“你用过我们的产品吗”到“最希望改进什么”，照着抄就能用。</p></li></ul>
</article>

<p class="pv1-eyebrow"><span class="no">NO.35</span><span>产品经理</span></p>
<h3>《创新者的窘境》</h3>
<p class="pv1-bmeta">The Innovator&#x27;s Dilemma · 克莱顿·克里斯坦森 · 中信出版社 · 2010</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/4243770/" target="_blank" rel="noopener">豆瓣 8.5 分 · 4174人评价 →</a></p>
<p class="pv1-lede">为什么管理越优秀、越听客户话的大公司，越容易被新技术干掉？哈佛教授用三个行业的真实历史回答这个问题。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>克莱顿·克里斯坦森是哈佛商学院教授，“颠覆性创新”理论创始人。1997年出版，“窘境”就是那个两难：管理越好，离死亡越近。</p><p>核心论点：大公司被颠覆恰恰因为“良好的管理”——倾听主流客户、追逐高利润、用财务流程筛项目，这些全对的原则在破坏性技术面前全错了。</p><p>经典在第一次用三个行业真实历史（硬盘、挖掘机、钢铁）讲透创新：“延续性创新”大公司擅长，“破坏性创新”总栽在这儿。“颠覆式创新”成了创业者口头禅，连比尔·盖茨都说每份提案都自称“颠覆性”。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 两种技术：延续性技术是把好的做得更好，破坏性技术是另起炉灶</b> 延续性技术是把现有东西做得更好（手机像素1000万到1亿）；破坏性技术另起炉灶，起初更差更便宜更简单（早期数码相机不如胶片）。大公司擅长前者，总栽在后者。</p><p class="pv1-ex"><i>例</i>数码相机刚出来像素低又贵，专业摄影师看不上；但它一路向上，“够用”那天胶片一夜之间没了。</p></li><li><p class="pv1-idea"><b>2. 价值网：困住大公司的那张网</b> 公司被客户、供应商、成本结构、利润要求织成的网困住，决定了它能看到什么、愿意做什么。破坏性技术在网里永远像亏本买卖。</p><p class="pv1-ex"><i>例</i>诺基亚不是不知道智能手机要来，是它的价值网不允许转身：运营商要信号好待机长，股东要确定回报。</p></li><li><p class="pv1-idea"><b>3. 最反常识的结论：正是“良好的管理”导致了失败</b> 倾听客户、追逐好市场、算投入产出比——商学院全对的原则，在破坏性技术面前全错：主流客户永远说不需要，财务模型永远算出不划算。</p><p class="pv1-ex"><i>例</i>硬盘巨头希捷：认真听IBM的话做大容量，新技术利润率低“不值得投”——每一步都正确，却错过了小尺寸硬盘。</p></li><li><p class="pv1-idea"><b>4. 破坏性技术的剧本：从低端切入，沿轨迹上移，吃掉主流</b> 固定剧本：在低端或全新市场落脚，靠便宜简单够用活下来；沿性能轨迹一路向上；“够用”那天主流客户成批倒戈。赢家是进步最快的。</p><p class="pv1-ex"><i>例</i>14寸硬盘的老大看不上8寸，8寸的老大看不上5.25寸——每一代都被“看不上的小东西”从下面掀翻。</p></li><li><p class="pv1-idea"><b>5. 新市场测不出来，只能试出来</b> 破坏性技术面向的市场一开始不存在，传统调研和商业计划书全部失效。别做宏大预测，小规模试错、快速迭代。</p><p class="pv1-ex"><i>例</i>2007年问商务人士要不要iPhone，99%说黑莓好好的；但极客觉得能上网装App真酷——市场是试出来的，不是调研出来的。</p></li><li><p class="pv1-idea"><b>6. 药方：给破坏性业务一个独立的小组织</b> 独立的成本结构、独立的考核标准、独立的客户，去服务边缘市场。让组织匹配任务，而不是任务削足适履。</p><p class="pv1-ex"><i>例</i>IBM做PC成立独立小团队放佛罗里达，远离总部高利润率绑架；塞进老部门的新业务永远抢不过资源，最后被“优化”掉。</p></li><li><p class="pv1-idea"><b>7. 客户说“不需要”，恰恰是破坏性技术的典型特征</b> 主流客户只能告诉你“把现在的东西做得更好”，永远不会为性能更差的新东西投票。“不需要”不是它不行的证据。</p><p class="pv1-ex"><i>例</i>柯达问专业摄影师要不要数码相机：“像素这么渣谁用”；但普通人觉得“能立刻看到照片真方便”先用了——等像素追上来，柯达来不及了。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分：为什么伟大的公司会失败</b> 硬盘行业完整兴衰史：每一代老大都被自己看不上的小技术干掉。</p><p class="pv1-ex"><i>例</i>1970-80年代：14寸看不上8寸，8寸看不上5.25寸——读完第一次觉得“历史在重复”。</p></li><li><p class="pv1-part"><b>第二部分：价值网——困住大公司的那张网</b> “价值网”：客户、成本和利润结构决定了公司能做什么、不能做什么。</p><p class="pv1-ex"><i>例</i>液压挖掘机力气小只能挖小水沟，但便宜灵活越做越好，最后连大型矿山都用液压的。</p></li><li><p class="pv1-part"><b>第三部分：破坏性技术的规律</b> 破坏性技术的固定剧本：低端切入，沿性能轨迹上移，“够用”时吃掉主流。</p><p class="pv1-ex"><i>例</i>小尺寸硬盘性能提升比主流需求涨得还快，“够用”那天主流客户整批倒戈。</p></li><li><p class="pv1-part"><b>第四部分：怎么办——让组织去匹配任务</b> 药方：想抓住破坏性技术，给它独立小组织，独立成本结构和考核。</p><p class="pv1-ex"><i>例</i>新业务塞老部门：按利润率考核永远“不达标”被砍；独立小团队按“学到了什么”考核，反而活下来。</p></li><li><p class="pv1-part"><b>结语：给管理者的忠告</b> 破坏性创新不是管理失败，是好管理的副产品；关键是看清自己的价值网。</p><p class="pv1-ex"><i>例</i>听到“新技术性能差、利润低、客户不想要”时，先问：是真不行，还是我的价值网让我觉得它不行。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b36">
<p class="pv1-eyebrow"><span class="no">NO.36</span><span>产品经理</span></p>
<h3>《上瘾：让用户养成使用习惯的四大产品逻辑》</h3>
<p class="pv1-bmeta">Hooked: How to Build Habit-Forming Products · 尼尔·埃亚尔 / 瑞安·胡佛 · 中信出版社 · 2017</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/27030507/" target="_blank" rel="noopener">豆瓣 7.4 分 · 5707人评价 →</a></p>
<p class="pv1-lede">为什么你一无聊就想刷手机？作者把Facebook、Twitter、Pinterest们让人“上瘾”的套路，提炼成了一个四步循环模型。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>尼尔·埃亚尔在斯坦福教行为设计，也创过业。2014年出版，回答：为什么有些App一无聊就想点开，另一些用两次就删？</p><p>核心是“上瘾模型”：触发→行动→多变的酬赏→投入，四步循环。背后是斯金纳、福格等行为心理学实验的工程化应用。</p><p>经典在第一次把“用户习惯”讲成可操作手册：“触发是什么？酬赏够多变吗？用户投入了什么？”成了产品圈通用语言。作者也留了伦理题：帮用户还是害用户？用“操纵矩阵”自查。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. 上瘾模型四步：触发→行动→多变的酬赏→投入，无限循环</b> 四步无限循环：触发让你开始，行动是最简单的动作，多变酬赏给点不一样的甜头，投入让你付出点什么。投入加载下一次触发，循环往复，习惯养成。</p><p class="pv1-ex"><i>例</i>无聊打开抖音：无聊（触发）→点开下滑（行动）→不知道下一条是什么（多变酬赏）→点赞关注（投入，算法更懂你）。</p></li><li><p class="pv1-idea"><b>2. 外部触发 vs 内部触发：最高境界是让情绪成为触发器</b> 外部触发是推送广告推荐；内部触发是你自己的情绪（无聊、孤独、想炫耀）。最高境界：无聊=刷抖音，晒生活=发朋友圈。情绪是最省钱的流量。</p><p class="pv1-ex"><i>例</i>微信：最早被朋友消息拉进去，后来“无聊就点开看看”——触发器从外部变成了情绪。</p></li><li><p class="pv1-idea"><b>3. 福格行为模型：行动 = 动机 + 能力 + 触发，三者缺一不可</b> 行动发生要三者齐：有动机（想做）、有能力（够简单）、有触发（有个由头）。产品设计的大量工作，就是降低行动难度。</p><p class="pv1-ex"><i>例</i>抖音下滑：想看有意思的（动机）+手指一滑零成本（能力）+无聊（触发）。打开要点五六步，行动就发生不了。</p></li><li><p class="pv1-idea"><b>4. 多变的酬赏：社交、猎物、自我，不确定性最抓人</b> 灵感来自斯金纳的鸽子实验：奖励不确定，行为更疯狂。三种酬赏：社交（点赞认同）、猎物（刷到新东西像寻宝）、自我（升级集满的成就感）。</p><p class="pv1-ex"><i>例</i>朋友圈：不知道谁会点赞说什么，忍不住反复点开看；淘宝“猜你喜欢”：每次刷新都不一样，像开盲盒。</p></li><li><p class="pv1-idea"><b>5. 投入：用户付出越多，越离不开；投入会加载下一个触发</b> 让用户付出时间、数据、内容、社交关系。三个作用：储存价值（越用越好用）、沉没成本让人舍不得走、加载下一个触发。</p><p class="pv1-ex"><i>例</i>小红书关注200人收藏500篇笔记后，你还舍得换平台吗？发了帖就等点赞——这就是下一次触发。</p></li><li><p class="pv1-idea"><b>6. 习惯养成后，就不需要外部触发了</b> 循环转够多圈，内部触发完全接管，用户主动回来。判断标准一句话：关掉所有推送，用户还会不会回来？</p><p class="pv1-ex"><i>例</i>现在的微信：99%不是被推送拉开的，是“想看看有没有人找我”。天天靠红包续命的产品，恰恰说明习惯没养成。</p></li><li><p class="pv1-idea"><b>7. 操纵矩阵：用这套方法，是在帮用户还是在害用户？</b> 上瘾模型是中性的，刀能切菜也能伤人。设计前先自查：我在帮用户成为他想成为的人，还是在利用他的弱点榨时间？</p><p class="pv1-ex"><i>例</i>帮用户养成每天背单词 vs 让用户每天多刷2小时短视频——同一套手法，一边是帮，一边是害。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>开篇：习惯区</b> 什么是“习惯型产品”：让用户不假思索主动回来的产品；习惯是互联网最值钱的资产。</p><p class="pv1-ex"><i>例</i>Facebook成了、无数“类Facebook”死了：区别是有没有进入用户的“习惯区”。</p></li><li><p class="pv1-part"><b>第1步：触发</b> 外部触发怎么把用户拉进来，以及怎么转化成内部触发（情绪和需求）。</p><p class="pv1-ex"><i>例</i>拼多多“砍一刀”：朋友链接是外部触发；“想买东西别买贵了就想到拼多多”是内部触发。</p></li><li><p class="pv1-part"><b>第2步：行动</b> 用福格行为模型拆解行动：动机怎么撩拨、能力怎么做减法、触发怎么给。</p><p class="pv1-ex"><i>例</i>一键登录 vs 填10项注册：把能力门槛降到零，行动发生率天差地别。</p></li><li><p class="pv1-part"><b>第3步：多变的酬赏</b> 三种酬赏（社交/猎物/自我），以及为什么“不确定性”才是上瘾的灵魂。</p><p class="pv1-ex"><i>例</i>抖音信息流永远不知道下一条是什么——“开盲盒”的感觉就是多变酬赏。</p></li><li><p class="pv1-part"><b>第4步：投入</b> 让用户付出时间数据内容社交关系；投入储存价值、制造沉没成本、加载新触发。</p><p class="pv1-ex"><i>例</i>B站投币收藏关注：越用越懂你，换平台代价越高；发动态等点赞的心情就是下次触发。</p></li><li><p class="pv1-part"><b>实战：圣经App案例、习惯测试与伦理</b> 用“圣经App”完整演示模型落地：习惯测试+“操纵矩阵”伦理自查。</p><p class="pv1-ex"><i>例</i>圣经App用“每天读经打卡+连续X天勋章+完成进度”，把反人性的读经做成了习惯。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b37">
<p class="pv1-eyebrow"><span class="no">NO.37</span><span>产品经理</span></p>
<h3>《增长黑客》</h3>
<p class="pv1-bmeta">Hacking Growth · 肖恩·埃利斯、摩根·布朗 · 中信出版社 · 2017</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/27593848/" target="_blank" rel="noopener">豆瓣 8.2 分 · 5546人评价 →</a></p>
<p class="pv1-lede">“增长黑客”发明人亲笔：用数据和一次次小实验，让用户量滚雪球一样涨起来。而不是砸钱买广告。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>2010 年，埃利斯帮 Dropbox 做增长。发现传统市场打法又贵又慢。提出“增长黑客”：横跨产品、技术、数据、营销，只为增长负责的团队。2017 年，他和摩根·布朗把这套方法写成这本书。</p><p>核心观点：增长不是玄学，是可复制的科学流程。先确认有人真心想要产品，再定全公司共盯的“北极星指标”。然后一周跑几个小实验：看数据、提想法、排优先级、做实验、复盘。</p><p>这套流程第一次把硅谷顶级公司的增长方法系统化，还定义了一个新工种。今天大厂的“用户增长部”，源头都在这本书。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. </b> 增长没人真正负责：产品归产品、市场归市场。增长团队把懂产品、会写代码、会看数据、懂营销的人拧在一起，只对增长负责。</p><p class="pv1-ex"><i>例</i>Facebook 早期，增长团队的工程师直接改新用户引导。分析师第二天就看得到留存变化，不用等市场部排期做广告。</p></li><li><p class="pv1-idea"><b>2. </b> 产品没人爱之前，谈增长就是烧钱。土办法：问用户“产品明天没了你会有多失望”。超过 40% 说“非常失望”，再砸资源做增长。</p><p class="pv1-ex"><i>例</i>Dropbox 先拍了个 3 分钟演示视频。几万人排队留邮箱，才全力投入。反过来，很多 App 一买量用户就流失——产品还没让人“非用不可”。</p></li><li><p class="pv1-idea"><b>3. </b> 增长团队最容易犯的错：每个人看的指标不一样。找一个最能代表“用户获得核心价值”的指标，全公司只盯它。它涨，增长才健康。</p><p class="pv1-ex"><i>例</i>Airbnb 的北极星是“入住的间夜数”。定对了这个数，团队不会为了 KPI 去刷一些没用的数据。</p></li><li><p class="pv1-idea"><b>4. </b> 四步循环不停转：看数据找机会、头脑风暴。ICE 打分排优先级，再小流量测试复盘。关键是快和多：一周跑好几个实验，大部分会失败，成一个就净赚。</p><p class="pv1-ex"><i>例</i>LinkedIn 每周同时跑十几个实验：改邮件标题、换按钮颜色。90% 没效果，但涨 5% 转化的那个，一年就是几百万新增用户。</p></li><li><p class="pv1-idea"><b>5. </b> 别每个渠道都浅尝辄止。先小成本测一批，找到“投入一块赚回三块”的，再把资源全砸进去。同时算清账：获客成本必须远低于用户终身价值。</p><p class="pv1-ex"><i>例</i>Airbnb 早期没钱打广告。它做了一键同步房源到 Craigslist 的工具，白嫖巨大流量。拼多多早期靠微信群“砍一刀”，几乎零成本获客。</p></li><li><p class="pv1-idea"><b>6. </b> 下载不等于会用。“啊哈时刻”就是用户第一次觉得“这东西真好用”的瞬间。想尽办法让新用户尽快到达。</p><p class="pv1-ex"><i>例</i>Facebook 发现新用户 10 天内加满 7 个好友。留存大幅提升，于是整个新手引导都围绕“加好友”设计。</p></li><li><p class="pv1-idea"><b>7. </b> 不做留存就砸钱获客，等于往漏桶里倒水。留存做到位，再用病毒循环加速：让老用户自发带来新用户。分享动作要对分享者有好处，还要顺手。</p><p class="pv1-ex"><i>例</i>Dropbox“邀请好友、双方各得 2G 空间”。老用户为扩容拼命邀请，新用户为空间乐意接受，一传十、十传百。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分 方法：第1章 搭建增长团队</b> 增长团队长什么样：跨职能、以增长为唯一目标，怎么招人、怎么定工作节奏。</p><p class="pv1-ex"><i>例</i>负责人最好直接向 CEO 汇报，每周只开增长会，只看数据和实验结果。</p></li><li><p class="pv1-part"><b>第2章 好产品是增长的根本</b> 产品市场匹配：用“失望度调查”（40% 法则），判断产品值不值得规模化。</p><p class="pv1-ex"><i>例</i>只有 15% 用户说“没了会非常失望”。结论很清楚：先回去打磨产品，别买量。</p></li><li><p class="pv1-part"><b>第3章 确定增长杠杆</b> 北极星指标：找到代表用户真正获得价值的指标，让全公司对齐。</p><p class="pv1-ex"><i>例</i>SaaS 公司盯“注册数”会刷低质量注册。改成盯“完成核心操作的付费团队数”，大家立刻知道该干什么。</p></li><li><p class="pv1-part"><b>第4章 快节奏试验</b> 增长实验的完整流程：想法来源、ICE 打分排优先级、实验设计、复盘沉淀。</p><p class="pv1-ex"><i>例</i>攒了 50 个想法不可能全做，ICE 打分先上影响力大、把握大、好做的；失败的实验也要写复盘。</p></li><li><p class="pv1-part"><b>第二部分 实战：第5-8章 获客、激活、留存、变现</b> 按用户旅程拆四章：获客讲渠道测试与规模化，激活讲啊哈时刻。留存讲三个阶段，变现讲定价与收入实验。</p><p class="pv1-ex"><i>例</i>获客讲 Airbnb 蹭流量。激活讲 Facebook 的“10 天 7 好友”。留存讲“初期留存决定长期留存”，变现讲实验找最优定价。</p></li><li><p class="pv1-part"><b>第9章 良性循环：维持并加速增长</b> 病毒传播和口碑：设计让用户自发拉新的机制，让增长自己转起来。</p><p class="pv1-ex"><i>例</i>Hotmail 在每封邮件底下加一句“免费邮箱，点击注册”。18 个月做到 1200 万用户，一分钱广告没花。</p></li></ul>
</article>

<p class="pv1-eyebrow"><span class="no">NO.38</span><span>产品经理</span></p>
<h3>《精益数据分析》</h3>
<p class="pv1-bmeta">Lean Analytics · 阿利斯泰尔·克罗尔、本杰明·约斯科维茨 · 人民邮电出版社（图灵） · 2013</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/26278639/" target="_blank" rel="noopener">豆瓣 8.2 分 · 2300人评价 →</a></p>
<p class="pv1-lede">教创业者看数据的书：别再盯虚荣指标了，每个阶段只看一个最重要的数。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>2013 年，克罗尔和约斯科维茨写了这本书。《精益创业》火了之后，人人都说 MVP 加快速迭代。但没人讲清：迭代时到底看什么数据？这本书补上这一块。</p><p>核心有三层。第一，创业者天生会骗自己，需要数据“打脸”。虚荣指标看着爽、指导不了行动。可执行指标告诉你下一步干什么。第二，别搞“数据驱动”，要搞“数据启迪”：数据是参谋，人才是司令。第三，先用“精益画布”一页纸讲清商业模式。再对照“六种商业模式乘以五个阶段”，每个阶段只盯一个指标。</p><p>它把数据分析从大公司 BI 部门手里解放出来，变成创业者每天能用的工具。书里 30 多个真实案例，每个结论都配“这个数当时是多少、算好算坏”。是少见的“带刻度”的数据书。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. </b> 创业者大多很会“说谎”：没证据先说服自己“点子一定能成”。数据的第一个作用不是“证明我对”，而是“及时发现我错”，撞南墙之前掉头。</p><p class="pv1-ex"><i>例</i>Airbnb 先派人去纽约亲手给几十套房源拍照。订单是平均水平的 2 到 3 倍。假设被证实了才规模化——用最小成本让数据“验货”。</p></li><li><p class="pv1-idea"><b>2. </b> 虚荣指标听着爽、指导不了行动：总注册用户、公众号粉丝数。可执行指标告诉你“下一步干什么”：付费转化率、次日留存。这个数字变了，你知道该做什么吗？不知道，就是虚荣指标。</p><p class="pv1-ex"><i>例</i>“我微信加了 5000 个好友”不如“我上周复购率 35%”有价值。数字掉了就知道：该搞会员活动、推新品了。</p></li><li><p class="pv1-idea"><b>3. </b> 好指标三条硬标准：一眼能看懂，不用解释半天；能跟过去、跟同行比；尽量用比率而不是绝对数——绝对数会骗人，比率不会。</p><p class="pv1-ex"><i>例</i>“新增 1 万用户”听着不错，但如果是花 100 万买来的呢？换成“获客成本”这个比率，立刻现形。</p></li><li><p class="pv1-idea"><b>4. </b> 数据是参谋，不是司令。数据告诉你“发生了什么”，“该怎么办”需要人的判断。数据有滞后、有盲区，最重要的东西（用户真实动机）根本不在数据里。</p><p class="pv1-ex"><i>例</i>数据说用户就爱看 15 秒搞笑视频，完全数据驱动，产品会越做越单调；但判断力告诉你：用户也需要有深度的内容。</p></li><li><p class="pv1-idea"><b>5. </b> 用“精益画布”代替几十页商业计划书：一页纸、九个格子。写清解决什么问题、给谁解决、怎么赚钱。想法一变，十分钟擦掉重写，逼着暴露最关键的假设。</p><p class="pv1-ex"><i>例</i>想开社区咖啡店。画布写完立刻看出最危险的假设是“真有人愿意付 299 月卡吗”。那就先发 100 张问卷，别先砸钱装修。</p></li><li><p class="pv1-idea"><b>6. </b> 创业公司经历五个阶段：移情、黏性、病毒性、营收、规模化。每个阶段只盯一个最重要的指标。人的注意力有限，盯十个等于没盯；早期盯收入就是找死。</p><p class="pv1-ex"><i>例</i>做 SaaS，黏性阶段就死盯“周活跃率”，别管收入；到了营收阶段，再盯“每月经常性收入”。</p></li><li><p class="pv1-idea"><b>7. </b> 别看“整体留存率”，要按用户注册时间分群看。1 月来的留存 30%，6 月来的只有 10%。平均看着还行，真相是产品越改越差。平均数会撒谎，分群才能看到真相。</p><p class="pv1-ex"><i>例</i>在线教育 App 整体次日留存 35% 看着不错。按渠道一分：自然用户留存 50%，买量来的只有 15%。买的流量全是垃圾，钱白花了。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第一部分 别再撒谎了（第1-4章）：为什么创业者需要数据</b> 创业者为什么会自欺欺人，数据是用来制衡妄想的；怎么设计记分板，以及数据驱动和数据启迪的区别。</p><p class="pv1-ex"><i>例</i>Airbnb 用人肉跑腿验证专业摄影能让订单翻倍：先验证，再投入。</p></li><li><p class="pv1-part"><b>第2章 分数板的设计：好指标长什么样</b> 好指标三条标准：可理解、可比较、是比率。分清虚荣指标和可执行指标的区别。</p><p class="pv1-ex"><i>例</i>看“总用户数”是虚荣的，看“每周活跃用户增长率”才是可执行的。后者掉了，你知道要去抓留存还是拉新。</p></li><li><p class="pv1-part"><b>第4章 数据驱动 vs 数据启迪</b> 数据的正确姿势：让数据给你启发，但别让数据替你做决定。</p><p class="pv1-ex"><i>例</i>数据告诉你“用户在周五晚上最活跃”。但“要不要为周五专门做活动”，得用人来判断——数据是参谋，人是司令。</p></li><li><p class="pv1-part"><b>第二部分 找到正确的指标：六种商业模式</b> 全书最厚的部分：六种生意，每种配五个发展阶段的关键指标。电子商务、SaaS、免费移动应用、媒体网站、用户生成内容、双边市场。</p><p class="pv1-ex"><i>例</i>做电商就看电子商务那章：移情阶段看验证了几个痛点，黏性阶段看复购率。营收阶段看客单价——直接照抄作业。</p></li><li><p class="pv1-part"><b>第三部分 指标的合理范围：好坏的刻度线</b> 光知道看什么指标还不够，还得知道“多少算好”。给每种商业模式的每个指标划基准线。</p><p class="pv1-ex"><i>例</i>SaaS 月流失率 5% 算优秀，10% 算危险。相当于给你的数据配了一把尺子。</p></li><li><p class="pv1-part"><b>第四部分 把精益分析装进组织</b> 怎么让数据文化落地：从创始人到一线员工，人人会看数、敢质疑、做实验。</p><p class="pv1-ex"><i>例</i>要求每个提案带上“要验证的假设、看什么指标、失败了怎么办”。开会不许说“我觉得”，必须说“数据显示”。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b39">
<p class="pv1-eyebrow"><span class="no">NO.39</span><span>产品经理</span></p>
<h3>《用户故事与敏捷方法》</h3>
<p class="pv1-bmeta">User Stories Applied: For Agile Software Development · 迈克·科恩 · 清华大学出版社 · 2004</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/4743056/" target="_blank" rel="noopener">豆瓣 8.1 分 · 609人评价 →</a></p>
<p class="pv1-lede">敏捷开发写需求的“圣经”：别写几十页没人看的文档了。一张小卡片加面对面交谈，再写下验收标准，就够了。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>2004 年，敏捷教练迈克·科恩写了这本书。当时很多团队嘴上“敏捷”，实际还是瀑布那套。产品经理憋几个月写巨详细的需求文档，做完发现用户根本不想要。</p><p>核心方法是“用户故事”：一张小卡片，正面只写一句话。句式是：作为谁、想要什么、以便于得到什么价值。卡片只是“提醒”，细节靠团队“交谈”聊出来。聊完把“怎么算做完”写成“验收标准”来“确认”。卡片加交谈加确认，就是著名的 3C。INVEST 六原则：独立、可协商、有价值、可估算、小、可测试。</p><p>后半本讲怎么用：故事点估算、排优先级、发布计划、迭代计划。用速率和燃尽图跟踪进度。今天几乎所有敏捷团队写需求的规矩，都出自这本书。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. </b> 完整用户故事有三部分：卡片——小卡片写一句话，只是个提醒；交谈——产品、开发、测试把细节聊透，这是最重要的；确认——把“做到什么程度算完”写成验收标准。卡片故意简略，就是逼大家开口聊。</p><p class="pv1-ex"><i>例</i>“点赞功能”卡片只写“作为刷视频的用户，我想双击点赞，以便表达喜欢”。开会一聊：点赞失败怎么办、连点三次算几次。边界情况全暴露了，文档永远写不出这么全。</p></li><li><p class="pv1-idea"><b>2. </b> 三项缺一不可：“作为谁”逼你想清楚用户是谁；“我想要什么”说功能。“以便于什么”说背后的价值——最重要，能帮你砍掉很多没用的需求。写不出“以便于”，需求本身就没想明白。</p><p class="pv1-ex"><i>例</i>外卖 App：“作为加班族，我想按销量排序，以便找到靠谱的店不踩雷。”看到“以便于”就知道，核心是“帮用户避雷”，设计时就要突出销量和评分。</p></li><li><p class="pv1-idea"><b>3. </b> 好故事六个标准，首字母拼成 INVEST。独立（能单独上线）、可协商（细节可谈）。有价值（对用户有价值）、可估算（能估出工作量）。小（一个迭代内做完）、可测试（做完能验证）。拿这六条一卡，烂需求立刻现形。</p><p class="pv1-ex"><i>例</i>“作为用户，我想有个好看的首页”——违反可测试和有价值。改成“作为新用户，我想在首页看到猜你喜欢，以便快速找到感兴趣的内容”。配上“首屏加载小于 2 秒”，才算合格。</p></li><li><p class="pv1-idea"><b>4. </b> 写故事之前先回答“用户是谁”。把用户分成几类典型角色，起名字、编背景、贴照片上墙。以后讨论需求就问：“宝妈李姐会用这个功能吗？”</p><p class="pv1-ex"><i>例</i>在线教育：“鸡娃宝妈”看学习报告，“自律大学生”看打卡排名。给“考证的打工人”推 15 分钟微课——角色不同，需求完全不同。</p></li><li><p class="pv1-idea"><b>5. </b> 多少扯皮都源于“做完了”但“不是我想要的”。开工前，产品经理和团队把验收测试写下来：一条条可验证的标准。这是给开发的“施工图”、测试的“考卷”、产品的“收货单”。不能是“体验流畅”这种空话。</p><p class="pv1-ex"><i>例</i>登录功能验收：密码输错 3 次，账号锁定 15 分钟并提示；错误提示不告诉你是账号错还是密码错（防撞库）。开发照着写，测试照着测，谁都没话说。</p></li><li><p class="pv1-idea"><b>6. </b> 估“这个功能要几天”十有八九不准，人天会被开会、请假吃掉。用“故事点”：找个熟悉的小故事当“1 个点”，新的跟它比大小。常用斐波那契数列（1、2、3、5、8、13）。数字越大越不精确，逼着把大故事拆小。</p><p class="pv1-ex"><i>例</i>“做个静态页面”等于 1 个点，“带搜索的商品列表页”可能是 5 个点。“整个支付流程”是 13 个点——13 太大了，必须拆。估出来的不是“几天”，而是团队一个迭代能消化多少点。</p></li><li><p class="pv1-idea"><b>7. </b> 刚收集来的需求往往巨大无比，叫“史诗”，比如“用户管理系统”。史诗不能直接进迭代，必须拆成一个个能在 1 到 2 周内做完的故事。拆的原则是“切蛋糕”：每一刀都是完整可用的功能。不是“这周做数据库、下周做界面”那种切法。</p><p class="pv1-ex"><i>例</i>“在线支付”切蛋糕：第一刀“支持支付宝付款”（界面到支付全通）。第二刀“加上微信支付”，第三刀“加上退款”。每一刀上线用户立刻能用。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>第I部分 起步：第1章 概览</b> 用户故事是什么、为什么需要它：软件需求本质是沟通问题。故事等于卡片加交谈加确认。</p><p class="pv1-ex"><i>例</i>“按文档做完了，用户说不是他想要的”——就是因为文档代替不了交谈。故事卡只是约大家来聊天的“饭局邀请函”。</p></li><li><p class="pv1-part"><b>第2章 编写故事、第7章 优秀准则</b> 故事的标准写法、INVEST 六原则、“切蛋糕”式拆分。</p><p class="pv1-ex"><i>例</i>“作为求职者，我想保存搜索条件，以便下次直接看新职位”。主语、功能、价值齐了。再用 INVEST 检查一遍，不合格的打回去重写。</p></li><li><p class="pv1-part"><b>第3-5章：用户角色建模、搜集故事、用户代理</b> 需求从哪来：先给用户画像（角色建模），再用访谈、问卷、观察搜集故事。见不到真实用户时，找“用户代理”合作。</p><p class="pv1-ex"><i>例</i>做医疗软件见不到医生，就去跟医药代表、客服聊。实在不行，让团队成员“扮演”医生走一遍流程——总比坐在办公室编需求强。</p></li><li><p class="pv1-part"><b>第6章 用户故事验收测试</b> 讲“确认”：在写代码之前就把验收标准定下来，由客户定义“什么算做完”。</p><p class="pv1-ex"><i>例</i>“优惠券”验收：满 100 减 10 的券。99 元不能用，100 元能用。退货后券要返还——提前写下来，开发和测试就不用猜了。</p></li><li><p class="pv1-part"><b>第II部分 估算和计划（第8-11章）</b> 故事点估算、排优先级、发布计划、迭代计划，以及用速率和燃尽图跟踪进度。</p><p class="pv1-ex"><i>例</i>发布计划：按优先级把故事排进待办列表，用团队的历史速率一算。“双十一前能做完哪些”一目了然——比拍脑袋定截止日期靠谱。</p></li><li><p class="pv1-part"><b>第IV部分 完整实例：付款管理项目</b> 全书最实在的部分：拿一个真实的付款管理项目，从头到尾演示。怎么写故事、怎么估、怎么排计划、怎么迭代。</p><p class="pv1-ex"><i>例</i>跟着这个案例走一遍：一个“史诗”怎么被拆成十几个小故事。哪些先进第一个迭代，燃尽图怎么画——相当于一次带教实习。</p></li></ul>
</article>
<article class="pv1-book rv" id="pv1-b40">
<p class="pv1-eyebrow"><span class="no">NO.40</span><span>产品经理</span></p>
<h3>《定位》</h3>
<p class="pv1-bmeta">Positioning: The Battle for Your Mind · 艾·里斯、杰克·特劳特 · 中国财政经济出版社 · 1981</p>
<p class="pv1-brating"><a href="https://book.douban.com/subject/1017180/" target="_blank" rel="noopener">豆瓣 8.2 分 · 9578人评价 →</a></p>
<p class="pv1-lede">营销学“圣经”：别再死磕“我的产品更好”。商战打的是用户脑子里的位置——谁先占住一个词，谁就赢。</p>
<h4 class="pv1-sec"><span>总体观点</span></h4>
<div class="pv1-thesis"><p>1981 年，广告人艾·里斯和杰克·特劳特出版了《定位》。当时营销界信奉“产品为王”“创意至上”。他俩泼了一盆冷水：信息爆炸的社会里，用户心智容量极其有限。它讨厌复杂、很难改变。营销的战场不在市场、不在渠道，而在潜在顾客的心智里。核心打法就几招。第一，成为第一：“更好”不如“更早”，人们只记得第一。第二，当不了第一，就开创一个新品类当第一。七喜打不过可口可乐和百事，就发明“非可乐”品类。第三，每个品类在心智里只有几个“阶梯位”。想挤上去，得用一个词“钉”住，比如沃尔沃等于安全。第四，必要时“重新定位”对手：不夸自己，而是把对手钉在不利位置上。</p><p>2001 年，美国营销学会把它评为“有史以来对美国营销影响最大的观念”。从王老吉的“怕上火”到瓜子二手车的“直卖网”，背后都是这套思想。</p></div>
<h4 class="pv1-sec"><span>核心观点 · 7</span></h4>
<ul class="pv1-ideas"><li><p class="pv1-idea"><b>1. </b> 全书总纲：营销不是“产品之战”，是“心智之战”。产品好不好实验室能测出来，但用户买不买取决于他脑子里怎么想。传播过度的社会里，心智为了自保变得简单粗暴。记不住的、太复杂的，一律过滤掉。</p><p class="pv1-ex"><i>例</i>加多宝没聊“我的凉茶配方多正宗”，直接在你脑子里钉了一个词。“怕上火，喝王老吉”——以后你吃火锅、熬夜，第一个蹦出来的就是它。</p></li><li><p class="pv1-idea"><b>2. </b> 人只记得第一：第一个登上月球的阿姆斯特朗人人知道，第二个是谁？没几个人说得出来。一旦第一名在心智里扎了根，后来者再好也只是“更好的第二名”。用户通常只买第一名。</p><p class="pv1-ex"><i>例</i>可口可乐是“可乐第一”，百事再努力也只能当“第二可乐”。与其在红海跟老大拼刺刀，不如找个没人的山头先插旗。</p></li><li><p class="pv1-idea"><b>3. </b> 第一名的位置被占了，硬挤挤不进去。解法是换赛道：自己定义一个新品类，在这个新品类里当第一。新品类的名字越简单、越跟老品类对立，效果越好。</p><p class="pv1-ex"><i>例</i>七喜打不过可口可乐和百事，就发明了“非可乐”。把饮料分成“可乐型”和“非可乐型”，自己在新品类里当老大。</p></li><li><p class="pv1-idea"><b>4. </b> 用户的心智像架梯子，每个品类都是一架梯子。每架梯子上只有几个位置，越往上越难挤。营销的任务就是让品牌尽量往上爬。最忌讳“定位模糊”——用户想不起来你是干嘛的，等于没定位。</p><p class="pv1-ex"><i>例</i>提到“安全”你想到沃尔沃，提到“驾驶乐趣”你想到宝马。反过来，很多品牌的广告语是“高品质生活”。哪个品类都能用，等于谁的心智都没占住。</p></li><li><p class="pv1-idea"><b>5. </b> 名字是钉入心智的钉子，好名字让人一听就知道你是干嘛的、跟谁不一样。原则：简单、好记、最好自带品类信息。最忌讳生僻字、拗口音译，或者一个名字横跨好几个不相关的品类。</p><p class="pv1-ex"><i>例</i>“瓜子二手车直卖网”，名字直接告诉你“我是干嘛的、跟中介有什么区别”。“饿了么”一听就是外卖。反过来，有些公司起个英文缩写，用户记了三年还不知道你是干嘛的。</p></li><li><p class="pv1-idea"><b>6. </b> 最“狠”的一招：不王婆卖瓜，而是把竞争对手“重新定位”到不利位置。方法不是攻击对手产品，而是利用用户心里对老大的固有印象，轻轻推一把。关键是引起共鸣：说的必须是用户心里隐隐觉得对的事。</p><p class="pv1-ex"><i>例</i>七喜说自己是“非可乐”，潜台词是“可乐等于含咖啡因、不够健康”。把可口可乐和百事一起钉在了“可乐阵营”里。</p></li><li><p class="pv1-idea"><b>7. </b> 书的最后把定位拉回个人：找工作、做职业规划，本质也是抢位置。方法一样：先搞清楚自己的独特价值，再想清楚抢哪个位置。然后用最简单的词让人记住，长期坚持。</p><p class="pv1-ex"><i>例</i>两个产品经理，一个简历写“3 年产品经验，负责过 App”。另一个写“从 0 到 1 做过百万用户的社交 App，专精增长”。后者一下钉住了“增长型产品经理”的位置。</p></li></ul>
<h4 class="pv1-sec"><span>全书结构</span></h4>
<ul class="pv1-parts"><li><p class="pv1-part"><b>开篇：定位是什么、心智备受骚扰（第1-2章）</b> 定位的基本概念：心智为什么是营销的终极战场。传播过度如何让用户的大脑变得排外、怕复杂。</p><p class="pv1-ex"><i>例</i>一个人一年要接触几十万条广告。大脑为了自保，只接收跟已有认知相符的信息。“酒香”再香，也得先挤进心智里。</p></li><li><p class="pv1-part"><b>切入心智：心智的小阶梯（第3-4章）</b> 心智的工作方式：每个品类在脑子里都是一架小梯子，位置有限；切入心智要简单，要借力已有的认知。</p><p class="pv1-ex"><i>例</i>“怕上火，喝王老吉”只用了 7 个字。它借了“上火”这个人人懂的概念，一下把凉茶钉进了饮料的梯子。</p></li><li><p class="pv1-part"><b>领导者与追随者的定位（第6-7章）</b> 第一名和第二名该怎么打：领导者守住位置、封死对手上位的路；追随者别硬碰硬，要找空位。</p><p class="pv1-ex"><i>例</i>可口可乐作为领导者，最好的策略是“正宗可乐”；百事作为追随者，打“新一代的选择”抢年轻人——各打各的，不正面拼刺刀。</p></li><li><p class="pv1-part"><b>重新定位竞争对手（第8章）</b> 全书最精彩的一章：怎么把对手钉在不利位置上，借力打力。</p><p class="pv1-ex"><i>例</i>七喜的“非可乐”没花一分钱攻击可口可乐。它只是重新定义了战场，把两大可乐巨头装进了“可乐型”这个筐里。</p></li><li><p class="pv1-part"><b>名字的威力与品牌延伸的陷阱（第9-13章）</b> 名字怎么起、品牌为什么不能乱延伸：一个名字在用户脑子里只能代表一件事。贪多必失。</p><p class="pv1-ex"><i>例</i>施乐想从复印机延伸到计算机。用户脑子里的“复印机”印象太深，计算机业务惨败。名字一旦钉死，很难再钉第二件事。</p></li><li><p class="pv1-part"><b>给公司、国家、产品、服务定位（第14-20章）</b> 把定位方法用到各种对象上：企业名、多元化公司、国家形象。银行、教堂——万物皆可定位。</p><p class="pv1-ex"><i>例</i>连国家都能定位：提到瑞士你想到手表和银行，提到德国你想到汽车和严谨。国家形象也是多年定位的结果。</p></li><li><p class="pv1-part"><b>为自己和前程定位：六步建立定位（第21-22章）</b> 把定位用在个人职业上，总结建立定位的六个步骤。认清现状、找准位置、选定对手、准备资源、长期坚持、表里如一。</p><p class="pv1-ex"><i>例</i>求职时别说“我要找一份有发展的工作”（等于没定位）。要说“我要成为母婴品类最懂增长的产品经理”——位置越具体，越容易被记住。</p></li></ul>
</article></section>

<section class="pv2-domain" id="software"><div class="pv2-domain-head"><span class="pv2-ghost" aria-hidden="true">01</span><div><p class="pv2-eyebrow">第壹辑 · 软件工程</p><h2 class="pv2-domain-title">软件工程</h2><p class="pv2-domain-intro">软件工程就是研究怎么把写代码这件事，从“一个人灵光一闪”变成“一群人稳定交付”的学问——管的不只是代码，更是人、进度和复杂度。</p></div></div>
<article class="pv2-book" id="pv2-book-1">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.01</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《人月神话》</h3>
  <p class="pv2-meta">The Mythical Man-Month: Essays on Software Engineering · 弗雷德里克·布鲁克斯 · 清华大学出版社 · 1975</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1102259/" target="_blank" rel="noopener">豆瓣 8.4 分 · 3676人评价 <span>→</span></a></p>
  <p class="pv2-lede">IBM 超级大项目的血泪总结：软件项目为什么总延期，加人为什么救不了它。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>布鲁克斯在 IBM 负责 OS/360——当时人类做过的最大软件项目，延期、超支、混乱全占。1975 年，他把教训写成这本书。</p><p>核心论点：软件的困难不在技术，在沟通、组织和人。“人月”是神话——人和时间不能随意互换，往延期的项目里加人，只会更延期。</p><p>布鲁克斯法则、概念完整性、外科手术团队、没有银弹——五十年过去还在被引用。经典就是经得起时间。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 8</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 给延期的项目加人，只会让它更延期（布鲁克斯法则）</b> 新人要培训，占用老人时间；任务重分增加沟通成本。短期内生产力不升反降，加人这剂药见效慢、副作用大。</p><p class="pv2-ex"><i>例</i>装修延期了，临时加三个新工人。你得停下手头活给他们讲清哪面墙要砸，讲半天原来的师傅也干不了活。人越多越乱。</p></li><li><p class="pv2-idea"><b>2. “人月”是个神话：人和时间不能随便互换</b> 5 个人干 2 个月是 10 人月，但 10 个人干 1 个月不是——有些活有严格先后顺序，必须一个人从头想到底，拆不开、并行不了。</p><p class="pv2-ex"><i>例</i>生孩子：1 个女人怀 9 个月，9 个女人一起上也生不出 1 个月的孩子。系统核心架构就得一个人想透，拼不起来。</p></li><li><p class="pv2-idea"><b>3. 沟通成本是按平方增长的</b> n 个人有 n(n-1)/2 条沟通通道。5 个人 10 条，50 个人 1225 条。人越多，每个人真正干活的时间占比越低。</p><p class="pv2-ex"><i>例</i>5 人小群消息清爽，50 人大群一天 999+，重要通知全被淹没。光爬楼对齐，就成了主业。</p></li><li><p class="pv2-idea"><b>4. 概念完整性是系统设计最重要的东西</b> 好系统像出自一个大脑：风格统一、思路连贯。功能多但七拼八凑，不如功能少但浑然一体。架构师说了算，不投票。</p><p class="pv2-ex"><i>例</i>装修请一个总设计师统管，风格统一住着舒服；客厅卧室厨房各请一个，装完像大杂烩，住着别扭。</p></li><li><p class="pv2-idea"><b>5. 外科手术团队：精英小队胜过大兵团</b> 不堆人数，组精英小队：一个主刀负责核心设计和代码，其他人全力配合。决策快、沟通少、质量高，小而精胜大而全。</p><p class="pv2-ex"><i>例</i>做手术：主刀动刀，其他人递器械、看监护仪、做记录。十个医生各切一刀，病人就没了。</p></li><li><p class="pv2-idea"><b>6. 第二系统效应：第二个系统最容易做“大”做“杂”</b> 做第一个系统时小心翼翼，做第二个时自信心爆棚，把上次没敢加的花哨功能全塞进去。结果臃肿难用。做第二个系统，克制比能力重要。</p><p class="pv2-ex"><i>例</i>第一家店菜单十道菜，样样好吃；开分店觉得自己行了，菜单加到五十道，后厨乱成一锅粥，老店口碑也砸了。</p></li><li><p class="pv2-idea"><b>7. 程序员都是乐观主义者，所以进度估算永远偏乐观</b> 程序员天生乐观，估算只算顺利情况，不算调试、联调、返工。布鲁克斯的经验比例：1/3 计划、1/6 写代码、1/4 构件测试、1/4 系统测试。</p><p class="pv2-ex"><i>例</i>你说开车去机场 40 分钟，是按一路绿灯算的。找车位、排队安检的时间也得留。“写完”不等于“能用”。</p></li><li><p class="pv2-idea"><b>8. 没有银弹：别指望某个新技术一夜解决所有问题</b> 软件的困难分本质困难（想清楚要做什么）和偶然困难（工具不好用）。新工具只能消灭后者，前者永远存在。别追银弹，练好基本功。</p><p class="pv2-ex"><i>例</i>减肥没有神药，管住嘴迈开腿才是本质。AI 编程工具能少写样板代码，但“需求到底要做什么”，还得人自己想。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：困难的本质（第1章 焦油坑、第2章 人月神话）</b> 定调：大型软件开发像掉进焦油坑，越挣扎陷越深；“人月”是骗人的，人和时间不能互换。</p><p class="pv2-ex"><i>例</i>车陷进沼泽，多叫几个人推只会脚印更乱、陷得更深——问题在沼泽本身，不在人数。</p></li><li><p class="pv2-part"><b>第二部分：怎么组织团队（第3章 外科手术队伍、第4章 贵族专制、民主政治和系统设计）</b> 精英小队（外科手术团队）加概念完整性：系统设计像出自一个大脑，架构师说了算，不民主投票。</p><p class="pv2-ex"><i>例</i>拍电影导演一个人说了算，风格才统一；十个导演轮流指挥，拍出来就是大杂烩。</p></li><li><p class="pv2-part"><b>第三部分：设计里的坑（第5章 画蛇添足、第6章 贯彻执行）</b> 警告第二系统效应——第二个系统最容易过度设计；再好的想法，执行走样也白搭。</p><p class="pv2-ex"><i>例</i>养第二个孩子容易被宠坏：加了太多“为你好”的安排，孩子压力山大——过度设计害人害己。</p></li><li><p class="pv2-part"><b>第四部分：进度是怎么失控的（第7章 为什么巴比伦塔会失败、第8章 胸有成竹、第9章 削足适履、第10章 提纲挈领、第11章 未雨绸缪）</b> 沟通失败、估算乐观、文档缺失如何一步步拖垮进度，以及用文档、里程碑把项目拉回正轨。</p><p class="pv2-ex"><i>例</i>全家出游没人做攻略、出发时间随口一说、各玩各的手机——最后肯定有人掉队、有人饿肚子。</p></li><li><p class="pv2-part"><b>第五部分：把项目做完的实战（第12章 干将莫邪、第13章 整体部分、第14章 祸起萧墙、第15章 另外一面）</b> 工具、测试、调试这些“把活干完”的硬功夫，以及项目后期各种幺蛾子的应对。</p><p class="pv2-ex"><i>例</i>装修收尾决定入住体验：缝隙打没打胶、插座通没通电——最后 10% 的活，决定 90% 的口碑。</p></li><li><p class="pv2-part"><b>第六部分：二十年后再看（第16章 没有银弹、第17章 再论“没有银弹”、第18章 命题的再论述、第19章 令人惊喜的二十年）</b> 20 周年版新增：布鲁克斯复盘当年论断的对错，以及“没有银弹”——本质困难靠技术突变消灭不掉。</p><p class="pv2-ex"><i>例</i>老船长二十年后重看自己画的航海图：有些暗礁标对了，有些洋流判错了，但“大海永远有风险”这条总原则没变。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-2">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.02</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《人件》</h3>
  <p class="pv2-meta">Peopleware: Productive Projects and Teams · 汤姆·迪马科、蒂莫西·李斯特 · 清华大学出版社 · 1987</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1108725/" target="_blank" rel="noopener">豆瓣 8.2 分 · 1204人评价 <span>→</span></a></p>
  <p class="pv2-lede">软件项目最大的问题不在技术，在人。怎么管好人这个最贵资产，而不是把程序员当零件用。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>两位作者干了几十年软件咨询，核心判断：管软件团队先是社会学问题，其次才是技术问题。士气、信任、专注度，才是成败关键。</p><p>软件业最大的浪费不在技术落后，在管理者在人上犯蠢：吵闹办公室、频繁打断、理所当然的加班、走马灯式的人员流动。和《人月神话》并称软件管理“两朵奇葩”：一个讲事，一个讲人。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 管理软件团队，首先是社会学问题，不是技术问题</b> 管理者爱琢磨流程工具，但成败更多取决于人的状态。人的问题解决了，技术问题自己顺；人心散了，再好的工具也白搭。</p><p class="pv2-ex"><i>例</i>孩子成绩下滑，先搞清楚他是不是没睡好、在学校被欺负了，而不是直接报更多补习班。根子在人，补课治标不治本。</p></li><li><p class="pv2-idea"><b>2. 程序员需要“流”：不被打断的整块时间</b> “流”是完全沉浸、忘记时间的专注状态，程序员最有产出的时刻。进入流要 15 分钟预热，一个电话就能击碎。一天被打断五六次，等于一天没干活。</p><p class="pv2-ex"><i>例</i>煲汤要小火慢炖才入味，每隔十分钟揭一次盖子，这锅汤永远煲不好。频繁打断，思路永远停在“烧开水”阶段。</p></li><li><p class="pv2-idea"><b>3. 办公室环境直接决定生产力</b> 吵闹的开放式办公室、没窗户的工位、动不动被叫去开会——环境对效率的伤害远超想象。环境不是福利，是生产资料。</p><p class="pv2-ex"><i>例</i>让孩子在菜市场门口写作业和在安静书房写，效果能一样吗？花大钱买人体工学椅，却舍不得给个安静角落——捡芝麻丢西瓜。</p></li><li><p class="pv2-idea"><b>4. 加班是个谎言：长期加班越多，质量越差</b> 短期冲刺可以，长期加班只会让人疲劳、出错、士气低落。很多加班不是为赶进度，是为“显得努力”、为出事免责。高效团队靠上班时的专注，不靠下班耗时间。</p><p class="pv2-ex"><i>例</i>考试前通宵刷题：熬到凌晨三点脑子成浆糊，错题更多，第二天照样栽。不如每天高效学 6 小时睡个好觉。</p></li><li><p class="pv2-idea"><b>5. “质量如果时间允许”——这句话本身就是病</b> 把质量当可选项，时间够就做好一点——牺牲质量省下的时间，后面以十倍代价还回来：修 bug、返工、客户投诉。“将就一下”是最贵的选择。</p><p class="pv2-ex"><i>例</i>装修用电线细一号的便宜货，省几百块，三年后线路老化砸墙重装花几万。代码里每次“将就”，都是未来的“砸墙重装”。</p></li><li><p class="pv2-idea"><b>6. 好团队是“胶冻”出来的，不是拼凑出来的</b> 高效团队像果冻一样“凝”在一起：互相信任、目标一致。但防御性管理、官僚主义、频繁打散重组、不可能的 deadline，会杀死这种凝聚力。</p><p class="pv2-ex"><i>例</i>五个各怀心思的明星，不如五个配合默契的普通球员。天天拆散重组、朝令夕改，队伍永远凝不起来。</p></li><li><p class="pv2-idea"><b>7. 人是最贵的资产，别把人当零件换</b> 程序员不是标准件，换一个人，几个月达不到原来人的产出。招聘、培训、知识流失、士气打击，隐性成本巨大。留人比招人重要：给挑战、给尊重、给好环境。</p><p class="pv2-ex"><i>例</i>老字号餐馆大厨走了，招牌菜味道三个月回不来，熟客跟着流失。省下的工资，跟流失的客人比，不值一提。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：管理人力资源（游戏的名称、高科技的幻觉、不存在加班的谎言、质量——如果时间允许、帕金森定律……）</b> 拆穿管理幻觉：没有神奇方法让生产力翻倍，加班解决不了问题，质量不能“时间允许再说”。</p><p class="pv2-ex"><i>例</i>家长觉得“换个补习班成绩就上去了”——不解决孩子本身的状态，换多少补习班都是折腾。</p></li><li><p class="pv2-part"><b>第二部分：办公环境（流、亲密梯度、窗户与噪音……）</b> 物理环境决定脑力产出：安静、私密、有窗户才能进入“流”；噪音和打断是隐形杀手。</p><p class="pv2-ex"><i>例</i>图书馆和夜市大排档旁看书，一晚上读进去的页数差好几倍——环境是脑力劳动的生产资料。</p></li><li><p class="pv2-part"><b>第三部分：选对人、用好人（招聘、面试、团队化学……）</b> 看真实做过的事而不是简历话术；招进来后让人快速融入、发挥所长，不把人当螺丝钉。</p><p class="pv2-ex"><i>例</i>相亲光看简历不如深聊一次；“结婚”之后，磨合期的相处方式决定关系能走多远。</p></li><li><p class="pv2-part"><b>第四部分：让团队“胶冻”起来（胶冻团队、黑衣团队、团队自杀手册……）</b> 高效团队如何形成，以及管理者无意中杀死团队的行为：不信任、官僚、频繁打散、伪造 deadline。</p><p class="pv2-ex"><i>例</i>熬果冻老去搅它、加水、倒来倒去，永远成不了形。团队也一样，瞎折腾就是最大的破坏。</p></li><li><p class="pv2-part"><b>第五部分：在这里工作应该是开心的（童年的终结、在这儿很开心、离职率……）</b> 留人靠有挑战的工作、被尊重的感觉、持续成长的机会。留不住人先照镜子，别怪年轻人不吃苦。</p><p class="pv2-ex"><i>例</i>好餐馆留回头客靠菜好吃、服务舒服，不靠优惠券。好公司留人靠“干得爽”，不是“走了找不到更好的”。</p></li><li><p class="pv2-part"><b>第六部分：新版新增——直面现代职场病（谈谈领导力、会议文化、（邪恶）邮件、与风险共舞……）</b> 第三版新增 6 章，专治现代公司病：病态领导力、开不完的会、淹没人的邮件、假装风险不存在。</p><p class="pv2-ex"><i>例</i>以前是“办公室太吵”，现在是“微信群 24 小时 @所有人”——病变了，药方也得更新。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-3">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.03</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《代码大全（第2版）》</h3>
  <p class="pv2-meta">Code Complete: A Practical Handbook of Software Construction, Second Edition · 史蒂夫·迈克康奈尔 · 电子工业出版社（博文视点） · 2004</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1477390/" target="_blank" rel="noopener">豆瓣 9.3 分 · 4285人评价 <span>→</span></a></p>
  <p class="pv2-lede">程序员案头武功秘籍：从变量命名到系统集成，教你把代码写得又结实又好懂。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>麦克康奈尔提出“软件构建”——从详细设计到编码、调试、测试、集成的“真正把软件造出来”的工作。这是占比最大、最核心的环节：需求可以谈，架构可以画，最后都得落到一行行代码。</p><p>这本书是“怎么写好代码”的百科全书：变量命名、函数写法、防御 bug、测试调试、重构调优，每个环节的最佳实践。不讲具体语言语法，讲所有语言通用的手艺。第一版拿过软件图书大奖，第二版 900 多页，无数程序员每年重读。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 8</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 软件构建的核心任务，是管理复杂度</b> 构建中压倒一切的目标是管理复杂度——人脑一次装的东西有限，代码越复杂 bug 越多，再聪明的人也 hold 不住一团乱麻。</p><p class="pv2-ex"><i>例</i>整理衣柜：衣服少随便堆也找得到，衣服多就得分区挂、贴标签、断舍离。大项目不靠拆分抽象管理复杂度，就是灾难。</p></li><li><p class="pv2-idea"><b>2. 隐喻决定你怎么写代码</b> 你心里把写软件比作什么，直接影响做法。比作“建大楼”就重视蓝图，比作“写作”就重视反复修改。选个好隐喻等于选了套好方法，烂隐喻把人带进沟。</p><p class="pv2-ex"><i>例</i>学做菜想成“化学实验”就会精确称量，想成“凭感觉”就随手抓料。隐喻选对了，动作自然对。</p></li><li><p class="pv2-idea"><b>3. 三思而后行：动手前先把“上游”想清楚</b> 需求架构没想清楚就开工，后面返工代价是前期的几十倍。前期多花一小时，后面省好几小时。但也别过度准备——到“足够开工”就行。</p><p class="pv2-ex"><i>例</i>装修图纸没画好就砸墙，墙漆刷完才发现卧室没留网口，返工得砸墙。图纸改一笔 1 分钟，墙上改 1 天。</p></li><li><p class="pv2-idea"><b>4. 防御式编程：对输入保持“合理的偏执”</b> 永远别信外部传进来的数据：用户输入、文件、网络都可能有问题。用断言把假设写下来，用错误处理接住异常。好代码像好门卫：先验身份再放行。</p><p class="pv2-ex"><i>例</i>小区门卫不能看脸放行，得刷卡登记。函数收到参数先检查合法性，能拦住一大半 bug——很多线上事故都是“没想到他会传这个”。</p></li><li><p class="pv2-idea"><b>5. 先写伪代码，再写真代码</b> 动手前先用大白话把逻辑步骤写出来，思路通了再翻译成代码。伪代码阶段改思路成本极低，代码写完再改就贵了。</p><p class="pv2-ex"><i>例</i>写作文先列提纲：提纲阶段调结构挪几个字就行，全文写完才发现结构问题，得重写三千字。</p></li><li><p class="pv2-idea"><b>6. 好名字是最好的注释</b> 好名字让代码自己说话：calculateTotalPrice() 一看就懂，calc() 得靠猜。准确、具体、避免误导——烂名字是代码腐烂的开始。</p><p class="pv2-ex"><i>例</i>“新建文件夹(2)”和“2026年国庆三亚游照片”，哪个找起来快？好名字省掉无数次“我当时写的这是啥”。</p></li><li><p class="pv2-idea"><b>7. 表驱动法：用查表代替一堆 if-else</b> 复杂条件分支别写十几层 if-else，用表把“条件→结果”存起来，只做一次查表。逻辑一目了然，规则变了只改表不动代码。</p><p class="pv2-ex"><i>例</i>快递分拣靠老师傅背区号会乱，贴一张“区号—线路对照表”在墙上，新人照着查就行。把“记性活”变成“查表活”，谁都不会错。</p></li><li><p class="pv2-idea"><b>8. 协同构建：代码是写给人看的，要让人帮你看</b> 结对编程、代码评审——让第二双眼睛看代码，是发现 bug 性价比最高的方式。评审能发现六成以上缺陷，比自己闷头调试高效得多。</p><p class="pv2-ex"><i>例</i>重要邮件请同事看一眼：自己看三遍看不出的错别字，别人一眼看到。作者有思维盲区，评审就是借别人的眼睛。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：打好基础（第1-4章：欢迎进入软件构建的世界、用隐喻理解软件开发、前期准备、关键的构建决策）</b> 讲清“软件构建”是什么、为什么是核心，以及动手前的准备和关键决策（选语言、定规范）。</p><p class="pv2-ex"><i>例</i>盖楼前先学看图纸、选材料、定工期——磨刀不误砍柴工，准备工作决定后面是顺利盖楼还是烂尾。</p></li><li><p class="pv2-part"><b>第二部分：创建高质量的代码（第5-9章：设计、类、高质量子程序、防御式编程、伪代码编程过程）</b> 怎么写结实的代码：类和函数设计、防御式代码、伪代码先想清楚——全书最核心的手艺部分。</p><p class="pv2-ex"><i>例</i>学做菜的核心课：备菜、火候、尝味道——这几招学会，做什么菜都不至于太难吃。</p></li><li><p class="pv2-part"><b>第三部分：变量（第10-13章：使用变量的一般事项、变量名的力量、基本数据类型、不常见的数据类型）</b> 最小的积木块：变量声明初始化、名字怎么起、各种数据类型怎么用好。</p><p class="pv2-ex"><i>例</i>学写字先练笔画：笔画正了字才好看。变量名清楚、类型用对，代码读着顺，bug 少。</p></li><li><p class="pv2-part"><b>第四部分：语句（第14-19章：组织直线型代码、条件语句、循环、不常见的控制结构、表驱动法、一般控制问题）</b> 代码的“句子”怎么写：if 和循环保持清晰，避免深层嵌套的“代码迷宫”，以及大杀器表驱动法。</p><p class="pv2-ex"><i>例</i>短句比长难句好读。代码结构清爽一眼看懂，bug 少一半——没人愿意读绕口令式代码。</p></li><li><p class="pv2-part"><b>第五部分：代码改善（第20-24章：软件质量概述、协同构建、开发者测试、调试、重构）</b> 代码写出来只是开始：怎么保质量、做评审测试、高效调试、重构让代码越变越好。</p><p class="pv2-ex"><i>例</i>房子盖好要验收维修翻新——代码也要“体检”（测试）、“看病”（调试）、“装修升级”（重构）。</p></li><li><p class="pv2-part"><b>第六部分：系统考虑（第25-30章：代码调整策略与技术、程序规模的影响、构建管理、集成、编程工具）</b> 从写好一段代码到管好整个项目：性能调优、规模大了怎么管、模块怎么集成、用什么工具。</p><p class="pv2-ex"><i>例</i>从做好一道菜到开餐厅：操心的不再是火候，是上菜速度、后厨分工、供应商配合——全局。</p></li><li><p class="pv2-part"><b>第七部分：软件工艺（第31-35章：布局与风格、自说明代码、个人性格、软件匠艺、在哪里获得更多信息）</b> 手艺人心法：代码排版、自说明代码、程序员修养，以及去哪里继续进阶。</p><p class="pv2-ex"><i>例</i>老师傅收徒最后教的不是招式是心法：“做菜先做人”的态度，决定你能走多远。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-4">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.04</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《程序员修炼之道》</h3>
  <p class="pv2-meta">The Pragmatic Programmer · 安德鲁·亨特、大卫·托马斯 · 电子工业出版社 · 1999</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1152111/" target="_blank" rel="noopener">豆瓣 8.7 分 · 2437人评价 <span>→</span></a></p>
  <p class="pv2-lede">程序员的内功心法：不只教写代码，更教怎么思考、怎么跟人打交道、怎么持续进步。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>1999 年，两位干了二十多年咨询的老手把踩过的坑写成这本书，副标题“从小工到专家”——讲程序员怎么从埋头写代码，成长为独当一面、让人放心的专家。</p><p>核心观点：写代码只是工作的一小部分，真正的本事是“注重实效”——做事前先想清楚为了解决什么问题，对变化开放，对手艺负责。几十条短小精悍的 Tip，条条能直接用。</p><p>它不讲某个语言框架，讲十年二十年不过时的东西：怎么跟需求方沟通、怎么写出好改的代码、怎么持续学习。DRY、破窗理论、曳光弹开发，最早都从这里流行起来。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 8</span></h4>
