  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 别和破窗户住在一起（破窗理论）</b> 一栋楼有扇破窗长期没人修，会传递“没人管”的信号，很快更多窗被打破。代码一样：一个烂命名、一段复制粘贴没人管，其他人就觉得“这里可以随便写”，质量一路滑坡。看到破窗，顺手修好。</p><p class="pv2-ex"><i>例</i>接手老项目看到 data1、data2，想“算了能跑就行”，接着自己也随便命名，三个月后模块谁也看不懂。反过来顺手改成 userList，别人看到“这里有人在乎”，也会认真写。</p></li><li><p class="pv2-idea"><b>2. 先打曳光弹，再全力开火</b> 别一上来憋大招写完整系统，先做能从头跑到尾的最小可用版本——界面能点、流程能走通，哪怕很糙。立刻知道架构对不对、需求理解偏没偏，偏了也只浪费几天。</p><p class="pv2-ex"><i>例</i>做在线点餐，先做只能“选菜→下单→看到订单”的简陋版给用户点一点。对方说“其实想要扫码点餐不是 App 点餐”，你只浪费一周，不是两个月。</p></li><li><p class="pv2-idea"><b>3. 正交性：改A别影响B</b> 系统各部分尽量独立，改一个地方不牵一发而动全身。正交的系统好改好测 bug 少；耦合在一起的系统，改个按钮颜色都可能把支付搞挂。</p><p class="pv2-ex"><i>例</i>注册功能把校验手机号、发短信、写数据库全塞一个函数，改图形验证码时注册流程挂了。拆成三个独立模块，换验证码只动一个。</p></li><li><p class="pv2-idea"><b>4. DRY：别重复自己</b> 每条知识、每份逻辑，系统里有且只有一个权威出处。重复代码是万恶之源——改的时候要改好几处，漏一处就是 bug。看到重复就抽出来。</p><p class="pv2-ex"><i>例</i>折扣逻辑在下单页和购物车页各写一遍，规则改成“满 200 减 20”，你只改了下单页，用户看到的价格和下单时不一样，客诉来了。抽成一个函数，两处都调它。</p></li><li><p class="pv2-idea"><b>5. 死掉的程序不会说谎（早崩溃）</b> 程序出问题最可怕的不是崩溃，是“带病运行”——数据错了还假装没事往下走，最后错得离真相十万八千里。发现不对劲立刻停下报错，别硬撑。立刻崩溃的程序，至少诚实。</p><p class="pv2-ex"><i>例</i>函数要求传用户 ID，结果传进来是空。默默返回空结果，账单算错了都不知道；直接抛异常“用户 ID 不能为空”，bug 定位从三天变三分钟。</p></li><li><p class="pv2-idea"><b>6. 把知识当投资组合来经营</b> 技术会贬值，今天热门的框架三年后可能没人用。像理财一样定期加仓：每年学一门新语言、每季度读一本技术书。目标不是追热点，是永远有学习新东西的能力。</p><p class="pv2-ex"><i>例</i>Java 程序员每年学点别的：今年学 Python 写脚本省下每周两小时，明年学 Go 理解并发。公司转技术栈时，别人慌，你上手快得多。</p></li><li><p class="pv2-idea"><b>7. 先对橡皮鸭解释清楚</b> 调试卡住时，找个橡皮鸭，把代码一行行讲给它听，解释每行干什么、期望发生什么。很多时候讲到一半自己就发现 bug 了——“讲清楚”逼你把含糊的地方想明白。</p><p class="pv2-ex"><i>例</i>排序结果不对，对鸭子讲：“这里按年龄排序……等等，我传的真是年龄字段吗？哦，传的是字符串，‘10’排在‘9’前面了！”bug 找到，先改脑子。</p></li><li><p class="pv2-idea"><b>8. 做需求的挖掘者，不做复述机</b> 用户说“要一匹更快的马”，复述机去造更快的马；挖掘者多问一句“你到底想解决什么”，发现他只是想“更快到达”，于是造出汽车。别当传声筒，像记者一样深挖到真正痛点。</p><p class="pv2-ex"><i>例</i>产品说“表格加个导出 Excel 按钮”，多问两句发现他只是每周一手动拷数据做周报。直接做“每周一自动发周报邮件”，连按钮都不用点。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一章：注重实效的哲学</b> 开篇立规矩：为手艺负责，对变化开放，把“实效”当一切决策的标尺。</p><p class="pv2-ex"><i>例</i>学做菜第一课不是切墩，是立观念：“做菜为让人吃得开心”——方向对了，学什么调料火候都有了方向。</p></li><li><p class="pv2-part"><b>第二章：注重实效的途径</b> 做事方法论：DRY、曳光弹、正交性、原型与取舍——全书干货最密集的一章。</p><p class="pv2-ex"><i>例</i>学开车先学打方向盘、踩刹车这些基本功，而不是“北京二环怎么走”这种一次性知识。</p></li><li><p class="pv2-part"><b>第三章：基本工具</b> 程序员的兵器谱：纯文本、命令行、版本控制、调试器——工具顺了，手艺才施展得开。</p><p class="pv2-ex"><i>例</i>几十万行代码里找 bug，有调试器和没调试器，是一小时和一天的区别。</p></li><li><p class="pv2-part"><b>第四章：注重实效的偏执</b> 防御性编程：契约式设计、断言、早崩溃、异常处理——对“代码一定会出问题”保持健康的偏执。</p><p class="pv2-ex"><i>例</i>出门前检查煤气锁门不是悲观，是知道“万一”的代价太大。把“万一思维”写进代码。</p></li><li><p class="pv2-part"><b>第五、六章：弯曲，或折断 &amp; 当你编码时</b> 让代码柔软好改（解耦、元程序设计），以及写代码的手艺：算法速度、重构、测试、橡皮鸭调试。</p><p class="pv2-ex"><i>例</i>前面练心法，这两章练招式：怎么出拳、怎么拆招、怎么复盘。</p></li><li><p class="pv2-part"><b>第七、八章：项目之前 &amp; 注重实效的项目</b> 从个人手艺到团队协作：怎么估算工期、写文档、做需求、让团队保持实效。</p><p class="pv2-ex"><i>例</i>从单打独斗的厨师变餐厅主厨：不光菜要好，还得定菜单、管后厨、跟客人打交道。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-5">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.05</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《重构：改善既有代码的设计》</h3>
  <p class="pv2-meta">Refactoring: Improving the Design of Existing Code · 马丁·福勒 · 中国电力出版社 · 1999</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1229923/" target="_blank" rel="noopener">豆瓣 9.0 分 · 2131人评价 <span>→</span></a></p>
  <p class="pv2-lede">把“能跑但难看”的代码，一小步一小步改成“好看又好改”：不改变功能，只改善结构。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>1999 年，马丁·福勒把程序员口口相传、没人系统总结过的“整理代码”手法写成书。在此之前“重构”只是高手间的黑话，之后成了每个程序员敢写进简历的正式手艺。</p><p>核心观点一句话：不改变软件外部行为的前提下，改善内部结构。用户感觉不到变化，代码更好懂、更好改。几十种手法条条讲清：什么情况用、为什么用、怎么做。</p><p>它回答了所有程序员的纠结：“代码太烂，推倒重写还是忍着？”福勒说：别走极端，小步快走，一次改一点，每步都保证能跑。“代码坏味道”这个词也是他发明的。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 重构不改变功能，只改善结构</b> 铁律：改完后软件从外面看必须和原来一模一样——同样输入，同样输出。变的只是代码内部长什么样。</p><p class="pv2-ex"><i>例</i>给房子重新布线：住户感觉不到变化，但电工再也不用在乱麻一样的电线里找火线了。</p></li><li><p class="pv2-idea"><b>2. 先闻闻代码有没有“坏味道”</b> 福勒列了 22 种“代码坏味道”：重复代码、超长函数、参数太多……坏味道不是 bug，代码能跑，但它在提醒你：这里以后会出事。</p><p class="pv2-ex"><i>例</i>函数有 8 个参数：createOrder(用户编号, 用户名, 手机号, 地址……)——调用容易传错，改起来提心吊胆。打包成“订单信息”对象。</p></li><li><p class="pv2-idea"><b>3. 小步快走，每步都能跑</b> 最忌“憋大招”——改三天中间代码一直是坏的，最后祈祷别炸。每步小到不可能出错，改完立刻跑测试确认，再走下一步。</p><p class="pv2-ex"><i>例</i>把类拆成两个：新建空类→跑测试→搬一个方法→跑测试→再搬一个。哪步出问题，就是这步的锅，回滚也只回滚一步。</p></li><li><p class="pv2-idea"><b>4. 戴两顶帽子，别混着戴</b> “加功能”和“重构”是两顶帽子：戴加功能的帽子只加功能，别顺手改结构；戴重构的帽子只改结构，别顺手加功能。混着做，出 bug 分不清是谁的锅。</p><p class="pv2-ex"><i>例</i>加“优惠券”功能发现旧代码太乱：先戴重构帽整理好、测试通过、提交；再换加功能帽，在新结构上加优惠券。分两步，每步都清楚。</p></li><li><p class="pv2-idea"><b>5. 三次法则：事不过三再抽象</b> 第一次写一段代码，第二次发现类似代码又写一遍，第三次——动手抽象成可复用的。不到三次急着抽象容易抽象错，三次还不动手就是在养坏味道。</p><p class="pv2-ex"><i>例</i>“校验手机号”逻辑在注册页、修改资料页、找回密码页出现三次：别再复制，抽成一个函数。规则一变，改一处就行。</p></li><li><p class="pv2-idea"><b>6. 重构不是重写，别推倒重来</b> 看到烂代码就想全删重写，风险极大：旧代码藏着无数“只有它知道”的业务细节和坑，重写等于全扔了。重构渐进式：旧系统一边跑，一边被一点点替换，风险可控。</p><p class="pv2-ex"><i>例</i>十年老计费系统没人敢动。重写派八个月还没摸清特殊折扣规则，新系统上线第一天就算错账。重构派一个模块一个模块整理，老系统一直在线，稳稳过渡。</p></li><li><p class="pv2-idea"><b>7. 拾穗式重构：顺手的事天天做</b> 重构不用立项排期开大会。改 bug、加功能时路过烂代码，顺手花十分钟整理一下，像农民收麦顺手捡麦穗。每天捡一点，质量不知不觉上去。</p><p class="pv2-ex"><i>例</i>修 bug 看到变量名 temp1、temp2，顺手改成 orderTotal、discountAmount。没多花几分钟，下一个读代码的人省十分钟琢磨。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一章：重构的一个例子</b> 完整实战开场：一段算话剧账单的“面条代码”，一步步被重构成清晰结构，先看重构长什么样。</p><p class="pv2-ex"><i>例</i>学游泳先看教练游一圈：原来“整理代码”不是玄学，每步都有章法。</p></li><li><p class="pv2-part"><b>第二章：重构的原则</b> 讲“道”：什么是重构、为什么做、什么时候不做、和性能的关系——先统一思想再学招式。</p><p class="pv2-ex"><i>例</i>学武术先学武德：不是所有架都能打，先知道重构的边界，别拿锤子看什么都像钉子。</p></li><li><p class="pv2-part"><b>第三章：代码的坏味道</b> 22 种坏味道的“闻诊手册”：重复代码、过长函数、过大类……每种都配“闻到之后怎么办”。</p><p class="pv2-ex"><i>例</i>老中医的“望闻问切”口诀：背下来，打开任何代码三秒钟指出“这儿迟早出事”。</p></li><li><p class="pv2-part"><b>第四章：构建测试体系</b> 重构的安全网：没自动化测试别谈重构。测试要“自检”、要快。</p><p class="pv2-ex"><i>例</i>走钢丝下面要有安全网。测试就是那张网——网够结实，才敢在钢丝上做动作。</p></li><li><p class="pv2-part"><b>第六到十二章：重构手法编目</b> 全书最厚的部分：提炼函数、搬移字段、封装变量、拆分循环……几十种手法随时可查的“招式词典”。</p><p class="pv2-ex"><i>例</i>新华字典不用背下来，“这个长函数怎么拆”时翻到“提炼函数”那页照着做就行。</p></li><li><p class="pv2-part"><b>第十三章：重构，复用与现实</b> 收尾谈现实：重构怎么跟设计模式、复用结合，在真实项目里推进，别变象牙塔理论。</p><p class="pv2-ex"><i>例</i>秘籍最后一页“行走江湖注意事项”：招式是死的，人是活的，真实项目里要变通。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-6">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.06</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《代码整洁之道》</h3>
  <p class="pv2-meta">Clean Code · 罗伯特·C·马丁 · 人民邮电出版社 · 2008</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/4199741/" target="_blank" rel="noopener">豆瓣 8.5 分 · 2193人评价 <span>→</span></a></p>
  <p class="pv2-lede">Bob 大叔手把手教你写出“人能看懂”的代码：命名、函数、注释、格式，条条都是血泪经验。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>2008 年，罗伯特·马丁开场很狠：代码永远不会消失，需求永远在变，“写出整洁的代码”是程序员的本职工作，不是锦上添花。这本书是他几十年经验浓缩的“代码卫生手册”。</p><p>核心观点：代码是写给人看的，顺便让机器执行。读代码的时间是写代码的十倍以上，所以第一要务是“好读”。名字名副其实、函数短到只做一件事、注释能不写就不写、格式像报纸一样有条理。</p><p>它把“代码品味”这种玄学变成可执行、可检查的清单。和《重构》常被一起读：一个教你“怎么写出好代码”，一个教你“怎么把坏代码变好”。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 名字要名副其实</b> 好名字让读者不看实现就知道它是干嘛的；烂名字（data、temp、info）等于埋地雷。宁可长一点，也别含糊。</p><p class="pv2-ex"><i>例</i>getData() 取什么数据？改成 getUserOrderHistory() 三秒看懂。布尔 flag 改成 isOrderPaid，一眼知道“订单是否已支付”。</p></li><li><p class="pv2-idea"><b>2. 函数只做一件事，而且要做好</b> 函数要小到只做一件事：能用一句话说清它在干嘛、且这句话里没有“和”“或”，就是一件事。函数一长，读的人脑子里记一堆上下文，累且容易错。</p><p class="pv2-ex"><i>例</i>processOrder() 200 行又校验库存又算价格又发短信：拆成 checkStock()、calculatePrice()、sendSms()、saveOrder()，主函数变四行“目录”，想看细节再点进去。</p></li><li><p class="pv2-idea"><b>3. 注释是失败，别用注释弥补烂代码</b> 好代码不需要注释解释“在做什么”，代码自己说清楚了。需要写注释，往往说明代码没写好。但解释“为什么”这么写的注释还是必要的——那是代码说不出来的。</p><p class="pv2-ex"><i>例</i>“i 加 1”是废话注释；“订单 30 分钟未支付自动取消，法务定的规则”有用——它解释的是代码背后的“为什么”。</p></li><li><p class="pv2-idea"><b>4. 童子军规则：让营地比你来时更干净</b> 离开营地要比来时更干净。每次改代码顺手让它干净一点点：改个烂命名、删段重复、拆个长函数。不用多，每次一点点，质量像复利一样越滚越好。</p><p class="pv2-ex"><i>例</i>修 bug 看到拼错的 recieve，顺手改成 receive 再提交。一年下来，无数个小动作让代码库慢慢变干净。</p></li><li><p class="pv2-idea"><b>5. 别返回null，用异常说清楚</b> 返回 null 是最常见的偷懒：调用方一不留神忘了判空，线上就崩。要么返回有意义的东西（空集合），要么直接抛异常——异常藏不住，不处理立刻告诉你。</p><p class="pv2-ex"><i>例</i>查用户订单，用户没订单返回 null，调用方写 order.getTotal() 直接空指针，线上事故。返回空列表，循环一下啥事没有。</p></li><li><p class="pv2-idea"><b>6. 测试是最好的文档</b> 一套好的单元测试，比任何文档都更能说明“代码是干嘛的”——文档会过时，测试不会，因为测试不过，代码合并不进去。</p><p class="pv2-ex"><i>例</i>新同事想知道下单接口有哪些规则，翻三个月没更新的 Wiki，不如直接看测试：满 200 减 20、未支付 30 分钟自动取消……条条测试就是条条活规矩。</p></li><li><p class="pv2-idea"><b>7. 一个类只有一个“变”的理由</b> 一个类只干一件事，只因为一种原因被修改。又管数据库又管发邮件又管算价格，需求一变就得改，改多就容易出 bug。职责分开，各自安好。</p><p class="pv2-ex"><i>例</i>UserService 里有注册、发欢迎邮件、生成报表，改邮件模板一不小心碰坏注册逻辑。拆成三个类，改邮件只动 EmailService，注册稳如泰山。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一章：整洁代码</b> 开宗明义：代码不会消失，整洁是本分；收集几位大师对“整洁代码”的回答，统一思想。</p><p class="pv2-ex"><i>例</i>学书法先看名家字帖：先看看“整洁代码长什么样”，心里有个标杆。</p></li><li><p class="pv2-part"><b>第二到五章：命名、函数、注释、格式</b> 四大基本功：名字怎么取、函数怎么写、注释何时写、格式怎么排——每天写代码都用得到的手艺。</p><p class="pv2-ex"><i>例</i>学做菜的刀工火候调味摆盘：不性感，但决定做出来的东西能不能吃。</p></li><li><p class="pv2-part"><b>第六、十章：对象和数据结构、类</b> 代码的“骨架”：对象和数据结构的区别、类的单一职责、怎么让类小而美。</p><p class="pv2-ex"><i>例</i>承重墙砌对了，往里填什么都稳。订单类只管订单，别让它又发短信又算报表——墙砌歪了整栋楼都晃。</p></li><li><p class="pv2-part"><b>第七到九章：错误处理、边界、单元测试</b> 代码的“免疫系统”：出错了怎么办、怎么跟第三方代码打交道、怎么写测试保护自己。</p><p class="pv2-ex"><i>例</i>系安全带、看后视镜、买保险：不出事没感觉，出事时救命。</p></li><li><p class="pv2-part"><b>第十一、十三章：系统、并发编程</b> 从写好一段代码到搭好一个系统：架构怎么保持整洁、多线程代码怎么写不出乱子。</p><p class="pv2-ex"><i>例</i>从做好一道菜到开餐厅：两个厨师同时往一口锅加盐得有规矩，不然味道全乱。</p></li><li><p class="pv2-part"><b>第十四到十七章：实战案例与启发</b> 拿真实代码开刀：一段烂代码怎么一步步被改好，外加“代码味道与启发”清单随时翻查。</p><p class="pv2-ex"><i>例</i>武功秘籍的“实战录像”：看高手把一套乱拳拆解重组，变成漂亮招式。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-7">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.07</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《设计模式：可复用面向对象软件的基础》</h3>
  <p class="pv2-meta">Design Patterns: Elements of Reusable Object-Oriented Software · Erich Gamma、Richard Helm、Ralph Johnson、John Vlissides · 机械工业出版社 · 1994</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1052241/" target="_blank" rel="noopener">豆瓣 9.0 分 · 3221人评价 <span>→</span></a></p>
  <p class="pv2-lede">GoF 四位大神总结的 23 个“前人踩坑换来的套路”：识别反复出现的问题，直接用被验证过的方案，不用重新发明轮子。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>1994 年，四位博士（人称 GoF）总结 23 种设计模式。在此之前，高手的“套路”只可意会不可言传；这本书起了名字、画了图、写成标准，全世界程序员有了共同的设计语言。</p><p>核心观点：很多问题反复出现，就有被验证过的优雅解法——这就是“模式”。模式不是代码，是“解决问题的思路模板”。最大好处不只是写代码，更是沟通：说“这里用观察者模式”，同事立刻懂。</p><p>它开创了一个领域：面试必问的单例、工厂、观察者、策略全从这里出来。三十年语言换几代，模式还在用——因为它们针对的是“变化”本身。但作者也提醒：别为用模式而用模式。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 针对接口编程，不针对实现编程</b> 代码依赖“抽象”（接口长什么样），不依赖“具体”（它到底是谁）。接口是契约，实现是干活的人——换人不用换契约，具体实现随便换，调用方不用改。</p><p class="pv2-ex"><i>例</i>代码里到处直接创建 MySQL 存储对象，换 MongoDB 得改几十处。依赖统一存储接口，换时只写个新实现类，调用方一行不动。</p></li><li><p class="pv2-idea"><b>2. 优先用组合，而不是继承</b> 新手最爱用继承：“狗继承动物，警犬继承狗”，结果改爷爷类孙子类全受影响。能用“组合”（对象里装着另一个对象）解决的别用继承——组合更灵活，想换就换，不用动祖宗。</p><p class="pv2-ex"><i>例</i>鸭子游戏：绿头鸭继承鸭子，后来加“橡皮鸭”不会飞，继承来的飞行方法成 bug。改成组合：想飞装会飞的行为，不想飞装不会飞的，随时换。</p></li><li><p class="pv2-idea"><b>3. 模式是套路，不是银弹</b> 模式是“特定场景下被验证过的解法”，不是“用了就高级”的勋章。最简单的方案往往最好，为炫技硬套模式只会把代码搞复杂。判断标准：不套模式，这段代码是不是真难受？</p><p class="pv2-ex"><i>例</i>全项目只有一个地方创建对象，非要上“抽象工厂模式”，三层类套下来别人得翻五个文件。直接创建一个对象就行——模式是止痛药不是维生素，没病别乱吃。</p></li><li><p class="pv2-idea"><b>4. 23种模式分三类</b> 23 种模式按用途分三类：创建型（5 种，管“对象怎么生出来”）、结构型（7 种，管“怎么组装”）、行为型（11 种，管“怎么协作”）。找模式先想：卡在创建、组装，还是协作上，一下缩小范围。</p><p class="pv2-ex"><i>例</i>“根据配置创建不同支付方式”是创建问题→工厂方法；“好多对象要互相通知”是协作问题→观察者。</p></li><li><p class="pv2-idea"><b>5. 观察者模式：一对多广播</b> 一对多依赖：一个对象状态变了，所有依赖它的自动收到通知。像公众号：你关注了号主，一发文所有粉丝自动收到推送，不用轮询“更新了吗”。</p><p class="pv2-ex"><i>例</i>股票 App：股价一变，所有打开这只股票页面的手机都要刷新。股价对象只管广播“我变了”，加 100 个新页面，股价对象一行不用改。</p></li><li><p class="pv2-idea"><b>6. 策略模式：算法随便换</b> 把一堆“二选一、多选一”的算法封装成独立的类，互相替换。调用方只管“我要算”，不管“怎么算”。加新算法，加个类就行，不碰老代码。</p><p class="pv2-ex"><i>例</i>商城打折：普通 95 折、VIP 85 折、员工 7 折。不用策略就是一堆 if-else，加一种用户就得改核心代码。用策略，加“合作伙伴 8 折”新建一个类，老代码不动。</p></li><li><p class="pv2-idea"><b>7. 工厂模式：把创建对象的事藏起来</b> 创建对象别让调用方直接动手，交给“工厂”管。调用方只说“我要个日志记录器”，工厂决定给控制台版还是文件版。“怎么创建”和“怎么使用”解耦，换实现不影响调用方。</p><p class="pv2-ex"><i>例</i>日志系统：开发环境打控制台，生产环境写文件。调用方找工厂要记录器，从开发切生产改个配置就行，业务代码一个字不动。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一章：引言</b> 讲“什么是设计模式”：四个要素（名称、问题、解法、效果），以及怎么分类、怎么描述——先统一语言。</p><p class="pv2-ex"><i>例</i>学象棋先认识车马炮怎么走：先把“模式”这个词讲清楚，后面不鸡同鸭讲。</p></li><li><p class="pv2-part"><b>第二章：案例研究</b> 用文档编辑器的完整设计案例，演示模式在真实设计中怎么被发现、被使用——理论结合实战。</p><p class="pv2-ex"><i>例</i>不光看菜谱，还看大厨完整做一道菜：遇到“撤销功能”，大厨自然用上命令模式。</p></li><li><p class="pv2-part"><b>第三章：创建型模式</b> 5 种管“对象怎么生出来”：抽象工厂、生成器、工厂方法、原型、单例——把创建的学问讲透。</p><p class="pv2-ex"><i>例</i>开工厂的生产线：什么时候流水线（工厂方法），什么时候定制（生成器），什么时候全公司只造一台（单例）。</p></li><li><p class="pv2-part"><b>第四章：结构型模式</b> 7 种管“对象怎么组装”：适配器、桥接、组合、装饰、外观、享元、代理——拼出更大的结构。</p><p class="pv2-ex"><i>例</i>乐高拼装说明书：小零件拼成城堡，拼完还能拆、还能换。</p></li><li><p class="pv2-part"><b>第五章：行为型模式</b> 11 种管“对象怎么协作”：观察者、策略、命令、状态……数量最多、日常最常用。</p><p class="pv2-ex"><i>例</i>球队战术手册：球怎么传、谁跑位、教练怎么指挥，一套完整配合打法。</p></li><li><p class="pv2-part"><b>第六章：结论</b> 收尾：模式怎么用、什么时候不用、模式的未来——别把模式当宗教，保持清醒。</p><p class="pv2-ex"><i>例</i>秘籍最后一页：武功再高也怕菜刀。模式再好只是工具，解决实际问题才是目的。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-8">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.08</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《UNIX编程艺术》</h3>
  <p class="pv2-meta">The Art of UNIX Programming · 埃里克·雷蒙德 · 电子工业出版社 · 2003</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1467587/" target="_blank" rel="noopener">豆瓣 9.0 分 · 2302人评价 <span>→</span></a></p>
  <p class="pv2-lede">讲“怎么写出像 UNIX 那样优雅、耐用、历久弥新软件”的设计哲学书。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>埃里克·雷蒙德是开源运动旗手，花五年把贝尔实验室几十年攒下的设计直觉——让 UNIX 从 1969 年活到今天的底层智慧——提炼成 17 条设计规则，加整套工具、社区、文化的论述。</p><p>核心论点：好软件不是功能堆出来的，是靠克制做出来的。功能做减法、部件做小、接口做薄，让小程序互相组合干大事。不教某门语言语法，教的是“审美”：什么设计美而耐久，什么丑而腐烂。</p><p>它回答永恒问题：技术几年换一茬，什么不变？答案是设计哲学。从 Linux 到开源运动、微服务、DevOps，骨子里都是这本书的东西。读完再看任何代码，都会问一句：这够简洁吗？</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 清晰胜于机巧：代码首先是写给人看的</b> “清晰原则”：代码被读的次数远多于被写的次数。耍小聪明玩晦涩技巧，今天省三行巧妙代码，明天别人花三小时才看懂，血亏。宁可多写几行大白话，别写一行天书。</p><p class="pv2-ex"><i>例</i>写菜谱“适量盐、少许糖、火候看着办”，看的人想打人。写“盐 3 克，中火 2 分钟”才靠谱。变量名 tmp、x1 的聪明写法，不如老老实实叫 user_name_list。</p></li><li><p class="pv2-idea"><b>2. 小工具加管道，能干大事情（组合原则）</b> UNIX 看家本领：每个程序只做好一件事，用“管道”像乐高一样拼起来。设计时就要考虑拼接——你的程序要能方便地跟别人的连起来干活，别做“瑞士军刀”式巨无霸，迟早没人维护得动。</p><p class="pv2-ex"><i>例</i>从日志找访问量 Top10 的 IP：一行命令串起六七个小工具，cat 日志 | 提取 IP | 排序 | 计数 | 取前 10。反观“日志分析平台”，装半天配置一堆，查个 Top10 要点十几个页面。</p></li><li><p class="pv2-idea"><b>3. 文本流：最笨但最通用的接口</b> UNIX 坚持用纯文本做程序间交换格式：人能直接看，任何语言都能读写，出问题一眼看出哪错了。二进制、私有格式更“高效”，但只有你的程序能读，调试靠猜，十年后迁移数据只能哭。</p><p class="pv2-ex"><i>例</i>两家快递交接：一家用透明塑料袋，里面是啥一眼看清；一家用焊死的铁箱子，只有他家有钥匙，瘪了都不知道碎没碎。配置文件用 YAML/JSON 而不用神秘二进制，就是文本化的胜利。</p></li><li><p class="pv2-idea"><b>4. 没事别吭声，错了就大声说（缄默与补救原则）</b> “缄默原则”：没什么可说的就安静干活，别刷屏——正常执行输出一堆“成功！”全是噪音。“补救原则”：一出错立刻退出，把错误说足——错在哪、为什么、怎么修，一次讲清，别让用户猜谜。</p><p class="pv2-ex"><i>例</i>靠谱管家：一切正常一声不吭；水管爆了立刻说“厨房接头裂了，已关总闸，师傅电话 XXX”。反面教材：平时弹窗报喜，出错只丢“未知错误（0x0001）”，用户干瞪眼。</p></li><li><p class="pv2-idea"><b>5. 先做出能跑的原型，再谈优化</b> “优化原则”：雕琢前先有原型，跑之前先学会走。还没跑通就纠结“快 5%”，90% 的优化都优化在不重要的地方。先写清晰正确的版本，实测找到真瓶颈再动手，且不许破坏清晰度。</p><p class="pv2-ex"><i>例</i>装修先保证水电通、墙不漏，住进去发现西晒严重再加遮阳帘。一上来纠结“吊灯欧式还是美式更省电”，房子还没盖好呢——过早优化是万恶之源。</p></li><li><p class="pv2-idea"><b>6. 策略和机制分开：做什么和怎么做是两回事</b> “策略”（要什么规则）和“机制”（怎么实现）分开。机制保持中立通用，策略放上层灵活配置。换规则不用改代码，换实现不用改规则。</p><p class="pv2-ex"><i>例</i>报销系统“超 5000 要总监审批”是策略，“审批流引擎怎么跑”是机制。5000 做成可配置，财务政策一变改个数字就行；写死在代码里，政策一变就得改代码重新上线。</p></li><li><p class="pv2-idea"><b>7. 程序员的时间，比机器的时间贵得多</b> 宁可多花机器一分钱，不花程序员一秒钟。硬件越来越便宜，人的工资越来越贵，凡能用机器资源换程序员时间的买卖都划算。别为省 1MB 内存写出没人敢动的祖传代码。</p><p class="pv2-ex"><i>例</i>月薪几万，每周花 3 小时自己拖地“省”200 块保洁费，这账怎么算都亏。用现成库多占 10MB 内存，换来不用造轮子、不用半夜修 bug——吝啬要吝啬复杂度，不是内存。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：背景——哲学、历史与横向对比（第 1-3 章）</b> 先讲 UNIX 哲学 17 条规则是什么，再讲它从贝尔实验室走来的历史，最后跟 Windows、经典 Mac OS 等设计哲学对比。</p><p class="pv2-ex"><i>例</i>学做菜先学“菜系”：知道粤菜讲究“鲜”（哲学），了解它怎么从农家菜变大菜系（历史），再跟川菜对比。先有地图再进山，不迷路。</p></li><li><p class="pv2-part"><b>第二部分（上）：设计——模块性、文本化、透明性（第 4-6 章）</b> UNIX 审美最核心的三块基石：程序拆小模块、模块间用文本交换数据、设计让人看懂方便调试。</p><p class="pv2-ex"><i>例</i>搭积木三铁律：零件小而标准、统一卡扣连接、拼错一眼看出。三条做到，搭出的东西又稳又好改。</p></li><li><p class="pv2-part"><b>第二部分（中）：设计——多任务、小型语言与生成（第 7-9 章）</b> 进程间怎么协作、什么时候发明“小语言”描述问题、能用程序生成代码就别手写。</p><p class="pv2-ex"><i>例</i>正则表达式就是小语言：不用写 50 行代码匹配文本，写一行“规则”就行。像买台面条机，以后想吃面按个按钮。</p></li><li><p class="pv2-part"><b>第二部分（下）：设计——配置、接口、优化与复杂度（第 10-13 章）</b> 配置文件写法、用户界面设计、优化原则，最后收束到终极敌人：复杂度——所有设计努力都是在跟它打仗。</p><p class="pv2-ex"><i>例</i>复杂度是软件的熵，只增不减。像家里东西只会越堆越多，能做的就是定期断舍离，别指望它自己变整齐。</p></li><li><p class="pv2-part"><b>第三部分：实现——语言、工具与重用（第 14-16 章）</b> 从哲学落到手艺：选什么语言（C 为什么是 UNIX 母语）、用什么工具、怎么复用轮子不重复造。</p><p class="pv2-ex"><i>例</i>借邻居电钻很划算，但为借电钻开车一小时去取，不如自己买一个——重用前先掂量轮子是不是比自己造的还沉。</p></li><li><p class="pv2-part"><b>第四部分：社区——可移植性、文档、开源与未来（第 17-20 章）</b> 软件之外的事：跨平台代码、文档为什么是软件的一部分、开源社区怎么协作、UNIX 哲学的未来。</p><p class="pv2-ex"><i>例</i>没文档的软件等于没写完：祖传菜谱只写“看着办”，传到第二代就失传了。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-9">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.09</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《编程珠玑》</h3>
  <p class="pv2-meta">Programming Pearls · 乔恩·本特利 · 人民邮电出版社 · 2000（第二版）</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/3227098/" target="_blank" rel="noopener">豆瓣 9.1 分 · 2222人评价 <span>→</span></a></p>
  <p class="pv2-lede">用真实故事教你“怎么把程序写对、写快、写小”的算法思维书。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>乔恩·本特利是贝尔实验室科学家，这本书是他《ACM 通讯》专栏的结集。“珠玑”就是从真实工程问题里打磨出的智慧珍珠——每章从一个真实难题讲起，带你看高手怎么思考。</p><p>核心论点：程序设计的功夫，一大半不在“写代码”，在“想清楚”。数据结构选对，难题自己变简单；动手前先估算，一半性能问题提前避开；先写对，再谈写快。全是案例，不讲大道理。</p><p>无数程序员的“算法启蒙书”和“面试圣经”。书很薄，每章读完都有“啊哈，原来还能这样”的顿悟。在“加机器加内存”的时代，它提醒你：聪明的设计永远比粗暴堆料更优雅、更便宜。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 位图：换个数据结构，千万级排序so easy</b> 内存只有 1MB，要给 1000 万个电话号码排序。解法是“位图”：用 1000 万个比特位，第 N 位是 1 就表示号码 N 存在。读一遍标记，扫一遍输出，排序完成。问题没变，换个角度，难题消失。</p><p class="pv2-ex"><i>例</i>老师点名不用抄 60 个名字再排序，拿座位表，来的人打个勾，按座位念一遍就行。不存“人是谁”，只存“这个位置有没有人”。</p></li><li><p class="pv2-idea"><b>2. 动手前，先在信封背面算一算</b> 写代码前先在信封背面估算：数据量、时间、空间。“每天 1 亿请求，一年 365 亿条，一条 100 字节就是 3.6TB”——几秒钟心算，避开“数据比想象大、生产直接爆炸”。数量级对了就行。</p><p class="pv2-ex"><i>例</i>请 500 人吃年夜饭：500×200 元=10 万预算，至少 50 桌。先估算再订厅，不会到那天傻眼。五分钟估算，省下五周返工。</p></li><li><p class="pv2-idea"><b>3. 先度量，再优化：别猜瓶颈在哪</b> 优化第一原则：先用 profiler 实测找到真瓶颈再动手。人的直觉在性能上经常是错的——你觉得慢的地方可能只占 1%，真吃 90% 时间的地方你压根没想到。不度量就优化，等于闭眼开车。</p><p class="pv2-ex"><i>例</i>觉得电费高怪罪空调，装分路电表才发现是阳台十年没关的旧冰柜在偷电。不装电表就换空调，钱花了，电费一分没降。</p></li><li><p class="pv2-idea"><b>4. 二分搜索：人人会写，几乎人人写错</b> 思想三岁小孩都懂（每次砍一半），但绝大多数程序员写不出完全正确的二分搜索：边界、中点、循环不变式，差之一错之千里。写前先把“每轮都成立的断言”想清楚，让程序自己证明自己对。</p><p class="pv2-ex"><i>例</i>猜数字 1-100，猜 50 说大了，范围变 1-49。到底是 49 还是 50、下次猜 25 还是 24，稀里糊涂。先立规矩：“要找的数永远在 [low, high] 闭区间里”，每轮检查规矩没破，代码不可能错。</p></li><li><p class="pv2-idea"><b>5. 数据决定程序结构：先想数据，再想代码</b> 动手写代码前，先把数据的样子想清楚——怎么存、长什么结构，代码结构自然跟出来。先写一堆代码再迁就数据，只会写出别扭的面条代码。好数据结构是好程序的骨架。</p><p class="pv2-ex"><i>例</i>整理衣柜：先定“按季节分区、每格一类”，之后找衣服放衣服都顺手。一开始乱塞，之后每次找都得翻箱倒柜，还得贴张“找衣服攻略”。</p></li><li><p class="pv2-idea"><b>6. “啊哈！”时刻：退一步，问题可能就化了</b> 很多难题难在盯着正面硬刚；退一步换个角度，难题常变成不值一提的小事。比如数组循环移位：与其一个个元素挪，不如三次翻转搞定。顿悟不是运气，是刻意练习换角度的结果。</p><p class="pv2-ex"><i>例</i>拧不开瓶盖别跟瓶盖较劲，瓶子倒过来热水冲一下盖子（热胀冷缩），轻轻一拧就开。问题没变，换个维度出手。</p></li><li><p class="pv2-idea"><b>7. 取样问题：水塘抽样，以小见大</b> 文件太大读不完，怎么从 N 个数均匀随机取 k 个？“水塘抽样”：只读一遍，维护 k 个元素的“水塘”，第 i 个数以 k/i 概率决定是否入选。内存永远只用 k 个位置，每个数被选中的概率完全均等。</p><p class="pv2-ex"><i>例</i>从长河随机捞 10 条鱼尝咸淡，不可能抽干河。端个小盆站岸边，鱼游来一条按规矩决定换不换，越到后面换的概率越小。一趟下来，每条鱼被选中的机会均等。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：基础——开篇与“啊哈”算法（第 1-2 章）</b> 第 1 章用千万电话号码排序的位图案例开场，第 2 章训练换角度看问题的顿悟能力——思维体操，先活动开脑子。</p><p class="pv2-ex"><i>例</i>学武术先练马步：第 1 章见识高手出招，第 2 章学高手心法。招式会忘，心法长身上。</p></li><li><p class="pv2-part"><b>第一部分：基础——数据结构与写对程序（第 3-5 章）</b> 数据决定程序结构、二分搜索怎么写对、从伪代码到 C 程序的落地——正确性是 1，其他都是后面的 0。</p><p class="pv2-ex"><i>例</i>本特利在小程序里加十几处断言，同事笑他过度小心，结果断言真抓到 bug。断言是给未来的自己留的“报警器”。</p></li><li><p class="pv2-part"><b>第二部分：性能——分析、估算与算法设计（第 6-8 章）</b> 性能视角（先度量）、粗略估算（信封背后的计算）、算法设计技术——不写代码就能预判性能的内功。</p><p class="pv2-ex"><i>例</i>他估算过“把《圣经》存一台机器要多久”，几个数量级心算得出结论。这种“数量级直觉”是高手的分水岭。</p></li><li><p class="pv2-part"><b>第二部分：性能——代码调优与节省空间（第 9-10 章）</b> 代码调优实战（一半急救锦囊一半大手术）、节省空间的巧思——优化是最后手段，但动手时要有一整套工具箱。</p><p class="pv2-ex"><i>例</i>调优二分搜索：减少分支、利用局部性，硬是把“已最优”的算法又提速一大截。工程实现上永远有油水可榨。</p></li><li><p class="pv2-part"><b>第三部分：应用——排序、取样与搜索（第 11-13 章）</b> 内功用到具体问题：排序的工程实现、取样问题（水塘抽样）、搜索结构的权衡——每章一个完整实战故事。</p><p class="pv2-ex"><i>例</i>他给真实系统写排序：根据数据特点（基本有序？重复多？）定制快速排序变体。算法课教“排序”，这章教“在真实世界里排序”。</p></li><li><p class="pv2-part"><b>第三部分：应用——堆与字符串（第 14-15 章）</b> 堆（顺带实现优先级队列和堆排序）、字符串处理——经典数据结构学透，工作中处处是它的影子。</p><p class="pv2-ex"><i>例</i>堆就是“急诊分诊台”：永远先处理最重的病人，新病人按轻重插队。操作系统调度、快递分仓，背后都是堆。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-10">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.10</span><span>软件工程</span></p>
  <h3 class="pv2-book-title">《领域驱动设计》</h3>
  <p class="pv2-meta">Domain-Driven Design: Tackling Complexity in the Heart of Software · 埃里克·埃文斯 · 人民邮电出版社 · 2003</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/26819666/" target="_blank" rel="noopener">豆瓣 7.9 分 · 522人评价 <span>→</span></a></p>
  <p class="pv2-lede">在一团乱麻的复杂业务里，用“模型”把业务理清楚、让代码跟上业务的设计方法论。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>2003 年，埃里克·埃文斯针对老大难问题：很多企业软件死掉不是技术不行，是业务太复杂——规则盘根错节、需求天天变，代码最后变成谁也看不懂的粥。</p><p>核心论点：软件真正的复杂性不在技术，在业务本身；对抗它的唯一武器，是真实反映业务的“领域模型”。模型不能只活在文档里，必须活在代码里、活在团队每天的对话里。战略上划分业务边界（限界上下文），战术上建模（实体、值对象、聚合），团队和业务专家用同一种语言说话（通用语言）。</p><p>它预言了未来：十几年后微服务大火，“服务按什么边界拆”最难的问题，答案早在这本书里——按限界上下文拆。今天的中台、微服务、业务架构，骨子里都是 DDD。难啃，但啃下来看业务系统的眼光完全不一样。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 通用语言：全团队说同一种话</b> 业务专家和程序员必须用同一套词汇说话，且这套词汇原样出现在代码里（类名方法名就是业务词汇）。很多项目的病根是“翻译腔”：业务说“客户”，开发写 user，测试叫“用户”——三个人开会各说各的，代码和业务对不上。</p><p class="pv2-ex"><i>例</i>一家人装修：你说“玄关”，工头听成“门口那块”，设计师画成“门厅”，鞋柜尺寸全错。统一叫“玄关”指进门 1.5 米区域，图纸合同聊天都这么叫，就不会错。</p></li><li><p class="pv2-idea"><b>2. 限界上下文：同一个词，出了这个门意思就变了</b> 任何业务概念只在明确边界内清晰无歧义，出了边界意思就变。“商品”在销售那指“可卖的东西”，在仓储那指“占库位的货”。硬搞“统一商品”模型包打天下，最后一定四不像。承认一词多义，给每个含义划地盘。</p><p class="pv2-ex"><i>例</i>“苹果”在水果店指能吃的水果，在手机店指电子产品。你不会要求全世界只用一个意思，业务系统也一样，各自有定义，再谈怎么协作。</p></li><li><p class="pv2-idea"><b>3. 实体 vs 值对象：看身份，还是看内容</b> 实体看“身份”：两个人同名同姓也是两个人，靠身份证号区分。值对象看“内容”：两张 100 元钞票编号不同但没人关心。值对象做成不可变（改就是换新的），天然线程安全，代码一下清爽很多。</p><p class="pv2-ex"><i>例</i>订单是实体：订单号 2024001 和 2024002 是两个订单，哪怕内容一样。订单里的“收货地址”是值对象：改地址直接换新的，不用追踪“这个地址对象”的身份。</p></li><li><p class="pv2-idea"><b>4. 聚合：一次只改一簇，守住一致性边界</b> 一组互相咬合的业务对象，必须作为整体来改，对外只通过“聚合根”说话。银行转账：扣款和入账要么一起成功要么都不，绝不允许只扣不入。聚合就是业务一致性的“保险丝盒”。</p><p class="pv2-ex"><i>例</i>订单和订单明细删订单必须连明细一起删。把“转出账户、转入账户、转账记录”圈成聚合，对外只暴露“转账”一个入口，里面怎么折腾都行。</p></li><li><p class="pv2-idea"><b>5. 模型就是代码，代码就是模型</b> 领域模型不能是 PPT 里的方框图，必须直接长在代码里：类名就是业务概念，方法就是业务动作，代码读起来像讲业务故事。模型和代码是两张皮，时间一长各说各话，模型就死了。</p><p class="pv2-ex"><i>例</i>菜谱写“宫保鸡丁”，端上来也得是宫保鸡丁，不能端盘“不明炒物”说“反正能吃”。代码里有 Order 类带 pay()、cancel() 方法，读代码就知道“这是订单，能付款能取消”。</p></li><li><p class="pv2-idea"><b>6. 防腐层：别让烂代码污染你的模型</b> 干净模型必须跟老旧混乱的外部系统对接时，中间加一层翻译，脏东西只脏在这一层，不许渗进模型。没有防腐层，外部系统的怪概念怪字段会慢慢污染代码，最后你的模型也一样烂。</p><p class="pv2-ex"><i>例</i>家里装净水器：自来水管可能有杂质，但你喝的水必须干净。净水器装在入户处，脏水只脏到滤芯，绝不进水杯。跟第三方支付、老 ERP 对接时，这一层能救命。</p></li><li><p class="pv2-idea"><b>7. 把最好的力气，花在核心域上</b> 业务里不是所有部分都一样重要。核心域（决定竞争力的部分）值得最好的设计师和最多的时间；支撑域和通用域能买就买、能凑合就凑合。在“员工请假审批”上雕花、核心“交易撮合引擎”写得稀烂，是本末倒置。</p><p class="pv2-ex"><i>例</i>开餐厅：招牌菜值得请大厨反复打磨；收银系统直接买现成的；考勤用 Excel 就行。把三个月花在自研考勤上，招牌菜让学徒随便炒，这餐厅必倒。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：让领域模型运转起来（第 1-4 章）</b> DDD 世界观：知识消化提炼、团队用通用语言交流、模型和代码绑定、领域逻辑跟技术细节隔离——全书地基。</p><p class="pv2-ex"><i>例</i>医院分科室：内科专心看病，不用管挂号系统用的什么软件。分科了，内科换药方不用等挂号系统升级。</p></li><li><p class="pv2-part"><b>第二部分：模型驱动设计的构建块（第 5-7 章）</b> 建模“零件箱”：实体、值对象、领域服务等基本模式，对象生命周期（工厂、仓库），再用完整例子演示怎么拼起来。</p><p class="pv2-ex"><i>例</i>前面给砖头水泥，这章带你看精装修好的样板间——一个完整领域模型长什么样，看完就知道零件往哪放。</p></li><li><p class="pv2-part"><b>第三部分（上）：向深层洞察重构——突破与显式化（第 8-9 章）</b> 模型越改越好：第 8 章讲“突破”——看懂业务本质后敢推倒重来；第 9 章把隐性概念变成显性模型元素。好模型是改出来的，不是设计出来的。</p><p class="pv2-ex"><i>例</i>整理房间到一半顿悟：“常用就 20 件，其他全是囤积！”推倒重来只留 20 件，还贴上标签。模型重构就是认知升级。</p></li><li><p class="pv2-part"><b>第三部分（下）：柔性设计与模式（第 10-13 章）</b> “柔性设计”让模型意图清晰、副作用小；分析模式和设计模式为领域模型服务。目标：模型不仅要对，还要好改。</p><p class="pv2-ex"><i>例</i>微波炉“解冻”键按下去只解冻，不会顺手把饭加热。好的领域方法也一样：调一次只做一件事，不偷偷改别的东西。</p></li><li><p class="pv2-part"><b>第四部分：战略设计——保持完整、蒸馏与大局（第 14-17 章）</b> 从单个模型放大到整个系统：保持模型完整（限界上下文、上下文映射、防腐层）、蒸馏核心域、大局观——微服务的思想源头。</p><p class="pv2-ex"><i>例</i>画小区地图：A 栋（销售）和 B 栋（仓储）之间几条路、谁给谁送东西全标清。地图画好，微服务拆分照图施工，不会拆出“跨栋上厕所”的笑话。</p></li></ul>
</article></section><section class="pv2-domain" id="system"><div class="pv2-domain-head"><span class="pv2-ghost" aria-hidden="true">02</span><div><p class="pv2-eyebrow">第贰辑 · 系统设计</p><h2 class="pv2-domain-title">系统设计</h2><p class="pv2-domain-intro">系统设计是研究“怎么把软件系统搭得又稳、又快、还好改”的学问：数据放哪、机器挂了怎么办、用户涨十倍怎么办、代码越写越乱怎么办——这些问题的答案，都归它管。</p></div></div>
<article class="pv2-book" id="pv2-book-11">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.11</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《数据密集型应用系统设计》</h3>
  <p class="pv2-meta">Designing Data-Intensive Applications · 马丁·克雷普曼 · 中国电力出版社 · 2017</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/30329536/" target="_blank" rel="noopener">豆瓣 9.6 分 · 1943人评价 <span>→</span></a></p>
  <p class="pv2-lede">数据系统的内功心法：数据库、缓存、消息队列看似五花八门。底层都在回答同一个问题——数据怎么存、怎么传、怎么算。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>所有数据系统，底层都在做三件事：存数据、传数据、算数据。数据库、缓存、消息队列只是这三件事的不同解法。</p><p>它的贡献是给了行业一套通用语言：可靠性、可扩展性、可维护性三个判分标准。外加复制、分区、一致性这些概念的统一梳理。从此选型讨论有了共同词汇。</p><p>核心认知：没有最好的技术，只有取舍。要一致性，就得牺牲速度或可用性；要灵活，就得接受复杂度。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 8</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 好系统有三个标准：别宕机、能长大、好维护</b> 评价数据系统，看三件事。可靠性（出故障还能不能干活）、可扩展性（量涨上去跟不跟得上）、可维护性（换人接手费不费劲）。很多系统不是被流量压垮的，是被自己养出的复杂度拖垮的。</p><p class="pv2-ex"><i>例</i>大促流量涨50倍：可靠性差，支付一抖订单就丢；可扩展性差，加机器也扛不住。可维护性差，加个“满减”功能改三天不敢上线。选型前，先拿这三条量一量。</p></li><li><p class="pv2-idea"><b>2. 没有银弹：一个数据库搞不定所有事</b> 不存在全场景最优的数据库。关系型擅长事务，搜索引擎擅长全文检索，缓存擅长扛读压力。正确姿势是组合拳：每种工具干最擅长的事，再用数据流串起来。</p><p class="pv2-ex"><i>例</i>内容平台也一样：用户放MySQL，搜索用Elasticsearch，热点放Redis，日志扔进Kafka。各司其职才顺手。</p></li><li><p class="pv2-idea"><b>3. 数据模型选错了，后面全是坑</b> 数据模型就是“数据怎么组织”：关系型用表，文档型用JSON，图用节点和边。表严谨但难改，文档灵活但关联查询费劲，图表达关系无敌。选型看数据天生的形状。</p><p class="pv2-ex"><i>例</i>“A的朋友的朋友”这种查询，图数据库一句话搞定，关系型得写好几层JOIN，数据量一大就慢。反过来，规矩的订单明细用表最自然。先看清数据的长相，再挑模型。</p></li><li><p class="pv2-idea"><b>4. LSM树和B树：一个擅写，一个擅读</b> 数据在磁盘上怎么摆，决定了读快还是写快。B树像整理好的字典，读快、写要原地改；LSM树像记流水账，写只管追加、飞快，读时再合并。日志类爱用LSM，传统业务爱用B树。</p><p class="pv2-ex"><i>例</i>记家庭账本：B树派每笔工整记到分类页，查得快、记得慢。LSM树派来一笔往最后随手一记，记得飞快、月底再归拢。朋友圈点赞适合后者，银行查余额适合前者。</p></li><li><p class="pv2-idea"><b>5. CAP：网络一分区，一致性和可用性只能保一个</b> CAP是分布式的不可能三角：一致性（看到的数据一样）、可用性（每个请求有回应）、分区容忍性（断网还能跑）。平时可兼得，但网络分区时必须二选一。</p><p class="pv2-ex"><i>例</i>两地机房专线抖了一下：保一致，用户转圈等；保可用，杭州先收单、等网络好了再同步，但北京暂时查不到。没有对错，看业务更怕“下不了单”还是“数据对不上”。</p></li><li><p class="pv2-idea"><b>6. 一致性是有档位的，越强越贵</b> 一致性不是有或没有，而是一档档的旋钮：从最终一致（早晚会一样）到线性一致（所有人看到的都一样）。档位越高，延迟越高、可用性越低。给每个业务选刚好够用的那档。</p><p class="pv2-ex"><i>例</i>微博点赞晚几秒更新没人投诉，用最终一致就行；银行转账绝不能出现“钱扣了、没到账”的中间态，必须强一致。别为点赞数花转账的钱。</p></li><li><p class="pv2-idea"><b>7. ACID之外，还有一堆弱隔离的暗礁</b> 很多数据库默认用的不是严格可串行化，而是弱隔离级别（读已提交、快照隔离等）。各有各的坑：脏读、丢失更新、写偏斜。选型前先搞清自己在用什么、在冒什么险。</p><p class="pv2-ex"><i>例</i>两个运营同时改库存：都看到10件，A改成20，B改成15，先后提交后变成15，A的修改悄悄丢了。这就是“丢失更新”。卖演唱会门票时，多卖的票就得退票道歉。</p></li><li><p class="pv2-idea"><b>8. 批处理和流处理：一桶一桶算，还是像水一样流</b> 批处理是攒够一堆再算（每天凌晨算报表），流处理是来一条算一条（实时风控）。Lambda架构是两套一起跑、互相校对；Kappa只用流处理，一套搞定。</p><p class="pv2-ex"><i>例</i>直播热度榜：批处理每小时汇总一次，榜单每小时变；流处理每条打赏都更新分数，榜单秒级跳动。大厂常用Lambda架构：流处理出实时榜，批处理每天校对一次，又快又准。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分 · 立规矩（第1章）：可靠性、可扩展性、可维护性</b> 全书的“判分标准”：好系统要出故障不宕机、规模涨了跟得上、换人接手不费劲。后面所有技术讨论都要回到这三条来打分。</p><p class="pv2-ex"><i>例</i>买车先定标准：安全、能拉货、好维修；之后每讲一个新技术，都回头问它对这三条是加分还是减分。</p></li><li><p class="pv2-part"><b>第一部分 · 数据长什么样（第2章）：数据模型与查询语言</b> 对比关系型、文档型、图等数据模型和查询语言：没有最好的模型，只有最合身的，看你的数据天生是什么形状。</p><p class="pv2-ex"><i>例</i>选数据库之前先看数据的“长相”：社交关系天生是网状，用图；订单明细天生是表格，用关系型。模型选对，查询语句短一半，性能快十倍。</p></li><li><p class="pv2-part"><b>第一部分 · 数据怎么存（第3章）：存储与检索</b> 讲数据库在磁盘上怎么摆数据：B树和LSM树两大家族，一个擅读、一个擅写，选型前先搞懂它们的脾气。</p><p class="pv2-ex"><i>例</i>看到“用了LSM存储引擎”，立刻知道它适合写多读少的场景；看到B树，就知道它偏向读多。</p></li><li><p class="pv2-part"><b>第一部分 · 数据怎么打包（第4章）：编码与演化</b> 数据在系统间传递要先“打包”（序列化）：讲各种编码格式，以及数据格式变了之后，怎么让新老版本互相认得。</p><p class="pv2-ex"><i>例</i>App升级后，老版本发来的数据新版本还认不认？Avro、Protobuf这类工具解决的就是向前向后兼容。让新老版本和平共处。</p></li><li><p class="pv2-part"><b>第二部分 · 从一台到多台（第5-6章）：复制与分区</b> 单机装不下时怎么办：复制是把数据多存几份，防丢、分担读压力；分区是把数据切开分到多台机器。两者是横向扩展的两板斧。</p><p class="pv2-ex"><i>例</i>一个图书馆变成连锁：每家店都进同样的热门书（复制，防某家店失火）。书太多一家放不下，就分类存放、每家只存一部分（分区）。复制管“别丢”，分区管“装下”。</p></li><li><p class="pv2-part"><b>第二部分 · 多台机器的麻烦事（第7-9章）：事务、分布式系统的坑、一致性与共识</b> 全书最烧脑：弱隔离的各种异常、时钟网络的坑、CAP取舍，以及机器怎么投票达成一致（共识算法）。</p><p class="pv2-ex"><i>例</i>把分布式所有灵魂拷问摆上台面：CAP、线性一致、共识算法，每个选择都标好代价。</p></li><li><p class="pv2-part"><b>第三部分 · 数据的二次加工（第10-11章）：批处理与流处理</b> 原始数据之外还要派生报表、索引、推荐：批处理攒够了算，流处理来一条算一条，各有各的用武之地。</p><p class="pv2-ex"><i>例</i>凌晨的销售报表和刷卡时的实时风控，是同一份数据的两种算饭。Lambda、Kappa两种架构，外加“只记操作不记状态”的事件溯源。</p></li><li><p class="pv2-part"><b>尾声（第12章）：把一切拼起来，兼谈未来</b> 收束全书：把前面所有概念拼成构建可靠、可扩展、可维护应用的方法。并展望未来，连数据隐私伦理也聊了聊。</p><p class="pv2-ex"><i>例</i>学完零件看整车组装：复制、分区、一致性、批流处理拼在一起。聊怎么搭出面向未来的数据系统，顺带谈数据伦理。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-12">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.12</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《架构整洁之道》</h3>
  <p class="pv2-meta">Clean Architecture · 罗伯特·C·马丁 · 电子工业出版社（博文视点） · 2017</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/30333919/" target="_blank" rel="noopener">豆瓣 8.7 分 · 988人评价 <span>→</span></a></p>
  <p class="pv2-lede">好架构跟用什么框架、数据库没关系。关键是把“做什么生意”的代码和“用什么技术”的代码分开，让生意逻辑不被技术细节绑架。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>框架换了一茬又一茬，架构的好坏规则几十年没变过。这本书一次讲清这些不变的规则。</p><p>架构的终极目标：用最小的人力成本满足构建和维护系统的需求。软件有“行为价值”（能干活）和“架构价值”（好改），后者才是软件之所以“软”的原因。整洁架构用依赖规则把“做什么生意”和“用什么技术”彻底分开。</p><p>它给出了从编程范式、SOLID、组件原则到整洁架构的完整链条。六边形架构、洋葱架构、DDD分层，都是这套思想的不同讲法。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 8</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 依赖规则：内圈的代码，永远不许知道外圈的存在</b> 全书最重要的铁律：依赖只能由外向内。内圈是业务规则（“买满200减20”），外圈是数据库、界面、框架。内圈定义接口、外圈实现，内圈绝不直接调用外圈的具体东西。换数据库、换框架，生意逻辑一行不用改。</p><p class="pv2-ex"><i>例</i>餐馆的核心是菜谱（内圈），用煤气还是电磁炉（外圈）不该影响它。菜谱里只写“加热”，不写“开煤气阀门”；换电磁炉，菜谱不用改一个字。</p></li><li><p class="pv2-idea"><b>2. 同心圆：一个系统就四层，各就各位</b> 四个同心圆：最里实体（订单、折扣规则），往外是用例（下单、退款）。再往外是接口适配器（控制器、网关），最外是框架和驱动。越往里越稳定、越不常变。</p><p class="pv2-ex"><i>例</i>打车软件：实体是“行程”“计价规则”，用例是“下单”“接单”。适配器把App请求转成用例，最外层是MySQL、Spring。换库只动最外层，改计价只动实体。</p></li><li><p class="pv2-idea"><b>3. SOLID：五个让代码好改的原则</b> 五个原则：单一职责（一个类只干一件事）、开闭（加功能靠扩展不改旧代码）、里氏替换（子类能顶替父类）。接口隔离（别逼实现用不上的接口）、依赖反转（依赖抽象不依赖具体）。全书都用这套尺子量代码。</p><p class="pv2-ex"><i>例</i>“订单类”既算价格又发短信还写库，改短信模板可能搞坏算价，拆成三个类各干各的。下单逻辑不调“支付宝SDK”而调“支付接口”，换渠道时下单逻辑不动。</p></li><li><p class="pv2-idea"><b>4. 软件有两种价值：“能跑”和“好改”，后者更重要</b> 行为价值是“能干活”（下单成功），架构价值是“好改”（下周加新玩法不费劲）。老板只看得见前者，但“能跑改不动”的系统加个小功能要三周。架构师的天职是守护架构价值，让软件一直“软”下去。</p><p class="pv2-ex"><i>例</i>两个外卖系统都能下单：A加“拼团”要改20个文件、回归一周；B边界清晰，加个用例类两天上线。A团队每加一个功能慢一点，一年后基本不敢动代码——这就是架构价值被透支。</p></li><li><p class="pv2-idea"><b>5. 编程范式不是给你“更多能力”，而是给你“立规矩”</b> 结构化拿走了goto（不许乱跳），面向对象拿走了函数指针乱指（必须走多态）。函数式拿走了可变变量（状态不能随便改）。每种范式都是少点自由、多份纪律，换来代码更好推理、更少怪bug。</p><p class="pv2-ex"><i>例</i>红绿灯限制了“随时走”的自由，换来路口不撞车。函数式不让变量随便改，“下单金额”定下来就没人能半路篡改，并发bug少一大半。限制让大规模协作成为可能。</p></li><li><p class="pv2-idea"><b>6. 组件怎么分：聚什么、拆什么，都有讲究</b> 六条原则：三个管“哪些类放一起”（一起变的放一起），三个管“组件间怎么依赖”（依赖指向更稳定的方向）。别让底层牵着高层走。微服务拆成“分布式单体”，病根多半在这里。</p><p class="pv2-ex"><i>例</i>“用户中心”和“订单中心”拆成两个服务，改个手机号订单服务也得发版——该放一起的被拆开了。反过来，天天变的“短信发送”和稳定的“计价规则”绑一起，改短信总要重测计价。边界画错比不拆还难受。</p></li><li><p class="pv2-idea"><b>7. 画出边界，把难做的决定往后推</b> MySQL还是Mongo？Spring还是Django？都是“细节”。好架构让你晚做决定、随时反悔：业务核心和技术细节之间画边界、中间用接口隔开。业务代码只认接口，上线时再把具体实现“插”进来。</p><p class="pv2-ex"><i>例</i>“下单用例”只依赖“订单仓库接口”，先用MySQL顶着。用户量爆了，重写一个实现类插上去，用例代码一行不改。</p></li><li><p class="pv2-idea"><b>8. 好架构的四个试金石：可测试、能并行开发、能独立部署、技术可换</b> 四个检验标准：业务逻辑能否脱离数据库界面单独测试；多团队能否各干各的不打架；组件能否单独上线；换框架数据库要不要伤筋动骨。全满足就是干净的，有一个不行就是边界没画对。</p><p class="pv2-ex"><i>例</i>装修：水电走完后换灯具品牌不该砸墙；木工油漆工能同时进场不打架；卫生间可单独验收。拿这四条一套，立刻知道架构合不合格。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分 · 概述（第1-2章）：设计与架构究竟是什么</b> 软件架构的终极目标：用最小的人力成本满足构建和维护系统的需求。软件有“行为价值”和“架构价值”，后者更重要。</p><p class="pv2-ex"><i>例</i>架构师不是画图的，是让系统一直“好改”的：外部质量（能跑）和内部质量（好改）要兼顾，天职是守护后者。</p></li><li><p class="pv2-part"><b>第二部分 · 从基础开始：编程范式（第3-6章）</b> 从三种编程范式讲起：范式的本质是对程序员能力的“限制”，限制换来代码更可控、更好推理。</p><p class="pv2-ex"><i>例</i>三种范式其实是三条“纪律”：不许乱跳（结构化）、必须走多态（面向对象）、状态不能随便改（函数式）。理解它们，才能理解后面的设计原则是从哪长出来的。</p></li><li><p class="pv2-part"><b>第三部分 · 设计原则（第7-11章）：SOLID</b> 逐个讲透SOLID五个设计原则，这是全书后面所有判断的依据：代码和架构好不好，拿这五个原则去量。</p><p class="pv2-ex"><i>例</i>全书的“尺子”：单一职责、开闭、里氏替换、接口隔离、依赖反转。后面量组件、量架构，用的都是这套标准。</p></li><li><p class="pv2-part"><b>第四部分 · 组件构建原则（第12-14章）</b> 组件是什么、哪些类该放在一起、组件之间该怎么依赖：六条组件原则，管“聚”也管“拆”。</p><p class="pv2-ex"><i>例</i>从“类”放大到“组件”：学怎么打包、怎么划边界。微服务拆分、模块划分的问题，答案基本都在这三章里。</p></li><li><p class="pv2-part"><b>第五部分 · 架构（第15-28章）：整洁架构登场</b> 正式定义整洁架构：四层同心圆、依赖规则、如何划分边界、怎么用设计模式跨越边界。并用完整实战案例把内容串起来。</p><p class="pv2-ex"><i>例</i>全书高潮：正式提出整洁架构——同心圆、依赖规则、边界划分、设计模式。还拿一个视频销售网站当案例，从头到尾搭一遍给你看。</p></li><li><p class="pv2-part"><b>第六部分 · 实现细节（第29-33章）</b> 讲具体技术的安放位置：数据库、Web界面、框架都是细节，应该被隔离在最外层，随时可换；附带整洁的嵌入式架构实践。</p><p class="pv2-ex"><i>例</i>数据库、Web、框架都是可替换的“细节”：具体技术“插”进架构而不污染业务核心。连嵌入式这种硬骨头也讲了怎么保持整洁。</p></li><li><p class="pv2-part"><b>附录：几十年从业经历的印证</b> 作者用自己数十年的软件从业经历，再次印证书中的观点：架构的规则几十年来没变过，变的只是技术的外衣。</p><p class="pv2-ex"><i>例</i>Bob大叔从1964年写到现在：这些规则不是纸上谈兵，是几十年一次次验证过的经验。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-13">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.13</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《微服务设计》</h3>
  <p class="pv2-meta">Building Microservices · 桑·纽曼 · 人民邮电出版社 · 2015</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/26772677/" target="_blank" rel="noopener">豆瓣 8.1 分 · 978人评价 <span>→</span></a></p>
  <p class="pv2-lede">把大系统拆成小而独立的服务，各自独立开发上线：什么时候该拆、怎么拆、拆完怎么管，微服务领域的开山之作。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>人人喊拆服务，但很多人拆完更痛苦：部署复杂、排查困难，一个请求串过十几个服务，出问题都不知道找谁。</p><p>微服务不是目的，是手段：把系统按业务边界切成能独立演进的小块，小步快跑、独立试错。但它有代价——分布式复杂度、运维成本、一致性难题一个都躲不掉。小团队、业务没想清楚、没自动化运维能力，单体可能是更好的选择。</p><p>它把“微服务”从时髦口号变成有章可循的工程实践：业务建模、独立部署、为失败而设计、可观察性。这些至今仍是云原生时代的常识。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 先按业务拆，不按技术拆（康威定律）</b> 拆服务按“下单、支付、库存”这样的业务能力，不按“前端队、后端队”分。康威定律：系统架构会复制组织沟通结构。反过来用：想让系统长成什么样，就先把团队按那个样子组织起来。</p><p class="pv2-ex"><i>例</i>开餐厅别按“切菜组、炒菜组”分，按“川菜档、粤菜档”分，每个档口从点菜到上菜一条龙。促销和订单拆成两个服务后，促销团队双十一前一周还能独立上线新玩法，不用排队等排期。</p></li><li><p class="pv2-idea"><b>2. 服务必须能独立部署，否则白拆</b> “微”不在代码量小，而在改一行代码只上线这一个服务，不用全站陪绑。改A必须连B、C一起上线，那就是“分布式单体”：享受了分布式的痛苦，没得到微服务的好处。</p><p class="pv2-ex"><i>例</i>用户中心独立成服务后，头像功能一周上三个版本，订单系统一次没重启——这就是独立部署的价值。</p></li><li><p class="pv2-idea"><b>3. 数据也要分家，别共用一个数据库</b> 两个服务连同一个库，改表结构就得一起改、一起上线——拆了个寂寞。每个服务管自己的数据，别人走接口来要。跨服务一致性用“最终一致”（发消息异步同步）解决，不靠数据库事务。</p><p class="pv2-ex"><i>例</i>订单和库存共用一张表，库存加个字段，订单的SQL全挂了。最后花两个月才把库拆开，代价比一开始就拆大得多。</p></li><li><p class="pv2-idea"><b>4. 为失败而设计：服务一定会挂</b> 保命四招：超时（别无限等）、熔断器（对方挂了别再敲门）。舱壁（一个服务hang死别拖死线程池）、重试加退避。</p><p class="pv2-ex"><i>例</i>家里一个房间短路，空开只断这一间，不会整栋停电。支付网关给银行接口加熔断，银行宕机时几十秒自动切备用通道，用户只觉得“慢了一点”，而不是全站报错。</p></li><li><p class="pv2-idea"><b>5. 智能端点、哑管道：服务之间通信尽量简单</b> 别搞中央总线（ESB）那种“聪明的管道”：逻辑全塞总线，一升级全站陪葬。用简单的REST或消息队列传数据（哑管道），业务逻辑留在服务自己手里（智能端点）。管道越傻，系统越灵活。</p><p class="pv2-ex"><i>例</i>小区快递柜：快递员只管放件（哑管道），取件码、身份验证都在App里（智能端点）。要是每个快递员都得去物业大厅登记审批，双十一那天大厅直接被堵死。</p></li><li><p class="pv2-idea"><b>6. 先单体，痛了再拆：架构是演进出来的</b> 新项目别一上来就微服务：业务没跑通，边界在哪都不知道，拆错比不拆还贵。先写单体，等哪个模块“改不动、一改全回归”了再拆出去。好边界是长出来的，不是画出来的。</p><p class="pv2-ex"><i>例</i>装修先住进去，知道哪面墙碍事再砸，而不是毛坯就按五年后的家庭结构砌墙。某创业公司单体三个月上线，跑一年后才把“拼团”拆成独立服务——那时才真正搞清边界在哪。</p></li><li><p class="pv2-idea"><b>7. 看不见就管不了：可观察性是必修课</b> 微服务里一个请求串过十几个服务，日志散在十几台机器上。三件套缺一不可：日志聚合、关联ID（一个请求一个编号、全链路追踪）、监控告警。不然线上出问题只能靠猜。</p><p class="pv2-ex"><i>例</i>给每个请求打上TraceID：一次“下单偶发超时”，十分钟定位到优惠券服务的慢SQL。以前得人肉对十几个服务的日志，至少半天。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：微服务到底是什么</b> 给微服务下定义：小、自治、围绕业务建模、独立部署。讲清楚它解决什么问题，又会带来哪些新代价，先泼一盆冷水。</p><p class="pv2-ex"><i>例</i>买车先看缺点：保养贵、油耗高，知道了再决定买不买。开篇先讲微服务的代价，免得你只看到好处一头扎进去。</p></li><li><p class="pv2-part"><b>第二部分：架构师的角色与建模</b> 讲“演进式架构师”：架构师不是画图纸的，而是定原则、划边界、保证大家不跑偏的。建模要用领域驱动设计的有界上下文来找服务的边界。</p><p class="pv2-ex"><i>例</i>就像城市规划师：不规定每栋楼盖几层，但划定商业区、住宅区，定下消防和间距红线。边界内各家自由发挥，城市整体不乱。</p></li><li><p class="pv2-part"><b>第三部分：怎么拆：从单体到微服务</b> 给单体“动手术”的几种拆法：按业务能力拆、绞杀者模式（新老并行、逐步替换）、按分支抽象逐步剥离。</p><p class="pv2-ex"><i>例</i>绞杀者模式像给老房子加装电梯：不拆楼，旁边盖新的，一层层搬功能过去，最后老楼只剩空壳。用户全程无感知，风险一次只冒一点。</p></li><li><p class="pv2-part"><b>第四部分：拆完怎么连：集成与数据</b> 服务间通信怎么选（REST、RPC、消息队列），以及最难的数据分家。从共享库到各管各的，数据同步和一致性怎么处理。</p><p class="pv2-ex"><i>例</i>离婚分财产：房子车子一人一套容易，最难的是共同账户的钱怎么分、以后孩子的学费怎么给。数据分家也一样：接口好定，一致性难搞。</p></li><li><p class="pv2-part"><b>第五部分：部署、测试、监控与安全</b> 每个服务独立流水线、容器化部署；分布式系统的测试策略（契约测试）；监控三件套；服务间认证与纵深防御。</p><p class="pv2-ex"><i>例</i>连锁餐厅：分店独立装修开业（独立部署），总部神秘顾客抽查（契约测试）。装摄像头看后厨（监控），进后厨刷卡（安全）。缺一样，开到第十家店就乱套。</p></li><li><p class="pv2-part"><b>第六部分：组织与规模化</b> 康威定律与团队组织：按服务组建全功能小团队。服务多到几十上百个之后：版本治理、服务发现、弹性伸缩。</p><p class="pv2-ex"><i>例</i>就像乐队：三个人时怎么排都行，变成交响乐团就得有声部、有指挥、有总谱。服务少时靠自觉，服务多了就得靠平台和规范。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-14">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.14</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《企业应用架构模式》</h3>
  <p class="pv2-meta">Patterns of Enterprise Application Architecture · 马丁·福勒 · 机械工业出版社 · 2002</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1230559/" target="_blank" rel="noopener">豆瓣 8.7 分 · 414人评价 <span>→</span></a></p>
  <p class="pv2-lede">OA、ERP、电商后台这类企业软件怎么写才不乱？前人踩过的坑提炼成“模式词汇表”，架构师案头的词典。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>企业应用翻来覆去就是那几类问题：业务逻辑放哪、对象怎么存进数据库、网页怎么分层。人人重复发明轮子、重复踩坑。福勒把业界验证过的解法整理成50多个模式，写成这本“模式词典”。</p><p>核心论点：架构设计不是玄学，是有据可查的“模式语言”。业务逻辑三种放法各有利弊，选错后期改不动；对象和关系数据库的“阻抗失衡”，用数据映射器、工作单元弥合。选模式就是做权衡，没有银弹。</p><p>它第一次系统回答了“企业应用怎么分层、怎么组织代码”。分层、领域模型、数据映射器、MVC成了之后二十年主流框架的底座——你天天用的很多概念都来自它。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 业务逻辑三种放法：事务脚本、表模块、领域模型</b> 事务脚本：一个请求写一个过程，简单直接，适合小系统。表模块：按表组织、一个表配一个类，适合中等复杂度。领域模型：按业务概念建模，“订单”是有行为的对象，适合复杂业务。复杂度越高越往领域模型走；小项目硬上就是大炮打蚊子。</p><p class="pv2-ex"><i>例</i>个人记账用流水账本（事务脚本）就行，小公司按科目设账（表模块），上市公司得有完整会计体系（领域模型）。报销小工具用事务脚本两周上线；核心交易系统用领域模型，三年后加新业务不用推倒重来。</p></li><li><p class="pv2-idea"><b>2. 分层：表现层、领域层、数据源层各干各的</b> 三层：页面只管展示，业务规则放中间层，数据库访问放底层。上层调下层，不许反过来。换数据库、换前端都不动业务逻辑，测试也能一层层测。这是全书的地基。</p><p class="pv2-ex"><i>例</i>餐厅：服务员只管点菜上菜，厨师只管做菜，采购只管进货。换收银系统不用重训厨师，换供应商不用重印菜单，各层独立变化、互不牵连。</p></li><li><p class="pv2-idea"><b>3. 对象和数据库天生不对付，得请个“翻译”（数据映射器）</b> 面向对象讲“对象套对象”，关系数据库讲“表和外键”，硬凑就是又臭又长的SQL拼接。数据映射器是个专职翻译：对象只管业务，翻译负责存进表、捞出来拼回对象。Hibernate、MyBatis本质上就是干这个的。</p><p class="pv2-ex"><i>例</i>中外合资谈判得配翻译：中方说中文（对象），外方说英文（SQL）。没翻译，双方只能互相学对方语言，最后两边都说不利索——代码里SQL和业务逻辑搅成一锅粥，谁也改不动。</p></li><li><p class="pv2-idea"><b>4. 工作单元：一次业务操作，要么全存，要么全不存</b> 下单要写订单表、扣库存、记流水，中间崩了怎么办？工作单元是个“记账本”：改动先记下来，最后统一提交。失败整体回滚，数据不会一半一半，还把多次数据库交互合并成一次。</p><p class="pv2-ex"><i>例</i>银行转账：扣A的钱和给B加钱必须同时成功，绝不能只扣不加。工作单元就是“同时”的保证人：要么两边一起变，要么当没发生过。</p></li><li><p class="pv2-idea"><b>5. 延迟加载：用到了再去查</b> 查订单顺带把1000条明细全查出来？太浪费。延迟加载：先查个壳，用到明细时再去拿。省内存省查询，但用不好会变成“查一次触发1000次小查询”（N+1问题），省的全吐回去还倒贴。</p><p class="pv2-ex"><i>例</i>看电子书：先加载目录，点进哪章才加载正文。打开书就把500页全下载，流量直接爆炸；但每翻一页都重新下载，还不如一开始全下完。分寸要拿捏好。</p></li><li><p class="pv2-idea"><b>6. 服务层：给业务逻辑开个统一的“前台”</b> 网页、App、第三方都要调“下单”，不能各调各的。服务层在领域逻辑外包一层统一入口：校验参数、调领域逻辑、记日志、管事务，套路收拢到一起。对外只有一个门，里面再复杂也不怕。</p><p class="pv2-ex"><i>例</i>公司前台：访客、快递、外卖先登记再分发，不让人直接闯进办公室找人。前台顺手做访客登记（日志）和身份核验（校验）。</p></li><li><p class="pv2-idea"><b>7. 模式是词汇，不是教条</b> 模式是“准确讨论设计”的共同语言，不是“必须这么写”的圣经。开会说“这里用个数据映射器”，团队立刻懂你在解决什么、付出什么代价。但生搬硬套和不用一样糟——脱离上下文谈模式就是耍流氓。</p><p class="pv2-ex"><i>例</i>“爆炒”“清蒸”是词汇，告诉你火候手法的区别；放多少盐还得看今天的菜。评审时说“这块事务脚本就够了，别上领域模型”，一句话大家就懂——模式语言让讨论变精确。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：概述——先搭脚手架</b> 全书的地图：企业应用长什么样、为什么分层、领域逻辑怎么组织。对象和关系数据库的矛盾、Web层怎么分、并发会话怎么处理。</p><p class="pv2-ex"><i>例</i>学做菜先学“煎炒烹炸”基本功，再学具体菜式。这部分不讲招式，先让你知道厨房里有哪些家伙事儿、分别解决什么问题。</p></li><li><p class="pv2-part"><b>第二部分：领域逻辑模式——业务代码写在哪</b> 全书最核心的一章：事务脚本、表模块、领域模型、服务层四种模式，讲清各自适用场景和代价。这是每个架构师都绕不开的选择题。</p><p class="pv2-ex"><i>例</i>就像装修先定风格：极简风、轻奢风、工业风没有绝对好坏，只有适不适合你的户型和预算。选错风格，后面全是返工——选错领域逻辑模式也一样。</p></li><li><p class="pv2-part"><b>第三部分：数据源模式——对象怎么跟数据库打交道</b> 表数据入口、行数据入口、活动记录、数据映射器：从“SQL写在代码里”到“专职翻译层”。复杂度递增、能力也递增。</p><p class="pv2-ex"><i>例</i>出国沟通四个段位：比划手势（表数据入口）、背日常用语（行数据入口）。请导游（活动记录）、雇专职翻译（数据映射器）。走得越远，越需要专业翻译。</p></li><li><p class="pv2-part"><b>第四部分：对象-关系的行为、结构与元数据模式</b> 把“翻译”做细：工作单元、标识映射、延迟加载、值对象、继承映射。处理缓存、加载时机、类继承存进表这些脏活。</p><p class="pv2-ex"><i>例</i>翻译公司内部分工：有人管术语库（元数据映射），有人定哪些文件先翻（延迟加载），有人校对去重（标识映射）。都是让翻译又快又准的配套手艺。</p></li><li><p class="pv2-part"><b>第五部分：Web 表示与分布模式</b> 网页层的分工：MVC、前端控制器、页面控制器、模板视图——谁收请求、谁选页面、谁拼HTML。以及拆到多台机器上的分布模式。</p><p class="pv2-ex"><i>例</i>就像话剧后台分工：有人管报幕（前端控制器）、有人管换景（页面控制器）、有人管念台词（视图）。观众只看到一台戏，背后是一套分工。</p></li><li><p class="pv2-part"><b>第六部分：并发、会话与基本模式</b> 多人同时改一条数据怎么办（乐观锁、悲观锁）、用户登录状态放哪（会话状态模式）。以及全书用到的最基础的小模式。</p><p class="pv2-ex"><i>例</i>乐观锁像共享文档协作：大家先改着，保存时发现冲突再合并，而不是一开始就锁死不让别人碰。冲突大概率不会发生，别为小概率事件付出大代价。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-15">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.15</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《SRE：Google运维解密》</h3>
  <p class="pv2-meta">Site Reliability Engineering: How Google Runs Production Systems · Google SRE 团队 · 电子工业出版社 · 2016</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/26875239/" target="_blank" rel="noopener">豆瓣 8.9 分 · 646人评价 <span>→</span></a></p>
  <p class="pv2-lede">Google运维团队的心法全公开：怎么让系统又稳又能快速迭代。运维不是救火，是工程。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>在Google，运维不叫Ops，叫SRE（站点可靠性工程师）。招会写代码的人，用软件工程的方法解决运维问题。这本书第一次系统公开了Google怎么保证搜索、Gmail不宕机。</p><p>核心论点两条：第一，可靠性是个“度”，不是越高越好。“错误预算”把稳定和迭代的矛盾变成算术题：用户要的是“足够可靠加持续变好”。第二，重复的手工活（toil）必须消灭。SRE至少一半时间写自动化，否则团队被救火淹没，规模越大死得越快。</p><p>它定义了一个新工种。今天大厂招SRE、谈SLO、做不甩锅的复盘、搞on-call轮值，源头都在这本书。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 错误预算：允许系统“合法地”出点小问题</b> SLO“99.9%的请求200ms内成功”，剩下0.1%就是错误预算：一个月允许宕机约43分钟。预算没花完放心发版，花超了停新功能、全力修稳定。“稳定还是迭代”从扯皮变成算术题。</p><p class="pv2-ex"><i>例</i>减肥每天允许一小块蛋糕，没超标不用自责，超标第二天多运动。用数字代替“我觉得不稳定”，开发和运维不用在会议室吵架，看仪表盘说话。</p></li><li><p class="pv2-idea"><b>2. 100% 可靠是浪费</b> 99.9%做到99.99%，成本翻几倍，用户几乎感知不到。可靠性只要“足够好”，省下的精力做用户真正需要的功能。别为用户不在乎的小数点买单。</p><p class="pv2-ex"><i>例</i>小区门禁“基本上安全”就行。为防电影里的特工装三层虹膜识别，业主每天进门折腾五分钟——没人觉得这是好物业，只觉得添堵。</p></li><li><p class="pv2-idea"><b>3. 消灭琐事：手工运维超过一半时间就必须停下来</b> Toil（琐事）指手工、重复、没营养、还得人肉干的活，比如每天手动重启服务。Google规矩：琐事超50%就停下所有新需求、全力做自动化。靠人肉撑的系统，规模一大必崩，人也崩。</p><p class="pv2-ex"><i>例</i>客人少时手洗碗还行，客人多了还手洗，洗碗工崩溃、碗也洗不干净，必须上洗碗机。某团队每天两小时手动发布，自动化后十分钟搞定、零失误。</p></li><li><p class="pv2-idea"><b>4. 监控只看四个黄金信号</b> 从用户视角看系统健康就四个数：延迟（多快）、流量（多少请求）、错误（多少失败）、饱和度（资源有多满）。告警只发“能行动的”：半夜叫醒人结果是“明天再说”，这种噪音迟早让人对告警麻木。</p><p class="pv2-ex"><i>例</i>看病看体温、血压、心率、血氧四个数，基本能判断健康，不用一上来就全身CT。某公司把告警从200条砍到30条“必须马上处理”，值班终于能睡整觉，真正的故障一次没漏。</p></li><li><p class="pv2-idea"><b>5. 复盘对事不对人</b> 复盘不许说“是谁的错”，只问“系统哪里给了犯错的机会”。人一定会犯错，“下次小心点”防不住；把系统改成“犯错也出不了大事”才算真改进。不甩锅的复盘是Google持续进步的秘密。</p><p class="pv2-ex"><i>例</i>航空事故调查不追究飞行员个人，查的是“仪表盘是不是容易看错”。某大厂删库事故后，复盘结论是“删生产库必须双人确认加二次验证”，之后同类事故归零。</p></li><li><p class="pv2-idea"><b>6. 渐进式发布：发布应该是日常小事</b> 别攒两个月搞“大版本上线”，那是赌博。小步快走：先给1%用户（金丝雀发布），没问题再扩大，出问题一键回滚。发布越频繁、每次越小，“爆炸半径”越可控，风险越低。</p><p class="pv2-ex"><i>例</i>新菜先让一桌客人试吃，好吃再全店推，总比直接换菜单、开业当天被全网吐槽强。某App灰度发布，一次闪退bug只影响1%用户就回滚了，全量发布就是P0事故。</p></li><li><p class="pv2-idea"><b>7. on-call 不是“背锅侠”，而是有制度的轮值</b> 半夜被叫起来不可怕，可怕的是“天天被叫、叫起来还修不好”。Google规矩：值班有补偿、有交接，“叫醒必须能处理”。频繁被叫醒说明系统该修了，不是人不够警醒。好的on-call制度倒逼系统变好。</p><p class="pv2-ex"><i>例</i>小区保安夜班偶尔处理个把事正常，每晚被叫醒十次说明门锁系统该修了，不是保安不够警醒。把“人受的苦”转成“系统要改的项”，值班越值越轻松。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>前言：为什么写这本书</b> 交代SRE的来历：Google当年招软件工程师干运维的活。十几年沉淀出一套方法论，这本书就是把它公开。</p><p class="pv2-ex"><i>例</i>老字号公开祖传配方：不是配方不值钱了，是想让整个行业进步。当然，公开的永远是心法，不是具体代码。</p></li><li><p class="pv2-part"><b>第一部分：绪论——先统一语言</b> SRE 是什么、Google 怎么看待风险、服务水平目标（SLO）怎么定。先把“可靠性”变成可量化的数字，后面才有得谈。</p><p class="pv2-ex"><i>例</i>开会先对齐术语：大家嘴里的“稳定”是一个意思吗？这部分就是发同一本词典：SLO多少、错误预算怎么算，先对齐再干活。</p></li><li><p class="pv2-part"><b>第二部分：原则——SRE 做事的几条大原则</b> 消除琐事、分布式系统的监控、自动化、发布工程、简单化。原则是“道”，后面的实践是“术”。</p><p class="pv2-ex"><i>例</i>武功心法：招式（具体工具）会过时，心法（原则）不会。这一部分的心法，换公司、换技术栈照样适用。</p></li><li><p class="pv2-part"><b>第三部分：实践——落到每天的具体工作</b> 最厚的一部分：告警怎么写、值班怎么值、故障怎么救、复盘怎么做、容量怎么算、数据怎么保证不丢。全是能直接抄作业的干货。</p><p class="pv2-ex"><i>例</i>驾校实操课：前面是交规（原则），这里是上车——怎么打方向、怎么倒车入库。看完就知道Google运维每天到底在干嘛。</p></li><li><p class="pv2-part"><b>第四部分：管理——组织层面的事</b> SRE 团队怎么管、怎么跟开发团队协作、招什么样的人、怎么避免把人累垮。技术问题背后都是人的问题。</p><p class="pv2-ex"><i>例</i>球队管理：光有战术不够，还得管更衣室——谁首发、谁替补、怎么轮换、怎么保持士气，不然球星也跑路。</p></li><li><p class="pv2-part"><b>第五部分：结束语——Google 踩过的坑</b> 收尾：把可靠性做成产品来思考，以及 Google 这些年交过的学费。提醒你：没有银弹，适合 Google 的不一定适合你，学的是思路。</p><p class="pv2-ex"><i>例</i>学霸分享错题本：最有价值的不是考了多少分，是当年在哪跌倒、怎么爬起来的。看完会对“大厂也犯傻”释然很多。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-16">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.16</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《发布！软件的设计与部署》</h3>
  <p class="pv2-meta">Release It!: Design and Deploy Production-Ready Software · 迈克尔·尼加德 · 人民邮电出版社 · 2008</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/26304417/" target="_blank" rel="noopener">豆瓣 7.7 分 · 72人评价 <span>→</span></a></p>
  <p class="pv2-lede">测试环境好好的，一上线就崩？这本书专讲“生产环境”这头怪兽：它怎么杀死你的系统。以及怎么设计才能活下来。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>开发环境和生产环境是两个世界：生产环境有真实流量、会断的网络、会挂的依赖、半夜三点的电话。99%的架构书教“把功能做出来”，这本教“怎么在生产环境活下来”。</p><p>核心论点：稳定性是可以设计的。书里总结了“稳定性模式”（超时、熔断器、舱壁、限流）和“反模式”（集成点爆炸、级联重试、资源无上限）。绝大多数生产事故不是代码bug，而是“一个变慢的依赖拖死整个系统”的级联故障。设计时能防住，靠运维祈祷没用。</p><p>它是“为生产而设计”的开山之作。“熔断器”“舱壁”这些微服务里的高频词，很多从这本书普及开。至今仍是SRE和架构师的必读书。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 为生产而设计，而不是为演示而设计</b> 很多系统开发机上跑得飞起，一上线就跪。设计时只想“功能通不通”，没想“依赖挂了怎么办、流量翻十倍怎么办、磁盘满了怎么办”。</p><p class="pv2-ex"><i>例</i>买车试驾都好开，得问“高速爆胎怎么办、冬天打不着火怎么办”。某系统没人问“短信网关挂了怎么办”，大促时网关一抖，用户收不到验证码，全站登录瘫痪。设计没留后路，出事只能干瞪眼。</p></li><li><p class="pv2-idea"><b>2. 级联故障：一个慢服务能拖死全站</b> A调B，B变慢，A的线程全卡在“等B返回”上；A的线程池耗尽，调A的C也跟着卡。多米诺骨牌：一个点的“慢”扩散成全站的“死”。这是生产事故最常见的死法，和代码bug无关，是架构病——设计时没做隔离，迟早要还。</p><p class="pv2-ex"><i>例</i>高速连环追尾：第一辆急刹，后面一辆接一辆撞上去。某电商大促，一个边缘的“推荐”服务变慢，拖死了下单主流程——主流程只是“顺手调了一下”推荐，却一起陪葬。</p></li><li><p class="pv2-idea"><b>3. 熔断器：对方挂了，就别再去敲门</b> 保险丝：电流过大就断开，保护全屋。熔断器一样：下游连续失败就“跳闸”，直接返回降级结果，不再发请求；过会儿放一个请求试探，好了就“合闸”。既不把挂掉的服务打得更挂，也不被它拖死。</p><p class="pv2-ex"><i>例</i>对方一直占线，别每隔十秒重拨——打不通，还把自己手机打没电。等半小时再试一次。支付系统给银行通道加熔断，银行抖动时自动切备用通道，用户只觉得“慢了一点”，而不是直接报错。</p></li><li><p class="pv2-idea"><b>4. 舱壁：把系统隔成“水密舱”</b> 船被鱼雷打中不沉，靠水密舱：一个舱进水，其他舱不受影响。软件里就是资源隔离：不同依赖配独立的线程池、连接池，一个hang死只耗尽自己的池子，不连累别人。隔离做好，故障“爆炸半径”就小。</p><p class="pv2-ex"><i>例</i>家里电路分路：空调一路、照明一路，空调短路只跳自己的闸，灯还亮着。某系统“下单”和“发券”共用一个线程池，发券hang死拖垮下单；拆成两个池子后，发券再挂也不影响收钱。</p></li><li><p class="pv2-idea"><b>5. 超时和限流：给每个操作上“紧箍咒”</b> 不设超时，等于“无限期等一个可能永远不回的人”；不限流，等于“来多少都接待、挤爆为止”。超时是“3秒不回就放弃”，限流是“门口保安数人头，满了排队或劝返”。两件小事防住一大半生产事故，却最容易被遗忘。</p><p class="pv2-ex"><i>例</i>饭店：等位超1小时客人就走（超时），满座不再放人进（限流）。让500人挤进只能坐50人的店，所有人都吃不上饭，厨师也崩溃。</p></li><li><p class="pv2-idea"><b>6. 反模式：集成点越多，死得越快</b> 每多接一个外部系统（支付、短信、地图、风控），就多一个“它挂了我也挂”的风险。集成点多到两只手数不过来，架构就有问题：要么砍掉非必要的，要么每个配上熔断降级。依赖是负债，不是资产。</p><p class="pv2-ex"><i>例</i>装修找20个分包队，任何一个掉链子，工期全拖。靠谱做法：关键路径的分包必须有备选（B队）。每个外部依赖都要有“B计划”。</p></li><li><p class="pv2-idea"><b>7. 透明度：看不见的系统救不回来</b> 线上出问题，第一问永远是“现在到底发生了什么”。日志、指标、业务仪表盘是救命的东西。重点记“业务指标”（每分钟下单量、支付成功率），不只看CPU内存——机器看着没事，业务可能已经挂了。</p><p class="pv2-ex"><i>例</i>开车只看“发动机转不转”（CPU），不看“车速多少”（业务量），抛锚了都不知道是没油还是爆胎。某公司大促CPU才40%，支付成功率却掉了20%——看业务指标才发现是第三方风控接口超时。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：活在生产环境</b> 开篇先带你认清现实：生产环境和开发、测试环境完全是两个世界。真实流量、不可靠的网络、会挂的依赖，以及永远在半夜响起的电话。</p><p class="pv2-ex"><i>例</i>新兵下连队：训练场打十环不算本事，战场上枪林弹雨活下来才算。这部分就是告诉你战场到底什么样。</p></li><li><p class="pv2-part"><b>第二部分：反模式——灾难的种子</b> 总结那些“看起来没问题、一上线就爆炸”的设计：集成点爆炸、级联重试、无上限使用资源。认出这些反模式，是防住事故的第一步。</p><p class="pv2-ex"><i>例</i>医生先学认病：发烧咳嗽对应什么病，心里有谱。看到“一个请求串行调8个外部接口”，老手后背发凉——这就是反模式的“症状”。</p></li><li><p class="pv2-part"><b>第三部分：稳定性模式——保命的招式</b> 全书的核心：超时、熔断器、舱壁、限流、快速失败。每个模式都讲清“解决什么问题、付出什么代价、代码大概怎么写”。</p><p class="pv2-ex"><i>例</i>就像武术套路：每个招式都拆解给你看——这招防什么、那招什么时候用。熔断器是“盾”，舱壁是“甲”，超时是“见势不妙先撤”，组合起来用才完整。</p></li><li><p class="pv2-part"><b>第四部分：中间件——稳定性的杀手</b> 专门讲那些你控制不了的东西：消息队列、应用服务器、数据库连接池。中间件出问题最隐蔽，也最致命，得用专门的手段对付。</p><p class="pv2-ex"><i>例</i>合租室友：自己的房间（代码）你能收拾，室友的房间（中间件）管不着，但他把厨房炸了你也得饿肚子。提前约法三章：超时、隔离、监控。</p></li><li><p class="pv2-part"><b>第五部分：交付——为生产而设计</b> 收尾：需求阶段就要考虑生产（容量规划、透明度、运维协作），而不是写完代码扔给运维。发布不是终点，是另一场战斗的起点。</p><p class="pv2-ex"><i>例</i>盖楼：设计图阶段就得考虑消防通道、承重、电梯维护，而不是盖好了才发现消防车进不来。“以后怎么活”要提前到“现在怎么画图”里。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-17">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.17</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《大型网站技术架构：核心原理与案例分析》</h3>
  <p class="pv2-meta">李智慧 · 电子工业出版社（博文视点） · 2013</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/25723064/" target="_blank" rel="noopener">豆瓣 7.8 分 · 1894人评价 <span>→</span></a></p>
  <p class="pv2-lede">网站从小做到大，架构怎么跟着变：作者在阿里当过架构师，把淘宝这些大网站踩过的坑总结成人人能用的方法。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>2013年，阿里架构师李智慧把一线大厂的架构经验写成这本书。那是中国互联网第一次有人系统地、用中文讲清“大网站是怎么长大的”——此前架构知识大多是英文的、零散的。</p><p>核心论点一句话：大型网站的架构不是设计出来的，是演化出来的。没有网站第一天就建成撑1亿用户的架构，都是从一台服务器开始，用户多了、慢了、挂了，才一步步拆成分布式。理解“演化”，就不再纠结“一步到位”。</p><p>全书围绕五个要素：高性能、高可用、可伸缩、可扩展、安全性。架构师的工作本质是在这五个要素间找平衡：加缓存提性能，但带来一致性问题；做冗余保可用，但冗余要花钱。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 大型网站的架构是演化出来的，不是设计出来的</b> 没有大网站第一天就是“能撑一亿用户”的样子。淘宝最早也是个简单网站，用户多了、扛不住了，才一步步拆分、加缓存、上集群。架构像城市路网，随人口增长一点点修出来，不是一张蓝图盖到老。别追求“一步到位”，每个阶段解决当下最痛的问题。</p><p class="pv2-ex"><i>例</i>开餐馆：夫妻店两个人起步，客人多了请帮工（加机器），再多开分店（拆业务），分店多了建中央厨房（分布式服务）。三桌客人的时候建中央厨房就是浪费，超前设计同理。</p></li><li><p class="pv2-idea"><b>2. 架构设计的九大模式：分层、分割、分布、集群、缓存、异步、冗余、自动化、安全</b> 大厂招数提炼成九个模式：分层、分割、分布、集群、缓存、异步、冗余、自动化、安全。分层是切成表现层、应用层、数据层；分割是按业务切小；分布是部署到不同机器；集群是多部署几份；缓存是热点放内存；异步是不着急的排队做；冗余是关键备双份；自动化是发布运维靠机器；安全是防攻击。</p><p class="pv2-ex"><i>例</i>双十一零点每秒几十万订单，下单、扣库存、付款全同步做，系统瞬间卡死。实际做法：下单请求先进消息队列排队（异步），库存慢慢扣，用户看到“排队中”而不是转圈——异步在救命。</p></li><li><p class="pv2-idea"><b>3. 评判架构的五个标尺：高性能、高可用、可伸缩、可扩展、安全性</b> 高性能是快，高可用是稳，可伸缩是加机器就扛更多流量，可扩展是加新功能不伤筋动骨，安全性是防黑客。架构师每天在这五个目标间取舍——它们经常打架，极致性能和极致安全就很难兼得。</p><p class="pv2-ex"><i>例</i>12306春运抢票：别卡、别崩、春运加机器、以后加候补购票、防黄牛脚本，五个一个不能少。架构评审会上吵的，就是这五个指标怎么排优先级。</p></li><li><p class="pv2-idea"><b>4. 缓存是性能优化的第一手段：网站访问遵循二八定律</b> 80%访问集中在20%热点数据上：首页、爆款、明星微博，永远那一小撮被反复看。何必每次都查慢吞吞的数据库？热点放内存（缓存），快几十上百倍。缓存分多层：浏览器、CDN、反向代理、本地、分布式，层层设防。</p><p class="pv2-ex"><i>例</i>热搜第一的绯闻一分钟被刷几百万次，每次都查数据库早趴下了。实际是这条微博缓存在内存里，几百万人读同一份拷贝，数据库只被问一次——这就是缓存的威力。</p></li><li><p class="pv2-idea"><b>5. 高可用：先假设一定会出故障，再来设计</b> 服务器会宕机、硬盘会坏、机房会断电。故障不是“会不会来”，是“什么时候来”。高可用就是不把鸡蛋放一个篮子：服务部署多份、数据多存几份、机房建两个。这叫冗余，贵，但比宕机一分钟损失几百万便宜。</p><p class="pv2-ex"><i>例</i>支付宝数据库至少两份实时同步，一台机房断电，几秒内切到备用机房，用户付款没感觉。你从没遇到“支付宝挂了”，背后就是这套冗余在烧钱。</p></li><li><p class="pv2-idea"><b>6. 异步解耦：让系统学会“排队”，而不是“堵死”</b> 同步像打电话，对方不接你就干等；异步像发微信，发完干别的，对方回了再处理。消息队列把上下游解耦：上游只管扔任务进队列，下游按自己节奏消费。流量洪峰来时，队列就是蓄水池，削峰填谷。</p><p class="pv2-ex"><i>例</i>秒杀100万人同时点“抢购”，不会让100万请求同时扣库存。而是让它们在消息队列排队，库存服务不紧不慢一个个处理。</p></li><li><p class="pv2-idea"><b>7. 安全是架构设计的一部分，不是上线前才想起来的补丁</b> 系统做好了才想“防一下黑客”，就像给漏水的船贴胶带。安全要融进架构：分层天然有隔离效果，敏感数据加密存，关键操作做风控。电商、金融网站一次拖库可能就是灭顶之灾。</p><p class="pv2-ex"><i>例</i>淘宝支付时突然要求短信验证：系统发现交易“有点可疑”（异地登录、大额），自动加一道验证。安全架构平时看不见，出事时救命。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一篇 概述：第1章 大型网站架构演化</b> 一个网站从一台服务器起步，随用户增长一步步演化成分布式架构。应用与数据分离、加缓存、上集群、读写分离、CDN。分布式文件系统、NoSQL、业务拆分、分布式服务。</p><p class="pv2-ex"><i>例</i>这章就是“餐馆扩张史”的完整剧本：读完会对“我系统处在哪个阶段、下一步拆什么”心里有数。</p></li><li><p class="pv2-part"><b>第二篇 架构模式：第2章 大型网站架构模式</b> 把大厂架构的通用招数提炼成九大模式：分层、分割、分布、集群、缓存、异步、冗余、自动化、安全。每个模式讲“解决什么问题、怎么用”。</p><p class="pv2-ex"><i>例</i>面试被问“怎么设计高并发系统”，把九个模式往上套：分层分割、分布集群、热点缓存、削峰异步、关键冗余。一套组合拳下来，面试官基本点头。</p></li><li><p class="pv2-part"><b>第二篇 核心要素：第3章 大型网站核心架构要素</b> 提出评价架构的五个标尺：高性能、高可用、可伸缩、可扩展、安全性，并讲清每个要素的目标、度量方法和常见手段。这是全书的“考试大纲”。</p><p class="pv2-ex"><i>例</i>老板说“要快、要稳、要能加功能”，翻译成架构语言就是性能、可用、扩展。这一章教你把大白话变成可度量的架构目标。</p></li><li><p class="pv2-part"><b>高性能：第4章 瞬时响应——网站的高性能架构</b> 从性能测试、优化讲起，分前端、应用服务器、存储三层给手段。浏览器缓存、CDN、反向代理、本地缓存、分布式缓存、异步、集群。</p><p class="pv2-ex"><i>例</i>页面打开要3秒怎么优化？按清单查：图片压缩了吗？用CDN了吗？接口能缓存吗？库加索引了吗？一层层查下去，3秒变300毫秒不是梦。</p></li><li><p class="pv2-part"><b>高可用：第5章 万无一失——网站的高可用架构</b> 讲如何设计“挂了一部分还能跑”的系统：负载均衡、故障转移、服务降级、限流、数据多副本。这是大厂SRE（网站可靠性）工作的理论源头之一。</p><p class="pv2-ex"><i>例</i>春晚红包微信支付每秒几十万笔，某台服务器挂了，负载均衡几秒内把流量挪走，用户毫无感知。“万无一失”靠的不是运气，是这一章的每一招。</p></li><li><p class="pv2-part"><b>伸缩与扩展：第6-7章 永无止境 &amp; 随需应变</b> 伸缩性是“加机器就扛更多流量”，可扩展性是“加新功能不用大改”。一个管量，一个管变化。</p><p class="pv2-ex"><i>例</i>双十一加100台服务器（伸缩），明年上“直播带货”（扩展）。前者靠云平台一键扩容，后者靠当初把“商品、交易、营销”拆成独立服务。</p></li><li><p class="pv2-part"><b>安全：第8章 固若金汤——网站的安全架构</b> 讲Web攻击（XSS、SQL注入、CSRF）怎么防、敏感信息怎么加密、垃圾信息怎么过滤、电商怎么做风险控制。安全是架构的底线。</p><p class="pv2-ex"><i>例</i>密码绝不能明文存库，要存“加盐哈希”：黑客偷走数据库，拿到的也是一堆算不回去的乱码。这是设计阶段定好的规矩，不是出事后再改。</p></li><li><p class="pv2-part"><b>第三篇 实战案例 &amp; 第四篇 架构师：第9-15章</b> 第三篇解剖淘宝、Wikipedia、Doris、秒杀系统和真实故障案例；第四篇讲架构师怎么做技术决策、怎么在职场成长。</p><p class="pv2-ex"><i>例</i>第12章秒杀系统是全书最高光：从“排队+限流+隔离”三板斧，到“把秒杀做成独立小系统”，很多公司第一次做秒杀就是照这章抄的作业。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-18">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.18</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《凤凰项目：一个IT运维的传奇故事》</h3>
  <p class="pv2-meta">The Phoenix Project: A Novel About IT, DevOps, and Helping Your Business Win · 吉恩·金、凯文·贝尔、乔治·斯帕福德 · 人民邮电出版社 · 2015</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/26644070/" target="_blank" rel="noopener">豆瓣 8.6 分 · 994人评价 <span>→</span></a></p>
  <p class="pv2-lede">用小说讲DevOps：IT经理临危受命90天，靠“三步工作法”把烂摊子变成高效团队。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>汽车零件公司IT经理Bill临危受命：90天内让烂尾的“凤凰项目”上线，否则整个IT部门被外包。在导师指点下，他领悟“三步工作法”，把救火队变成高效团队。</p><p>核心论点：IT工作和工厂流水线没本质区别，都服从约束理论——系统产出速度取决于最慢的环节（瓶颈）。想提速别瞎忙，先找到瓶颈、保护瓶颈、打破瓶颈。三步工作法（快速流动、快速反馈、持续学习）就是操作手册。</p><p>在它之前，DevOps是一堆零散理念和工具；这本书第一次用完整故事讲清“为什么需要DevOps”。此后十年，它成了DevOps圈的启蒙读物。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 三步工作法第一法则：让工作从左到右快速流动</b> 管“从左到右的工作流”：需求从开发流向运维再到用户，这条线要快、要顺。三招：小批量工作（别攒大版本一次发）、限制同时在做的事、绝不让有缺陷的东西流到下游。</p><p class="pv2-ex"><i>例</i>工厂流水线：铁板从左边进，切割、焊接、喷漆，从右边出来变成汽车门。IT一样：需求从左边进，开发、测试、运维，从右边交付用户。等审批、等环境、返工——任何让线停下来的地方都是浪费。</p></li><li><p class="pv2-idea"><b>2. 三步工作法第二法则：从右到左建立快速反馈</b> 管“从右到左的反馈流”：下游发现问题，最快速度告诉上游。出问题立刻喊停、快速定位、把教训变成防护（比如加个自动化检查）。反馈越快，同样的坑越不会踩第二次。</p><p class="pv2-ex"><i>例</i>工厂里工人发现零件问题，立刻拉绳停线，全厂一起看。IT也该这样：报警一响先止血、再复盘。很多团队相反：报警没人看，出事互相甩锅，同样的坑下个月再踩一次。</p></li><li><p class="pv2-idea"><b>3. 三步工作法第三法则：持续学习和实验的文化</b> 管持续学习和实验的文化：每次事故都是学习机会，鼓励小步试错。复盘不甩锅，经验沉淀成文档和工具，主动做故障演练。没这种文化，前两条迟早流于形式。</p><p class="pv2-ex"><i>例</i>航空业每次空难都彻底调查、全行业学习，所以飞机越来越安全。IT也该这样：故障后复盘不追责、只找系统原因，改进变成自动化规则。敢做小实验，组织才越来越强。</p></li><li><p class="pv2-idea"><b>4. 找到瓶颈：整个系统的产出，只取决于最慢的那个环节</b> 约束理论：任何系统同一时间只有一个瓶颈，系统产出速度等于瓶颈的速度。非瓶颈环节再努力也是白费。找到瓶颈、让它满负荷、最终打破它，系统才会变快。书里的“布伦特”就是瓶颈本人。</p><p class="pv2-ex"><i>例</i>公司里所有疑难杂症都要经布伦特的手，他休假一周，三个项目全停摆。办法不是让他更努力，而是把他脑子里的知识写成文档、做成工具——先保护瓶颈，再消除瓶颈。</p></li><li><p class="pv2-idea"><b>5. 四种工作类型：计划外工作是吞噬一切的黑洞</b> IT工作分四种：业务项目、内部项目、变更，以及最要命的计划外工作（线上故障、紧急需求、安全补丁）。计划外工作像黑洞，吞掉所有排好的计划。天天被它追着跑，就永远没空做重要的事。</p><p class="pv2-ex"><i>例</i>排好这周做三个需求，周一两个线上故障、周二老板插紧急需求、周三全量打补丁，计划全泡汤。计划外工作不打招呼、优先级最高，专杀一切计划。办法：留缓冲时间，把重复出现的计划外工作变成计划内（总在救的火做成自动化）。</p></li><li><p class="pv2-idea"><b>6. 警惕“救火英雄文化”和技术债：越救火，越没空防火</b> 很多团队靠几个“英雄”撑着：系统挂了总有人能人肉修好。短期感人，长期是灾难——英雄越救火，团队越没空防火（自动化、文档、重构），火越烧越旺。技术债同理：欠得越多，未来计划外工作越多。</p><p class="pv2-ex"><i>例</i>“救火英雄”每次凌晨三点爬起来修好系统，大家都夸靠谱。但没人问：为什么总是他？为什么同样的火每月烧一次？英雄文化掩盖了系统性问题。高手是让火烧不起来的人，不是灭火最快的人。</p></li><li><p class="pv2-idea"><b>7. 用看板让工作可视化：看不见的工作管不好</b> 把需求、故障、变更全部可视化（比如一块看板），谁在做什么、卡在哪，一目了然。限制每列数量（在制品上限），逼团队先做完手头的事再开新坑，流动速度自然上去。</p><p class="pv2-ex"><i>例</i>白板三列：待办、进行中、已完成，“进行中”最多3项。很快发现5件事卡在“等运维给权限”——瓶颈自己现形了。站会看着板子说事就行。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>开篇：临危受命的90天</b> IT经理Bill临危受命：90天内让烂尾的“凤凰项目”上线，否则IT部门被外包。全书小说体、按日期推进，跟着Bill一天天往下走。</p><p class="pv2-ex"><i>例</i>Bill第一周就被现实教育：服务器宕机、项目延期、部门互相甩锅。在传统企业IT待过的人读到这，都会会心一笑——太真实了。</p></li><li><p class="pv2-part"><b>救火与启蒙：认识三步工作法</b> Bill救火中认识导师Erik，第一次听到“三步工作法”和约束理论。并用“四种工作类型”盘点团队时间去哪了——全书的理论奠基。</p><p class="pv2-ex"><i>例</i>Erik带Bill去工厂：流水线上在制品堆积如山，真正瓶颈是那台老机器。你们IT也一样，布伦特就是那台老机器。</p></li><li><p class="pv2-part"><b>实践：把三步工作法用起来</b> Bill带着团队落地：看板可视化、限制在制品、小批量发布、建立快速反馈、保护瓶颈。凤凰项目从“人人喊打”慢慢变成“居然能按时交付了”。</p><p class="pv2-ex"><i>例</i>白板上墙，所有工作上板；“进行中”最多三件事；布伦特的时间被保护，只干最重要的事。几周后：交付变快，加班变少。</p></li><li><p class="pv2-part"><b>凤凰涅槃：上线与转折</b> 凤凰项目成功上线，CEO保住了IT部门。更重要的是，团队证明了：用正确的方法，传统企业的IT也能跑得像互联网公司一样快。</p><p class="pv2-ex"><i>例</i>上线当天所有人守在作战室：没有通宵、没有惊魂，系统平稳上线。Bill意识到：不靠熬夜拼命项目也能成功，靠的是流程，不是运气。</p></li><li><p class="pv2-part"><b>尾声：从项目到文化</b> 收尾讲文化的沉淀：复盘机制、知识分享、持续实验。项目会结束，但“三步工作法”留下来，变成了组织的肌肉记忆。</p><p class="pv2-ex"><i>例</i>最后Bill不再天天救火，而是在想“怎么让好状态持续下去”。DevOps的终点不是一套工具，是持续改善的文化。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-19">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.19</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《微服务架构设计模式》</h3>
  <p class="pv2-meta">Microservices Patterns: With Examples in Java · 克里斯·理查森（Chris Richardson） · 机械工业出版社 · 2019</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/33425123/" target="_blank" rel="noopener">豆瓣 9.0 分 · 718人评价 <span>→</span></a></p>
  <p class="pv2-lede">微服务“模式词典”：拆服务、服务间通信、分布式事务这些难题，一个个给出经过验证的解法。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>微服务正火，但缺一本“动手指南”。拆多细、服务间怎么通信、分布式事务怎么办，全是坑。Chris Richardson把这本书写成了微服务的“模式词典”。</p><p>微服务不是“把单体拆小”那么简单：拆完之后，通信、事务、查询、部署全是新问题。但前人都踩过，都可以沉淀成模式。书里用统一的“模式语言”（问题、方案、利弊）讲了几十个模式，每个决策都有章可循。</p><p>它让微服务从“玄学”变成“工程学”。选型不再靠拍脑袋：分布式事务的标准答案是Saga，协同和编排两种做法，利弊都列清楚。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 8</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 先想清楚再拆：单体地狱和微服务地狱一样可怕</b> 单体做大变“单体地狱”：代码耦合、部署半小时、改一行提心吊胆。微服务拆不好变“微服务地狱”：分布式事务、网络延迟、运维爆炸。微服务不是银弹，团队小、业务简单时，单体可能是更好的选择。</p><p class="pv2-ex"><i>例</i>5个人、2万行代码拆成20个微服务：部署协调20个仓库，出问题查20份日志。新人三个月看不懂全貌——这就是微服务地狱。</p></li><li><p class="pv2-idea"><b>2. 怎么拆服务：跟着业务拆，别跟着技术拆</b> 两套方法：按业务能力拆（电商天然有商品、订单、支付），或按子域拆（DDD的“限界上下文”）。核心一条：高内聚、低耦合，一个服务只干一类事，服务之间少废话。</p><p class="pv2-ex"><i>例</i>按“商品、订单、支付、库存”拆成四个服务，各有自己的库和团队。这就是限界上下文：一个服务管好一块业务，谁也别伸手到别人地盘。</p></li><li><p class="pv2-idea"><b>3. 服务之间怎么说话：同步像打电话，异步像发微信</b> 两种说话方式：同步（REST、gRPC，像打电话，实时但互相等）和异步（消息队列，像发微信，解耦但有延迟）。</p><p class="pv2-ex"><i>例</i>查订单详情调订单服务，订单服务又调商品和用户服务——同步像套娃，一层慢层层慢，一个挂全挂。能异步就异步：下单成功发个“订单已创建”事件，库存、物流各自订阅处理，谁也不用等谁。</p></li><li><p class="pv2-idea"><b>4. Saga模式：没有分布式事务，就用“分步提交+补偿”</b> 微服务处理分布式事务的标准答案：大事务拆成一串本地小事务。每步成功发事件触发下一步；哪步失败，反向执行补偿操作撤销前面。</p><p class="pv2-ex"><i>例</i>下单要做三件事：创建订单、扣库存、扣钱，三个服务三个库，没有传统事务。Saga：前两步成功、第三步扣钱失败，别慌，执行补偿——库存加回去、订单标失败。没有“要么全成功”，只有“失败了能撤销”。</p></li><li><p class="pv2-idea"><b>5. CQRS：读写分开，查得快才重要</b> 命令查询职责分离：写和读用不同模型。微服务里数据散在各处，跨服务查又慢又复杂，干脆为查询单独建模、单独优化。代价是数据有短暂延迟（最终一致），换来查询性能大幅提升。</p><p class="pv2-ex"><i>例</i>CQRS建一个“查询服务”，平时订阅各服务事件把数据拼好存自己这。用户查详情只问它，一个请求搞定，又快又稳。</p></li><li><p class="pv2-idea"><b>6. 事件溯源：不记余额，只记每一笔流水</b> 不直接存“当前状态”，存“导致状态变化的一串事件”。状态随时重放算出来，天然带审计日志，调试回滚都方便。代价是概念绕、查询要额外建模，适合审计追溯要求高的场景（金融、订单）。</p><p class="pv2-ex"><i>例</i>账户100元花了30：传统做法把余额改成70，事件溯源记一笔“支出30元”，余额是算出来的。想查账，把所有流水重放一遍就行，一笔都丢不了。</p></li><li><p class="pv2-idea"><b>7. API网关：给前端一个统一的门面</b> 前端不该直接面对几十个微服务。API网关是统一门面：鉴权、限流、路由、拼装一站式搞定。BFF更进一步：给每种客户端定制专属接口，App要的和网页要的可以不一样。</p><p class="pv2-ex"><i>例</i>App只调一个API网关，网关在后面把20个调用拼好一次返回。还可以给App、网页、小程序各配专属网关，各取所需。</p></li><li><p class="pv2-idea"><b>8. 绞杀者模式：别重写老系统，一点点“勒死”它</b> 全书压轴，也最实用：别想“推倒重写”，那是找死。在老系统外套一层新服务，新功能走新服务，老功能逐步迁移，流量一点点切。风险可控、随时回滚，是绝大多数团队落地微服务的真实路径。</p><p class="pv2-ex"><i>例</i>10年历史的老单体谁也不敢重写：新功能做成微服务挡在前面，流量一点点切过去。几年后老系统只剩空壳，自然退役——像绞杀榕缠死大树一样。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第1章 逃离单体地狱</b> 讲单体应用的困境、微服务的利弊，以及最重要的判断：你到底该不该上微服务。先立规矩，再谈技术。</p><p class="pv2-ex"><i>例</i>装修前先问“这房子真要拆吗”：承重墙不能动，小修小补就行。很多团队的问题不是“怎么拆”，是“根本不该拆”。</p></li><li><p class="pv2-part"><b>第2章 服务的分解策略</b> 两种分解方法：按业务能力分解、按子域（DDD限界上下文）分解。附带分解 checklist，帮你检验拆得对不对。</p><p class="pv2-ex"><i>例</i>架构师对着业务架构图画圈：商品一块、订单一块、支付一块，圈就是服务边界。画完所有人懂了：拆服务是业务问题，不是技术问题。</p></li><li><p class="pv2-part"><b>第3章 微服务架构中的进程间通信</b> 同步（REST、gRPC）与异步（消息、事件）的详细对比：可靠性、延迟、耦合度。以及服务发现、断路器等配套模式。</p><p class="pv2-ex"><i>例</i>下单直接调库存接口（同步），还是发消息“我下单了你们看着办”（异步）？两种方式的时序图、优缺点、选型建议。这一章一次讲透。</p></li><li><p class="pv2-part"><b>第4章 使用Saga管理事务</b> 分布式事务的标准解法：协同式Saga与编排式Saga，补偿事务的设计，以及防并发坑的技巧。</p><p class="pv2-ex"><i>例</i>订机票：订座成功、扣款失败，Saga补偿自动释放座位。并通知用户“支付失败、座位已释放”——没有“系统错误请重试”，体验干干净净。</p></li><li><p class="pv2-part"><b>第5-6章 业务逻辑设计与事件溯源</b> 用DDD的聚合、领域事件来建模业务逻辑；事件溯源把“状态变化”本身存下来，天然可审计、可重放。</p><p class="pv2-ex"><i>例</i>订单创建后发出“订单已创建”事件，库存听到扣库存，物流听到建运单。订单服务根本不认识它俩，加新服务不用改老代码。</p></li><li><p class="pv2-part"><b>第7-8章 查询与外部API</b> CQRS解决跨服务查询难题；API网关与BFF模式解决前端接入问题。读写分离、各取所需。</p><p class="pv2-ex"><i>例</i>双十一大屏实时显示成交额：查询服务订阅所有交易事件，数字每秒更新。写库（交易）和读库（大屏）互不干扰，各自安好。</p></li><li><p class="pv2-part"><b>第9-13章 测试、生产就绪、部署与重构</b> 微服务测试策略（消费者驱动的契约测试是重点）、生产就绪checklist、多种部署模式。最后以绞杀者模式收尾：老单体一点点换成微服务。</p><p class="pv2-ex"><i>例</i>“本地能跑”到“线上敢跑”，差的是：健康检查、指标、链路追踪、外部化配置、灰度发布。测试金字塔告诉你单元、集成、端到端测试该怎么配比。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-20">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.20</span><span>系统设计</span></p>
  <h3 class="pv2-book-title">《架构即未来》</h3>
  <p class="pv2-meta">The Art of Scalability (2nd Edition) · 马丁·阿伯特（Martin L. Abbott）、迈克尔·费舍尔（Michael T. Fisher） · 机械工业出版社 · 2014</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/26765979/" target="_blank" rel="noopener">豆瓣 8.0 分 · 326人评价 <span>→</span></a></p>
  <p class="pv2-lede">“AKF扩展立方体”：系统撑不住了，加机器、拆功能还是分数据？三个轴指方向。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>eBay、PayPal的用户量在涨，服务器成本却要压。两位作者把超大规模系统的扩展经验写成这本书。</p><p>核心贡献是AKF扩展立方体：把“系统怎么扩展”变成三道选择题。X轴：加一模一样的机器（水平克隆）；Y轴：按功能拆成不同服务；Z轴：按数据切分分片。任何扩展手段都能归到这三个轴上，架构师从此有了共同语言。</p><p>它是第一本把“扩展性”讲透的书，而且不只讲技术：扩展性是人、流程、技术的乘积。今天的微服务、分库分表、云原生弹性伸缩，思想源头很多在这个立方体里。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. AKF扩展立方体：扩展只有三个方向</b> “系统怎么扩展”抽象成一个立方体：X轴水平克隆，Y轴按功能拆分，Z轴按数据拆分。任何扩展手段都能归到这三个轴上，讨论扩展有了共同语言。</p><p class="pv2-ex"><i>例</i>用户量涨10倍系统变慢：短期X轴加机器顶住（最快），中期Y轴拆“图片处理”成独立服务（治本）。长期Z轴按用户ID分库（根治）。三个方向清清楚楚，不再碰运气。</p></li><li><p class="pv2-idea"><b>2. X轴：水平克隆——加机器，最简单的扩展</b> 最简单粗暴的扩展：应用原样复制多份，前面用负载均衡分发流量。不改代码，见效最快。但有天花板：有状态的部分（数据库、文件存储）克隆不了，所以X轴通常是第一步，不是终点。</p><p class="pv2-ex"><i>例</i>流量翻倍，最快就是再买几台服务器装同样的程序，前面加负载均衡分流。代码一行不改，半小时搞定。但数据库还是那一个，加再多机器，瓶颈迟早卡在没法克隆的地方。</p></li><li><p class="pv2-idea"><b>3. Y轴：按功能拆分——微服务思想的老祖宗</b> 按功能、业务把系统拆开：不同功能拆成不同服务，各自独立扩展、独立部署。好处是资源利用率高，哪里压力大加哪里；代价是系统变复杂，服务之间要通信、要治理。</p><p class="pv2-ex"><i>例</i>电商网站拆成“商品浏览”“下单支付”“图片处理”三个服务：图片处理吃CPU就多配机器，商品浏览压力大就加缓存。各服务独立扩展，钱花在刀刃上——这就是“微服务”思想的老祖宗。</p></li><li><p class="pv2-idea"><b>4. Z轴：按数据拆分——分库分表的理论源头</b> 把数据切成互不重叠的片，分散到不同机器：按客户、按地域、按哈希切。好处是扩展性最强（理论上无限加机器）；代价是跨片查询变复杂、事务难做。数据库扩展的终极手段：分库分表。</p><p class="pv2-ex"><i>例</i>用户表1亿行越查越慢：按用户ID哈希分到10个库，1号库只存ID尾号1的用户。查询先算“这个用户在哪”，再去对应库查——每个库1000万行，速度回来了。</p></li><li><p class="pv2-idea"><b>5. 扩展不只是技术的事：人、流程、技术三驾马车</b> 见过太多“技术没问题但扩不上去”的案例，结论：扩展性是人、流程、技术三者的乘积。组织不合理（200人的大团队）、流程有瓶颈（发布层层审批），技术再好也白搭。三者一起设计。</p><p class="pv2-ex"><i>例</i>团队天天加班，发布还是慢：不是技术不行，是流程卡住了——每次发布五个领导审批，等两周。“流程”这条腿瘸了。技术、流程、组织三条腿，瘸一条都跑不快。</p></li><li><p class="pv2-idea"><b>6. 架构原则：为扩展而设计，而不是事后补救</b> 与其事后救火，不如事前设计。架构原则：无状态设计、异步解耦、缓存优先、水平扩展友好——让系统“天生就好扩展”。扩展性不是运维阶段才考虑，是画第一张架构图时就要想好的。</p><p class="pv2-ex"><i>例</i>设计之初就规定：应用服务器不存本地状态（登录态放Redis）。X轴加机器才无压力；耗时操作全走异步队列，Y轴拆分才顺滑。</p></li><li><p class="pv2-idea"><b>7. 先找到瓶颈再动手：度量先行，加错机器等于白花钱</b> 扩展第一步永远是度量：先找到瓶颈，再选对应的轴。一慢就加机器，结果瓶颈在数据库，加100台应用服务器也没用。AKF立方体的价值就是一张“排查地图”，顺着三个轴一个个排除。</p><p class="pv2-ex"><i>例</i>系统变慢别急着加机器。CPU满了，走X轴加机器；服务太重，走Y轴拆分；单表太大，走Z轴分片。量体裁衣、对症下药，加错方向的机器都是白花钱。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>核心模型：AKF扩展立方体</b> 全书的地图：X轴（水平克隆）、Y轴（功能拆分）、Z轴（数据拆分）。理解了这个模型，后面所有手段都有了坐标，再也不会“头痛医头”。</p><p class="pv2-ex"><i>例</i>开会讨论“系统太慢怎么办”，以前各说各话。现在白板上画个立方体：“先走X轴顶住，下季度走Y轴拆图片服务”。三分钟达成共识，这就是共同语言的威力。</p></li><li><p class="pv2-part"><b>X轴：水平扩展——克隆一切</b> 讲水平克隆的适用场景、负载均衡、会话保持（为什么无状态设计重要），以及X轴的天花板：有状态的部分克隆不了。</p><p class="pv2-ex"><i>例</i>春晚抢红包，微信支付服务器是平时的几十倍：平时100台，春晚1000台，结束再缩回去。云计算让X轴前所未有的便宜方便。</p></li><li><p class="pv2-part"><b>Y轴：功能拆分——按服务拆</b> 按业务功能拆分系统的原则、服务的粒度、拆分后的通信与治理。这是微服务架构的理论前身，拆得好坏直接决定扩展成本。</p><p class="pv2-ex"><i>例</i>淘宝把“商品”“交易”“支付”拆成独立系统，双十一只给交易系统加机器，商品系统该干嘛干嘛。还是大单体就只能整体加机器，白白浪费。</p></li><li><p class="pv2-part"><b>Z轴：数据拆分——按客户、数据拆</b> 数据分片的策略（哈希、范围、目录）、分片后的查询路由、跨片事务的取舍。这是扩展性最强、也最复杂的一条轴。</p><p class="pv2-ex"><i>例</i>微信用户数据按地域分片，华南用户查华南的库。单库数据量下来查询快了，还顺带满足数据合规——Z轴一举多得。</p></li><li><p class="pv2-part"><b>架构原则：可扩展系统的设计清单</b> 总结一线大厂验证过的架构原则：无状态、异步、缓存、松耦合等。目标是让系统“天生好扩展”，而不是长大后再动手术。</p><p class="pv2-ex"><i>例</i>新服务上线前，架构师拿checklist逐项过：无状态吗？能水平扩展吗？缓存加了吗？耗时操作异步了吗？扩展性从“口号”变成“流程”。</p></li><li><p class="pv2-part"><b>人与流程：组织和事故管理</b> 可扩展的组织（小团队、端到端负责）和流程（敏捷、变更管理、事故复盘）：技术、流程、组织三者缺一不可。这是本书区别于纯技术书的最大特点。</p><p class="pv2-ex"><i>例</i>eBay把大团队拆成几十个小团队，每个对一块业务端到端负责，发布速度反而上去了。组织架构和系统架构互相塑造——这就是康威定律。</p></li></ul>
</article></section><section class="pv2-domain" id="uiux"><div class="pv2-domain-head"><span class="pv2-ghost" aria-hidden="true">03</span><div><p class="pv2-eyebrow">第叁辑 · UI/UX 设计</p><h2 class="pv2-domain-title">UI/UX 设计</h2><p class="pv2-domain-intro">说白了，UI/UX 设计就是研究“人怎么用东西”的学问：UI 管“长什么样”，UX 管“用起来顺不顺”。目标只有一个——让用户用产品时不费脑子、不犯错，还觉得顺手。</p></div></div>
<article class="pv2-book" id="pv2-book-21">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.21</span><span>UI/UX 设计</span></p>
  <h3 class="pv2-book-title">《点石成金》</h3>
  <p class="pv2-meta">Don&#x27;t Make Me Think · 史蒂夫·克鲁格 · 机械工业出版社 · 2000</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1827702/" target="_blank" rel="noopener">豆瓣 8.5 分 · 7273人评价 <span>→</span></a></p>
  <p class="pv2-lede">做网站和 App 的实战小册子：别让用户动脑子，薄、幽默、句句拿来就能用。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>一个页面好不好用，不看视觉多酷，只看用户能不能不假思索地完成任务。用户停下来想“我该点哪儿”，设计就已经输了。</p><p>用户不是在阅读页面，而是在扫描；做选择时不是精挑细选，而是差不多就行。这本书把可用性从实验室里的高深学问，变成了人人能用的常识。</p><p>它提出了“一天 10 美分”测试法。找 3 个用户，一个上午测一次，下午就改。从此“小步快测”成了整个互联网行业的标配动作。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 别让我思考：好页面不用动脑子</b> 用户打开页面时大脑处于省电模式，只想赶紧把事办完。每个按钮、每段文字都要一眼就懂。让用户犹豫超过一秒的设计，都是在添堵。</p><p class="pv2-ex"><i>例</i>注册按钮写“免费注册”，用户秒懂。写成“开启您的数字化之旅”，用户就得愣住：这是注册吗？淘宝的“立即购买”大按钮又大又红，不用想就知道点它能下单。</p></li><li><p class="pv2-idea"><b>2. 用户不读页面，他们只扫描</b> 用户像雷达一样扫页面，只抓关键词、大标题、加粗字，剩下的直接跳过。页面是写给“扫描仪”看的，得经得起扫：层级分明、重点突出。</p><p class="pv2-ex"><i>例</i>微信公众号文章没人逐字读，都是先扫标题和小标题，觉得有料才细看。所以多用小标题分段、关键词加粗、要点用列表排开。</p></li><li><p class="pv2-idea"><b>3. 差不多就行：用户不做最优选择</b> “满意即可”：用户点第一个看起来靠谱的选项，错了再回头。试错成本太低了，点错了点返回就行，谁还费脑子比较？</p><p class="pv2-ex"><i>例</i>百度搜“北京好吃的火锅”，你会点第一个标题顺眼的进去，不行再退回来。搜索结果页的关键是让每个结果都清晰可信，用户敢放心点下去。</p></li><li><p class="pv2-idea"><b>4. 点击几次无所谓，每次点击要明确</b> 用户不怕多点几下，怕的是每点一下都要赌一把：“点这个对吗？会去哪儿？”只要每一步都清清楚楚，点十次也乐意。</p><p class="pv2-ex"><i>例</i>美团外卖从首页到结算七八步，但每一步都知道自己在哪、下一步去哪，所以不累。反倒是某些网站的按钮写着“了解更多”，点下去是报价单还是广告全靠猜。</p></li><li><p class="pv2-idea"><b>5. 删掉一半文字，再把剩下的删掉一半</b> 网页上的字 90% 没人看，却全是噪音。它们让真正重要的信息更难被扫到。先删一半，再删一半，留下的每个字都得是“不写用户就办不成事”的。</p><p class="pv2-ex"><i>例</i>很多公司官网首页写“欢迎光临，我公司成立于 2003 年……”。用户只想找客服电话，这些字全是路障。苹果官网一句话：“iPhone 16，强，翻天。”</p></li><li><p class="pv2-idea"><b>6. 导航要像街头指示牌，一眼看懂</b> 好导航像马路上的指示牌：需要的时候准时出现、清晰醒目。再配上面包屑“首页 &gt; 女装 &gt; 连衣裙”。用户随时知道自己在哪、怎么回去。</p><p class="pv2-ex"><i>例</i>淘宝把“首页、购物车、我的”固定在底部。不管逛多深，一抬手就能回家。用户在网站里迷路，和在商场里迷路一样，只想赶紧出去。</p></li><li><p class="pv2-idea"><b>7. 可用性测试不用贵：找 3 个人，一个上午测一次</b> 别把可用性测试当科研项目。找 3 个普通用户，给几个典型任务，看着他们用，记下卡住的地方。一个上午就能发现 80% 的问题。精髓是早测、常测。</p><p class="pv2-ex"><i>例</i>点餐小程序原型做好，直接拉 3 个同事来“帮我点一份宫保鸡丁”。有人在支付页卡住，有人找不到优惠券入口，10 分钟问题全暴露了。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一部分：可用性的基本原则（第 1–6 章）</b> 三条定律加用户真实行为：用户扫描不阅读、选择差不多就行。设计手法：为扫描设计、借用惯例、视觉层级分明、删繁就简、导航清晰。</p><p class="pv2-ex"><i>例</i>就像高速公路广告牌：司机只有 3 秒钟看，字大、信息少、一眼懂。网页也一样，用户只给你几秒钟，这部分教你在这几秒里把事说清楚。</p></li><li><p class="pv2-part"><b>第二部分：让用户顺利上路（第 7 章）</b> 首页是网站的“大堂”，几秒钟内必须回答三个问题：这是什么网站？我能干什么？为什么选你不选别人？</p><p class="pv2-ex"><i>例</i>携程首页一眼就懂：订机票酒店的，搜索框在正中间。反观某些企业官网，一屏轮播图配“携手共创美好未来”，三个问题一个都没回答。</p></li><li><p class="pv2-part"><b>可用性之争：农夫和牧牛人为什么总吵架（第 8 章）</b> 团队里关于可用性的争论吵不出结果，因为人人都从自己立场出发。解法是别争对错，让真实用户投票——也就是做测试。</p><p class="pv2-ex"><i>例</i>老板要首页加轮播大图，设计师说没人看。别吵，找 5 个用户来，看看有几个人点轮播图，数据一摆出来，争论自然结束。</p></li><li><p class="pv2-part"><b>自己动手的可用性测试（第 9–10 章）</b> 低成本测试全流程：怎么招人、怎么出任务、测试时只看不说。核心一句话：可用性就是基本礼貌，别给用户添麻烦。</p><p class="pv2-ex"><i>例</i>每月抽一个上午，请 3 个用户用 20 分钟。你会发现一堆自己天天看却视而不见的问题。</p></li><li><p class="pv2-part"><b>移动时代与“救命，老板要我……”（第 11–13 章）</b> 移动端屏幕小、场景碎片化，可用性要求更高。最后一章教你怎么跟老板沟通：把“你错了”说成“我们一起让用户更爽”。</p><p class="pv2-ex"><i>例</i>老板要在首页塞 8 个入口，别硬顶。“我们找 3 个用户试试，看他们找不找得到充值入口？”争论变成一次 30 分钟的小测试。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-22">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.22</span><span>UI/UX 设计</span></p>
  <h3 class="pv2-book-title">《用户体验要素》</h3>
  <p class="pv2-meta">The Elements of User Experience · 杰西·詹姆斯·加勒特 · 机械工业出版社 · 2003</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/2297549/" target="_blank" rel="noopener">豆瓣 8.3 分 · 4517人评价 <span>→</span></a></p>
  <p class="pv2-lede">用“五个层面”把产品工作从战略讲到视觉。产品经理和设计师的共同语言。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>用户体验不是界面美不美。它是一个五层系统：战略、范围、结构、框架、表现，从抽象到具体。下层支撑上层：战略错了，界面再漂亮也没用。</p><p>2003 年出版时人人都在谈用户体验，却没人说得清它包括什么、从哪儿下手。这张五层面图一出来，全行业有了共同语言。吵按钮颜色是表现层的问题，争功能优先级回战略层找依据。</p><p>它确立了 UX 工作的完整版图。用户体验从公司战略就开始，而不是最后“美化一下界面”的收尾工作。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 6</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 战略层：先回答“我们为什么做，用户为什么用”</b> 这是最底层、也最重要的一层。产品目标：我们想得到什么。用户需求：用户是谁、痛点是什么。想不清楚，上面盖什么楼都是歪的。</p><p class="pv2-ex"><i>例</i>外卖 App 战略是“30 分钟必达”，首页就该突出预估时间和超时赔付。战略是“全网最低价”，首页就该突出红包补贴。战略不同，整个产品就不同。</p></li><li><p class="pv2-idea"><b>2. 范围层：把战略翻译成“做什么、不做什么”的清单</b> 把战略变成具体清单：功能型产品列功能规格，内容型产品列内容需求。“不做什么”跟“做什么”同样重要，范围不清，项目就无限膨胀。</p><p class="pv2-ex"><i>例</i>微信 1.0 只做免费文字和语音消息，不做朋友圈、公众号、支付。范围足够克制，才能快速上线、快速验证。</p></li><li><p class="pv2-idea"><b>3. 结构层：决定用户怎么走、信息怎么组织</b> 开始画产品的“骨架”。交互设计（点了按钮发生什么）和信息架构（内容怎么分类、让用户找得到）。这一层看不见，但用得顺不顺全靠它。</p><p class="pv2-ex"><i>例</i>淘宝把商品组织成“女装 &gt; 连衣裙 &gt; 夏季连衣裙”的类目树。顺着点，总能找到想要的。12306 买票：查车次→选座→填乘车人→支付，一步接一步不能跳。</p></li><li><p class="pv2-idea"><b>4. 框架层：单个页面的布局，按钮放哪儿、导航怎么摆</b> 每个房间的家具摆放图：按钮放哪儿、页面间怎么穿梭、信息怎么呈现。产出就是线框图：先摆对位置，再谈好看。</p><p class="pv2-ex"><i>例</i>微信聊天页输入框永远在底部、发送键在右下角，十年没变，因为符合拇指操作。框架层摆错了，表现层再美也救不回来。</p></li><li><p class="pv2-idea"><b>5. 表现层：视觉是最后一步，不是第一步</b> 用户直接看到的东西：颜色、字体、图标、间距。作用是把下面四层的决策用最美的方式呈现。项目一启动就先做视觉稿，做出来也只是“好看的空壳”。</p><p class="pv2-ex"><i>例</i>先定户型再买沙发：户型没定就买了欧式大沙发，可能门都进不去。先画线框图把布局定死，再上视觉，才不会返工。</p></li><li><p class="pv2-idea"><b>6. 下层决定上层：地基歪了，装修再好也白搭</b> 五层自下而上依赖：改上层容易，改下层上面层层跟着动。出问题别急着改界面，先一层层往下问：战略错了？范围不清？还是结构乱了？</p><p class="pv2-ex"><i>例</i>电商 App 转化率低，老板让按钮做大做红，改完没起色。病根在结构层：结算要填 12 项信息，用户嫌烦直接放弃。结构层的问题，表现层救不了。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>开篇：用户体验为什么重要</b> 用户体验是产品在用户手里留下的全部印象和感受。体验差，用户用脚投票，每个接触点都在塑造口碑。</p><p class="pv2-ex"><i>例</i>买手机不只看参数，还在意开箱、系统、客服。这些加起来才是用户体验：它不是某个部门的事，是产品的全部。</p></li><li><p class="pv2-part"><b>第一章：战略层——产品目标与用户需求</b> 产品目标要具体可衡量，用户需求要靠调研而不是拍脑袋。两者对齐，项目才有主心骨。</p><p class="pv2-ex"><i>例</i>滴滴早期战略很清楚。目标是“让更多人打到车”，用户痛点是“打车难、等待久”。所有功能都围着这个转，没有一个多余动作。</p></li><li><p class="pv2-part"><b>第二章：范围层——功能规格与内容需求</b> 把战略变成清单：功能型产品写功能规格，内容型产品写内容需求。排优先级、敢说“不做”，防止需求膨胀。</p><p class="pv2-ex"><i>例</i>像列购物清单去超市：写下“只买牛奶、鸡蛋、面包”，才能抵挡住零食区的诱惑。</p></li><li><p class="pv2-part"><b>第三章：结构层——交互设计与信息架构</b> 产品的骨架。交互设计管“用户一步步怎么操作”，信息架构管“内容怎么分类组织”。产出是流程图、网站地图这些看不见、但决定顺不顺的东西。</p><p class="pv2-ex"><i>例</i>宜家的路线是设计好的：你顺着箭头逛完全场，不知不觉买了一堆计划外的东西。用户以为自己在逛，其实每一步都在设计之中。</p></li><li><p class="pv2-part"><b>第四章：框架层——界面、导航、信息设计</b> 单个页面怎么布局：元素放哪儿、导航怎么做、信息怎么排版。先画线框图验证布局，再谈美观。</p><p class="pv2-ex"><i>例</i>像摆家具：沙发对电视、餐桌挨厨房，位置对了住着才顺。App 的搜索框放顶部、主按钮放拇指够得着的地方，一个道理。</p></li><li><p class="pv2-part"><b>第五章：表现层——视觉设计</b> 色彩、字体、图标、风格统一。视觉不只是好看，还要强化品牌、引导视线、传达层级。</p><p class="pv2-ex"><i>例</i>饿了么的蓝、美团的黄，瞟一眼颜色就知道是谁——这就是表现层的品牌识别力。</p></li><li><p class="pv2-part"><b>收尾：要素的应用</b> 框架在不同项目里灵活用：内容型和功能型产品侧重点不同。层与层之间来回迭代，不是一条道走到黑。</p><p class="pv2-ex"><i>例</i>做新闻 App，信息架构是重头戏；做修图 App，交互设计是重头戏。菜谱是参考，炒菜还得看火候。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-23">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.23</span><span>UI/UX 设计</span></p>
  <h3 class="pv2-book-title">《设计心理学》</h3>
  <p class="pv2-meta">The Design of Everyday Things · 唐纳德·诺曼 · 中信出版社 · 1988</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/1288844/" target="_blank" rel="noopener">豆瓣 8.2 分 · 4051人评价 <span>→</span></a></p>
  <p class="pv2-lede">从“门总推错”讲起：用户犯错通常不是人笨，是设计蠢，好设计顺着人的心理来。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>当用户用不好一个产品时，错的不是用户，是设计。诺曼用认知心理学解释人机交互。人靠心智模型猜测产品怎么工作，靠产品给的提示验证。设计要做的，就是填平“执行鸿沟”和“评估鸿沟”。让人知道怎么下手，也知道做成了没。</p><p>1988 年出版时设计界还在比造型，诺曼第一个系统地把认知心理学搬进设计。他开创了“以用户为中心的设计”。那扇分不清推拉的“诺曼门”，成了全世界设计课的开场案例。</p><p>它重新定义了“错误”：用户犯的每一个错，都是设计欠用户的一个解释。防呆设计、可用性测试、以用户为中心的设计流程，全都从这里生根发芽。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 不是你笨，是那扇门有问题（诺曼门）</b> 分不清推拉的门，不是用户观察力差，是设计没把“怎么开”这件事说清楚。不需要说明书、不需要试错的东西，才是好设计。</p><p class="pv2-ex"><i>例</i>双手抱着快递走到玻璃门前，推一下没开，拉一下开了，进去又被第二扇门挡住。装横杆的门只能推、装把手的门只能拉——设计本身就该把答案写好。</p></li><li><p class="pv2-idea"><b>2. 示能：东西要“长得像”它的用法</b> “示能”指东西的外形材质本身就在告诉你它能怎么用：椅子示能坐，按钮示能按。好的示能让用户不用学、不用猜，看一眼就知道怎么下手。</p><p class="pv2-ex"><i>例</i>剪刀的指环明明白白告诉你手指伸哪儿、怎么用力。微波炉上一排一模一样的按钮，每个都示能按。却没一个告诉你按了会发生什么。</p></li><li><p class="pv2-idea"><b>3. 意符：明确告诉用户“这里可以动手”</b> “意符”是“请在这里操作”的明确信号。比如按钮的阴影、链接的下划线、“向右滑动解锁”的箭头。没有意符，用户面对能用的东西也不知道从哪儿下手。</p><p class="pv2-ex"><i>例</i>App 里纯文字“提交”，用户不敢点。加上圆角边框和阴影，立刻有了“按钮感”。电梯开门键上的“◀▶”符号也是意符。</p></li><li><p class="pv2-idea"><b>4. 映射：控制器和效果的对应关系要符合直觉</b> “映射”指控制器和它控制的东西的对应关系。空间排布对应、方向对应：往上推就是开大，往左拨就是选左边，顺着人的直觉来。</p><p class="pv2-ex"><i>例</i>老式燃气灶四个炉头排成方形、四个旋钮排成一排，永远记不住哪个管哪个。把旋钮也排成方形一一对应，看一眼就会。</p></li><li><p class="pv2-idea"><b>5. 心智模型：用户脑子里对“这怎么工作”的猜想</b> 用户永远是靠猜来用产品的：猜对了用得顺，猜错了就犯错。设计师的任务是让产品符合用户已有的猜想，或帮用户建立正确的猜想。</p><p class="pv2-ex"><i>例</i>很多人以为把文件拖进回收站就是彻底删除了，结果只是挪了个地方，硬盘照样满。好的设计顺着用户的心智模型来，不嘲笑它。</p></li><li><p class="pv2-idea"><b>6. 错误分两种：手滑和想错，好设计都要防得住</b> “手滑”是想得对但手没跟上（点错按钮），“想错”是理解就错了（转错人）。手滑靠撤销、确认兜底，想错靠提示和反馈纠正。人一定会犯错，设计要把代价降到最低。</p><p class="pv2-ex"><i>例</i>微信消息两分钟内可撤回，就是给手滑兜底。某些 App“删除聊天记录”一点就没，连确认都没有。这是在惩罚人类的正常失误。</p></li><li><p class="pv2-idea"><b>7. 反馈和约束：做了要吭声，关键处要设限</b> “反馈”是操作后给个回应（声音、震动、动画），让人知道成了没成。“约束”是主动限制错误发生（插不错、跳不过）。反馈管事后安心，约束管事前防呆。</p><p class="pv2-ex"><i>例</i>洗衣机按启动键“滴”一声、亮灯、开始转，三重反馈告诉你“收到”。SIM 卡一角斜切，只能以唯一正确的方向插进去。物理约束让你想犯错都没机会。</p></li></ul>
  <h4 class="pv2-label"><span>全书结构</span></h4>
  <ul class="pv2-parts"><li><p class="pv2-part"><b>第一章：日常用品的“心理病理学”</b> 一堆“坏设计”展览。分不清推拉的门、记不清旋钮管哪个炉头的灶、总按错的电话机。用户受苦，病根在设计。</p><p class="pv2-ex"><i>例</i>读完你会发现生活中处处是“带病上岗”的设计，而你受的那些气，真不是你的错。</p></li><li><p class="pv2-part"><b>第二章：日常行为的心理学——行动的七个阶段</b> 人完成行动要经过七个阶段：定目标、定意图、定动作、执行、感知、解释、评估。好设计填平“执行鸿沟”（不知道怎么下手）和“评估鸿沟”（不知道做成了没）。</p><p class="pv2-ex"><i>例</i>调空调到 26 度：遥控器按钮太多找不到温度键，就是执行鸿沟。按了没任何显示，你不知道设没设上，就是评估鸿沟。</p></li><li><p class="pv2-part"><b>第三章：头脑中的知识与世界上的知识</b> 人做事靠两种知识：记在脑子里的和写在世界上的。好设计尽量把知识放在世界上，别考验用户的记忆力。</p><p class="pv2-ex"><i>例</i>朋友家 8 个电灯开关，你一个个试，这是在逼你瞎猜。旁边贴个小标签“客厅”“阳台”，就不用猜了。</p></li><li><p class="pv2-part"><b>第四章：知道要做什么——约束、可发现性与反馈</b> 让用户“知道该干嘛”的三大法宝：约束、可发现性、反馈。约束限制错误可能，可发现性靠示能和意符，反馈是做了给回应。这是全书最实用的设计工具箱。</p><p class="pv2-ex"><i>例</i>乐高积木凸起和凹槽只有一种拼法，拼错了根本卡不进去。约束的大师：小孩不用教就会玩。</p></li><li><p class="pv2-part"><b>第五章：人为错误？不，是糟糕的设计</b> 系统讲错误：手滑 vs 想错、为什么指责用户没用，以及防错设计的方法。从根上让错误发生不了，或让错误代价足够小。</p><p class="pv2-ex"><i>例</i>药瓶“按压再旋转”瓶盖：小孩打不开，大人一看就懂。软件里删文件前输入文件名确认，高危操作不让你手滑就酿大祸。</p></li><li><p class="pv2-part"><b>第六、七章：设计思维与商业中的设计</b> 从单品设计上升到方法论。以用户为中心的设计流程：观察、想法、原型、测试，不断迭代。以及设计如何在商业组织里落地。</p><p class="pv2-ex"><i>例</i>像做菜：先尝一口（观察用户）、想想缺啥（想法）。小火试做一份（原型）、请人试吃（测试）。不好吃就回炉。</p></li></ul>
</article>
<article class="pv2-book" id="pv2-book-24">
  <p class="pv2-eyebrow"><span class="pv2-no">NO.24</span><span>UI/UX 设计</span></p>
  <h3 class="pv2-book-title">《交互设计精髓》</h3>
  <p class="pv2-meta">About Face: The Essentials of Interaction Design · 艾伦·库珀 · 电子工业出版社 · 2007</p>
  <p class="pv2-rating"><a href="https://book.douban.com/subject/3279105/" target="_blank" rel="noopener">豆瓣 8.7 分 · 1370人评价 <span>→</span></a></p>
  <p class="pv2-lede">交互设计的开山之作：别堆功能，先搞清用户想干成什么事。</p>
  <h4 class="pv2-label"><span>总体观点</span></h4>
  <div class="pv2-thesis"><p>库珀是“交互设计”一词的提出者。他发现：软件按工程师的脑回路长大，用户用起来一头雾水。</p><p>全书核心：目标导向设计。别问用户要什么功能，问他想达成什么目标。功能是手段，目标才是目的。</p><p>人物角色、场景剧本、目标导向——源头都在这本书里。今天产品和交互设计天天用的方法，从这里来。</p></div>
  <h4 class="pv2-label"><span>核心观点 · 7</span></h4>
  <ul class="pv2-ideas"><li><p class="pv2-idea"><b>1. 别问用户要什么功能，问他想达成什么目标</b> 用户说“要个导出按钮”，真实目标可能是“月底交报表”。只给按钮，他还得自己排版；直接给到排好版的报表，问题才算解决。</p><p class="pv2-ex"><i>例</i>打车软件：用户说“我要选车型”。真实目标是“准时赶飞机”。好设计直接告诉你“现在出发，50 分钟到，赶得上”。</p></li><li><p class="pv2-idea"><b>2. 给用户起个名字、编个故事：人物角色</b> 别对着“用户”这种模糊概念设计。虚构几个具体的人——有名字、年龄、习惯和目标。每次决策都问：他会这么用吗？具体的人能让全团队想到一块去。</p><p class="pv2-ex"><i>例</i>给老年人做 App，别想“老年用户”四个字。想“王阿姨，68 岁，眼花，怕点错”。这行小字她看得清吗？这按钮她敢点吗？立刻有画面感。</p></li><li><p class="pv2-idea"><b>3. 软件别按工程师的思路长，要按用户的思路长</b> 工程师心里有“实现模型”，用户脑子里有“心理模型”。难用的软件，错在把前者直接端给用户。好设计是翻译：里面再复杂，端出来的是用户那套说法。</p><p class="pv2-ex"><i>例</i>早期数码相机菜单写“ISO 感光度”，用户想的是“屋里太暗，拍清楚点”。订酒店：系统管“房型编码”，用户只想选“大床还是双床”。</p></li><li><p class="pv2-idea"><b>4. 为“中间用户”设计：新手会长大，专家是少数</b> 用户分三类：新手会长大，专家是少数，大多数人永远“会用但不精通”。别为新手做成幼儿园，也别为专家堆满快捷键。抓住中间用户，两头都照顾得到。</p><p class="pv2-ex"><i>例</i>微信：新手只会发语音，用久了自然学会发红包。开车也一样：同一辆车，是给“会开但不飙车”的大多数人设计的。</p></li><li><p class="pv2-idea"><b>5. 每个应用都有“姿态”：干活的和打扰人的不是一回事</b> 主权姿态的应用独占屏幕、长时间使用，比如 Word，用户要它强大。瞬时姿态的应用弹出来三秒就走，比如闹钟，用户要它别烦人。用错姿态就是灾难。</p><p class="pv2-ex"><i>例</i>闹钟响时只给“关闭 / 稍后”两个大按钮就对了。要是弹窗里还让你选铃声分类、设重复规则，起床气会更大。</p></li><li><p class="pv2-idea"><b>6. 撤销是最好的后悔药：让人敢点，错了能回</b> 用户不敢探索，是怕点错了回不来。强大的撤销能把“万一错了”的焦虑清零，人就敢大胆试。确认框是偷懒设计：把软件该承担的风险转嫁给了用户。</p><p class="pv2-ex"><i>例</i>微信消息两分钟内可撤回，发错群还能抢救，大家才敢随手发。PS 里 Ctrl+Z 一路退回去，你才敢大胆调色。</p></li><li><p class="pv2-idea"><b>7. 别让用户干本该软件干的活</b> 记住单号再粘贴、同一信息填三遍、导文件前先建五个文件夹。这些“附加工作”都是软件懒、让人勤。凡是软件能记住、算出来、自动填的，都不该麻烦用户。</p><p class="pv2-ex"><i>例</i>12306 记住常用乘车人，一点就选好。手机验证码自动填充：系统能读短信，就别让人眼看手输。</p></li></ul>
