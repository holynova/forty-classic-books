<li><p><b>第六章：结论</b> 收尾：模式怎么用、什么时候不用、模式的未来——别把模式当宗教，保持清醒。</p><p class="ex"><i>例</i>秘籍最后一页：武功再高也怕菜刀。模式再好只是工具，解决实际问题才是目的。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-8">
  <div class="card-top"><span class="card-no">NO.08</span><span class="dchip">软件工程</span><a class="card-rating" href="https://book.douban.com/subject/1467587/" target="_blank" rel="noopener">豆瓣 9 · 2302人评价</a></div>
  <h3>《UNIX编程艺术》</h3>
  <p class="meta">The Art of UNIX Programming · 埃里克·雷蒙德 · 电子工业出版社 · 2003</p>
  <p class="lede">讲“怎么写出像 UNIX 那样优雅、耐用、历久弥新软件”的设计哲学书。</p>
  <div class="thesis"><p>埃里克·雷蒙德是开源运动旗手，花五年把贝尔实验室几十年攒下的设计直觉——让 UNIX 从 1969 年活到今天的底层智慧——提炼成 17 条设计规则，加整套工具、社区、文化的论述。</p>
<p>核心论点：好软件不是功能堆出来的，是靠克制做出来的。功能做减法、部件做小、接口做薄，让小程序互相组合干大事。不教某门语言语法，教的是“审美”：什么设计美而耐久，什么丑而腐烂。</p>
<p>它回答永恒问题：技术几年换一茬，什么不变？答案是设计哲学。从 Linux 到开源运动、微服务、DevOps，骨子里都是这本书的东西。读完再看任何代码，都会问一句：这够简洁吗？</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 清晰胜于机巧：代码首先是写给人看的</b> “清晰原则”：代码被读的次数远多于被写的次数。耍小聪明玩晦涩技巧，今天省三行巧妙代码，明天别人花三小时才看懂，血亏。宁可多写几行大白话，别写一行天书。</p><p class="ex"><i>例</i>写菜谱“适量盐、少许糖、火候看着办”，看的人想打人。写“盐 3 克，中火 2 分钟”才靠谱。变量名 tmp、x1 的聪明写法，不如老老实实叫 user_name_list。</p></li>
<li><p><b>2. 小工具加管道，能干大事情（组合原则）</b> UNIX 看家本领：每个程序只做好一件事，用“管道”像乐高一样拼起来。设计时就要考虑拼接——你的程序要能方便地跟别人的连起来干活，别做“瑞士军刀”式巨无霸，迟早没人维护得动。</p><p class="ex"><i>例</i>从日志找访问量 Top10 的 IP：一行命令串起六七个小工具，cat 日志 | 提取 IP | 排序 | 计数 | 取前 10。反观“日志分析平台”，装半天配置一堆，查个 Top10 要点十几个页面。</p></li>
<li><p><b>3. 文本流：最笨但最通用的接口</b> UNIX 坚持用纯文本做程序间交换格式：人能直接看，任何语言都能读写，出问题一眼看出哪错了。二进制、私有格式更“高效”，但只有你的程序能读，调试靠猜，十年后迁移数据只能哭。</p><p class="ex"><i>例</i>两家快递交接：一家用透明塑料袋，里面是啥一眼看清；一家用焊死的铁箱子，只有他家有钥匙，瘪了都不知道碎没碎。配置文件用 YAML/JSON 而不用神秘二进制，就是文本化的胜利。</p></li>
<li><p><b>4. 没事别吭声，错了就大声说（缄默与补救原则）</b> “缄默原则”：没什么可说的就安静干活，别刷屏——正常执行输出一堆“成功！”全是噪音。“补救原则”：一出错立刻退出，把错误说足——错在哪、为什么、怎么修，一次讲清，别让用户猜谜。</p><p class="ex"><i>例</i>靠谱管家：一切正常一声不吭；水管爆了立刻说“厨房接头裂了，已关总闸，师傅电话 XXX”。反面教材：平时弹窗报喜，出错只丢“未知错误（0x0001）”，用户干瞪眼。</p></li>
<li><p><b>5. 先做出能跑的原型，再谈优化</b> “优化原则”：雕琢前先有原型，跑之前先学会走。还没跑通就纠结“快 5%”，90% 的优化都优化在不重要的地方。先写清晰正确的版本，实测找到真瓶颈再动手，且不许破坏清晰度。</p><p class="ex"><i>例</i>装修先保证水电通、墙不漏，住进去发现西晒严重再加遮阳帘。一上来纠结“吊灯欧式还是美式更省电”，房子还没盖好呢——过早优化是万恶之源。</p></li>
<li><p><b>6. 策略和机制分开：做什么和怎么做是两回事</b> “策略”（要什么规则）和“机制”（怎么实现）分开。机制保持中立通用，策略放上层灵活配置。换规则不用改代码，换实现不用改规则。</p><p class="ex"><i>例</i>报销系统“超 5000 要总监审批”是策略，“审批流引擎怎么跑”是机制。5000 做成可配置，财务政策一变改个数字就行；写死在代码里，政策一变就得改代码重新上线。</p></li>
<li><p><b>7. 程序员的时间，比机器的时间贵得多</b> 宁可多花机器一分钱，不花程序员一秒钟。硬件越来越便宜，人的工资越来越贵，凡能用机器资源换程序员时间的买卖都划算。别为省 1MB 内存写出没人敢动的祖传代码。</p><p class="ex"><i>例</i>月薪几万，每周花 3 小时自己拖地“省”200 块保洁费，这账怎么算都亏。用现成库多占 10MB 内存，换来不用造轮子、不用半夜修 bug——吝啬要吝啬复杂度，不是内存。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：背景——哲学、历史与横向对比（第 1-3 章）</b> 先讲 UNIX 哲学 17 条规则是什么，再讲它从贝尔实验室走来的历史，最后跟 Windows、经典 Mac OS 等设计哲学对比。</p><p class="ex"><i>例</i>学做菜先学“菜系”：知道粤菜讲究“鲜”（哲学），了解它怎么从农家菜变大菜系（历史），再跟川菜对比。先有地图再进山，不迷路。</p></li>
<li><p><b>第二部分（上）：设计——模块性、文本化、透明性（第 4-6 章）</b> UNIX 审美最核心的三块基石：程序拆小模块、模块间用文本交换数据、设计让人看懂方便调试。</p><p class="ex"><i>例</i>搭积木三铁律：零件小而标准、统一卡扣连接、拼错一眼看出。三条做到，搭出的东西又稳又好改。</p></li>
<li><p><b>第二部分（中）：设计——多任务、小型语言与生成（第 7-9 章）</b> 进程间怎么协作、什么时候发明“小语言”描述问题、能用程序生成代码就别手写。</p><p class="ex"><i>例</i>正则表达式就是小语言：不用写 50 行代码匹配文本，写一行“规则”就行。像买台面条机，以后想吃面按个按钮。</p></li>
<li><p><b>第二部分（下）：设计——配置、接口、优化与复杂度（第 10-13 章）</b> 配置文件写法、用户界面设计、优化原则，最后收束到终极敌人：复杂度——所有设计努力都是在跟它打仗。</p><p class="ex"><i>例</i>复杂度是软件的熵，只增不减。像家里东西只会越堆越多，能做的就是定期断舍离，别指望它自己变整齐。</p></li>
<li><p><b>第三部分：实现——语言、工具与重用（第 14-16 章）</b> 从哲学落到手艺：选什么语言（C 为什么是 UNIX 母语）、用什么工具、怎么复用轮子不重复造。</p><p class="ex"><i>例</i>借邻居电钻很划算，但为借电钻开车一小时去取，不如自己买一个——重用前先掂量轮子是不是比自己造的还沉。</p></li>
<li><p><b>第四部分：社区——可移植性、文档、开源与未来（第 17-20 章）</b> 软件之外的事：跨平台代码、文档为什么是软件的一部分、开源社区怎么协作、UNIX 哲学的未来。</p><p class="ex"><i>例</i>没文档的软件等于没写完：祖传菜谱只写“看着办”，传到第二代就失传了。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-9">
  <div class="card-top"><span class="card-no">NO.09</span><span class="dchip">软件工程</span><a class="card-rating" href="https://book.douban.com/subject/3227098/" target="_blank" rel="noopener">豆瓣 9.1 · 2222人评价</a></div>
  <h3>《编程珠玑》</h3>
  <p class="meta">Programming Pearls · 乔恩·本特利 · 人民邮电出版社 · 2000（第二版）</p>
  <p class="lede">用真实故事教你“怎么把程序写对、写快、写小”的算法思维书。</p>
  <div class="thesis"><p>乔恩·本特利是贝尔实验室科学家，这本书是他《ACM 通讯》专栏的结集。“珠玑”就是从真实工程问题里打磨出的智慧珍珠——每章从一个真实难题讲起，带你看高手怎么思考。</p>
<p>核心论点：程序设计的功夫，一大半不在“写代码”，在“想清楚”。数据结构选对，难题自己变简单；动手前先估算，一半性能问题提前避开；先写对，再谈写快。全是案例，不讲大道理。</p>
<p>无数程序员的“算法启蒙书”和“面试圣经”。书很薄，每章读完都有“啊哈，原来还能这样”的顿悟。在“加机器加内存”的时代，它提醒你：聪明的设计永远比粗暴堆料更优雅、更便宜。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 位图：换个数据结构，千万级排序so easy</b> 内存只有 1MB，要给 1000 万个电话号码排序。解法是“位图”：用 1000 万个比特位，第 N 位是 1 就表示号码 N 存在。读一遍标记，扫一遍输出，排序完成。问题没变，换个角度，难题消失。</p><p class="ex"><i>例</i>老师点名不用抄 60 个名字再排序，拿座位表，来的人打个勾，按座位念一遍就行。不存“人是谁”，只存“这个位置有没有人”。</p></li>
<li><p><b>2. 动手前，先在信封背面算一算</b> 写代码前先在信封背面估算：数据量、时间、空间。“每天 1 亿请求，一年 365 亿条，一条 100 字节就是 3.6TB”——几秒钟心算，避开“数据比想象大、生产直接爆炸”。数量级对了就行。</p><p class="ex"><i>例</i>请 500 人吃年夜饭：500×200 元=10 万预算，至少 50 桌。先估算再订厅，不会到那天傻眼。五分钟估算，省下五周返工。</p></li>
<li><p><b>3. 先度量，再优化：别猜瓶颈在哪</b> 优化第一原则：先用 profiler 实测找到真瓶颈再动手。人的直觉在性能上经常是错的——你觉得慢的地方可能只占 1%，真吃 90% 时间的地方你压根没想到。不度量就优化，等于闭眼开车。</p><p class="ex"><i>例</i>觉得电费高怪罪空调，装分路电表才发现是阳台十年没关的旧冰柜在偷电。不装电表就换空调，钱花了，电费一分没降。</p></li>
<li><p><b>4. 二分搜索：人人会写，几乎人人写错</b> 思想三岁小孩都懂（每次砍一半），但绝大多数程序员写不出完全正确的二分搜索：边界、中点、循环不变式，差之一错之千里。写前先把“每轮都成立的断言”想清楚，让程序自己证明自己对。</p><p class="ex"><i>例</i>猜数字 1-100，猜 50 说大了，范围变 1-49。到底是 49 还是 50、下次猜 25 还是 24，稀里糊涂。先立规矩：“要找的数永远在 [low, high] 闭区间里”，每轮检查规矩没破，代码不可能错。</p></li>
<li><p><b>5. 数据决定程序结构：先想数据，再想代码</b> 动手写代码前，先把数据的样子想清楚——怎么存、长什么结构，代码结构自然跟出来。先写一堆代码再迁就数据，只会写出别扭的面条代码。好数据结构是好程序的骨架。</p><p class="ex"><i>例</i>整理衣柜：先定“按季节分区、每格一类”，之后找衣服放衣服都顺手。一开始乱塞，之后每次找都得翻箱倒柜，还得贴张“找衣服攻略”。</p></li>
<li><p><b>6. “啊哈！”时刻：退一步，问题可能就化了</b> 很多难题难在盯着正面硬刚；退一步换个角度，难题常变成不值一提的小事。比如数组循环移位：与其一个个元素挪，不如三次翻转搞定。顿悟不是运气，是刻意练习换角度的结果。</p><p class="ex"><i>例</i>拧不开瓶盖别跟瓶盖较劲，瓶子倒过来热水冲一下盖子（热胀冷缩），轻轻一拧就开。问题没变，换个维度出手。</p></li>
<li><p><b>7. 取样问题：水塘抽样，以小见大</b> 文件太大读不完，怎么从 N 个数均匀随机取 k 个？“水塘抽样”：只读一遍，维护 k 个元素的“水塘”，第 i 个数以 k/i 概率决定是否入选。内存永远只用 k 个位置，每个数被选中的概率完全均等。</p><p class="ex"><i>例</i>从长河随机捞 10 条鱼尝咸淡，不可能抽干河。端个小盆站岸边，鱼游来一条按规矩决定换不换，越到后面换的概率越小。一趟下来，每条鱼被选中的机会均等。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：基础——开篇与“啊哈”算法（第 1-2 章）</b> 第 1 章用千万电话号码排序的位图案例开场，第 2 章训练换角度看问题的顿悟能力——思维体操，先活动开脑子。</p><p class="ex"><i>例</i>学武术先练马步：第 1 章见识高手出招，第 2 章学高手心法。招式会忘，心法长身上。</p></li>
<li><p><b>第一部分：基础——数据结构与写对程序（第 3-5 章）</b> 数据决定程序结构、二分搜索怎么写对、从伪代码到 C 程序的落地——正确性是 1，其他都是后面的 0。</p><p class="ex"><i>例</i>本特利在小程序里加十几处断言，同事笑他过度小心，结果断言真抓到 bug。断言是给未来的自己留的“报警器”。</p></li>
<li><p><b>第二部分：性能——分析、估算与算法设计（第 6-8 章）</b> 性能视角（先度量）、粗略估算（信封背后的计算）、算法设计技术——不写代码就能预判性能的内功。</p><p class="ex"><i>例</i>他估算过“把《圣经》存一台机器要多久”，几个数量级心算得出结论。这种“数量级直觉”是高手的分水岭。</p></li>
<li><p><b>第二部分：性能——代码调优与节省空间（第 9-10 章）</b> 代码调优实战（一半急救锦囊一半大手术）、节省空间的巧思——优化是最后手段，但动手时要有一整套工具箱。</p><p class="ex"><i>例</i>调优二分搜索：减少分支、利用局部性，硬是把“已最优”的算法又提速一大截。工程实现上永远有油水可榨。</p></li>
<li><p><b>第三部分：应用——排序、取样与搜索（第 11-13 章）</b> 内功用到具体问题：排序的工程实现、取样问题（水塘抽样）、搜索结构的权衡——每章一个完整实战故事。</p><p class="ex"><i>例</i>他给真实系统写排序：根据数据特点（基本有序？重复多？）定制快速排序变体。算法课教“排序”，这章教“在真实世界里排序”。</p></li>
<li><p><b>第三部分：应用——堆与字符串（第 14-15 章）</b> 堆（顺带实现优先级队列和堆排序）、字符串处理——经典数据结构学透，工作中处处是它的影子。</p><p class="ex"><i>例</i>堆就是“急诊分诊台”：永远先处理最重的病人，新病人按轻重插队。操作系统调度、快递分仓，背后都是堆。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-10">
  <div class="card-top"><span class="card-no">NO.10</span><span class="dchip">软件工程</span><a class="card-rating" href="https://book.douban.com/subject/26819666/" target="_blank" rel="noopener">豆瓣 7.9 · 522人评价</a></div>
  <h3>《领域驱动设计》</h3>
  <p class="meta">Domain-Driven Design: Tackling Complexity in the Heart of Software · 埃里克·埃文斯 · 人民邮电出版社 · 2003</p>
  <p class="lede">在一团乱麻的复杂业务里，用“模型”把业务理清楚、让代码跟上业务的设计方法论。</p>
  <div class="thesis"><p>2003 年，埃里克·埃文斯针对老大难问题：很多企业软件死掉不是技术不行，是业务太复杂——规则盘根错节、需求天天变，代码最后变成谁也看不懂的粥。</p>
<p>核心论点：软件真正的复杂性不在技术，在业务本身；对抗它的唯一武器，是真实反映业务的“领域模型”。模型不能只活在文档里，必须活在代码里、活在团队每天的对话里。战略上划分业务边界（限界上下文），战术上建模（实体、值对象、聚合），团队和业务专家用同一种语言说话（通用语言）。</p>
<p>它预言了未来：十几年后微服务大火，“服务按什么边界拆”最难的问题，答案早在这本书里——按限界上下文拆。今天的中台、微服务、业务架构，骨子里都是 DDD。难啃，但啃下来看业务系统的眼光完全不一样。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 通用语言：全团队说同一种话</b> 业务专家和程序员必须用同一套词汇说话，且这套词汇原样出现在代码里（类名方法名就是业务词汇）。很多项目的病根是“翻译腔”：业务说“客户”，开发写 user，测试叫“用户”——三个人开会各说各的，代码和业务对不上。</p><p class="ex"><i>例</i>一家人装修：你说“玄关”，工头听成“门口那块”，设计师画成“门厅”，鞋柜尺寸全错。统一叫“玄关”指进门 1.5 米区域，图纸合同聊天都这么叫，就不会错。</p></li>
<li><p><b>2. 限界上下文：同一个词，出了这个门意思就变了</b> 任何业务概念只在明确边界内清晰无歧义，出了边界意思就变。“商品”在销售那指“可卖的东西”，在仓储那指“占库位的货”。硬搞“统一商品”模型包打天下，最后一定四不像。承认一词多义，给每个含义划地盘。</p><p class="ex"><i>例</i>“苹果”在水果店指能吃的水果，在手机店指电子产品。你不会要求全世界只用一个意思，业务系统也一样，各自有定义，再谈怎么协作。</p></li>
<li><p><b>3. 实体 vs 值对象：看身份，还是看内容</b> 实体看“身份”：两个人同名同姓也是两个人，靠身份证号区分。值对象看“内容”：两张 100 元钞票编号不同但没人关心。值对象做成不可变（改就是换新的），天然线程安全，代码一下清爽很多。</p><p class="ex"><i>例</i>订单是实体：订单号 2024001 和 2024002 是两个订单，哪怕内容一样。订单里的“收货地址”是值对象：改地址直接换新的，不用追踪“这个地址对象”的身份。</p></li>
<li><p><b>4. 聚合：一次只改一簇，守住一致性边界</b> 一组互相咬合的业务对象，必须作为整体来改，对外只通过“聚合根”说话。银行转账：扣款和入账要么一起成功要么都不，绝不允许只扣不入。聚合就是业务一致性的“保险丝盒”。</p><p class="ex"><i>例</i>订单和订单明细删订单必须连明细一起删。把“转出账户、转入账户、转账记录”圈成聚合，对外只暴露“转账”一个入口，里面怎么折腾都行。</p></li>
<li><p><b>5. 模型就是代码，代码就是模型</b> 领域模型不能是 PPT 里的方框图，必须直接长在代码里：类名就是业务概念，方法就是业务动作，代码读起来像讲业务故事。模型和代码是两张皮，时间一长各说各话，模型就死了。</p><p class="ex"><i>例</i>菜谱写“宫保鸡丁”，端上来也得是宫保鸡丁，不能端盘“不明炒物”说“反正能吃”。代码里有 Order 类带 pay()、cancel() 方法，读代码就知道“这是订单，能付款能取消”。</p></li>
<li><p><b>6. 防腐层：别让烂代码污染你的模型</b> 干净模型必须跟老旧混乱的外部系统对接时，中间加一层翻译，脏东西只脏在这一层，不许渗进模型。没有防腐层，外部系统的怪概念怪字段会慢慢污染代码，最后你的模型也一样烂。</p><p class="ex"><i>例</i>家里装净水器：自来水管可能有杂质，但你喝的水必须干净。净水器装在入户处，脏水只脏到滤芯，绝不进水杯。跟第三方支付、老 ERP 对接时，这一层能救命。</p></li>
<li><p><b>7. 把最好的力气，花在核心域上</b> 业务里不是所有部分都一样重要。核心域（决定竞争力的部分）值得最好的设计师和最多的时间；支撑域和通用域能买就买、能凑合就凑合。在“员工请假审批”上雕花、核心“交易撮合引擎”写得稀烂，是本末倒置。</p><p class="ex"><i>例</i>开餐厅：招牌菜值得请大厨反复打磨；收银系统直接买现成的；考勤用 Excel 就行。把三个月花在自研考勤上，招牌菜让学徒随便炒，这餐厅必倒。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：让领域模型运转起来（第 1-4 章）</b> DDD 世界观：知识消化提炼、团队用通用语言交流、模型和代码绑定、领域逻辑跟技术细节隔离——全书地基。</p><p class="ex"><i>例</i>医院分科室：内科专心看病，不用管挂号系统用的什么软件。分科了，内科换药方不用等挂号系统升级。</p></li>
<li><p><b>第二部分：模型驱动设计的构建块（第 5-7 章）</b> 建模“零件箱”：实体、值对象、领域服务等基本模式，对象生命周期（工厂、仓库），再用完整例子演示怎么拼起来。</p><p class="ex"><i>例</i>前面给砖头水泥，这章带你看精装修好的样板间——一个完整领域模型长什么样，看完就知道零件往哪放。</p></li>
<li><p><b>第三部分（上）：向深层洞察重构——突破与显式化（第 8-9 章）</b> 模型越改越好：第 8 章讲“突破”——看懂业务本质后敢推倒重来；第 9 章把隐性概念变成显性模型元素。好模型是改出来的，不是设计出来的。</p><p class="ex"><i>例</i>整理房间到一半顿悟：“常用就 20 件，其他全是囤积！”推倒重来只留 20 件，还贴上标签。模型重构就是认知升级。</p></li>
<li><p><b>第三部分（下）：柔性设计与模式（第 10-13 章）</b> “柔性设计”让模型意图清晰、副作用小；分析模式和设计模式为领域模型服务。目标：模型不仅要对，还要好改。</p><p class="ex"><i>例</i>微波炉“解冻”键按下去只解冻，不会顺手把饭加热。好的领域方法也一样：调一次只做一件事，不偷偷改别的东西。</p></li>
<li><p><b>第四部分：战略设计——保持完整、蒸馏与大局（第 14-17 章）</b> 从单个模型放大到整个系统：保持模型完整（限界上下文、上下文映射、防腐层）、蒸馏核心域、大局观——微服务的思想源头。</p><p class="ex"><i>例</i>画小区地图：A 栋（销售）和 B 栋（仓储）之间几条路、谁给谁送东西全标清。地图画好，微服务拆分照图施工，不会拆出“跨栋上厕所”的笑话。</p></li>
    </ul>
  </details>
</article>
</div>
</section>
<section class="domain" id="pv3-d-system">
<div class="domain-head"><p class="eyebrow">第贰辑</p><h2>系统设计</h2><span class="count">10 本</span></div>
<p class="domain-intro">系统设计就是研究“当用户从100变成1个亿，系统要怎么搭才不崩”的学问——管的是架构、扩展性和稳定性。</p>
<div class="cards">

<article class="card" id="pv3-book-11">
  <div class="card-top"><span class="card-no">NO.11</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/30329536/" target="_blank" rel="noopener">豆瓣 9.6 · 1943人评价</a></div>
  <h3>《数据密集型应用系统设计》</h3>
  <p class="meta">Designing Data-Intensive Applications · 马丁·克雷普曼 · 中国电力出版社 · 2017</p>
  <p class="lede">数据系统的内功心法：数据库、缓存、消息队列看似五花八门。底层都在回答同一个问题——数据怎么存、怎么传、怎么算。</p>
  <div class="thesis"><p>所有数据系统，底层都在做三件事：存数据、传数据、算数据。数据库、缓存、消息队列只是这三件事的不同解法。</p>
<p>它的贡献是给了行业一套通用语言：可靠性、可扩展性、可维护性三个判分标准。外加复制、分区、一致性这些概念的统一梳理。从此选型讨论有了共同词汇。</p>
<p>核心认知：没有最好的技术，只有取舍。要一致性，就得牺牲速度或可用性；要灵活，就得接受复杂度。</p></div>
  <details class="fold">
    <summary>核心观点 · 8<span class="chev">›</span></summary>
    <ul><li><p><b>1. 好系统有三个标准：别宕机、能长大、好维护</b> 评价数据系统，看三件事。可靠性（出故障还能不能干活）、可扩展性（量涨上去跟不跟得上）、可维护性（换人接手费不费劲）。很多系统不是被流量压垮的，是被自己养出的复杂度拖垮的。</p><p class="ex"><i>例</i>大促流量涨50倍：可靠性差，支付一抖订单就丢；可扩展性差，加机器也扛不住。可维护性差，加个“满减”功能改三天不敢上线。选型前，先拿这三条量一量。</p></li>
<li><p><b>2. 没有银弹：一个数据库搞不定所有事</b> 不存在全场景最优的数据库。关系型擅长事务，搜索引擎擅长全文检索，缓存擅长扛读压力。正确姿势是组合拳：每种工具干最擅长的事，再用数据流串起来。</p><p class="ex"><i>例</i>内容平台也一样：用户放MySQL，搜索用Elasticsearch，热点放Redis，日志扔进Kafka。各司其职才顺手。</p></li>
<li><p><b>3. 数据模型选错了，后面全是坑</b> 数据模型就是“数据怎么组织”：关系型用表，文档型用JSON，图用节点和边。表严谨但难改，文档灵活但关联查询费劲，图表达关系无敌。选型看数据天生的形状。</p><p class="ex"><i>例</i>“A的朋友的朋友”这种查询，图数据库一句话搞定，关系型得写好几层JOIN，数据量一大就慢。反过来，规矩的订单明细用表最自然。先看清数据的长相，再挑模型。</p></li>
<li><p><b>4. LSM树和B树：一个擅写，一个擅读</b> 数据在磁盘上怎么摆，决定了读快还是写快。B树像整理好的字典，读快、写要原地改；LSM树像记流水账，写只管追加、飞快，读时再合并。日志类爱用LSM，传统业务爱用B树。</p><p class="ex"><i>例</i>记家庭账本：B树派每笔工整记到分类页，查得快、记得慢。LSM树派来一笔往最后随手一记，记得飞快、月底再归拢。朋友圈点赞适合后者，银行查余额适合前者。</p></li>
<li><p><b>5. CAP：网络一分区，一致性和可用性只能保一个</b> CAP是分布式的不可能三角：一致性（看到的数据一样）、可用性（每个请求有回应）、分区容忍性（断网还能跑）。平时可兼得，但网络分区时必须二选一。</p><p class="ex"><i>例</i>两地机房专线抖了一下：保一致，用户转圈等；保可用，杭州先收单、等网络好了再同步，但北京暂时查不到。没有对错，看业务更怕“下不了单”还是“数据对不上”。</p></li>
<li><p><b>6. 一致性是有档位的，越强越贵</b> 一致性不是有或没有，而是一档档的旋钮：从最终一致（早晚会一样）到线性一致（所有人看到的都一样）。档位越高，延迟越高、可用性越低。给每个业务选刚好够用的那档。</p><p class="ex"><i>例</i>微博点赞晚几秒更新没人投诉，用最终一致就行；银行转账绝不能出现“钱扣了、没到账”的中间态，必须强一致。别为点赞数花转账的钱。</p></li>
<li><p><b>7. ACID之外，还有一堆弱隔离的暗礁</b> 很多数据库默认用的不是严格可串行化，而是弱隔离级别（读已提交、快照隔离等）。各有各的坑：脏读、丢失更新、写偏斜。选型前先搞清自己在用什么、在冒什么险。</p><p class="ex"><i>例</i>两个运营同时改库存：都看到10件，A改成20，B改成15，先后提交后变成15，A的修改悄悄丢了。这就是“丢失更新”。卖演唱会门票时，多卖的票就得退票道歉。</p></li>
<li><p><b>8. 批处理和流处理：一桶一桶算，还是像水一样流</b> 批处理是攒够一堆再算（每天凌晨算报表），流处理是来一条算一条（实时风控）。Lambda架构是两套一起跑、互相校对；Kappa只用流处理，一套搞定。</p><p class="ex"><i>例</i>直播热度榜：批处理每小时汇总一次，榜单每小时变；流处理每条打赏都更新分数，榜单秒级跳动。大厂常用Lambda架构：流处理出实时榜，批处理每天校对一次，又快又准。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分 · 立规矩（第1章）：可靠性、可扩展性、可维护性</b> 全书的“判分标准”：好系统要出故障不宕机、规模涨了跟得上、换人接手不费劲。后面所有技术讨论都要回到这三条来打分。</p><p class="ex"><i>例</i>买车先定标准：安全、能拉货、好维修；之后每讲一个新技术，都回头问它对这三条是加分还是减分。</p></li>
<li><p><b>第一部分 · 数据长什么样（第2章）：数据模型与查询语言</b> 对比关系型、文档型、图等数据模型和查询语言：没有最好的模型，只有最合身的，看你的数据天生是什么形状。</p><p class="ex"><i>例</i>选数据库之前先看数据的“长相”：社交关系天生是网状，用图；订单明细天生是表格，用关系型。模型选对，查询语句短一半，性能快十倍。</p></li>
<li><p><b>第一部分 · 数据怎么存（第3章）：存储与检索</b> 讲数据库在磁盘上怎么摆数据：B树和LSM树两大家族，一个擅读、一个擅写，选型前先搞懂它们的脾气。</p><p class="ex"><i>例</i>看到“用了LSM存储引擎”，立刻知道它适合写多读少的场景；看到B树，就知道它偏向读多。</p></li>
<li><p><b>第一部分 · 数据怎么打包（第4章）：编码与演化</b> 数据在系统间传递要先“打包”（序列化）：讲各种编码格式，以及数据格式变了之后，怎么让新老版本互相认得。</p><p class="ex"><i>例</i>App升级后，老版本发来的数据新版本还认不认？Avro、Protobuf这类工具解决的就是向前向后兼容。让新老版本和平共处。</p></li>
<li><p><b>第二部分 · 从一台到多台（第5-6章）：复制与分区</b> 单机装不下时怎么办：复制是把数据多存几份，防丢、分担读压力；分区是把数据切开分到多台机器。两者是横向扩展的两板斧。</p><p class="ex"><i>例</i>一个图书馆变成连锁：每家店都进同样的热门书（复制，防某家店失火）。书太多一家放不下，就分类存放、每家只存一部分（分区）。复制管“别丢”，分区管“装下”。</p></li>
<li><p><b>第二部分 · 多台机器的麻烦事（第7-9章）：事务、分布式系统的坑、一致性与共识</b> 全书最烧脑：弱隔离的各种异常、时钟网络的坑、CAP取舍，以及机器怎么投票达成一致（共识算法）。</p><p class="ex"><i>例</i>把分布式所有灵魂拷问摆上台面：CAP、线性一致、共识算法，每个选择都标好代价。</p></li>
<li><p><b>第三部分 · 数据的二次加工（第10-11章）：批处理与流处理</b> 原始数据之外还要派生报表、索引、推荐：批处理攒够了算，流处理来一条算一条，各有各的用武之地。</p><p class="ex"><i>例</i>凌晨的销售报表和刷卡时的实时风控，是同一份数据的两种算饭。Lambda、Kappa两种架构，外加“只记操作不记状态”的事件溯源。</p></li>
<li><p><b>尾声（第12章）：把一切拼起来，兼谈未来</b> 收束全书：把前面所有概念拼成构建可靠、可扩展、可维护应用的方法。并展望未来，连数据隐私伦理也聊了聊。</p><p class="ex"><i>例</i>学完零件看整车组装：复制、分区、一致性、批流处理拼在一起。聊怎么搭出面向未来的数据系统，顺带谈数据伦理。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-12">
  <div class="card-top"><span class="card-no">NO.12</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/30333919/" target="_blank" rel="noopener">豆瓣 8.7 · 988人评价</a></div>
  <h3>《架构整洁之道》</h3>
  <p class="meta">Clean Architecture · 罗伯特·C·马丁 · 电子工业出版社（博文视点） · 2017</p>
  <p class="lede">好架构跟用什么框架、数据库没关系。关键是把“做什么生意”的代码和“用什么技术”的代码分开，让生意逻辑不被技术细节绑架。</p>
  <div class="thesis"><p>框架换了一茬又一茬，架构的好坏规则几十年没变过。这本书一次讲清这些不变的规则。</p>
<p>架构的终极目标：用最小的人力成本满足构建和维护系统的需求。软件有“行为价值”（能干活）和“架构价值”（好改），后者才是软件之所以“软”的原因。整洁架构用依赖规则把“做什么生意”和“用什么技术”彻底分开。</p>
<p>它给出了从编程范式、SOLID、组件原则到整洁架构的完整链条。六边形架构、洋葱架构、DDD分层，都是这套思想的不同讲法。</p></div>
  <details class="fold">
    <summary>核心观点 · 8<span class="chev">›</span></summary>
    <ul><li><p><b>1. 依赖规则：内圈的代码，永远不许知道外圈的存在</b> 全书最重要的铁律：依赖只能由外向内。内圈是业务规则（“买满200减20”），外圈是数据库、界面、框架。内圈定义接口、外圈实现，内圈绝不直接调用外圈的具体东西。换数据库、换框架，生意逻辑一行不用改。</p><p class="ex"><i>例</i>餐馆的核心是菜谱（内圈），用煤气还是电磁炉（外圈）不该影响它。菜谱里只写“加热”，不写“开煤气阀门”；换电磁炉，菜谱不用改一个字。</p></li>
<li><p><b>2. 同心圆：一个系统就四层，各就各位</b> 四个同心圆：最里实体（订单、折扣规则），往外是用例（下单、退款）。再往外是接口适配器（控制器、网关），最外是框架和驱动。越往里越稳定、越不常变。</p><p class="ex"><i>例</i>打车软件：实体是“行程”“计价规则”，用例是“下单”“接单”。适配器把App请求转成用例，最外层是MySQL、Spring。换库只动最外层，改计价只动实体。</p></li>
<li><p><b>3. SOLID：五个让代码好改的原则</b> 五个原则：单一职责（一个类只干一件事）、开闭（加功能靠扩展不改旧代码）、里氏替换（子类能顶替父类）。接口隔离（别逼实现用不上的接口）、依赖反转（依赖抽象不依赖具体）。全书都用这套尺子量代码。</p><p class="ex"><i>例</i>“订单类”既算价格又发短信还写库，改短信模板可能搞坏算价，拆成三个类各干各的。下单逻辑不调“支付宝SDK”而调“支付接口”，换渠道时下单逻辑不动。</p></li>
<li><p><b>4. 软件有两种价值：“能跑”和“好改”，后者更重要</b> 行为价值是“能干活”（下单成功），架构价值是“好改”（下周加新玩法不费劲）。老板只看得见前者，但“能跑改不动”的系统加个小功能要三周。架构师的天职是守护架构价值，让软件一直“软”下去。</p><p class="ex"><i>例</i>两个外卖系统都能下单：A加“拼团”要改20个文件、回归一周；B边界清晰，加个用例类两天上线。A团队每加一个功能慢一点，一年后基本不敢动代码——这就是架构价值被透支。</p></li>
<li><p><b>5. 编程范式不是给你“更多能力”，而是给你“立规矩”</b> 结构化拿走了goto（不许乱跳），面向对象拿走了函数指针乱指（必须走多态）。函数式拿走了可变变量（状态不能随便改）。每种范式都是少点自由、多份纪律，换来代码更好推理、更少怪bug。</p><p class="ex"><i>例</i>红绿灯限制了“随时走”的自由，换来路口不撞车。函数式不让变量随便改，“下单金额”定下来就没人能半路篡改，并发bug少一大半。限制让大规模协作成为可能。</p></li>
<li><p><b>6. 组件怎么分：聚什么、拆什么，都有讲究</b> 六条原则：三个管“哪些类放一起”（一起变的放一起），三个管“组件间怎么依赖”（依赖指向更稳定的方向）。别让底层牵着高层走。微服务拆成“分布式单体”，病根多半在这里。</p><p class="ex"><i>例</i>“用户中心”和“订单中心”拆成两个服务，改个手机号订单服务也得发版——该放一起的被拆开了。反过来，天天变的“短信发送”和稳定的“计价规则”绑一起，改短信总要重测计价。边界画错比不拆还难受。</p></li>
<li><p><b>7. 画出边界，把难做的决定往后推</b> MySQL还是Mongo？Spring还是Django？都是“细节”。好架构让你晚做决定、随时反悔：业务核心和技术细节之间画边界、中间用接口隔开。业务代码只认接口，上线时再把具体实现“插”进来。</p><p class="ex"><i>例</i>“下单用例”只依赖“订单仓库接口”，先用MySQL顶着。用户量爆了，重写一个实现类插上去，用例代码一行不改。</p></li>
<li><p><b>8. 好架构的四个试金石：可测试、能并行开发、能独立部署、技术可换</b> 四个检验标准：业务逻辑能否脱离数据库界面单独测试；多团队能否各干各的不打架；组件能否单独上线；换框架数据库要不要伤筋动骨。全满足就是干净的，有一个不行就是边界没画对。</p><p class="ex"><i>例</i>装修：水电走完后换灯具品牌不该砸墙；木工油漆工能同时进场不打架；卫生间可单独验收。拿这四条一套，立刻知道架构合不合格。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分 · 概述（第1-2章）：设计与架构究竟是什么</b> 软件架构的终极目标：用最小的人力成本满足构建和维护系统的需求。软件有“行为价值”和“架构价值”，后者更重要。</p><p class="ex"><i>例</i>架构师不是画图的，是让系统一直“好改”的：外部质量（能跑）和内部质量（好改）要兼顾，天职是守护后者。</p></li>
<li><p><b>第二部分 · 从基础开始：编程范式（第3-6章）</b> 从三种编程范式讲起：范式的本质是对程序员能力的“限制”，限制换来代码更可控、更好推理。</p><p class="ex"><i>例</i>三种范式其实是三条“纪律”：不许乱跳（结构化）、必须走多态（面向对象）、状态不能随便改（函数式）。理解它们，才能理解后面的设计原则是从哪长出来的。</p></li>
<li><p><b>第三部分 · 设计原则（第7-11章）：SOLID</b> 逐个讲透SOLID五个设计原则，这是全书后面所有判断的依据：代码和架构好不好，拿这五个原则去量。</p><p class="ex"><i>例</i>全书的“尺子”：单一职责、开闭、里氏替换、接口隔离、依赖反转。后面量组件、量架构，用的都是这套标准。</p></li>
<li><p><b>第四部分 · 组件构建原则（第12-14章）</b> 组件是什么、哪些类该放在一起、组件之间该怎么依赖：六条组件原则，管“聚”也管“拆”。</p><p class="ex"><i>例</i>从“类”放大到“组件”：学怎么打包、怎么划边界。微服务拆分、模块划分的问题，答案基本都在这三章里。</p></li>
<li><p><b>第五部分 · 架构（第15-28章）：整洁架构登场</b> 正式定义整洁架构：四层同心圆、依赖规则、如何划分边界、怎么用设计模式跨越边界。并用完整实战案例把内容串起来。</p><p class="ex"><i>例</i>全书高潮：正式提出整洁架构——同心圆、依赖规则、边界划分、设计模式。还拿一个视频销售网站当案例，从头到尾搭一遍给你看。</p></li>
<li><p><b>第六部分 · 实现细节（第29-33章）</b> 讲具体技术的安放位置：数据库、Web界面、框架都是细节，应该被隔离在最外层，随时可换；附带整洁的嵌入式架构实践。</p><p class="ex"><i>例</i>数据库、Web、框架都是可替换的“细节”：具体技术“插”进架构而不污染业务核心。连嵌入式这种硬骨头也讲了怎么保持整洁。</p></li>
<li><p><b>附录：几十年从业经历的印证</b> 作者用自己数十年的软件从业经历，再次印证书中的观点：架构的规则几十年来没变过，变的只是技术的外衣。</p><p class="ex"><i>例</i>Bob大叔从1964年写到现在：这些规则不是纸上谈兵，是几十年一次次验证过的经验。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-13">
  <div class="card-top"><span class="card-no">NO.13</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/26772677/" target="_blank" rel="noopener">豆瓣 8.1 · 978人评价</a></div>
  <h3>《微服务设计》</h3>
  <p class="meta">Building Microservices · 桑·纽曼 · 人民邮电出版社 · 2015</p>
  <p class="lede">把大系统拆成小而独立的服务，各自独立开发上线：什么时候该拆、怎么拆、拆完怎么管，微服务领域的开山之作。</p>
  <div class="thesis"><p>人人喊拆服务，但很多人拆完更痛苦：部署复杂、排查困难，一个请求串过十几个服务，出问题都不知道找谁。</p>
<p>微服务不是目的，是手段：把系统按业务边界切成能独立演进的小块，小步快跑、独立试错。但它有代价——分布式复杂度、运维成本、一致性难题一个都躲不掉。小团队、业务没想清楚、没自动化运维能力，单体可能是更好的选择。</p>
<p>它把“微服务”从时髦口号变成有章可循的工程实践：业务建模、独立部署、为失败而设计、可观察性。这些至今仍是云原生时代的常识。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 先按业务拆，不按技术拆（康威定律）</b> 拆服务按“下单、支付、库存”这样的业务能力，不按“前端队、后端队”分。康威定律：系统架构会复制组织沟通结构。反过来用：想让系统长成什么样，就先把团队按那个样子组织起来。</p><p class="ex"><i>例</i>开餐厅别按“切菜组、炒菜组”分，按“川菜档、粤菜档”分，每个档口从点菜到上菜一条龙。促销和订单拆成两个服务后，促销团队双十一前一周还能独立上线新玩法，不用排队等排期。</p></li>
<li><p><b>2. 服务必须能独立部署，否则白拆</b> “微”不在代码量小，而在改一行代码只上线这一个服务，不用全站陪绑。改A必须连B、C一起上线，那就是“分布式单体”：享受了分布式的痛苦，没得到微服务的好处。</p><p class="ex"><i>例</i>用户中心独立成服务后，头像功能一周上三个版本，订单系统一次没重启——这就是独立部署的价值。</p></li>
<li><p><b>3. 数据也要分家，别共用一个数据库</b> 两个服务连同一个库，改表结构就得一起改、一起上线——拆了个寂寞。每个服务管自己的数据，别人走接口来要。跨服务一致性用“最终一致”（发消息异步同步）解决，不靠数据库事务。</p><p class="ex"><i>例</i>订单和库存共用一张表，库存加个字段，订单的SQL全挂了。最后花两个月才把库拆开，代价比一开始就拆大得多。</p></li>
<li><p><b>4. 为失败而设计：服务一定会挂</b> 保命四招：超时（别无限等）、熔断器（对方挂了别再敲门）。舱壁（一个服务hang死别拖死线程池）、重试加退避。</p><p class="ex"><i>例</i>家里一个房间短路，空开只断这一间，不会整栋停电。支付网关给银行接口加熔断，银行宕机时几十秒自动切备用通道，用户只觉得“慢了一点”，而不是全站报错。</p></li>
<li><p><b>5. 智能端点、哑管道：服务之间通信尽量简单</b> 别搞中央总线（ESB）那种“聪明的管道”：逻辑全塞总线，一升级全站陪葬。用简单的REST或消息队列传数据（哑管道），业务逻辑留在服务自己手里（智能端点）。管道越傻，系统越灵活。</p><p class="ex"><i>例</i>小区快递柜：快递员只管放件（哑管道），取件码、身份验证都在App里（智能端点）。要是每个快递员都得去物业大厅登记审批，双十一那天大厅直接被堵死。</p></li>
<li><p><b>6. 先单体，痛了再拆：架构是演进出来的</b> 新项目别一上来就微服务：业务没跑通，边界在哪都不知道，拆错比不拆还贵。先写单体，等哪个模块“改不动、一改全回归”了再拆出去。好边界是长出来的，不是画出来的。</p><p class="ex"><i>例</i>装修先住进去，知道哪面墙碍事再砸，而不是毛坯就按五年后的家庭结构砌墙。某创业公司单体三个月上线，跑一年后才把“拼团”拆成独立服务——那时才真正搞清边界在哪。</p></li>
<li><p><b>7. 看不见就管不了：可观察性是必修课</b> 微服务里一个请求串过十几个服务，日志散在十几台机器上。三件套缺一不可：日志聚合、关联ID（一个请求一个编号、全链路追踪）、监控告警。不然线上出问题只能靠猜。</p><p class="ex"><i>例</i>给每个请求打上TraceID：一次“下单偶发超时”，十分钟定位到优惠券服务的慢SQL。以前得人肉对十几个服务的日志，至少半天。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：微服务到底是什么</b> 给微服务下定义：小、自治、围绕业务建模、独立部署。讲清楚它解决什么问题，又会带来哪些新代价，先泼一盆冷水。</p><p class="ex"><i>例</i>买车先看缺点：保养贵、油耗高，知道了再决定买不买。开篇先讲微服务的代价，免得你只看到好处一头扎进去。</p></li>
<li><p><b>第二部分：架构师的角色与建模</b> 讲“演进式架构师”：架构师不是画图纸的，而是定原则、划边界、保证大家不跑偏的。建模要用领域驱动设计的有界上下文来找服务的边界。</p><p class="ex"><i>例</i>就像城市规划师：不规定每栋楼盖几层，但划定商业区、住宅区，定下消防和间距红线。边界内各家自由发挥，城市整体不乱。</p></li>
<li><p><b>第三部分：怎么拆：从单体到微服务</b> 给单体“动手术”的几种拆法：按业务能力拆、绞杀者模式（新老并行、逐步替换）、按分支抽象逐步剥离。</p><p class="ex"><i>例</i>绞杀者模式像给老房子加装电梯：不拆楼，旁边盖新的，一层层搬功能过去，最后老楼只剩空壳。用户全程无感知，风险一次只冒一点。</p></li>
<li><p><b>第四部分：拆完怎么连：集成与数据</b> 服务间通信怎么选（REST、RPC、消息队列），以及最难的数据分家。从共享库到各管各的，数据同步和一致性怎么处理。</p><p class="ex"><i>例</i>离婚分财产：房子车子一人一套容易，最难的是共同账户的钱怎么分、以后孩子的学费怎么给。数据分家也一样：接口好定，一致性难搞。</p></li>
<li><p><b>第五部分：部署、测试、监控与安全</b> 每个服务独立流水线、容器化部署；分布式系统的测试策略（契约测试）；监控三件套；服务间认证与纵深防御。</p><p class="ex"><i>例</i>连锁餐厅：分店独立装修开业（独立部署），总部神秘顾客抽查（契约测试）。装摄像头看后厨（监控），进后厨刷卡（安全）。缺一样，开到第十家店就乱套。</p></li>
<li><p><b>第六部分：组织与规模化</b> 康威定律与团队组织：按服务组建全功能小团队。服务多到几十上百个之后：版本治理、服务发现、弹性伸缩。</p><p class="ex"><i>例</i>就像乐队：三个人时怎么排都行，变成交响乐团就得有声部、有指挥、有总谱。服务少时靠自觉，服务多了就得靠平台和规范。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-14">
  <div class="card-top"><span class="card-no">NO.14</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/1230559/" target="_blank" rel="noopener">豆瓣 8.7 · 414人评价</a></div>
  <h3>《企业应用架构模式》</h3>
  <p class="meta">Patterns of Enterprise Application Architecture · 马丁·福勒 · 机械工业出版社 · 2002</p>
  <p class="lede">OA、ERP、电商后台这类企业软件怎么写才不乱？前人踩过的坑提炼成“模式词汇表”，架构师案头的词典。</p>
  <div class="thesis"><p>企业应用翻来覆去就是那几类问题：业务逻辑放哪、对象怎么存进数据库、网页怎么分层。人人重复发明轮子、重复踩坑。福勒把业界验证过的解法整理成50多个模式，写成这本“模式词典”。</p>
<p>核心论点：架构设计不是玄学，是有据可查的“模式语言”。业务逻辑三种放法各有利弊，选错后期改不动；对象和关系数据库的“阻抗失衡”，用数据映射器、工作单元弥合。选模式就是做权衡，没有银弹。</p>
<p>它第一次系统回答了“企业应用怎么分层、怎么组织代码”。分层、领域模型、数据映射器、MVC成了之后二十年主流框架的底座——你天天用的很多概念都来自它。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 业务逻辑三种放法：事务脚本、表模块、领域模型</b> 事务脚本：一个请求写一个过程，简单直接，适合小系统。表模块：按表组织、一个表配一个类，适合中等复杂度。领域模型：按业务概念建模，“订单”是有行为的对象，适合复杂业务。复杂度越高越往领域模型走；小项目硬上就是大炮打蚊子。</p><p class="ex"><i>例</i>个人记账用流水账本（事务脚本）就行，小公司按科目设账（表模块），上市公司得有完整会计体系（领域模型）。报销小工具用事务脚本两周上线；核心交易系统用领域模型，三年后加新业务不用推倒重来。</p></li>
<li><p><b>2. 分层：表现层、领域层、数据源层各干各的</b> 三层：页面只管展示，业务规则放中间层，数据库访问放底层。上层调下层，不许反过来。换数据库、换前端都不动业务逻辑，测试也能一层层测。这是全书的地基。</p><p class="ex"><i>例</i>餐厅：服务员只管点菜上菜，厨师只管做菜，采购只管进货。换收银系统不用重训厨师，换供应商不用重印菜单，各层独立变化、互不牵连。</p></li>
<li><p><b>3. 对象和数据库天生不对付，得请个“翻译”（数据映射器）</b> 面向对象讲“对象套对象”，关系数据库讲“表和外键”，硬凑就是又臭又长的SQL拼接。数据映射器是个专职翻译：对象只管业务，翻译负责存进表、捞出来拼回对象。Hibernate、MyBatis本质上就是干这个的。</p><p class="ex"><i>例</i>中外合资谈判得配翻译：中方说中文（对象），外方说英文（SQL）。没翻译，双方只能互相学对方语言，最后两边都说不利索——代码里SQL和业务逻辑搅成一锅粥，谁也改不动。</p></li>
<li><p><b>4. 工作单元：一次业务操作，要么全存，要么全不存</b> 下单要写订单表、扣库存、记流水，中间崩了怎么办？工作单元是个“记账本”：改动先记下来，最后统一提交。失败整体回滚，数据不会一半一半，还把多次数据库交互合并成一次。</p><p class="ex"><i>例</i>银行转账：扣A的钱和给B加钱必须同时成功，绝不能只扣不加。工作单元就是“同时”的保证人：要么两边一起变，要么当没发生过。</p></li>
<li><p><b>5. 延迟加载：用到了再去查</b> 查订单顺带把1000条明细全查出来？太浪费。延迟加载：先查个壳，用到明细时再去拿。省内存省查询，但用不好会变成“查一次触发1000次小查询”（N+1问题），省的全吐回去还倒贴。</p><p class="ex"><i>例</i>看电子书：先加载目录，点进哪章才加载正文。打开书就把500页全下载，流量直接爆炸；但每翻一页都重新下载，还不如一开始全下完。分寸要拿捏好。</p></li>
<li><p><b>6. 服务层：给业务逻辑开个统一的“前台”</b> 网页、App、第三方都要调“下单”，不能各调各的。服务层在领域逻辑外包一层统一入口：校验参数、调领域逻辑、记日志、管事务，套路收拢到一起。对外只有一个门，里面再复杂也不怕。</p><p class="ex"><i>例</i>公司前台：访客、快递、外卖先登记再分发，不让人直接闯进办公室找人。前台顺手做访客登记（日志）和身份核验（校验）。</p></li>
<li><p><b>7. 模式是词汇，不是教条</b> 模式是“准确讨论设计”的共同语言，不是“必须这么写”的圣经。开会说“这里用个数据映射器”，团队立刻懂你在解决什么、付出什么代价。但生搬硬套和不用一样糟——脱离上下文谈模式就是耍流氓。</p><p class="ex"><i>例</i>“爆炒”“清蒸”是词汇，告诉你火候手法的区别；放多少盐还得看今天的菜。评审时说“这块事务脚本就够了，别上领域模型”，一句话大家就懂——模式语言让讨论变精确。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：概述——先搭脚手架</b> 全书的地图：企业应用长什么样、为什么分层、领域逻辑怎么组织。对象和关系数据库的矛盾、Web层怎么分、并发会话怎么处理。</p><p class="ex"><i>例</i>学做菜先学“煎炒烹炸”基本功，再学具体菜式。这部分不讲招式，先让你知道厨房里有哪些家伙事儿、分别解决什么问题。</p></li>
<li><p><b>第二部分：领域逻辑模式——业务代码写在哪</b> 全书最核心的一章：事务脚本、表模块、领域模型、服务层四种模式，讲清各自适用场景和代价。这是每个架构师都绕不开的选择题。</p><p class="ex"><i>例</i>就像装修先定风格：极简风、轻奢风、工业风没有绝对好坏，只有适不适合你的户型和预算。选错风格，后面全是返工——选错领域逻辑模式也一样。</p></li>
<li><p><b>第三部分：数据源模式——对象怎么跟数据库打交道</b> 表数据入口、行数据入口、活动记录、数据映射器：从“SQL写在代码里”到“专职翻译层”。复杂度递增、能力也递增。</p><p class="ex"><i>例</i>出国沟通四个段位：比划手势（表数据入口）、背日常用语（行数据入口）。请导游（活动记录）、雇专职翻译（数据映射器）。走得越远，越需要专业翻译。</p></li>
<li><p><b>第四部分：对象-关系的行为、结构与元数据模式</b> 把“翻译”做细：工作单元、标识映射、延迟加载、值对象、继承映射。处理缓存、加载时机、类继承存进表这些脏活。</p><p class="ex"><i>例</i>翻译公司内部分工：有人管术语库（元数据映射），有人定哪些文件先翻（延迟加载），有人校对去重（标识映射）。都是让翻译又快又准的配套手艺。</p></li>
<li><p><b>第五部分：Web 表示与分布模式</b> 网页层的分工：MVC、前端控制器、页面控制器、模板视图——谁收请求、谁选页面、谁拼HTML。以及拆到多台机器上的分布模式。</p><p class="ex"><i>例</i>就像话剧后台分工：有人管报幕（前端控制器）、有人管换景（页面控制器）、有人管念台词（视图）。观众只看到一台戏，背后是一套分工。</p></li>
<li><p><b>第六部分：并发、会话与基本模式</b> 多人同时改一条数据怎么办（乐观锁、悲观锁）、用户登录状态放哪（会话状态模式）。以及全书用到的最基础的小模式。</p><p class="ex"><i>例</i>乐观锁像共享文档协作：大家先改着，保存时发现冲突再合并，而不是一开始就锁死不让别人碰。冲突大概率不会发生，别为小概率事件付出大代价。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-15">
  <div class="card-top"><span class="card-no">NO.15</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/26875239/" target="_blank" rel="noopener">豆瓣 8.9 · 646人评价</a></div>
  <h3>《SRE：Google运维解密》</h3>
  <p class="meta">Site Reliability Engineering: How Google Runs Production Systems · Google SRE 团队 · 电子工业出版社 · 2016</p>
  <p class="lede">Google运维团队的心法全公开：怎么让系统又稳又能快速迭代。运维不是救火，是工程。</p>
  <div class="thesis"><p>在Google，运维不叫Ops，叫SRE（站点可靠性工程师）。招会写代码的人，用软件工程的方法解决运维问题。这本书第一次系统公开了Google怎么保证搜索、Gmail不宕机。</p>
<p>核心论点两条：第一，可靠性是个“度”，不是越高越好。“错误预算”把稳定和迭代的矛盾变成算术题：用户要的是“足够可靠加持续变好”。第二，重复的手工活（toil）必须消灭。SRE至少一半时间写自动化，否则团队被救火淹没，规模越大死得越快。</p>
<p>它定义了一个新工种。今天大厂招SRE、谈SLO、做不甩锅的复盘、搞on-call轮值，源头都在这本书。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 错误预算：允许系统“合法地”出点小问题</b> SLO“99.9%的请求200ms内成功”，剩下0.1%就是错误预算：一个月允许宕机约43分钟。预算没花完放心发版，花超了停新功能、全力修稳定。“稳定还是迭代”从扯皮变成算术题。</p><p class="ex"><i>例</i>减肥每天允许一小块蛋糕，没超标不用自责，超标第二天多运动。用数字代替“我觉得不稳定”，开发和运维不用在会议室吵架，看仪表盘说话。</p></li>
<li><p><b>2. 100% 可靠是浪费</b> 99.9%做到99.99%，成本翻几倍，用户几乎感知不到。可靠性只要“足够好”，省下的精力做用户真正需要的功能。别为用户不在乎的小数点买单。</p><p class="ex"><i>例</i>小区门禁“基本上安全”就行。为防电影里的特工装三层虹膜识别，业主每天进门折腾五分钟——没人觉得这是好物业，只觉得添堵。</p></li>
<li><p><b>3. 消灭琐事：手工运维超过一半时间就必须停下来</b> Toil（琐事）指手工、重复、没营养、还得人肉干的活，比如每天手动重启服务。Google规矩：琐事超50%就停下所有新需求、全力做自动化。靠人肉撑的系统，规模一大必崩，人也崩。</p><p class="ex"><i>例</i>客人少时手洗碗还行，客人多了还手洗，洗碗工崩溃、碗也洗不干净，必须上洗碗机。某团队每天两小时手动发布，自动化后十分钟搞定、零失误。</p></li>
<li><p><b>4. 监控只看四个黄金信号</b> 从用户视角看系统健康就四个数：延迟（多快）、流量（多少请求）、错误（多少失败）、饱和度（资源有多满）。告警只发“能行动的”：半夜叫醒人结果是“明天再说”，这种噪音迟早让人对告警麻木。</p><p class="ex"><i>例</i>看病看体温、血压、心率、血氧四个数，基本能判断健康，不用一上来就全身CT。某公司把告警从200条砍到30条“必须马上处理”，值班终于能睡整觉，真正的故障一次没漏。</p></li>
<li><p><b>5. 复盘对事不对人</b> 复盘不许说“是谁的错”，只问“系统哪里给了犯错的机会”。人一定会犯错，“下次小心点”防不住；把系统改成“犯错也出不了大事”才算真改进。不甩锅的复盘是Google持续进步的秘密。</p><p class="ex"><i>例</i>航空事故调查不追究飞行员个人，查的是“仪表盘是不是容易看错”。某大厂删库事故后，复盘结论是“删生产库必须双人确认加二次验证”，之后同类事故归零。</p></li>
<li><p><b>6. 渐进式发布：发布应该是日常小事</b> 别攒两个月搞“大版本上线”，那是赌博。小步快走：先给1%用户（金丝雀发布），没问题再扩大，出问题一键回滚。发布越频繁、每次越小，“爆炸半径”越可控，风险越低。</p><p class="ex"><i>例</i>新菜先让一桌客人试吃，好吃再全店推，总比直接换菜单、开业当天被全网吐槽强。某App灰度发布，一次闪退bug只影响1%用户就回滚了，全量发布就是P0事故。</p></li>
<li><p><b>7. on-call 不是“背锅侠”，而是有制度的轮值</b> 半夜被叫起来不可怕，可怕的是“天天被叫、叫起来还修不好”。Google规矩：值班有补偿、有交接，“叫醒必须能处理”。频繁被叫醒说明系统该修了，不是人不够警醒。好的on-call制度倒逼系统变好。</p><p class="ex"><i>例</i>小区保安夜班偶尔处理个把事正常，每晚被叫醒十次说明门锁系统该修了，不是保安不够警醒。把“人受的苦”转成“系统要改的项”，值班越值越轻松。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>前言：为什么写这本书</b> 交代SRE的来历：Google当年招软件工程师干运维的活。十几年沉淀出一套方法论，这本书就是把它公开。</p><p class="ex"><i>例</i>老字号公开祖传配方：不是配方不值钱了，是想让整个行业进步。当然，公开的永远是心法，不是具体代码。</p></li>
<li><p><b>第一部分：绪论——先统一语言</b> SRE 是什么、Google 怎么看待风险、服务水平目标（SLO）怎么定。先把“可靠性”变成可量化的数字，后面才有得谈。</p><p class="ex"><i>例</i>开会先对齐术语：大家嘴里的“稳定”是一个意思吗？这部分就是发同一本词典：SLO多少、错误预算怎么算，先对齐再干活。</p></li>
<li><p><b>第二部分：原则——SRE 做事的几条大原则</b> 消除琐事、分布式系统的监控、自动化、发布工程、简单化。原则是“道”，后面的实践是“术”。</p><p class="ex"><i>例</i>武功心法：招式（具体工具）会过时，心法（原则）不会。这一部分的心法，换公司、换技术栈照样适用。</p></li>
<li><p><b>第三部分：实践——落到每天的具体工作</b> 最厚的一部分：告警怎么写、值班怎么值、故障怎么救、复盘怎么做、容量怎么算、数据怎么保证不丢。全是能直接抄作业的干货。</p><p class="ex"><i>例</i>驾校实操课：前面是交规（原则），这里是上车——怎么打方向、怎么倒车入库。看完就知道Google运维每天到底在干嘛。</p></li>
<li><p><b>第四部分：管理——组织层面的事</b> SRE 团队怎么管、怎么跟开发团队协作、招什么样的人、怎么避免把人累垮。技术问题背后都是人的问题。</p><p class="ex"><i>例</i>球队管理：光有战术不够，还得管更衣室——谁首发、谁替补、怎么轮换、怎么保持士气，不然球星也跑路。</p></li>
<li><p><b>第五部分：结束语——Google 踩过的坑</b> 收尾：把可靠性做成产品来思考，以及 Google 这些年交过的学费。提醒你：没有银弹，适合 Google 的不一定适合你，学的是思路。</p><p class="ex"><i>例</i>学霸分享错题本：最有价值的不是考了多少分，是当年在哪跌倒、怎么爬起来的。看完会对“大厂也犯傻”释然很多。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-16">
  <div class="card-top"><span class="card-no">NO.16</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/26304417/" target="_blank" rel="noopener">豆瓣 7.7 · 72人评价</a></div>
  <h3>《发布！软件的设计与部署》</h3>
  <p class="meta">Release It!: Design and Deploy Production-Ready Software · 迈克尔·尼加德 · 人民邮电出版社 · 2008</p>
  <p class="lede">测试环境好好的，一上线就崩？这本书专讲“生产环境”这头怪兽：它怎么杀死你的系统。以及怎么设计才能活下来。</p>
  <div class="thesis"><p>开发环境和生产环境是两个世界：生产环境有真实流量、会断的网络、会挂的依赖、半夜三点的电话。99%的架构书教“把功能做出来”，这本教“怎么在生产环境活下来”。</p>
<p>核心论点：稳定性是可以设计的。书里总结了“稳定性模式”（超时、熔断器、舱壁、限流）和“反模式”（集成点爆炸、级联重试、资源无上限）。绝大多数生产事故不是代码bug，而是“一个变慢的依赖拖死整个系统”的级联故障。设计时能防住，靠运维祈祷没用。</p>
<p>它是“为生产而设计”的开山之作。“熔断器”“舱壁”这些微服务里的高频词，很多从这本书普及开。至今仍是SRE和架构师的必读书。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 为生产而设计，而不是为演示而设计</b> 很多系统开发机上跑得飞起，一上线就跪。设计时只想“功能通不通”，没想“依赖挂了怎么办、流量翻十倍怎么办、磁盘满了怎么办”。</p><p class="ex"><i>例</i>买车试驾都好开，得问“高速爆胎怎么办、冬天打不着火怎么办”。某系统没人问“短信网关挂了怎么办”，大促时网关一抖，用户收不到验证码，全站登录瘫痪。设计没留后路，出事只能干瞪眼。</p></li>
<li><p><b>2. 级联故障：一个慢服务能拖死全站</b> A调B，B变慢，A的线程全卡在“等B返回”上；A的线程池耗尽，调A的C也跟着卡。多米诺骨牌：一个点的“慢”扩散成全站的“死”。这是生产事故最常见的死法，和代码bug无关，是架构病——设计时没做隔离，迟早要还。</p><p class="ex"><i>例</i>高速连环追尾：第一辆急刹，后面一辆接一辆撞上去。某电商大促，一个边缘的“推荐”服务变慢，拖死了下单主流程——主流程只是“顺手调了一下”推荐，却一起陪葬。</p></li>
<li><p><b>3. 熔断器：对方挂了，就别再去敲门</b> 保险丝：电流过大就断开，保护全屋。熔断器一样：下游连续失败就“跳闸”，直接返回降级结果，不再发请求；过会儿放一个请求试探，好了就“合闸”。既不把挂掉的服务打得更挂，也不被它拖死。</p><p class="ex"><i>例</i>对方一直占线，别每隔十秒重拨——打不通，还把自己手机打没电。等半小时再试一次。支付系统给银行通道加熔断，银行抖动时自动切备用通道，用户只觉得“慢了一点”，而不是直接报错。</p></li>
<li><p><b>4. 舱壁：把系统隔成“水密舱”</b> 船被鱼雷打中不沉，靠水密舱：一个舱进水，其他舱不受影响。软件里就是资源隔离：不同依赖配独立的线程池、连接池，一个hang死只耗尽自己的池子，不连累别人。隔离做好，故障“爆炸半径”就小。</p><p class="ex"><i>例</i>家里电路分路：空调一路、照明一路，空调短路只跳自己的闸，灯还亮着。某系统“下单”和“发券”共用一个线程池，发券hang死拖垮下单；拆成两个池子后，发券再挂也不影响收钱。</p></li>
<li><p><b>5. 超时和限流：给每个操作上“紧箍咒”</b> 不设超时，等于“无限期等一个可能永远不回的人”；不限流，等于“来多少都接待、挤爆为止”。超时是“3秒不回就放弃”，限流是“门口保安数人头，满了排队或劝返”。两件小事防住一大半生产事故，却最容易被遗忘。</p><p class="ex"><i>例</i>饭店：等位超1小时客人就走（超时），满座不再放人进（限流）。让500人挤进只能坐50人的店，所有人都吃不上饭，厨师也崩溃。</p></li>
<li><p><b>6. 反模式：集成点越多，死得越快</b> 每多接一个外部系统（支付、短信、地图、风控），就多一个“它挂了我也挂”的风险。集成点多到两只手数不过来，架构就有问题：要么砍掉非必要的，要么每个配上熔断降级。依赖是负债，不是资产。</p><p class="ex"><i>例</i>装修找20个分包队，任何一个掉链子，工期全拖。靠谱做法：关键路径的分包必须有备选（B队）。每个外部依赖都要有“B计划”。</p></li>
<li><p><b>7. 透明度：看不见的系统救不回来</b> 线上出问题，第一问永远是“现在到底发生了什么”。日志、指标、业务仪表盘是救命的东西。重点记“业务指标”（每分钟下单量、支付成功率），不只看CPU内存——机器看着没事，业务可能已经挂了。</p><p class="ex"><i>例</i>开车只看“发动机转不转”（CPU），不看“车速多少”（业务量），抛锚了都不知道是没油还是爆胎。某公司大促CPU才40%，支付成功率却掉了20%——看业务指标才发现是第三方风控接口超时。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：活在生产环境</b> 开篇先带你认清现实：生产环境和开发、测试环境完全是两个世界。真实流量、不可靠的网络、会挂的依赖，以及永远在半夜响起的电话。</p><p class="ex"><i>例</i>新兵下连队：训练场打十环不算本事，战场上枪林弹雨活下来才算。这部分就是告诉你战场到底什么样。</p></li>
<li><p><b>第二部分：反模式——灾难的种子</b> 总结那些“看起来没问题、一上线就爆炸”的设计：集成点爆炸、级联重试、无上限使用资源。认出这些反模式，是防住事故的第一步。</p><p class="ex"><i>例</i>医生先学认病：发烧咳嗽对应什么病，心里有谱。看到“一个请求串行调8个外部接口”，老手后背发凉——这就是反模式的“症状”。</p></li>
<li><p><b>第三部分：稳定性模式——保命的招式</b> 全书的核心：超时、熔断器、舱壁、限流、快速失败。每个模式都讲清“解决什么问题、付出什么代价、代码大概怎么写”。</p><p class="ex"><i>例</i>就像武术套路：每个招式都拆解给你看——这招防什么、那招什么时候用。熔断器是“盾”，舱壁是“甲”，超时是“见势不妙先撤”，组合起来用才完整。</p></li>
<li><p><b>第四部分：中间件——稳定性的杀手</b> 专门讲那些你控制不了的东西：消息队列、应用服务器、数据库连接池。中间件出问题最隐蔽，也最致命，得用专门的手段对付。</p><p class="ex"><i>例</i>合租室友：自己的房间（代码）你能收拾，室友的房间（中间件）管不着，但他把厨房炸了你也得饿肚子。提前约法三章：超时、隔离、监控。</p></li>
<li><p><b>第五部分：交付——为生产而设计</b> 收尾：需求阶段就要考虑生产（容量规划、透明度、运维协作），而不是写完代码扔给运维。发布不是终点，是另一场战斗的起点。</p><p class="ex"><i>例</i>盖楼：设计图阶段就得考虑消防通道、承重、电梯维护，而不是盖好了才发现消防车进不来。“以后怎么活”要提前到“现在怎么画图”里。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-17">
  <div class="card-top"><span class="card-no">NO.17</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/25723064/" target="_blank" rel="noopener">豆瓣 7.8 · 1894人评价</a></div>
  <h3>《大型网站技术架构：核心原理与案例分析》</h3>
  <p class="meta">李智慧 · 电子工业出版社（博文视点） · 2013</p>
  <p class="lede">网站从小做到大，架构怎么跟着变：作者在阿里当过架构师，把淘宝这些大网站踩过的坑总结成人人能用的方法。</p>
  <div class="thesis"><p>2013年，阿里架构师李智慧把一线大厂的架构经验写成这本书。那是中国互联网第一次有人系统地、用中文讲清“大网站是怎么长大的”——此前架构知识大多是英文的、零散的。</p>
<p>核心论点一句话：大型网站的架构不是设计出来的，是演化出来的。没有网站第一天就建成撑1亿用户的架构，都是从一台服务器开始，用户多了、慢了、挂了，才一步步拆成分布式。理解“演化”，就不再纠结“一步到位”。</p>
<p>全书围绕五个要素：高性能、高可用、可伸缩、可扩展、安全性。架构师的工作本质是在这五个要素间找平衡：加缓存提性能，但带来一致性问题；做冗余保可用，但冗余要花钱。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 大型网站的架构是演化出来的，不是设计出来的</b> 没有大网站第一天就是“能撑一亿用户”的样子。淘宝最早也是个简单网站，用户多了、扛不住了，才一步步拆分、加缓存、上集群。架构像城市路网，随人口增长一点点修出来，不是一张蓝图盖到老。别追求“一步到位”，每个阶段解决当下最痛的问题。</p><p class="ex"><i>例</i>开餐馆：夫妻店两个人起步，客人多了请帮工（加机器），再多开分店（拆业务），分店多了建中央厨房（分布式服务）。三桌客人的时候建中央厨房就是浪费，超前设计同理。</p></li>
<li><p><b>2. 架构设计的九大模式：分层、分割、分布、集群、缓存、异步、冗余、自动化、安全</b> 大厂招数提炼成九个模式：分层、分割、分布、集群、缓存、异步、冗余、自动化、安全。分层是切成表现层、应用层、数据层；分割是按业务切小；分布是部署到不同机器；集群是多部署几份；缓存是热点放内存；异步是不着急的排队做；冗余是关键备双份；自动化是发布运维靠机器；安全是防攻击。</p><p class="ex"><i>例</i>双十一零点每秒几十万订单，下单、扣库存、付款全同步做，系统瞬间卡死。实际做法：下单请求先进消息队列排队（异步），库存慢慢扣，用户看到“排队中”而不是转圈——异步在救命。</p></li>
<li><p><b>3. 评判架构的五个标尺：高性能、高可用、可伸缩、可扩展、安全性</b> 高性能是快，高可用是稳，可伸缩是加机器就扛更多流量，可扩展是加新功能不伤筋动骨，安全性是防黑客。架构师每天在这五个目标间取舍——它们经常打架，极致性能和极致安全就很难兼得。</p><p class="ex"><i>例</i>12306春运抢票：别卡、别崩、春运加机器、以后加候补购票、防黄牛脚本，五个一个不能少。架构评审会上吵的，就是这五个指标怎么排优先级。</p></li>
<li><p><b>4. 缓存是性能优化的第一手段：网站访问遵循二八定律</b> 80%访问集中在20%热点数据上：首页、爆款、明星微博，永远那一小撮被反复看。何必每次都查慢吞吞的数据库？热点放内存（缓存），快几十上百倍。缓存分多层：浏览器、CDN、反向代理、本地、分布式，层层设防。</p><p class="ex"><i>例</i>热搜第一的绯闻一分钟被刷几百万次，每次都查数据库早趴下了。实际是这条微博缓存在内存里，几百万人读同一份拷贝，数据库只被问一次——这就是缓存的威力。</p></li>
<li><p><b>5. 高可用：先假设一定会出故障，再来设计</b> 服务器会宕机、硬盘会坏、机房会断电。故障不是“会不会来”，是“什么时候来”。高可用就是不把鸡蛋放一个篮子：服务部署多份、数据多存几份、机房建两个。这叫冗余，贵，但比宕机一分钟损失几百万便宜。</p><p class="ex"><i>例</i>支付宝数据库至少两份实时同步，一台机房断电，几秒内切到备用机房，用户付款没感觉。你从没遇到“支付宝挂了”，背后就是这套冗余在烧钱。</p></li>
<li><p><b>6. 异步解耦：让系统学会“排队”，而不是“堵死”</b> 同步像打电话，对方不接你就干等；异步像发微信，发完干别的，对方回了再处理。消息队列把上下游解耦：上游只管扔任务进队列，下游按自己节奏消费。流量洪峰来时，队列就是蓄水池，削峰填谷。</p><p class="ex"><i>例</i>秒杀100万人同时点“抢购”，不会让100万请求同时扣库存。而是让它们在消息队列排队，库存服务不紧不慢一个个处理。</p></li>
<li><p><b>7. 安全是架构设计的一部分，不是上线前才想起来的补丁</b> 系统做好了才想“防一下黑客”，就像给漏水的船贴胶带。安全要融进架构：分层天然有隔离效果，敏感数据加密存，关键操作做风控。电商、金融网站一次拖库可能就是灭顶之灾。</p><p class="ex"><i>例</i>淘宝支付时突然要求短信验证：系统发现交易“有点可疑”（异地登录、大额），自动加一道验证。安全架构平时看不见，出事时救命。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一篇 概述：第1章 大型网站架构演化</b> 一个网站从一台服务器起步，随用户增长一步步演化成分布式架构。应用与数据分离、加缓存、上集群、读写分离、CDN。分布式文件系统、NoSQL、业务拆分、分布式服务。</p><p class="ex"><i>例</i>这章就是“餐馆扩张史”的完整剧本：读完会对“我系统处在哪个阶段、下一步拆什么”心里有数。</p></li>
<li><p><b>第二篇 架构模式：第2章 大型网站架构模式</b> 把大厂架构的通用招数提炼成九大模式：分层、分割、分布、集群、缓存、异步、冗余、自动化、安全。每个模式讲“解决什么问题、怎么用”。</p><p class="ex"><i>例</i>面试被问“怎么设计高并发系统”，把九个模式往上套：分层分割、分布集群、热点缓存、削峰异步、关键冗余。一套组合拳下来，面试官基本点头。</p></li>
<li><p><b>第二篇 核心要素：第3章 大型网站核心架构要素</b> 提出评价架构的五个标尺：高性能、高可用、可伸缩、可扩展、安全性，并讲清每个要素的目标、度量方法和常见手段。这是全书的“考试大纲”。</p><p class="ex"><i>例</i>老板说“要快、要稳、要能加功能”，翻译成架构语言就是性能、可用、扩展。这一章教你把大白话变成可度量的架构目标。</p></li>
<li><p><b>高性能：第4章 瞬时响应——网站的高性能架构</b> 从性能测试、优化讲起，分前端、应用服务器、存储三层给手段。浏览器缓存、CDN、反向代理、本地缓存、分布式缓存、异步、集群。</p><p class="ex"><i>例</i>页面打开要3秒怎么优化？按清单查：图片压缩了吗？用CDN了吗？接口能缓存吗？库加索引了吗？一层层查下去，3秒变300毫秒不是梦。</p></li>
<li><p><b>高可用：第5章 万无一失——网站的高可用架构</b> 讲如何设计“挂了一部分还能跑”的系统：负载均衡、故障转移、服务降级、限流、数据多副本。这是大厂SRE（网站可靠性）工作的理论源头之一。</p><p class="ex"><i>例</i>春晚红包微信支付每秒几十万笔，某台服务器挂了，负载均衡几秒内把流量挪走，用户毫无感知。“万无一失”靠的不是运气，是这一章的每一招。</p></li>
<li><p><b>伸缩与扩展：第6-7章 永无止境 &amp; 随需应变</b> 伸缩性是“加机器就扛更多流量”，可扩展性是“加新功能不用大改”。一个管量，一个管变化。</p><p class="ex"><i>例</i>双十一加100台服务器（伸缩），明年上“直播带货”（扩展）。前者靠云平台一键扩容，后者靠当初把“商品、交易、营销”拆成独立服务。</p></li>
<li><p><b>安全：第8章 固若金汤——网站的安全架构</b> 讲Web攻击（XSS、SQL注入、CSRF）怎么防、敏感信息怎么加密、垃圾信息怎么过滤、电商怎么做风险控制。安全是架构的底线。</p><p class="ex"><i>例</i>密码绝不能明文存库，要存“加盐哈希”：黑客偷走数据库，拿到的也是一堆算不回去的乱码。这是设计阶段定好的规矩，不是出事后再改。</p></li>
<li><p><b>第三篇 实战案例 &amp; 第四篇 架构师：第9-15章</b> 第三篇解剖淘宝、Wikipedia、Doris、秒杀系统和真实故障案例；第四篇讲架构师怎么做技术决策、怎么在职场成长。</p><p class="ex"><i>例</i>第12章秒杀系统是全书最高光：从“排队+限流+隔离”三板斧，到“把秒杀做成独立小系统”，很多公司第一次做秒杀就是照这章抄的作业。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-18">
  <div class="card-top"><span class="card-no">NO.18</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/26644070/" target="_blank" rel="noopener">豆瓣 8.6 · 994人评价</a></div>
  <h3>《凤凰项目：一个IT运维的传奇故事》</h3>
  <p class="meta">The Phoenix Project: A Novel About IT, DevOps, and Helping Your Business Win · 吉恩·金、凯文·贝尔、乔治·斯帕福德 · 人民邮电出版社 · 2015</p>
  <p class="lede">用小说讲DevOps：IT经理临危受命90天，靠“三步工作法”把烂摊子变成高效团队。</p>
  <div class="thesis"><p>汽车零件公司IT经理Bill临危受命：90天内让烂尾的“凤凰项目”上线，否则整个IT部门被外包。在导师指点下，他领悟“三步工作法”，把救火队变成高效团队。</p>
<p>核心论点：IT工作和工厂流水线没本质区别，都服从约束理论——系统产出速度取决于最慢的环节（瓶颈）。想提速别瞎忙，先找到瓶颈、保护瓶颈、打破瓶颈。三步工作法（快速流动、快速反馈、持续学习）就是操作手册。</p>
<p>在它之前，DevOps是一堆零散理念和工具；这本书第一次用完整故事讲清“为什么需要DevOps”。此后十年，它成了DevOps圈的启蒙读物。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 三步工作法第一法则：让工作从左到右快速流动</b> 管“从左到右的工作流”：需求从开发流向运维再到用户，这条线要快、要顺。三招：小批量工作（别攒大版本一次发）、限制同时在做的事、绝不让有缺陷的东西流到下游。</p><p class="ex"><i>例</i>工厂流水线：铁板从左边进，切割、焊接、喷漆，从右边出来变成汽车门。IT一样：需求从左边进，开发、测试、运维，从右边交付用户。等审批、等环境、返工——任何让线停下来的地方都是浪费。</p></li>
<li><p><b>2. 三步工作法第二法则：从右到左建立快速反馈</b> 管“从右到左的反馈流”：下游发现问题，最快速度告诉上游。出问题立刻喊停、快速定位、把教训变成防护（比如加个自动化检查）。反馈越快，同样的坑越不会踩第二次。</p><p class="ex"><i>例</i>工厂里工人发现零件问题，立刻拉绳停线，全厂一起看。IT也该这样：报警一响先止血、再复盘。很多团队相反：报警没人看，出事互相甩锅，同样的坑下个月再踩一次。</p></li>
<li><p><b>3. 三步工作法第三法则：持续学习和实验的文化</b> 管持续学习和实验的文化：每次事故都是学习机会，鼓励小步试错。复盘不甩锅，经验沉淀成文档和工具，主动做故障演练。没这种文化，前两条迟早流于形式。</p><p class="ex"><i>例</i>航空业每次空难都彻底调查、全行业学习，所以飞机越来越安全。IT也该这样：故障后复盘不追责、只找系统原因，改进变成自动化规则。敢做小实验，组织才越来越强。</p></li>
<li><p><b>4. 找到瓶颈：整个系统的产出，只取决于最慢的那个环节</b> 约束理论：任何系统同一时间只有一个瓶颈，系统产出速度等于瓶颈的速度。非瓶颈环节再努力也是白费。找到瓶颈、让它满负荷、最终打破它，系统才会变快。书里的“布伦特”就是瓶颈本人。</p><p class="ex"><i>例</i>公司里所有疑难杂症都要经布伦特的手，他休假一周，三个项目全停摆。办法不是让他更努力，而是把他脑子里的知识写成文档、做成工具——先保护瓶颈，再消除瓶颈。</p></li>
<li><p><b>5. 四种工作类型：计划外工作是吞噬一切的黑洞</b> IT工作分四种：业务项目、内部项目、变更，以及最要命的计划外工作（线上故障、紧急需求、安全补丁）。计划外工作像黑洞，吞掉所有排好的计划。天天被它追着跑，就永远没空做重要的事。</p><p class="ex"><i>例</i>排好这周做三个需求，周一两个线上故障、周二老板插紧急需求、周三全量打补丁，计划全泡汤。计划外工作不打招呼、优先级最高，专杀一切计划。办法：留缓冲时间，把重复出现的计划外工作变成计划内（总在救的火做成自动化）。</p></li>
<li><p><b>6. 警惕“救火英雄文化”和技术债：越救火，越没空防火</b> 很多团队靠几个“英雄”撑着：系统挂了总有人能人肉修好。短期感人，长期是灾难——英雄越救火，团队越没空防火（自动化、文档、重构），火越烧越旺。技术债同理：欠得越多，未来计划外工作越多。</p><p class="ex"><i>例</i>“救火英雄”每次凌晨三点爬起来修好系统，大家都夸靠谱。但没人问：为什么总是他？为什么同样的火每月烧一次？英雄文化掩盖了系统性问题。高手是让火烧不起来的人，不是灭火最快的人。</p></li>
<li><p><b>7. 用看板让工作可视化：看不见的工作管不好</b> 把需求、故障、变更全部可视化（比如一块看板），谁在做什么、卡在哪，一目了然。限制每列数量（在制品上限），逼团队先做完手头的事再开新坑，流动速度自然上去。</p><p class="ex"><i>例</i>白板三列：待办、进行中、已完成，“进行中”最多3项。很快发现5件事卡在“等运维给权限”——瓶颈自己现形了。站会看着板子说事就行。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>开篇：临危受命的90天</b> IT经理Bill临危受命：90天内让烂尾的“凤凰项目”上线，否则IT部门被外包。全书小说体、按日期推进，跟着Bill一天天往下走。</p><p class="ex"><i>例</i>Bill第一周就被现实教育：服务器宕机、项目延期、部门互相甩锅。在传统企业IT待过的人读到这，都会会心一笑——太真实了。</p></li>
<li><p><b>救火与启蒙：认识三步工作法</b> Bill救火中认识导师Erik，第一次听到“三步工作法”和约束理论。并用“四种工作类型”盘点团队时间去哪了——全书的理论奠基。</p><p class="ex"><i>例</i>Erik带Bill去工厂：流水线上在制品堆积如山，真正瓶颈是那台老机器。你们IT也一样，布伦特就是那台老机器。</p></li>
<li><p><b>实践：把三步工作法用起来</b> Bill带着团队落地：看板可视化、限制在制品、小批量发布、建立快速反馈、保护瓶颈。凤凰项目从“人人喊打”慢慢变成“居然能按时交付了”。</p><p class="ex"><i>例</i>白板上墙，所有工作上板；“进行中”最多三件事；布伦特的时间被保护，只干最重要的事。几周后：交付变快，加班变少。</p></li>
<li><p><b>凤凰涅槃：上线与转折</b> 凤凰项目成功上线，CEO保住了IT部门。更重要的是，团队证明了：用正确的方法，传统企业的IT也能跑得像互联网公司一样快。</p><p class="ex"><i>例</i>上线当天所有人守在作战室：没有通宵、没有惊魂，系统平稳上线。Bill意识到：不靠熬夜拼命项目也能成功，靠的是流程，不是运气。</p></li>
<li><p><b>尾声：从项目到文化</b> 收尾讲文化的沉淀：复盘机制、知识分享、持续实验。项目会结束，但“三步工作法”留下来，变成了组织的肌肉记忆。</p><p class="ex"><i>例</i>最后Bill不再天天救火，而是在想“怎么让好状态持续下去”。DevOps的终点不是一套工具，是持续改善的文化。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-19">
  <div class="card-top"><span class="card-no">NO.19</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/33425123/" target="_blank" rel="noopener">豆瓣 9 · 718人评价</a></div>
  <h3>《微服务架构设计模式》</h3>
  <p class="meta">Microservices Patterns: With Examples in Java · 克里斯·理查森（Chris Richardson） · 机械工业出版社 · 2019</p>
  <p class="lede">微服务“模式词典”：拆服务、服务间通信、分布式事务这些难题，一个个给出经过验证的解法。</p>
  <div class="thesis"><p>微服务正火，但缺一本“动手指南”。拆多细、服务间怎么通信、分布式事务怎么办，全是坑。Chris Richardson把这本书写成了微服务的“模式词典”。</p>
<p>微服务不是“把单体拆小”那么简单：拆完之后，通信、事务、查询、部署全是新问题。但前人都踩过，都可以沉淀成模式。书里用统一的“模式语言”（问题、方案、利弊）讲了几十个模式，每个决策都有章可循。</p>
<p>它让微服务从“玄学”变成“工程学”。选型不再靠拍脑袋：分布式事务的标准答案是Saga，协同和编排两种做法，利弊都列清楚。</p></div>
  <details class="fold">
    <summary>核心观点 · 8<span class="chev">›</span></summary>
    <ul><li><p><b>1. 先想清楚再拆：单体地狱和微服务地狱一样可怕</b> 单体做大变“单体地狱”：代码耦合、部署半小时、改一行提心吊胆。微服务拆不好变“微服务地狱”：分布式事务、网络延迟、运维爆炸。微服务不是银弹，团队小、业务简单时，单体可能是更好的选择。</p><p class="ex"><i>例</i>5个人、2万行代码拆成20个微服务：部署协调20个仓库，出问题查20份日志。新人三个月看不懂全貌——这就是微服务地狱。</p></li>
<li><p><b>2. 怎么拆服务：跟着业务拆，别跟着技术拆</b> 两套方法：按业务能力拆（电商天然有商品、订单、支付），或按子域拆（DDD的“限界上下文”）。核心一条：高内聚、低耦合，一个服务只干一类事，服务之间少废话。</p><p class="ex"><i>例</i>按“商品、订单、支付、库存”拆成四个服务，各有自己的库和团队。这就是限界上下文：一个服务管好一块业务，谁也别伸手到别人地盘。</p></li>
<li><p><b>3. 服务之间怎么说话：同步像打电话，异步像发微信</b> 两种说话方式：同步（REST、gRPC，像打电话，实时但互相等）和异步（消息队列，像发微信，解耦但有延迟）。</p><p class="ex"><i>例</i>查订单详情调订单服务，订单服务又调商品和用户服务——同步像套娃，一层慢层层慢，一个挂全挂。能异步就异步：下单成功发个“订单已创建”事件，库存、物流各自订阅处理，谁也不用等谁。</p></li>
<li><p><b>4. Saga模式：没有分布式事务，就用“分步提交+补偿”</b> 微服务处理分布式事务的标准答案：大事务拆成一串本地小事务。每步成功发事件触发下一步；哪步失败，反向执行补偿操作撤销前面。</p><p class="ex"><i>例</i>下单要做三件事：创建订单、扣库存、扣钱，三个服务三个库，没有传统事务。Saga：前两步成功、第三步扣钱失败，别慌，执行补偿——库存加回去、订单标失败。没有“要么全成功”，只有“失败了能撤销”。</p></li>
<li><p><b>5. CQRS：读写分开，查得快才重要</b> 命令查询职责分离：写和读用不同模型。微服务里数据散在各处，跨服务查又慢又复杂，干脆为查询单独建模、单独优化。代价是数据有短暂延迟（最终一致），换来查询性能大幅提升。</p><p class="ex"><i>例</i>CQRS建一个“查询服务”，平时订阅各服务事件把数据拼好存自己这。用户查详情只问它，一个请求搞定，又快又稳。</p></li>
<li><p><b>6. 事件溯源：不记余额，只记每一笔流水</b> 不直接存“当前状态”，存“导致状态变化的一串事件”。状态随时重放算出来，天然带审计日志，调试回滚都方便。代价是概念绕、查询要额外建模，适合审计追溯要求高的场景（金融、订单）。</p><p class="ex"><i>例</i>账户100元花了30：传统做法把余额改成70，事件溯源记一笔“支出30元”，余额是算出来的。想查账，把所有流水重放一遍就行，一笔都丢不了。</p></li>
<li><p><b>7. API网关：给前端一个统一的门面</b> 前端不该直接面对几十个微服务。API网关是统一门面：鉴权、限流、路由、拼装一站式搞定。BFF更进一步：给每种客户端定制专属接口，App要的和网页要的可以不一样。</p><p class="ex"><i>例</i>App只调一个API网关，网关在后面把20个调用拼好一次返回。还可以给App、网页、小程序各配专属网关，各取所需。</p></li>
<li><p><b>8. 绞杀者模式：别重写老系统，一点点“勒死”它</b> 全书压轴，也最实用：别想“推倒重写”，那是找死。在老系统外套一层新服务，新功能走新服务，老功能逐步迁移，流量一点点切。风险可控、随时回滚，是绝大多数团队落地微服务的真实路径。</p><p class="ex"><i>例</i>10年历史的老单体谁也不敢重写：新功能做成微服务挡在前面，流量一点点切过去。几年后老系统只剩空壳，自然退役——像绞杀榕缠死大树一样。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第1章 逃离单体地狱</b> 讲单体应用的困境、微服务的利弊，以及最重要的判断：你到底该不该上微服务。先立规矩，再谈技术。</p><p class="ex"><i>例</i>装修前先问“这房子真要拆吗”：承重墙不能动，小修小补就行。很多团队的问题不是“怎么拆”，是“根本不该拆”。</p></li>
<li><p><b>第2章 服务的分解策略</b> 两种分解方法：按业务能力分解、按子域（DDD限界上下文）分解。附带分解 checklist，帮你检验拆得对不对。</p><p class="ex"><i>例</i>架构师对着业务架构图画圈：商品一块、订单一块、支付一块，圈就是服务边界。画完所有人懂了：拆服务是业务问题，不是技术问题。</p></li>
<li><p><b>第3章 微服务架构中的进程间通信</b> 同步（REST、gRPC）与异步（消息、事件）的详细对比：可靠性、延迟、耦合度。以及服务发现、断路器等配套模式。</p><p class="ex"><i>例</i>下单直接调库存接口（同步），还是发消息“我下单了你们看着办”（异步）？两种方式的时序图、优缺点、选型建议。这一章一次讲透。</p></li>
<li><p><b>第4章 使用Saga管理事务</b> 分布式事务的标准解法：协同式Saga与编排式Saga，补偿事务的设计，以及防并发坑的技巧。</p><p class="ex"><i>例</i>订机票：订座成功、扣款失败，Saga补偿自动释放座位。并通知用户“支付失败、座位已释放”——没有“系统错误请重试”，体验干干净净。</p></li>
<li><p><b>第5-6章 业务逻辑设计与事件溯源</b> 用DDD的聚合、领域事件来建模业务逻辑；事件溯源把“状态变化”本身存下来，天然可审计、可重放。</p><p class="ex"><i>例</i>订单创建后发出“订单已创建”事件，库存听到扣库存，物流听到建运单。订单服务根本不认识它俩，加新服务不用改老代码。</p></li>
<li><p><b>第7-8章 查询与外部API</b> CQRS解决跨服务查询难题；API网关与BFF模式解决前端接入问题。读写分离、各取所需。</p><p class="ex"><i>例</i>双十一大屏实时显示成交额：查询服务订阅所有交易事件，数字每秒更新。写库（交易）和读库（大屏）互不干扰，各自安好。</p></li>
<li><p><b>第9-13章 测试、生产就绪、部署与重构</b> 微服务测试策略（消费者驱动的契约测试是重点）、生产就绪checklist、多种部署模式。最后以绞杀者模式收尾：老单体一点点换成微服务。</p><p class="ex"><i>例</i>“本地能跑”到“线上敢跑”，差的是：健康检查、指标、链路追踪、外部化配置、灰度发布。测试金字塔告诉你单元、集成、端到端测试该怎么配比。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-20">
  <div class="card-top"><span class="card-no">NO.20</span><span class="dchip">系统设计</span><a class="card-rating" href="https://book.douban.com/subject/26765979/" target="_blank" rel="noopener">豆瓣 8 · 326人评价</a></div>
  <h3>《架构即未来》</h3>
  <p class="meta">The Art of Scalability (2nd Edition) · 马丁·阿伯特（Martin L. Abbott）、迈克尔·费舍尔（Michael T. Fisher） · 机械工业出版社 · 2014</p>
  <p class="lede">“AKF扩展立方体”：系统撑不住了，加机器、拆功能还是分数据？三个轴指方向。</p>
  <div class="thesis"><p>eBay、PayPal的用户量在涨，服务器成本却要压。两位作者把超大规模系统的扩展经验写成这本书。</p>
<p>核心贡献是AKF扩展立方体：把“系统怎么扩展”变成三道选择题。X轴：加一模一样的机器（水平克隆）；Y轴：按功能拆成不同服务；Z轴：按数据切分分片。任何扩展手段都能归到这三个轴上，架构师从此有了共同语言。</p>
<p>它是第一本把“扩展性”讲透的书，而且不只讲技术：扩展性是人、流程、技术的乘积。今天的微服务、分库分表、云原生弹性伸缩，思想源头很多在这个立方体里。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. AKF扩展立方体：扩展只有三个方向</b> “系统怎么扩展”抽象成一个立方体：X轴水平克隆，Y轴按功能拆分，Z轴按数据拆分。任何扩展手段都能归到这三个轴上，讨论扩展有了共同语言。</p><p class="ex"><i>例</i>用户量涨10倍系统变慢：短期X轴加机器顶住（最快），中期Y轴拆“图片处理”成独立服务（治本）。长期Z轴按用户ID分库（根治）。三个方向清清楚楚，不再碰运气。</p></li>
<li><p><b>2. X轴：水平克隆——加机器，最简单的扩展</b> 最简单粗暴的扩展：应用原样复制多份，前面用负载均衡分发流量。不改代码，见效最快。但有天花板：有状态的部分（数据库、文件存储）克隆不了，所以X轴通常是第一步，不是终点。</p><p class="ex"><i>例</i>流量翻倍，最快就是再买几台服务器装同样的程序，前面加负载均衡分流。代码一行不改，半小时搞定。但数据库还是那一个，加再多机器，瓶颈迟早卡在没法克隆的地方。</p></li>
<li><p><b>3. Y轴：按功能拆分——微服务思想的老祖宗</b> 按功能、业务把系统拆开：不同功能拆成不同服务，各自独立扩展、独立部署。好处是资源利用率高，哪里压力大加哪里；代价是系统变复杂，服务之间要通信、要治理。</p><p class="ex"><i>例</i>电商网站拆成“商品浏览”“下单支付”“图片处理”三个服务：图片处理吃CPU就多配机器，商品浏览压力大就加缓存。各服务独立扩展，钱花在刀刃上——这就是“微服务”思想的老祖宗。</p></li>
<li><p><b>4. Z轴：按数据拆分——分库分表的理论源头</b> 把数据切成互不重叠的片，分散到不同机器：按客户、按地域、按哈希切。好处是扩展性最强（理论上无限加机器）；代价是跨片查询变复杂、事务难做。数据库扩展的终极手段：分库分表。</p><p class="ex"><i>例</i>用户表1亿行越查越慢：按用户ID哈希分到10个库，1号库只存ID尾号1的用户。查询先算“这个用户在哪”，再去对应库查——每个库1000万行，速度回来了。</p></li>
<li><p><b>5. 扩展不只是技术的事：人、流程、技术三驾马车</b> 见过太多“技术没问题但扩不上去”的案例，结论：扩展性是人、流程、技术三者的乘积。组织不合理（200人的大团队）、流程有瓶颈（发布层层审批），技术再好也白搭。三者一起设计。</p><p class="ex"><i>例</i>团队天天加班，发布还是慢：不是技术不行，是流程卡住了——每次发布五个领导审批，等两周。“流程”这条腿瘸了。技术、流程、组织三条腿，瘸一条都跑不快。</p></li>
<li><p><b>6. 架构原则：为扩展而设计，而不是事后补救</b> 与其事后救火，不如事前设计。架构原则：无状态设计、异步解耦、缓存优先、水平扩展友好——让系统“天生就好扩展”。扩展性不是运维阶段才考虑，是画第一张架构图时就要想好的。</p><p class="ex"><i>例</i>设计之初就规定：应用服务器不存本地状态（登录态放Redis）。X轴加机器才无压力；耗时操作全走异步队列，Y轴拆分才顺滑。</p></li>
<li><p><b>7. 先找到瓶颈再动手：度量先行，加错机器等于白花钱</b> 扩展第一步永远是度量：先找到瓶颈，再选对应的轴。一慢就加机器，结果瓶颈在数据库，加100台应用服务器也没用。AKF立方体的价值就是一张“排查地图”，顺着三个轴一个个排除。</p><p class="ex"><i>例</i>系统变慢别急着加机器。CPU满了，走X轴加机器；服务太重，走Y轴拆分；单表太大，走Z轴分片。量体裁衣、对症下药，加错方向的机器都是白花钱。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>核心模型：AKF扩展立方体</b> 全书的地图：X轴（水平克隆）、Y轴（功能拆分）、Z轴（数据拆分）。理解了这个模型，后面所有手段都有了坐标，再也不会“头痛医头”。</p><p class="ex"><i>例</i>开会讨论“系统太慢怎么办”，以前各说各话。现在白板上画个立方体：“先走X轴顶住，下季度走Y轴拆图片服务”。三分钟达成共识，这就是共同语言的威力。</p></li>
<li><p><b>X轴：水平扩展——克隆一切</b> 讲水平克隆的适用场景、负载均衡、会话保持（为什么无状态设计重要），以及X轴的天花板：有状态的部分克隆不了。</p><p class="ex"><i>例</i>春晚抢红包，微信支付服务器是平时的几十倍：平时100台，春晚1000台，结束再缩回去。云计算让X轴前所未有的便宜方便。</p></li>
<li><p><b>Y轴：功能拆分——按服务拆</b> 按业务功能拆分系统的原则、服务的粒度、拆分后的通信与治理。这是微服务架构的理论前身，拆得好坏直接决定扩展成本。</p><p class="ex"><i>例</i>淘宝把“商品”“交易”“支付”拆成独立系统，双十一只给交易系统加机器，商品系统该干嘛干嘛。还是大单体就只能整体加机器，白白浪费。</p></li>
<li><p><b>Z轴：数据拆分——按客户、数据拆</b> 数据分片的策略（哈希、范围、目录）、分片后的查询路由、跨片事务的取舍。这是扩展性最强、也最复杂的一条轴。</p><p class="ex"><i>例</i>微信用户数据按地域分片，华南用户查华南的库。单库数据量下来查询快了，还顺带满足数据合规——Z轴一举多得。</p></li>
<li><p><b>架构原则：可扩展系统的设计清单</b> 总结一线大厂验证过的架构原则：无状态、异步、缓存、松耦合等。目标是让系统“天生好扩展”，而不是长大后再动手术。</p><p class="ex"><i>例</i>新服务上线前，架构师拿checklist逐项过：无状态吗？能水平扩展吗？缓存加了吗？耗时操作异步了吗？扩展性从“口号”变成“流程”。</p></li>
<li><p><b>人与流程：组织和事故管理</b> 可扩展的组织（小团队、端到端负责）和流程（敏捷、变更管理、事故复盘）：技术、流程、组织三者缺一不可。这是本书区别于纯技术书的最大特点。</p><p class="ex"><i>例</i>eBay把大团队拆成几十个小团队，每个对一块业务端到端负责，发布速度反而上去了。组织架构和系统架构互相塑造——这就是康威定律。</p></li>
    </ul>
  </details>
</article>
</div>
</section>
<section class="domain" id="pv3-d-uiux">
<div class="domain-head"><p class="eyebrow">第叁辑</p><h2>UI/UX 设计</h2><span class="count">10 本</span></div>
<p class="domain-intro">UI/UX 设计，说白了就是研究“让人用东西时不费脑、不糟心”的学问——屏幕上的每个按钮、每一步流程，都是设计师替用户提前做好的决定。</p>
<div class="cards">

<article class="card" id="pv3-book-21">
  <div class="card-top"><span class="card-no">NO.21</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/1827702/" target="_blank" rel="noopener">豆瓣 8.5 · 7273人评价</a></div>
  <h3>《点石成金》</h3>
  <p class="meta">Don't Make Me Think · 史蒂夫·克鲁格 · 机械工业出版社 · 2000</p>
  <p class="lede">做网站和 App 的实战小册子：别让用户动脑子，薄、幽默、句句拿来就能用。</p>
  <div class="thesis"><p>一个页面好不好用，不看视觉多酷，只看用户能不能不假思索地完成任务。用户停下来想“我该点哪儿”，设计就已经输了。</p>
<p>用户不是在阅读页面，而是在扫描；做选择时不是精挑细选，而是差不多就行。这本书把可用性从实验室里的高深学问，变成了人人能用的常识。</p>
<p>它提出了“一天 10 美分”测试法。找 3 个用户，一个上午测一次，下午就改。从此“小步快测”成了整个互联网行业的标配动作。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 别让我思考：好页面不用动脑子</b> 用户打开页面时大脑处于省电模式，只想赶紧把事办完。每个按钮、每段文字都要一眼就懂。让用户犹豫超过一秒的设计，都是在添堵。</p><p class="ex"><i>例</i>注册按钮写“免费注册”，用户秒懂。写成“开启您的数字化之旅”，用户就得愣住：这是注册吗？淘宝的“立即购买”大按钮又大又红，不用想就知道点它能下单。</p></li>
<li><p><b>2. 用户不读页面，他们只扫描</b> 用户像雷达一样扫页面，只抓关键词、大标题、加粗字，剩下的直接跳过。页面是写给“扫描仪”看的，得经得起扫：层级分明、重点突出。</p><p class="ex"><i>例</i>微信公众号文章没人逐字读，都是先扫标题和小标题，觉得有料才细看。所以多用小标题分段、关键词加粗、要点用列表排开。</p></li>
<li><p><b>3. 差不多就行：用户不做最优选择</b> “满意即可”：用户点第一个看起来靠谱的选项，错了再回头。试错成本太低了，点错了点返回就行，谁还费脑子比较？</p><p class="ex"><i>例</i>百度搜“北京好吃的火锅”，你会点第一个标题顺眼的进去，不行再退回来。搜索结果页的关键是让每个结果都清晰可信，用户敢放心点下去。</p></li>
<li><p><b>4. 点击几次无所谓，每次点击要明确</b> 用户不怕多点几下，怕的是每点一下都要赌一把：“点这个对吗？会去哪儿？”只要每一步都清清楚楚，点十次也乐意。</p><p class="ex"><i>例</i>美团外卖从首页到结算七八步，但每一步都知道自己在哪、下一步去哪，所以不累。反倒是某些网站的按钮写着“了解更多”，点下去是报价单还是广告全靠猜。</p></li>
<li><p><b>5. 删掉一半文字，再把剩下的删掉一半</b> 网页上的字 90% 没人看，却全是噪音。它们让真正重要的信息更难被扫到。先删一半，再删一半，留下的每个字都得是“不写用户就办不成事”的。</p><p class="ex"><i>例</i>很多公司官网首页写“欢迎光临，我公司成立于 2003 年……”。用户只想找客服电话，这些字全是路障。苹果官网一句话：“iPhone 16，强，翻天。”</p></li>
<li><p><b>6. 导航要像街头指示牌，一眼看懂</b> 好导航像马路上的指示牌：需要的时候准时出现、清晰醒目。再配上面包屑“首页 &gt; 女装 &gt; 连衣裙”。用户随时知道自己在哪、怎么回去。</p><p class="ex"><i>例</i>淘宝把“首页、购物车、我的”固定在底部。不管逛多深，一抬手就能回家。用户在网站里迷路，和在商场里迷路一样，只想赶紧出去。</p></li>
<li><p><b>7. 可用性测试不用贵：找 3 个人，一个上午测一次</b> 别把可用性测试当科研项目。找 3 个普通用户，给几个典型任务，看着他们用，记下卡住的地方。一个上午就能发现 80% 的问题。精髓是早测、常测。</p><p class="ex"><i>例</i>点餐小程序原型做好，直接拉 3 个同事来“帮我点一份宫保鸡丁”。有人在支付页卡住，有人找不到优惠券入口，10 分钟问题全暴露了。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：可用性的基本原则（第 1–6 章）</b> 三条定律加用户真实行为：用户扫描不阅读、选择差不多就行。设计手法：为扫描设计、借用惯例、视觉层级分明、删繁就简、导航清晰。</p><p class="ex"><i>例</i>就像高速公路广告牌：司机只有 3 秒钟看，字大、信息少、一眼懂。网页也一样，用户只给你几秒钟，这部分教你在这几秒里把事说清楚。</p></li>
<li><p><b>第二部分：让用户顺利上路（第 7 章）</b> 首页是网站的“大堂”，几秒钟内必须回答三个问题：这是什么网站？我能干什么？为什么选你不选别人？</p><p class="ex"><i>例</i>携程首页一眼就懂：订机票酒店的，搜索框在正中间。反观某些企业官网，一屏轮播图配“携手共创美好未来”，三个问题一个都没回答。</p></li>
<li><p><b>可用性之争：农夫和牧牛人为什么总吵架（第 8 章）</b> 团队里关于可用性的争论吵不出结果，因为人人都从自己立场出发。解法是别争对错，让真实用户投票——也就是做测试。</p><p class="ex"><i>例</i>老板要首页加轮播大图，设计师说没人看。别吵，找 5 个用户来，看看有几个人点轮播图，数据一摆出来，争论自然结束。</p></li>
<li><p><b>自己动手的可用性测试（第 9–10 章）</b> 低成本测试全流程：怎么招人、怎么出任务、测试时只看不说。核心一句话：可用性就是基本礼貌，别给用户添麻烦。</p><p class="ex"><i>例</i>每月抽一个上午，请 3 个用户用 20 分钟。你会发现一堆自己天天看却视而不见的问题。</p></li>
<li><p><b>移动时代与“救命，老板要我……”（第 11–13 章）</b> 移动端屏幕小、场景碎片化，可用性要求更高。最后一章教你怎么跟老板沟通：把“你错了”说成“我们一起让用户更爽”。</p><p class="ex"><i>例</i>老板要在首页塞 8 个入口，别硬顶。“我们找 3 个用户试试，看他们找不找得到充值入口？”争论变成一次 30 分钟的小测试。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-22">
  <div class="card-top"><span class="card-no">NO.22</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/2297549/" target="_blank" rel="noopener">豆瓣 8.3 · 4517人评价</a></div>
  <h3>《用户体验要素》</h3>
  <p class="meta">The Elements of User Experience · 杰西·詹姆斯·加勒特 · 机械工业出版社 · 2003</p>
  <p class="lede">用“五个层面”把产品工作从战略讲到视觉。产品经理和设计师的共同语言。</p>
  <div class="thesis"><p>用户体验不是界面美不美。它是一个五层系统：战略、范围、结构、框架、表现，从抽象到具体。下层支撑上层：战略错了，界面再漂亮也没用。</p>
<p>2003 年出版时人人都在谈用户体验，却没人说得清它包括什么、从哪儿下手。这张五层面图一出来，全行业有了共同语言。吵按钮颜色是表现层的问题，争功能优先级回战略层找依据。</p>
<p>它确立了 UX 工作的完整版图。用户体验从公司战略就开始，而不是最后“美化一下界面”的收尾工作。</p></div>
  <details class="fold">
    <summary>核心观点 · 6<span class="chev">›</span></summary>
    <ul><li><p><b>1. 战略层：先回答“我们为什么做，用户为什么用”</b> 这是最底层、也最重要的一层。产品目标：我们想得到什么。用户需求：用户是谁、痛点是什么。想不清楚，上面盖什么楼都是歪的。</p><p class="ex"><i>例</i>外卖 App 战略是“30 分钟必达”，首页就该突出预估时间和超时赔付。战略是“全网最低价”，首页就该突出红包补贴。战略不同，整个产品就不同。</p></li>
<li><p><b>2. 范围层：把战略翻译成“做什么、不做什么”的清单</b> 把战略变成具体清单：功能型产品列功能规格，内容型产品列内容需求。“不做什么”跟“做什么”同样重要，范围不清，项目就无限膨胀。</p><p class="ex"><i>例</i>微信 1.0 只做免费文字和语音消息，不做朋友圈、公众号、支付。范围足够克制，才能快速上线、快速验证。</p></li>
<li><p><b>3. 结构层：决定用户怎么走、信息怎么组织</b> 开始画产品的“骨架”。交互设计（点了按钮发生什么）和信息架构（内容怎么分类、让用户找得到）。这一层看不见，但用得顺不顺全靠它。</p><p class="ex"><i>例</i>淘宝把商品组织成“女装 &gt; 连衣裙 &gt; 夏季连衣裙”的类目树。顺着点，总能找到想要的。12306 买票：查车次→选座→填乘车人→支付，一步接一步不能跳。</p></li>
<li><p><b>4. 框架层：单个页面的布局，按钮放哪儿、导航怎么摆</b> 每个房间的家具摆放图：按钮放哪儿、页面间怎么穿梭、信息怎么呈现。产出就是线框图：先摆对位置，再谈好看。</p><p class="ex"><i>例</i>微信聊天页输入框永远在底部、发送键在右下角，十年没变，因为符合拇指操作。框架层摆错了，表现层再美也救不回来。</p></li>
<li><p><b>5. 表现层：视觉是最后一步，不是第一步</b> 用户直接看到的东西：颜色、字体、图标、间距。作用是把下面四层的决策用最美的方式呈现。项目一启动就先做视觉稿，做出来也只是“好看的空壳”。</p><p class="ex"><i>例</i>先定户型再买沙发：户型没定就买了欧式大沙发，可能门都进不去。先画线框图把布局定死，再上视觉，才不会返工。</p></li>
<li><p><b>6. 下层决定上层：地基歪了，装修再好也白搭</b> 五层自下而上依赖：改上层容易，改下层上面层层跟着动。出问题别急着改界面，先一层层往下问：战略错了？范围不清？还是结构乱了？</p><p class="ex"><i>例</i>电商 App 转化率低，老板让按钮做大做红，改完没起色。病根在结构层：结算要填 12 项信息，用户嫌烦直接放弃。结构层的问题，表现层救不了。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>开篇：用户体验为什么重要</b> 用户体验是产品在用户手里留下的全部印象和感受。体验差，用户用脚投票，每个接触点都在塑造口碑。</p><p class="ex"><i>例</i>买手机不只看参数，还在意开箱、系统、客服。这些加起来才是用户体验：它不是某个部门的事，是产品的全部。</p></li>
<li><p><b>第一章：战略层——产品目标与用户需求</b> 产品目标要具体可衡量，用户需求要靠调研而不是拍脑袋。两者对齐，项目才有主心骨。</p><p class="ex"><i>例</i>滴滴早期战略很清楚。目标是“让更多人打到车”，用户痛点是“打车难、等待久”。所有功能都围着这个转，没有一个多余动作。</p></li>
<li><p><b>第二章：范围层——功能规格与内容需求</b> 把战略变成清单：功能型产品写功能规格，内容型产品写内容需求。排优先级、敢说“不做”，防止需求膨胀。</p><p class="ex"><i>例</i>像列购物清单去超市：写下“只买牛奶、鸡蛋、面包”，才能抵挡住零食区的诱惑。</p></li>
<li><p><b>第三章：结构层——交互设计与信息架构</b> 产品的骨架。交互设计管“用户一步步怎么操作”，信息架构管“内容怎么分类组织”。产出是流程图、网站地图这些看不见、但决定顺不顺的东西。</p><p class="ex"><i>例</i>宜家的路线是设计好的：你顺着箭头逛完全场，不知不觉买了一堆计划外的东西。用户以为自己在逛，其实每一步都在设计之中。</p></li>
<li><p><b>第四章：框架层——界面、导航、信息设计</b> 单个页面怎么布局：元素放哪儿、导航怎么做、信息怎么排版。先画线框图验证布局，再谈美观。</p><p class="ex"><i>例</i>像摆家具：沙发对电视、餐桌挨厨房，位置对了住着才顺。App 的搜索框放顶部、主按钮放拇指够得着的地方，一个道理。</p></li>
<li><p><b>第五章：表现层——视觉设计</b> 色彩、字体、图标、风格统一。视觉不只是好看，还要强化品牌、引导视线、传达层级。</p><p class="ex"><i>例</i>饿了么的蓝、美团的黄，瞟一眼颜色就知道是谁——这就是表现层的品牌识别力。</p></li>
<li><p><b>收尾：要素的应用</b> 框架在不同项目里灵活用：内容型和功能型产品侧重点不同。层与层之间来回迭代，不是一条道走到黑。</p><p class="ex"><i>例</i>做新闻 App，信息架构是重头戏；做修图 App，交互设计是重头戏。菜谱是参考，炒菜还得看火候。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-23">
  <div class="card-top"><span class="card-no">NO.23</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/1288844/" target="_blank" rel="noopener">豆瓣 8.2 · 4051人评价</a></div>
  <h3>《设计心理学》</h3>
  <p class="meta">The Design of Everyday Things · 唐纳德·诺曼 · 中信出版社 · 1988</p>
  <p class="lede">从“门总推错”讲起：用户犯错通常不是人笨，是设计蠢，好设计顺着人的心理来。</p>
  <div class="thesis"><p>当用户用不好一个产品时，错的不是用户，是设计。诺曼用认知心理学解释人机交互。人靠心智模型猜测产品怎么工作，靠产品给的提示验证。设计要做的，就是填平“执行鸿沟”和“评估鸿沟”。让人知道怎么下手，也知道做成了没。</p>
<p>1988 年出版时设计界还在比造型，诺曼第一个系统地把认知心理学搬进设计。他开创了“以用户为中心的设计”。那扇分不清推拉的“诺曼门”，成了全世界设计课的开场案例。</p>
<p>它重新定义了“错误”：用户犯的每一个错，都是设计欠用户的一个解释。防呆设计、可用性测试、以用户为中心的设计流程，全都从这里生根发芽。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 不是你笨，是那扇门有问题（诺曼门）</b> 分不清推拉的门，不是用户观察力差，是设计没把“怎么开”这件事说清楚。不需要说明书、不需要试错的东西，才是好设计。</p><p class="ex"><i>例</i>双手抱着快递走到玻璃门前，推一下没开，拉一下开了，进去又被第二扇门挡住。装横杆的门只能推、装把手的门只能拉——设计本身就该把答案写好。</p></li>
<li><p><b>2. 示能：东西要“长得像”它的用法</b> “示能”指东西的外形材质本身就在告诉你它能怎么用：椅子示能坐，按钮示能按。好的示能让用户不用学、不用猜，看一眼就知道怎么下手。</p><p class="ex"><i>例</i>剪刀的指环明明白白告诉你手指伸哪儿、怎么用力。微波炉上一排一模一样的按钮，每个都示能按。却没一个告诉你按了会发生什么。</p></li>
<li><p><b>3. 意符：明确告诉用户“这里可以动手”</b> “意符”是“请在这里操作”的明确信号。比如按钮的阴影、链接的下划线、“向右滑动解锁”的箭头。没有意符，用户面对能用的东西也不知道从哪儿下手。</p><p class="ex"><i>例</i>App 里纯文字“提交”，用户不敢点。加上圆角边框和阴影，立刻有了“按钮感”。电梯开门键上的“◀▶”符号也是意符。</p></li>
<li><p><b>4. 映射：控制器和效果的对应关系要符合直觉</b> “映射”指控制器和它控制的东西的对应关系。空间排布对应、方向对应：往上推就是开大，往左拨就是选左边，顺着人的直觉来。</p><p class="ex"><i>例</i>老式燃气灶四个炉头排成方形、四个旋钮排成一排，永远记不住哪个管哪个。把旋钮也排成方形一一对应，看一眼就会。</p></li>
<li><p><b>5. 心智模型：用户脑子里对“这怎么工作”的猜想</b> 用户永远是靠猜来用产品的：猜对了用得顺，猜错了就犯错。设计师的任务是让产品符合用户已有的猜想，或帮用户建立正确的猜想。</p><p class="ex"><i>例</i>很多人以为把文件拖进回收站就是彻底删除了，结果只是挪了个地方，硬盘照样满。好的设计顺着用户的心智模型来，不嘲笑它。</p></li>
<li><p><b>6. 错误分两种：手滑和想错，好设计都要防得住</b> “手滑”是想得对但手没跟上（点错按钮），“想错”是理解就错了（转错人）。手滑靠撤销、确认兜底，想错靠提示和反馈纠正。人一定会犯错，设计要把代价降到最低。</p><p class="ex"><i>例</i>微信消息两分钟内可撤回，就是给手滑兜底。某些 App“删除聊天记录”一点就没，连确认都没有。这是在惩罚人类的正常失误。</p></li>
<li><p><b>7. 反馈和约束：做了要吭声，关键处要设限</b> “反馈”是操作后给个回应（声音、震动、动画），让人知道成了没成。“约束”是主动限制错误发生（插不错、跳不过）。反馈管事后安心，约束管事前防呆。</p><p class="ex"><i>例</i>洗衣机按启动键“滴”一声、亮灯、开始转，三重反馈告诉你“收到”。SIM 卡一角斜切，只能以唯一正确的方向插进去。物理约束让你想犯错都没机会。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一章：日常用品的“心理病理学”</b> 一堆“坏设计”展览。分不清推拉的门、记不清旋钮管哪个炉头的灶、总按错的电话机。用户受苦，病根在设计。</p><p class="ex"><i>例</i>读完你会发现生活中处处是“带病上岗”的设计，而你受的那些气，真不是你的错。</p></li>
<li><p><b>第二章：日常行为的心理学——行动的七个阶段</b> 人完成行动要经过七个阶段：定目标、定意图、定动作、执行、感知、解释、评估。好设计填平“执行鸿沟”（不知道怎么下手）和“评估鸿沟”（不知道做成了没）。</p><p class="ex"><i>例</i>调空调到 26 度：遥控器按钮太多找不到温度键，就是执行鸿沟。按了没任何显示，你不知道设没设上，就是评估鸿沟。</p></li>
<li><p><b>第三章：头脑中的知识与世界上的知识</b> 人做事靠两种知识：记在脑子里的和写在世界上的。好设计尽量把知识放在世界上，别考验用户的记忆力。</p><p class="ex"><i>例</i>朋友家 8 个电灯开关，你一个个试，这是在逼你瞎猜。旁边贴个小标签“客厅”“阳台”，就不用猜了。</p></li>
<li><p><b>第四章：知道要做什么——约束、可发现性与反馈</b> 让用户“知道该干嘛”的三大法宝：约束、可发现性、反馈。约束限制错误可能，可发现性靠示能和意符，反馈是做了给回应。这是全书最实用的设计工具箱。</p><p class="ex"><i>例</i>乐高积木凸起和凹槽只有一种拼法，拼错了根本卡不进去。约束的大师：小孩不用教就会玩。</p></li>
<li><p><b>第五章：人为错误？不，是糟糕的设计</b> 系统讲错误：手滑 vs 想错、为什么指责用户没用，以及防错设计的方法。从根上让错误发生不了，或让错误代价足够小。</p><p class="ex"><i>例</i>药瓶“按压再旋转”瓶盖：小孩打不开，大人一看就懂。软件里删文件前输入文件名确认，高危操作不让你手滑就酿大祸。</p></li>
<li><p><b>第六、七章：设计思维与商业中的设计</b> 从单品设计上升到方法论。以用户为中心的设计流程：观察、想法、原型、测试，不断迭代。以及设计如何在商业组织里落地。</p><p class="ex"><i>例</i>像做菜：先尝一口（观察用户）、想想缺啥（想法）。小火试做一份（原型）、请人试吃（测试）。不好吃就回炉。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-24">
  <div class="card-top"><span class="card-no">NO.24</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/3279105/" target="_blank" rel="noopener">豆瓣 8.7 · 1370人评价</a></div>
  <h3>《交互设计精髓》</h3>
  <p class="meta">About Face: The Essentials of Interaction Design · 艾伦·库珀 · 电子工业出版社 · 2007</p>
  <p class="lede">交互设计的开山之作：别堆功能，先搞清用户想干成什么事。</p>
  <div class="thesis"><p>库珀是“交互设计”一词的提出者。他发现：软件按工程师的脑回路长大，用户用起来一头雾水。</p>
<p>全书核心：目标导向设计。别问用户要什么功能，问他想达成什么目标。功能是手段，目标才是目的。</p>
<p>人物角色、场景剧本、目标导向——源头都在这本书里。今天产品和交互设计天天用的方法，从这里来。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 别问用户要什么功能，问他想达成什么目标</b> 用户说“要个导出按钮”，真实目标可能是“月底交报表”。只给按钮，他还得自己排版；直接给到排好版的报表，问题才算解决。</p><p class="ex"><i>例</i>打车软件：用户说“我要选车型”。真实目标是“准时赶飞机”。好设计直接告诉你“现在出发，50 分钟到，赶得上”。</p></li>
<li><p><b>2. 给用户起个名字、编个故事：人物角色</b> 别对着“用户”这种模糊概念设计。虚构几个具体的人——有名字、年龄、习惯和目标。每次决策都问：他会这么用吗？具体的人能让全团队想到一块去。</p><p class="ex"><i>例</i>给老年人做 App，别想“老年用户”四个字。想“王阿姨，68 岁，眼花，怕点错”。这行小字她看得清吗？这按钮她敢点吗？立刻有画面感。</p></li>
<li><p><b>3. 软件别按工程师的思路长，要按用户的思路长</b> 工程师心里有“实现模型”，用户脑子里有“心理模型”。难用的软件，错在把前者直接端给用户。好设计是翻译：里面再复杂，端出来的是用户那套说法。</p><p class="ex"><i>例</i>早期数码相机菜单写“ISO 感光度”，用户想的是“屋里太暗，拍清楚点”。订酒店：系统管“房型编码”，用户只想选“大床还是双床”。</p></li>
<li><p><b>4. 为“中间用户”设计：新手会长大，专家是少数</b> 用户分三类：新手会长大，专家是少数，大多数人永远“会用但不精通”。别为新手做成幼儿园，也别为专家堆满快捷键。抓住中间用户，两头都照顾得到。</p><p class="ex"><i>例</i>微信：新手只会发语音，用久了自然学会发红包。开车也一样：同一辆车，是给“会开但不飙车”的大多数人设计的。</p></li>
<li><p><b>5. 每个应用都有“姿态”：干活的和打扰人的不是一回事</b> 主权姿态的应用独占屏幕、长时间使用，比如 Word，用户要它强大。瞬时姿态的应用弹出来三秒就走，比如闹钟，用户要它别烦人。用错姿态就是灾难。</p><p class="ex"><i>例</i>闹钟响时只给“关闭 / 稍后”两个大按钮就对了。要是弹窗里还让你选铃声分类、设重复规则，起床气会更大。</p></li>
<li><p><b>6. 撤销是最好的后悔药：让人敢点，错了能回</b> 用户不敢探索，是怕点错了回不来。强大的撤销能把“万一错了”的焦虑清零，人就敢大胆试。确认框是偷懒设计：把软件该承担的风险转嫁给了用户。</p><p class="ex"><i>例</i>微信消息两分钟内可撤回，发错群还能抢救，大家才敢随手发。PS 里 Ctrl+Z 一路退回去，你才敢大胆调色。</p></li>
<li><p><b>7. 别让用户干本该软件干的活</b> 记住单号再粘贴、同一信息填三遍、导文件前先建五个文件夹。这些“附加工作”都是软件懒、让人勤。凡是软件能记住、算出来、自动填的，都不该麻烦用户。</p><p class="ex"><i>例</i>12306 记住常用乘车人，一点就选好。手机验证码自动填充：系统能读短信，就别让人眼看手输。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一篇 认识用户（一）：目标导向与两种模型</b> 方法论地基：目标导向设计、实现模型与心理模型、用户三类划分。</p><p class="ex"><i>例</i>做外卖 App，先分清用户目标是“快点吃上”，而不是“浏览美食图”。后面所有设计才有准星。</p></li>
<li><p><b>第一篇 认识用户（二）：从研究到需求</b> 怎么真正了解用户：定性研究、提炼人物角色、写场景剧本、整理需求。</p><p class="ex"><i>例</i>给快递员设计 App，去跟车跑一天，而不是在办公室里脑补他需要什么。</p></li>
<li><p><b>第二篇 设计的行为与形式（一）：原则、姿态与流</b> 从需求到设计：设计原则、应用“姿态”选择、让操作顺滑的“流”。</p><p class="ex"><i>例</i>音乐 App：播放页是主权姿态要沉浸，音量弹窗是瞬时姿态要快。调子定错，全片垮掉。</p></li>
<li><p><b>第二篇 设计的行为与形式（二）：细节中的魔鬼</b> 交互细节：消除附加工作、设计好行为、用隐喻降低学习成本。</p><p class="ex"><i>例</i>删除文件拖进废纸篓——“扔东西”这个隐喻，人人一学就会。</p></li>
<li><p><b>第三篇 数据与操作：搜索、撤销、文件与输入</b> 硬骨头：搜索、撤销、保存按钮、数据输入、直接操作。</p><p class="ex"><i>例</i>网盘自动保存让你告别 Ctrl+S，撤销键让你敢删敢改。</p></li>
<li><p><b>第三篇 控件与反馈：窗口、对话框与错误处理</b> 界面零件的正确用法：窗口、控件、对话框，以及不招人烦的报错写法。</p><p class="ex"><i>例</i>动不动弹“你确定吗”是最懒的设计。好报错告诉用户“出什么事了、怎么修”，而不是甩一句“错误 404”。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-25">
  <div class="card-top"><span class="card-no">NO.25</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/3323633/" target="_blank" rel="noopener">豆瓣 8.6 · 13047人评价</a></div>
  <h3>《写给大家看的设计书》</h3>
  <p class="meta">The Non-Designer's Design Book · 罗宾·威廉姆斯 · 人民邮电出版社 · 2012</p>
  <p class="lede">非设计师的救星：四个简单原则，让你的 PPT、海报从“业余”变“专业”。</p>
  <div class="thesis"><p>很多人不是没审美，是没人告诉他规则。作者把平面设计归纳成四个原则：亲密性、对齐、重复、对比。</p>
<p>核心论点：设计不是天赋，是手艺。业余和专业的差距，是几个基本原则，不是灵感。</p>
<p>全书都是“错误示范 vs 正确示范”的对比图，看完立刻能用。无数人的设计启蒙都是它。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 亲密性：关系近的放一起，关系远的分开</b> 距离近，读者默认它们是一伙的；离得远，默认没关系。别把标题和正文隔老远，也别把不相关的字挤在一起。分组是最便宜的信息组织手段。</p><p class="ex"><i>例</i>菜单上“宫保鸡丁 38 元”：菜名价格必须挨着，一眼是一对。价格全对齐右边、菜名在左边，客人得来回找。</p></li>
<li><p><b>2. 对齐：每个元素都要和另一个元素发生关系</b> 页面上任何东西都不能随手乱放。每个元素都要和另一个元素有视觉连线。左对齐、居中都行，关键是“有意识”。业余感的最大来源，就是元素各摆各的。</p><p class="ex"><i>例</i>简历里时间都右对齐、公司名都左对齐，立刻整齐。时间忽左忽右，HR 看着就累。</p></li>
<li><p><b>3. 重复：让页面有“一家子”的感觉</b> 把某些视觉元素在全篇重复：同样的标题样式、色块、线条装饰。重复带来统一感和专业感，还能形成品牌记忆。一页 PPT 用五种标题颜色，看着像拼盘。</p><p class="ex"><i>例</i>咖啡店菜单、海报、外卖袋都用同一种牛皮纸色和手写体，你立刻记得住它。每次换风格，你就记不住。</p></li>
<li><p><b>4. 对比：要对比就对比得彻底，犹犹豫豫最难看</b> 大小、粗细、颜色拉开差距就拉干脆。最忌“有点不一样又不太一样”：标题只比正文大一号，读者以为是排错了。对比让重点一眼跳出来。</p><p class="ex"><i>例</i>海报主标题 72 号加粗、副标题 24 号细体，一眼分清主次。主标题 36 号、副标题 32 号，看着就像没调好。</p></li>
<li><p><b>5. 字体分六大家族，先认家族再谈搭配</b> 英文字体六大类：古典衬线、现代衬线、粗衬线、无衬线、手写体、装饰体。中文也有对应感觉：宋体正式，黑体利落。认出“家族”，才知道什么气质往哪儿用。</p><p class="ex"><i>例</i>婚礼请柬用手写体，科技发布会用无衬线黑体。儿童乐园海报用严肃宋体加粗，就像让会计主持婚礼，浑身别扭。</p></li>
<li><p><b>6. 字体搭配的铁律：要么极像，要么极不像</b> 两种“有点像又不太像”的字体放一起，像穿错袜子。要么用同一家族的粗细变化，要么选反差极大的两种。一份设计里字体别超过三种。</p><p class="ex"><i>例</i>标题粗黑体、正文细黑体：同一家族，稳。标题宋体、正文仿宋：远看像双胞胎、细看又不是，处处别扭。</p></li>
<li><p><b>7. 去掉“默认感”：软件默认样式是业余的代名词</b> Word 默认宋体五号、PPT 默认模板——这些“默认”看着业余。因为它们没经过任何设计决策。专业第一步不是加特效，是把默认的东西亲手调一遍：字号、行距、对齐、间距。</p><p class="ex"><i>例</i>同样一份通知，改成“段落间空一行、关键句加粗”。立刻从“随手一贴”变成“正式文件”。设计感来自克制，不是装饰。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分 设计原理之一：亲密性</b> 第一个原则：用距离远近分组信息，大量“改前 vs 改后”对比实例。</p><p class="ex"><i>例</i>名片上姓名电话抱团、公司信息抱团，立刻清爽。就像整理抽屉：袜子和袜子放一起。</p></li>
<li><p><b>第一部分 设计原理之二：对齐</b> 对齐的几种方式和威力：全篇统一、有意识，左对齐最稳。</p><p class="ex"><i>例</i>海报上时间地点联系方式左对齐成一条线，观众顺着读不费劲。每行都居中，眼睛得左右找。</p></li>
<li><p><b>第一部分 设计原理之三：重复</b> 用重复制造统一感：重复颜色、形状、线条、字体，让零散元素成整体。</p><p class="ex"><i>例</i>系列海报每张顶部同一条红色横线，观众立刻知道是一套的。像音乐里的副歌，一响就知道“到这儿了”。</p></li>
<li><p><b>第一部分 设计原理之四：对比</b> 对比的运用和禁忌：大小粗细颜色都能对比，但半吊子对比不如不做。</p><p class="ex"><i>例</i>促销海报“5 折”巨大加粗，重点自己跳出来。只大一点点，顾客还以为你心虚。</p></li>
<li><p><b>第二部分 字体设计之一：认识六大字体类别</b> 六大字体家族：古典衬线、现代衬线、粗衬线、无衬线、手写体、装饰体。</p><p class="ex"><i>例</i>银行年报用古典衬线体显得可信，音乐节海报用装饰体显得好玩。选错家族像穿拖鞋去面试。</p></li>
<li><p><b>第二部分 字体设计之二：字体对比与搭配规则</b> 字体搭配规则：对比要强烈、避免冲突，一页不超过三种字体。</p><p class="ex"><i>例</i>请柬标题用华丽手写体、正文用朴素宋体：反差大，反而互相成就。</p></li>
<li><p><b>第三部分 设计小知识与综合练习</b> 致命细节：寡妇孤儿行、首字下沉、标点规范，外加四个原则的综合实战。</p><p class="ex"><i>例</i>段落最后一行一个字孤零零掉下来（寡妇行），像衣服线头没剪。调一下字距就能收回去。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-26">
  <div class="card-top"><span class="card-no">NO.26</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/23708491/" target="_blank" rel="noopener">豆瓣 7.6 · 1812人评价</a></div>
  <h3>《设计师要懂心理学》</h3>
  <p class="meta">100 Things Every Designer Needs to Know About People · 苏珊·魏因申克 · 人民邮电出版社 · 2013</p>
  <p class="lede">100 条“人就是这样”的心理学结论，每条翻译成一句设计该怎么做。</p>
  <div class="thesis"><p>作者是行为心理学家。她发现设计师和心理学隔着一堵墙：论文看不懂，看懂了不知怎么用。</p>
<p>她把跟设计最相关的 100 个原理分成十章。按“人如何看、如何读、如何记”来分。每条都是“结论 + 解释 + 设计小贴士”。</p>
<p>这是本案头辞典，不用从头读到尾。吵架时能甩出依据，是它给设计师最大的底气。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 人一次只能记住三四件事，别考验用户的记性</b> 短时记忆一次只能装 3 到 4 个组块。别让用户“记住验证码再填”，也别让他“记住上一页价格再回来比”。这样的设计都是在为难人。记不住是脑子说了算，不是用户笨。</p><p class="ex"><i>例</i>导航菜单一口气列 20 个选项，用户看完就忘。拆成 4 到 5 个一组，世界都清净了。背手机号你也 3-4-4 分段，大脑天生这么干。</p></li>
<li><p><b>2. 开头和结尾最容易被记住，重要的放两头</b> 系列位置效应：一串东西里开头和结尾最容易记住，中间最容易忘。最重要的放开头，其次放结尾，中间放次要的。别把王牌藏中间。</p><p class="ex"><i>例</i>App 底部导航 5 个位置，最重要的“首页”和“我的”放两端。面试自我介绍开头结尾精心准备，中间经历 HR 转头就忘。</p></li>
<li><p><b>3. 选择越多，人越难下手</b> 希克定律：选项越多，决策越慢；多到一定程度，人干脆不选了。别以为功能多等于好。好设计替用户做减法，或分步骤呈现。</p><p class="ex"><i>例</i>超市 30 种果酱，顾客逛一圈空手走；只摆 6 种，销量反而更高。朋友纠结吃饭，你说“火锅还是日料”他立刻能定。</p></li>
<li><p><b>4. 人看别人怎么做，自己就跟着做</b> 社会认同：拿不准时，人看周围人怎么做。评分、销量、评论都在说“很多人买了，你放心”。普通人的评价比专家管用，因为用户觉得“他跟我一样”。</p><p class="ex"><i>例</i>两家奶茶店，一家排长队一家没人，你大概率去排队那家。“这么多人选”本身就是信号。</p></li>
<li><p><b>5. 别让人“回忆”，要让人“认出来”</b> “再认”比“回忆”省力得多：从选项里认出一个，比凭空想起一个容易。好界面多用“选”少用“填”，多给提示少考记忆。让用户凭空回忆的设计都反人性。</p><p class="ex"><i>例</i>登录用“从相册选出设过的三张图”，比“输入密保答案”容易。就像考试：选择题永远比填空题简单。</p></li>
<li><p><b>6. 人在压力下会变“笨”，关键时刻界面越简单越好</b> 耶克斯 - 多德森定律：一点紧张能专注，压力一大表现直线下降。赶时间、着急时，平时会用的功能都不会了。关键流程要简单到“闭眼走对”。</p><p class="ex"><i>例</i>赶飞机时改签，平时三步搞定，着急时每步都像迷宫。好流程只剩“改到哪班、点确定”两步。</p></li>
<li><p><b>7. 人的眼睛会被“脸”和“会动的东西”吸走</b> 视觉硬连线：对人脸和运动极度敏感，这是进化留下的。页面放张人脸，目光一定先去那儿；有地方在闪，别的都看不见。用好是引导，用滥是灾难。</p><p class="ex"><i>例</i>落地页放张微笑客服照片，转化率常上涨，人脸自带信任感。表单旁放闪烁广告条，用户就填不好表了。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一章 人是如何看的</b> 视觉原理：先看整体轮廓、余光先发现运动，格式塔原理决定我们怎么分组信息。</p><p class="ex"><i>例</i>网页上两个按钮离得近，你默认它们是一对。离得远，觉得没关系——“接近性”在替你分组。</p></li>
<li><p><b>第二章 人是如何阅读的</b> 阅读冷知识：认词靠字形轮廓，全大写反而难读；屏幕阅读是扫读不是逐字读。</p><p class="ex"><i>例</i>没人逐字读你的长文案，用户扫小标题和加粗。重要的词加粗、段落要短，是给“扫读”准备的。</p></li>
<li><p><b>第三章 人是如何记忆的</b> 短时记忆 3~4 组块，开头结尾记得牢，再认比回忆容易。</p><p class="ex"><i>例</i>用户说“我上次是这么操作的”，很可能记错了。记忆每次回想都会被改写，不如直接观察他操作。</p></li>
<li><p><b>第四章 人是如何思考的</b> 心智模型、认知负荷和心流：人对东西怎么运转有预想，超负荷就宕机。</p><p class="ex"><i>例</i>用户默认共享单车“扫码就开锁”。你的车还要先按隐藏按钮，他的心智模型就崩了。</p></li>
<li><p><b>第五~六章 注意力与动机</b> 注意力与动机：一次只能好好干一件事；多巴胺爱不可预测的奖励，目标要拆小。</p><p class="ex"><i>例</i>集卡活动让人停不下来，因为“下一张是啥”不可预测。把大目标拆成“再集 2 张就换购”，比“集满 50 张”有劲。</p></li>
<li><p><b>第七~十章 社会性、感觉、犯错与决策</b> 社会性与情绪：从众、面子；人会犯错，要做容错；决策怕损失、爱走捷径。</p><p class="ex"><i>例</i>“仅剩 2 件”比“库存充足”更能促单。人对“失去”的敏感，远超对“得到”的渴望。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-27">
  <div class="card-top"><span class="card-no">NO.27</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/1314262/" target="_blank" rel="noopener">豆瓣 8.1 · 2348人评价</a></div>
  <h3>《情感化设计》</h3>
  <p class="meta">Emotional Design: Why We Love (or Hate) Everyday Things · 唐纳德·诺曼 · 电子工业出版社 · 2005</p>
  <p class="lede">好用只是及格：让人掏钱、念念不忘的，是设计里的“情绪价值”。</p>
  <div class="thesis"><p>写完《设计心理学》讲“好用”后，诺曼发现了反例。有些东西不好用，人们却爱得不行。</p>
<p>他意识到漏掉了情感。认知分三层：本能层管好不好看，行为层管好不好用，反思层管有没有意义。</p>
<p>情绪直接参与决策：好看的东西人觉得更好用，有故事的东西人愿意多付钱。今天说的“情绪价值”，源头多从这本书来。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 设计有三层：好看、好用、有意义</b> 诺曼借脑科学提出三层认知：本能层管第一印象，是秒级直觉。行为层管顺不顺手；反思层管事后回味——这东西代表什么、跟我有什么故事。三层都讨好，才是完整设计。</p><p class="ex"><i>例</i>买跑鞋：配色戳你（本能层），上脚不磨脚（行为层）。它是你跑完首个半马那双（反思层），三层全中，这牌子你一辈子都认。</p></li>
<li><p><b>2. 好看的东西，真的更好用</b> 全书最出名的结论：好看的产品，用户会觉得更好用。哪怕功能一模一样。愉悦让人放松、思路开阔，小毛病就包容了。美不是装饰，是可用性的一部分。</p><p class="ex"><i>例</i>两个功能相同的记账 App，界面精美的那个你觉得“它算得准”。界面丑的，卡一下你就想卸载。颜值自带“容错光环”。</p></li>
<li><p><b>3. 开心让人有创意，焦虑让人抠细节</b> 正面情绪让人思维发散、更有创造力，也更能容忍小问题。负面情绪让人聚焦细节、谨慎小心。设计要看场景配情绪：探索型产品给松弛感，关键型产品给掌控感。</p><p class="ex"><i>例</i>旅行 App 用明亮插画和轻松文案，你才有心情慢慢逛。银行 App 转大账时，你要的是冷静清晰——这时候卖萌只会让你更慌。</p></li>
<li><p><b>4. 让人掏钱的，往往是反思层</b> 反思层是最高一层：文化、身份、记忆、自我形象。好不好用只是入场券，真正让人掏钱的，是“这东西像我”“它有故事”。品牌忠诚度基本是反思层在打工。</p><p class="ex"><i>例</i>有人花几万买机械表，买的不是准时，是“匠心”“传承”的故事。老字号糕点味道不如新网红，但“小时候的味道”值三倍价钱。</p></li>
<li><p><b>5. 玩乐不是不务正业：有趣让人愿意学</b> 好玩的设计降低学习门槛，让人主动探索。游戏化核心是给人“掌控感 + 小惊喜”的循环。人在玩的状态下学东西最快，也最宽容。</p><p class="ex"><i>例</i>背单词 App 做成闯关，连击给特效——枯燥背诵变成“再来一局”。宜家说明书没一个字，全是小人漫画，跟下来还有成就感。</p></li>
<li><p><b>6. 机器人也得懂点“人情世故”</b> 诺曼预测：未来的机器必须处理情感。不是让它们有感情，而是能读懂人的情绪、做出合乎情境的反应。你着急时还慢悠悠讲笑话的语音助手，就是情感设计不及格。</p><p class="ex"><i>例</i>加班到半夜，智能音箱说“辛苦了，要不要来点轻音乐”。比机械报时贴心一百倍。扫地机器人卡住说“我被困住了”，卖个萌人就不想踢它。</p></li>
<li><p><b>7. 有时候，一点点“不好用”是故意的</b> 诺曼的反直觉观点：不是所有东西都要极致顺滑。有些“摩擦”是设计的一部分。重要的决定就该慢一点、难一点，让人停下来想一想。反思层有时需要行为层让路。</p><p class="ex"><i>例</i>删除文件时的二次确认、转账时的人脸识别：多这一步很烦。但它逼你确认“我是认真的”。就像茶道：明明有速溶茶，人们还是愿意花半小时走流程。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>序幕：三个茶杯</b> 开篇故事：三个茶杯——好看的、好用的、有纪念意义的，引出全书问题。</p><p class="ex"><i>例</i>就像衣柜里那件起球却舍不得扔的卫衣：不好看，也不保暖了。但那是毕业旅行买的——喜欢一个东西的理由，从不止“好用”。</p></li>
<li><p><b>第一章 好看的东西更好用</b> 全书最出名的结论：美感提升感知可用性，情绪直接影响人对产品的评价。</p><p class="ex"><i>例</i>试驾两辆参数相同的车，内饰精致那辆你觉得“动力都更顺”。日常直觉，背后有实验撑腰。</p></li>
<li><p><b>第二章 情感与设计的多种面孔</b> 情绪和认知纠缠在一起：正面负面情绪各有用处，设计要“看菜下碟”。</p><p class="ex"><i>例</i>过山车故意制造紧张——负面情绪在这里是商品。医院挂号机让你紧张，就是事故。</p></li>
<li><p><b>第三章 设计的三个层次：本能、行为、反思</b> 理论核心：拆解三层各自管什么，以及三层怎么配合、怎么打架。</p><p class="ex"><i>例</i>买车：展厅一见钟情（本能层），试驾方向盘顺手（行为层）。跟邻居说“这是限量版”（反思层）——这就是“买买买心理学”。</p></li>
<li><p><b>第四章 乐趣和游戏</b> “好玩”的设计价值：游戏化、惊喜感、掌控感让人更愿学、更宽容、更忠诚。</p><p class="ex"><i>例</i>迪士尼把排队区做成游览动线还时不时互动——两小时排下来不觉得亏。铁栏杆排队两小时，能把人排抑郁。</p></li>
<li><p><b>第五~六章 有情感的机器与机器人的未来</b> 展望未来：机器读懂人的情绪、做出得体反应，以及人与机器人的情感关系。</p><p class="ex"><i>例</i>车载助手发现你叹气，主动问“要不要换首歌”。机器人长得太像人却差一点，会让人毛骨悚然（恐怖谷）——拟人化是技术活。</p></li>
<li><p><b>第七章 商业世界中的设计 + 尾声</b> 情感设计怎么做成生意：品牌、溢价、忠诚度；尾声“我们都是设计师”。</p><p class="ex"><i>例</i>苹果店的包装把拆箱做成仪式，开箱视频收获百万播放。这不是浪费钱，是反思层在印钞。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-28">
  <div class="card-top"><span class="card-no">NO.28</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/6792322/" target="_blank" rel="noopener">豆瓣 8.6 · 1719人评价</a></div>
  <h3>《认知与设计》</h3>
  <p class="meta">Designing with the Mind in Mind · 杰夫·约翰逊 · 人民邮电出版社 · 2011</p>
  <p class="lede">把认知心理学翻译成界面设计规则：大脑怎么工作，界面就该怎么设计。</p>
  <div class="thesis"><p>每条 UI 规范背后都有脑科学撑腰。人眼的结构、注意力的带宽、记忆的容量，是改不了的硬件限制。设计只能顺着大脑来，不能拧着来。</p>
<p>懂了心理机制，就不用死记规范。错误提示放出错处旁边，菜单比命令行好用，确认页回显关键信息。这些全是同一套原理推导出来的。</p>
<p>每章讲一个心理事实，配一堆界面正反例。短小、好读，读完立刻能用。</p></div>
  <details class="fold">
    <summary>核心观点 · 8<span class="chev">›</span></summary>
    <ul><li><p><b>1. 知觉自带偏见：我们看到的是以为会看到的</b> 大脑看到的不是客观世界，而是按经验“脑补”出来的。第一原则是符合预期：危险用红色、按钮长得像按钮。</p><p class="ex"><i>例</i>删除做成红色加垃圾桶图标，用户秒懂；做成绿色对勾，用户会愣住——预期被违背，用户只会当成 bug。</p></li>
<li><p><b>2. 视觉天生爱找结构：用间距和对齐分组，不用画框框</b> 人脑自动把靠得近、长得像的元素看成一组。用间距和对齐就能“免费”分组，根本不用画框框。</p><p class="ex"><i>例</i>外卖 App 里菜名、价格、图片靠得近，就被自动看成一道菜；间距一乱，用户分不清哪行价格对应哪道菜。</p></li>
<li><p><b>3. 注意力是稀缺资源：一次只让人认真做一件事</b> 注意力像手电，只能照亮一小块。重要信息别藏角落，别同时弹三个弹窗。每多一个抢注意力的东西，任务完成率就掉一截。</p><p class="ex"><i>例</i>支付页面把“确认支付”做大、收起其他链接；表单填到一半弹广告，用户直接关掉走人。</p></li>
<li><p><b>4. 再认容易、回忆难：给选项让用户“认出来”，别让人“背出来”</b> 从一堆东西里挑出见过的很轻松，凭空想起来很费劲。好界面用菜单和历史记录让用户“认”，烂界面让人背编号、背流程。</p><p class="ex"><i>例</i>搜索框自动补全、输入法联想、外卖“再来一单”都是让人“认”；让用户输入 12 位订单号查快递，纯粹在为难记忆。</p></li>
<li><p><b>5. 短期记忆只有三四格：别让用户在心里“端着”信息到处跑</b> 工作记忆只能装三四个“组块”。界面要在用到的地方直接摆出信息，别让用户记住上一页的数字再填到下一页。</p><p class="ex"><i>例</i>转账确认页完整显示“转给谁、转多少钱”，而不是只写“确认转账”四个字。</p></li>
<li><p><b>6. 阅读是反天性的：用户是“扫描”页面，不是“读书”</b> 人脑为说话进化，不是为阅读进化。用户打开页面是“扫”关键词，不是读文章。</p><p class="ex"><i>例</i>更新说明写成“1. 更快了 2. 修了闪退”，比一大段散文强得多。标题、加粗、列表，就是给扫描准备的。</p></li>
<li><p><b>7. 选项太多反而选不出来：给默认、做精简、分步骤</b> 选项越多、越复杂，人越难下决定、事后越不满意。这就是选择悖论。</p><p class="ex"><i>例</i>套餐页摆 12 种资费，用户看完直接关掉——不是不想买，是选不出来；给默认、分步骤，一次只呈现几个选项。</p></li>
<li><p><b>8. 按钮越大越近越好点：重要操作做大，危险操作设坎</b> 点中目标的时间跟大小成反比、跟距离成正比。重要按钮做大、放顺手的位置；危险操作反其道而行之，故意做小、加二次确认。</p><p class="ex"><i>例</i>底部导航按钮又大又近，拇指一点就中；微信删聊天要先左滑再点删除，连设两道坎。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：视觉与知觉（第 1-6 章）</b> 讲眼睛和大脑怎么“看”界面：知觉偏见、格式塔分组、色觉局限。这是全书的地基。</p><p class="ex"><i>例</i>学完就知道：错误提示为什么用红色？分组为什么靠间距？重要按钮为什么不放角落？每条规范背后都有大脑的原理。</p></li>
<li><p><b>第二部分：注意与记忆（第 7-8 章）</b> 注意力一次只能顾一件事，短期记忆只有三四个格子。设计必须顺着这个限制来，不能跟它较劲。</p><p class="ex"><i>例</i>表单分步填，确认页回显关键信息，验证码和提示放同一屏。都是在给大脑的小内存减负。</p></li>
<li><p><b>第三部分：再认、学习与决策（第 9-11 章）</b> 再认比回忆轻松，从经验中学比从零算快，人还经常不理性。顺着这些特点设计，用户“不用学就会”。</p><p class="ex"><i>例</i>“再来一单”、默认选项、选项控制在五个以内——都是在利用人的这些特点。</p></li>
<li><p><b>第四部分：时间要求（第 12 章）</b> 等待的忍耐按秒算：0.1 秒觉得即时，1 秒觉得卡，10 秒人就走了。快和“显得快”同样重要。</p><p class="ex"><i>例</i>按钮一点立刻变色（0.1 秒内给反馈），加载超过 1 秒给进度条。都在跟大脑的等待忍耐度赛跑。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-29">
  <div class="card-top"><span class="card-no">NO.29</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/25744600/" target="_blank" rel="noopener">豆瓣 7.6 · 449人评价</a></div>
  <h3>《微交互》</h3>
  <p class="meta">Microinteractions: Designing with Details · 丹·萨弗 · 人民邮电出版社 · 2013</p>
  <p class="lede">伟大的产品是细节堆出来的。这本书教你设计只有一秒钟的交互：开关、点赞、解锁、提示音。</p>
  <div class="thesis"><p>微交互是围绕一个用例的小而完整的产品瞬间。比如设闹钟、点赞、静音开关、密码强度提示。大功能决定用户买不买，小细节决定用户留不留。</p>
<p>每个微交互都能拆成四个零件。触发器：怎么开始。规则：背后的逻辑。反馈：让用户感知到。循环与模式：随时间怎么变。拿着四个零件检查任何小功能，哪里别扭一目了然。</p>
<p>这本书第一次给细节设计立了规矩。先把微交互找出来，逐个打磨四个零件，最后装到真机上找人试。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 先找到微交互：把产品拆成几十个“一秒钟的小瞬间”</b> 登录、收藏、刷新、空状态、密码强度提示……列成清单，一个一个打磨。决定用户每天心情的，恰恰是这些一秒钟的小事。</p><p class="ex"><i>例</i>天气 App 的下拉刷新动画、微信的“拍一拍”，用户每天碰几十次。注册流程，几个月才走一次。</p></li>
<li><p><b>2. 触发器分两种：用户手动触发，和系统自动触发</b> 开关有两种：用户自己发动的，比如点、滑、说；系统自动发动的，比如到点提醒、电量低警告。设计时必须回答：怎么开始？别让用户猜，更别偷偷来。</p><p class="ex"><i>例</i>微信长按头像“拍一拍”是用户触发；电量到 20% 自动弹窗是系统触发。</p></li>
<li><p><b>3. 规则是隐形的逻辑：一次只做一件事，用限制提前防错</b> 规则是触发后的逻辑，用户看不见，但处处被管着。好规则符合直觉，用限制提前防止犯错，而不是等犯错了再惩罚。</p><p class="ex"><i>例</i>密码框实时提示“还需要 1 个数字”，而不是提交后才报错；日期选择器直接禁掉不存在的日期。</p></li>
<li><p><b>4. 反馈让人“看见”发生了什么：要快，要克制，别放烟花</b> 规则是隐形的，用户只能通过反馈知道“成了没”。反馈要快（0.1 秒内有反应）、要克制；没有反馈的操作，用户会觉得产品“死了”。</p><p class="ex"><i>例</i>点赞后心形“砰”地变大回弹；提交按钮一点立刻变灰显示“提交中”。</p></li>
<li><p><b>5. 文案也是反馈：把“Error 404”说成人话</b> 按钮上的字、报错提示、空状态文案都叫微文案。好的微文案像人说话：清楚、简短、有温度，出错时还告诉用户“怎么办”。</p><p class="ex"><i>例</i>别写“Error 404”。写“这个页面去火星了，带你回首页”就够了。</p></li>
<li><p><b>6. 循环让微交互越用越聪明，模式能少则少</b> 循环是微交互随时间的变化：用得越多越懂你。模式是特殊状态，每多一个，用户的脑子就多一份负担，能少则少。</p><p class="ex"><i>例</i>输入法记住常用词，越用越顺手；一个 App 有 5 种模式，用户永远搞不清自己在哪种。</p></li>
<li><p><b>7. 签名式微交互：给产品造一个让人记住的“招牌动作”</b> 每个伟大产品都有一个标志性的小瞬间，用户会拿它跟朋友炫耀。挑一个跟品牌气质最配的做到极致，让它成为产品的签名。</p><p class="ex"><i>例</i>iPhone 的滑动解锁、微信的“摇一摇”、Kindle 的翻页动画。提起任何一个，你立刻知道是哪家。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第 1 章：什么是微交互</b> 给微交互下定义：围绕一个用例的小而完整的产品瞬间——细节决定产品的生死。</p><p class="ex"><i>例</i>闹钟 App 里有“再睡 5 分钟”小睡的被留了下来，没有的被删了。差，就差在这一个微交互上。</p></li>
<li><p><b>第 2 章：触发器</b> 讲触发器的两种类型（用户触发和系统触发），以及触发条件怎么定。</p><p class="ex"><i>例</i>下拉刷新是用户触发的，低电量提醒是系统触发的。设计前先把每个微交互的“开关”想清楚。</p></li>
<li><p><b>第 3 章：规则</b> 讲触发之后发生什么：背后的逻辑、合理的限制、怎么提前防止用户犯错。</p><p class="ex"><i>例</i>点赞只能点一次，份数上限 10 份。这些看不见的逻辑，决定微交互会不会出乱子。</p></li>
<li><p><b>第 4 章：反馈</b> 讲怎么让用户感知结果：视觉、声音、震动反馈和微文案——快、克制、说人话。</p><p class="ex"><i>例</i>点赞的回弹动画、发送成功的“嗖”声——用户靠这些感知到“事情成了”。</p></li>
<li><p><b>第 5 章：循环与模式</b> 讲微交互随时间怎么变：循环让它越用越聪明，模式是负担要慎用。</p><p class="ex"><i>例</i>输入法越用越懂你是循环，勿扰模式一开全静音是模式。</p></li>
<li><p><b>第 6 章与附录：组合实战与测试</b> 把四个零件装起来做完整案例。小东西也要装到真机上找人试。</p><p class="ex"><i>例</i>把“开关静音”按四个零件做出来，装到真机上。找 5 个用户实际拨一下，看懂不懂、爽不爽。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-30">
  <div class="card-top"><span class="card-no">NO.30</span><span class="dchip">UI/UX 设计</span><a class="card-rating" href="https://book.douban.com/subject/2144413/" target="_blank" rel="noopener">豆瓣 7.7 · 682人评价</a></div>
  <h3>《简单法则》</h3>
  <p class="meta">The Laws of Simplicity · 约翰·梅达 · 中国人民大学出版社 · 2007</p>
  <p class="lede">MIT 教授用十条法则讲简约。简约不是东西变少，是可以学会的设计手艺。</p>
  <div class="thesis"><p>这是 MIT 教授约翰·梅达的“简约”课讲义。整本书只回答一个问题：简约是什么，怎么做到。</p>
<p>核心论点就一句：简约不是东西少，而是处理复杂的手艺。十条法则加三把钥匙，就是这门手艺的练习手册：从减法（削减）、整理（组织）、省时间（时间）起步。</p>
<p>它经典在诚实：不喊“少即是多”，而是承认有些复杂永远简化不了（失败），还提醒你情感可以“多多益善”。简约不是冷冰冰的断舍离。</p></div>
  <details class="fold">
    <summary>核心观点 · 8<span class="chev">›</span></summary>
    <ul><li><p><b>1. 削减：简约的第一步是减法，要用心地减</b> 减法的秘诀：先问“这个东西存在的理由是什么”。答不上来，再动手。</p><p class="ex"><i>例</i>电视遥控器：五六十个键，99% 的人只用开关、音量、换台。苹果后来砍到几个键——App 设置里三年没人点的开关，删了没人哭。</p></li>
<li><p><b>2. 组织：东西多不可怕，乱才可怕</b> 东西多别急着扔，先理一理。记住 SLIP 口诀：分类、贴标签、整合、分轻重，一百样也能像十样。</p><p class="ex"><i>例</i>手机桌面：几十个 App 拖进文件夹按“社交、工具”分好类，东西一件没少，找起来快多了。</p></li>
<li><p><b>3. 时间：省下来的时间，感觉就是“简单”</b> 等待让人觉得复杂。省不下来的时间，告诉用户“还要等多久”也是一种体贴——未知才最折磨人。</p><p class="ex"><i>例</i>外卖 App：显示“预计 30 分钟”加骑手实时位置，饭还是那顿饭，焦虑没了。反面例子：银行 App 转圈不报进度，30 秒熬出 3 分钟的感觉。</p></li>
<li><p><b>4. 学习：懂了，就不觉得难了</b> 复杂的东西学会了就不觉得难。借用户已有的熟悉感，他心里冒出“这个我见过”，就敢上手了。</p><p class="ex"><i>例</i>宜家说明书：一个字没有，全是图——看图拧螺丝是全人类都懂的语言。早期 iPhone 把备忘录做成黄色便签纸，也是借了你的熟悉感。</p></li>
<li><p><b>5. 差异：没有复杂，简单就显不出来</b> 全世界都极简，极简就不值钱了。该简单时干净利落，该复杂时给足信息——一收一放才抓得住注意力。</p><p class="ex"><i>例</i>谷歌首页只有一个搜索框，点开却是密密麻麻的结果页。分开看都不出彩，这一收一放才让人觉得清爽又全能。</p></li>
<li><p><b>6. 情境：留白不是浪费，是主角的舞台</b> 简约的东西靠周围的留白和氛围托着。给重要的东西让路，空白一点都不多余。</p><p class="ex"><i>例</i>苹果官网：一个产品图配大片留白，眼睛无处可逃只能看它。反面：电商详情页塞满每个模块，结果一个都没记住。</p></li>
<li><p><b>7. 情感：讲感情的时候，别怕“多此一举”</b> 感情这东西，多多益善。传递温度时加一点“没用”的装饰不是浪费——简约不等于冷冰冰。</p><p class="ex"><i>例</i>聊天 App 的表情包：发“微笑”两个字就够，但龇牙的表情包情绪多十倍。Mac 开机那声“噔”也是——人们记住产品的，往往就是这些。</p></li>
