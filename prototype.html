<li><p><b>8. 唯一：减去明显的，加上“有意义的”</b> 这是全书的收束：简约不是一减了之。减去明显的，再把有意义的加回来——减是技术，加是品味。</p><p class="ex"><i>例</i>第一代 iPhone：砍掉实体键盘，但留下一个 Home 键——再懵的人都知道“按它就能回家”。全砍成一块玻璃，2007 年的人不敢买。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>开篇：先回答“简约到底是什么”</b> 梅达开篇破题：简约不是东西少，而是在技术和生活被塞满的时代保持清醒的能力。</p><p class="ex"><i>例</i>手机装 200 个 App 不是问题，问题是它们天天弹通知把你搞疯——简约治的是这种失控感。</p></li>
<li><p><b>基础篇 SHE：削减 · 组织 · 时间（入门三法则）</b> 入门三法则 SHE：先做减法，再理整齐，最后替用户省时间——练熟能治八成的“复杂病”。</p><p class="ex"><i>例</i>整理衣柜：扔掉三年没穿的，把常穿的放顺手处，找衣服从 10 分钟变 1 分钟。</p></li>
<li><p><b>中级篇：学习 · 差异 · 情境</b> 进阶讲心法：借用户的知识降门槛，用对比制造美感，别忽视留白和氛围。</p><p class="ex"><i>例</i>Switch 新手引导：靠直觉就能上手，画面极简但手柄震动丰富，开箱都有仪式感。</p></li>
<li><p><b>高级篇（上）：情感 · 信任</b> 简约不只冷冰冰：温度和信任也是简约的一部分——让人放松、敢用的产品才真的简单。</p><p class="ex"><i>例</i>支付宝免密支付：拿掉“输密码”，买单顺滑到无感，你愿意把一点信任交给它。</p></li>
<li><p><b>高级篇（下）：失败 · 唯一</b> 承认有些东西永远做不简约，别硬拗；真正的简约是“减去明显的、加上有意义的”。</p><p class="ex"><i>例</i>Photoshop 注定比美图秀秀复杂——承认它是给专业人士的工具，把裁剪、调色放在最顺手处，复杂但好用。</p></li>
<li><p><b>收尾：三把钥匙——远离 · 开放 · 力量</b> 最后三把钥匙：把不常用的搬远，把过程摊开让人看懂，用更少办更多的事。</p><p class="ex"><i>例</i>手机 App 资源库：不常用的不用删，滑到最后一屏收纳，桌面瞬间清爽。</p></li>
    </ul>
  </details>
</article>
</div>
</section>
<section class="domain" id="pv3-d-product">
<div class="domain-head"><p class="eyebrow">第肆辑</p><h2>产品经理</h2><span class="count">10 本</span></div>
<p class="domain-intro">产品经理就是负责想清楚“做什么产品、为谁做、为什么做”的人——夹在用户和工程师之间，把含糊的需求翻译成能上线、能赚钱的产品。</p>
<div class="cards">

<article class="card" id="pv3-book-31">
  <div class="card-top"><span class="card-no">NO.31</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/5914587/" target="_blank" rel="noopener">豆瓣 8.4 · 9098人评价</a></div>
  <h3>《启示录》</h3>
  <p class="meta">Inspired: How to Create Tech Products Customers Love · 马蒂·卡根 · 华中科技大学出版社 · 2008</p>
  <p class="lede">产品经理实战手册：别闷头做功能，先验证用户要不要、能不能做出来，再动手。</p>
  <div class="thesis"><p>多数软件产品死掉，不是工程师不行，而是从一开始就做错了东西：根本没人想要。产品经理的核心工作，是在开发前找到一个“用户想要、用得来、做得出”的方案。</p>
<p>2008 年，产品经理大多是老板的传声筒。这本书第一次系统写下了硅谷的现代产品管理。作者在惠普、网景、eBay 干过一线，方法全是实战验证过的。</p>
<p>它改了三个认知：产品经理为成败负全责，死了别怪工程师。需求文档该被可点击原型取代，做产品要小步验证、别憋大招。</p></div>
  <details class="fold">
    <summary>核心观点 · 8<span class="chev">›</span></summary>
    <ul><li><p><b>1. 好产品三者缺一不可：用户想要、用得来、技术做得出</b> 好产品同时满足三条：用户愿意花钱花时间、一看就会用、技术上做得出来。三者是“与”关系，不是“或”：只盯一两样，最后都白忙活。</p><p class="ex"><i>例</i>比如做“拍照识菜品热量”App：用户需要，但识别要等30秒、操作还绕弯。准确率只有50%——任何一个短板都会要它的命，先做粗糙原型把三条逐一验证。</p></li>
<li><p><b>2. 产品经理是第一责任人，产品死了别怪工程师</b> 衡量产品经理的唯一标准，是产品本身成不成功。你的活儿不是传声筒，而是发现机会、定义产品，做成是你的功劳，做砸锅也是你的。</p><p class="ex"><i>例</i>就像餐厅主厨：菜不好吃，不能怪买菜和切菜的——菜单是你定的、味道是你把关的。App没人用，别怪“开发慢”“老板施压”：当初接什么需求、怎么设计，决定权在你手里。</p></li>
<li><p><b>3. 别写几十页需求文档，做个能点的原型给用户试</b> 写几十页需求文档、开发照着做，做完才发现用户不买账。和设计师快速做出高仿真原型，拿给真实用户亲测：改原型便宜，推倒重来不心疼。</p><p class="ex"><i>例</i>要加“拼团”功能？别让开发吭哧干两个月。让设计师花两天做个可点击的假页面，找10个用户试。结果有人找不到入口、有人嫌流程绕：你花两天就学到教训，而不是花两个月写代码交学费。</p></li>
<li><p><b>4. 每个想法先过“十问”拷问：用户是谁？解决什么问题？怎么算成功？</b> 每个产品想法，先拿问题清单拷问一遍：用户是谁？现在怎么解决问题？方案好在哪？最怕“我觉得用户需要”：答不上来就回去做功课，别直接开干。</p><p class="ex"><i>例</i>比如“老年人打车App”：用户是60岁以上不会用智能手机的老人，现在靠路边招手、子女代叫。方案：大字体一键叫车、子女可远程代叫；成功标准：三月内单城日单破千——问完这一串，是拍脑袋还是真机会一目了然。</p></li>
<li><p><b>5. 定几条产品原则，吵架不用每次找老板拍板</b> 产品原则是团队共同认可的“行事准则”，比如“用户价值优先于短期收入”。日常争论一对照就有答案；老板施压时，不说“我不想做”，而说“这违反我们定下的原则”。</p><p class="ex"><i>例</i>团队定了“三步原则：核心操作三步内完成”。某天运营想在下单流程加弹窗广告：加了就四步，违反原则，不用找老板裁决。想反驳，先论证“为什么这次可破例”，而不是比谁嗓门大。</p></li>
<li><p><b>6. 找一小撮铁杆用户，从头陪你打磨产品</b> 这叫“特约用户”：早期找十几个目标用户持续试用、持续给反馈，他们是“编外团队成员”。反馈来得快、够真实，他们还会因深度参与变成第一批自发传播者。</p><p class="ex"><i>例</i>做记账App，上线前找20个月光族朋友当特约用户。他们嫌“记一笔填8个字段太烦”你就砍到3个，要的“短信账单自动识别”成了下个版本核心功能。</p></li>
<li><p><b>7. 警惕为大客户定制的“特例”功能，它会拖死产品</b> 大客户常说“加这个功能我们就签单”，听着诱人，但这种定制和多数用户需求背道而驰。卡根称之为“劣质收益”：短期赚了钱，长期毁了产品。</p><p class="ex"><i>例</i>SaaS卖给中小公司，大客户说“加个审批流就买1000个账号”。加了之后其他客户嫌界面复杂、续费率下降，几千行特殊逻辑让每次升级提心吊胆：这1000个账号的钱，根本cover不住产品被拖慢的代价。</p></li>
<li><p><b>8. 用户做决定靠的是恐惧、贪婪和欲望，不是理性分析</b> 人买东西很少因为“理性比较参数”，更多被情绪驱动：怕错过（恐惧）、想占便宜（贪婪）、想成为更好的自己（欲望）。做产品别只讲功能参数，多想想你击中了用户的哪种情绪。</p><p class="ex"><i>例</i>知识付费文案写“你的同龄人正在抛弃你”，打的是恐惧；App爱用“限时五折”“仅剩3件”，打的是贪婪加恐惧。健身App说“算法很科学”没人理，改成“30天练出马甲线”，下载量直接翻倍。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：人员（第1-10章）</b> 讲做产品需要哪些人、各干什么：产品经理、营销、项目经理、设计、开发怎么分工协作，以及怎么招人管人、怎么跟上司相处。</p><p class="ex"><i>例</i>第2章讲产品管理和产品营销是两回事：一个管“做什么产品”，一个管“怎么卖出去”——让厨师兼服务员，菜和客人都顾不上。</p></li>
<li><p><b>第二部分：流程（第11-30章）</b> 全书最厚的部分：从发现产品机会、原型验证，到上线部署、快速迭代的完整打法，外加敏捷和瀑布两种开发模式怎么配合产品工作。</p><p class="ex"><i>例</i>eBay每个重要功能上线前都先做高仿真原型实测：有次改版测完发现完成率反而下降，直接回炉——回炉发生在开发前，省的是真金白银的开发成本。</p></li>
<li><p><b>第三部分：产品（第31-39章）</b> 不同类型产品的实战经验：苹果为什么行、平台型产品怎么做、企业级产品怎么卖，顺带拆几个反面教材帮你避坑。</p><p class="ex"><i>例</i>第31章讲乔布斯“少即是多”：砍掉90%功能、把剩下10%做到极致——用户要的不是功能列表，是“把1000首歌装进口袋”这一个爽点。</p></li>
<li><p><b>总结：最佳实践与反省清单（第40-41章）</b> 全书浓缩成“最佳实践清单”和“产品经理反省清单”：贴工位上随时对照，专治“我以为”。</p><p class="ex"><i>例</i>反省清单里有一条：“你上一次和真实用户聊天是什么时候？”——很多产品经理几个月没和用户说过话，看到这句赶紧约访谈去。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-32">
  <div class="card-top"><span class="card-no">NO.32</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/10945606/" target="_blank" rel="noopener">豆瓣 8.2 · 6570人评价</a></div>
  <h3>《精益创业》</h3>
  <p class="meta">The Lean Startup · 埃里克·莱斯 · 中信出版社 · 2011</p>
  <p class="lede">创业别靠赌：用最小成本、最快速度做实验，验证你的想法到底有没有人买单。</p>
  <div class="thesis"><p>创业不是“我有个绝妙想法然后做出来”，而是在极端不确定中搞清“什么才是对的”。创业公司的真正产出不是代码，而是“验证过的认知”。</p>
<p>方法是把创业当科学实验：提假设、做MVP、测用户真实反应，快速转完“开发-测量-学习”这个圈。2011年之前，创业要么靠商业计划书融资憋大招，要么纯打鸡血。</p>
<p>这本书把丰田精益、敏捷开发、客户开发拧成了一套操作系统，“快速试错”“小步快跑”从此成了创业者的标准动作。它改了三个认知：要“快速地失败、廉价地失败”；看“可执行指标”不看“虚荣指标”；转型不是认怂，是基于数据的理性决策。</p></div>
  <details class="fold">
    <summary>核心观点 · 8<span class="chev">›</span></summary>
    <ul><li><p><b>1. 创业公司的真正产品不是代码，而是“验证过的认知”</b> 创业公司存在的目的不是生产东西、不是赚钱，而是搞清“怎样做出一门持续赚钱的生意”——这叫“验证性学习”。它不能靠“我觉得”，必须靠科学实验：提假设、做实验、看真实用户数据；不能带来认知的忙碌都是浪费。</p><p class="ex"><i>例</i>想做“上门喂猫”服务？别先开发App、租办公室、招10个人。先在小区群发接龙“周末出游需上门喂猫的报名”：20人接龙说明需求真实，没人理你只花一下午就排除了一个伪需求。</p></li>
<li><p><b>2. 别憋大招，先做“最小可行产品”扔出去，看用户真金白银的反应</b> MVP就是“能验证核心假设的最小东西”：不求完整，只求测出“用户到底要不要”。视频式、贵宾式、“绿野仙踪”式都是经典做法，核心就一个：用最小成本换真实用户行为数据。</p><p class="ex"><i>例</i>想做“AI帮你写周报”？别先训练模型开发网站，先拉30个朋友进微信群，你每晚8点人工整理周报发回。两周后一半人天天用，需求真实再投入；没人理，你只花了14个晚上而不是14个月。</p></li>
<li><p><b>3. 把“开发-测量-学习”这个圈转起来，转得越快赢面越大</b> 想法→做出东西→测量用户反应→学到认知→产生新想法，无限循环：创业竞争的本质不是谁想法牛，而是谁转完一圈最快。很多团队一年转一圈，精益团队一周转一圈：一年下来，认知差距是50倍。</p><p class="ex"><i>例</i>就像打靶：高手连开十枪、每枪按上一枪落点微调，而不是闭眼开一枪再分析一年弹道。做社区团购：A憋半年上线“完美版”发现没人自提，B用微信群第一周就开团、每周改一次，两个月摸清用户最在意“送货准时”。</p></li>
<li><p><b>4. 数据不好就勇敢转型：换方向不丢人，死扛才丢人</b> 转型就是“换个姿势再试”：基于已验证的认知，对战略做结构性调整——换用户、换盈利模式、换核心功能。转型不是拍脑袋：在“转型还是坚持”会上，用创新核算的数据说话；伟大公司几乎都是转出来的，转型越早越便宜。</p><p class="ex"><i>例</i>“大学生二手书平台”数据惨淡：卖家多、买家少，一看数据，学生真正活跃的是“拼单买新书”和“课程资料分享”。于是转型做“开学季教材拼团”，三个月用户翻5倍——方向错了不换，等于拿着地图往悬崖开。</p></li>
<li><p><b>5. 别被虚荣指标骗了，要看能指导行动的“可执行指标”</b> 虚荣指标“看起来美、指导不了行动”：总注册10万、阅读10万+；可执行指标“告诉你下一步干什么”：新增用户7天后回来多少？记住创新核算三步：MVP建基准线→小步优化看指标→决定转型或坚持；数据是用来做决定的，不是自我安慰的。</p><p class="ex"><i>例</i>App上线一月下载5万，老板很开心，但次日留存只有8%：92%的人用一次就删，5万下载全是虚荣。正确做法：别买量了，先找20个流失用户聊“为什么删”，把留存修好再谈增长——否则就是往漏水桶里倒水。</p></li>
<li><p><b>6. 小步快跑别搞大批量：“死亡螺旋”专治“一次到位”</b> 大批量是“攒一大波需求、一次性开发上线”：文档50页、开发三月，上线才发现方向错了，返工成本巨大。小批量是每次只做一点、快速上线验证；大批量会陷入“死亡螺旋”：批量越大越不敢改，越不改错得越多。</p><p class="ex"><i>例</i>装修房子：大批量是“设计图一次定稿、三个月后入住”，住进去发现插座全在床头后面，砸墙重改贵到肉疼。小批量是“先装一间住两天”，发现“床头没插座”立刻改，后面全避开：做产品同理，每周上1个功能、看数据再定下周做什么。</p></li>
<li><p><b>7. 增长只有三种引擎：让人留下来、让人带来人、让人花钱，先选一种死磕</b> 可持续增长只有三种：粘着式（用户来了不走，靠留存）、病毒式（用户自发带新用户）、付费式（获客成本小于用户终身价值）。关键：一次只盯一种，把核心指标做健康再考虑别的——什么都想要，等于什么都没抓住。</p><p class="ex"><i>例</i>在线课程App：老用户续费率60%（粘着式有戏），转介绍率很低（病毒式没戏）。那就别烧钱做“邀请返现”，全力让学完的人续下一期：加学习社群、加班主任督学——一次点一盏灯。</p></li>
<li><p><b>8. 出了问题连问五个为什么，找到根因，而不是找人背锅</b> “五个为什么”是丰田传下来的方法：出事先别急着定责，连问五层“为什么”，通常能挖到系统和流程层面的根因。目的是建“自适应组织”：每次事故都变成组织学习而不是甩锅大会，同样的坑全公司只踩一次。</p><p class="ex"><i>例</i>App崩了别急着开除运维，连问五个为什么：为什么磁盘满了？日志没清理；为什么没清理？没自动脚本；为什么没有？上线清单三年没更新。根因是“流程没人维护”，不是“运维手滑”：修好流程，全公司以后都不再踩这个坑。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一篇：愿景（第1-4章）</b> 先讲清创业到底在干嘛：创业是一种管理，产出是“验证过的认知”，要用科学实验做产品，而不是靠赌。</p><p class="ex"><i>例</i>作者在IMVU埋头几个月做出“完美版”产品，上线后用户根本不买账：那一刻他明白，几个月的工作全是浪费，因为没带来任何关于用户的真相。</p></li>
<li><p><b>第二篇：驾驭（第5-8章）</b> 创业这辆车具体怎么开：把战略拆成假设、做MVP测试、用创新核算看数据，在“转型还是坚持”会上做决断。</p><p class="ex"><i>例</i>Dropbox创始人没写一行代码，先做了个3分钟演示视频，一夜之间等候名单从5000涨到75000：一个视频的成本，验证了“真有人要”，比先开发半年聪明一百倍。</p></li>
<li><p><b>第三篇：加速（第9-12章）</b> 跑起来后怎么提速不翻车：小批量生产、选对增长引擎、用五个为什么打造自适应组织、给颠覆式创新留空间。</p><p class="ex"><i>例</i>很多团队死在“引擎搞混”：靠广告砸钱获客（付费式），却用“用户量”自我安慰，从不算“一个用户终身赚多少、获客花多少”——账算清那天，才发现一直在赔本赚吆喝。</p></li>
<li><p><b>尾声：杜绝浪费（第13-14章）</b> 收束全书：精益创业的终极目标是杜绝一切不带来认知的浪费，并号召读者加入全球精益创业运动。</p><p class="ex"><i>例</i>作者算了笔账：全世界每天有无数创业者在重复制造“没人要的东西”，烧掉的钱和青春是最贵的浪费——如果每人先花一周验证假设，省下的不只是钱，是整整一代人的时间。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-33">
  <div class="card-top"><span class="card-no">NO.33</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/34907971/" target="_blank" rel="noopener">豆瓣 7.8 · 4895人评价</a></div>
  <h3>《俞军产品方法论》</h3>
  <p class="meta">俞军 · 中信出版集团 · 2019</p>
  <p class="lede">中国“产品经理教父”俞军，把做产品还原成几个可以算账的公式：用户价值、交易设计、决策方法。</p>
  <div class="thesis"><p>俞军是百度贴吧之父，做过百度和滴滴的产品高管。2019年，他把十几年的思考写成这本书。</p>
<p>核心论点只有一句：产品经理的本质是决策者，决策要靠算账——用户模型、交易模型、决策，三件事。</p>
<p>它为什么经典：第一次有人把“做产品”系统化成可传授的框架，讲“道”不讲“术”。“用户价值=新体验−旧体验−替换成本”，这一个公式就值回书价。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 用户价值公式：新体验 − 旧体验 − 替换成本</b> 算三笔账：用了你的新体验，减去用户现有的旧体验，再减去换过来的替换成本。只有差值为正且足够大，用户才会换。</p><p class="ex"><i>例</i>做外卖拼单：新体验只好一点点，但拉人、凑时间、统一口味的替换成本很高，用户就不换。</p></li>
<li><p><b>2. 用户不是自然人，是需求的集合</b> 同一个人在不同场景下是不同用户：白天是打工人，深夜是外卖用户。别问他是谁，问他此刻想要什么。</p><p class="ex"><i>例</i>“深夜想吃热面”背后，可能是程序员、带娃的妈妈或失眠老人——需求相同，就是同一类用户。</p></li>
<li><p><b>3. 移步换景：去用户的场景里理解他</b> 别坐在会议室里推理用户，那99%是错的。走到他的生活场景里，看他怎么做决策。</p><p class="ex"><i>例</i>给菜市场大妈做买菜App，去菜市场站一天：她在乎的不是比价功能，是摊主熟不熟。</p></li>
<li><p><b>4. 交易模型：一切商业都是交易</b> 用户付出时间金钱换价值，企业付出成本换收入。产品经理设计的是各方都觉得划算、能持续转的交易结构。</p><p class="ex"><i>例</i>拼多多：用户付出拉人成本得到低价，商家付出低价得到大订单，平台得到用户和交易额——三方都划算才转得起来。</p></li>
<li><p><b>5. 产品经理的本质是决策者</b> 不是画原型写文档，那些只是手段。信息永远不足，产品经理就是那个替产品做选择题、承担结果的人。</p><p class="ex"><i>例</i>微信当年要不要做朋友圈？没数据、没人能证明，张小龙只能基于用户价值判断拍板。</p></li>
<li><p><b>6. 效用：产品是用户获得的满足感</b> “效用”是经济学词：这东西对我有什么用。产品不是你造的那个东西，是用户用它获得的效用。</p><p class="ex"><i>例</i>同一杯奶茶：对口渴的人是解渴，对小情侣是甜蜜，对打卡的是朋友圈素材。</p></li>
<li><p><b>7. 产品经理十二条：体感是最好的需求来源</b> 俞军早年总结的12条心得，流传最广。核心一句：直觉从大量亲身体验里长出来，不是想出来的。</p><p class="ex"><i>例</i>“把自己当傻瓜”：你觉得显而易见的按钮，第一次用的用户就是找不到；“每天变成用户”：高频用自己和竞品的产品。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：用户模型</b> 全书地基：用户是需求的集合、用户价值公式、移步换景，后面所有判断都从这儿出发。</p><p class="ex"><i>例</i>用用户模型解释拼多多：命中“想买便宜好货又怕被坑”的需求集合，价值公式算下来是正的。</p></li>
<li><p><b>第二部分：交易模型</b> 商业本质是交易：好产品必须设计出各方都觉得划算的交易结构。</p><p class="ex"><i>例</i>知识付费：用户得到知识和安心，老师得到收入名声，平台得到抽成——三方划算才能持续。</p></li>
<li><p><b>第三部分：决策</b> 产品经理的核心工作：在信息不足时做决策，选期望收益最大的选项。</p><p class="ex"><i>例</i>砍不砍做了三个月但数据平平的功能：算期望效用——成功概率×收益，对比继续投入的成本。</p></li>
<li><p><b>第四部分：产品经理的选拔与成长</b> 什么样的人适合做产品经理：靠体验、复盘和实战练判断力。</p><p class="ex"><i>例</i>好产品经理的特质：同理心强、逻辑好、爱折腾，愿意亲手试100个产品。</p></li>
<li><p><b>附录：推荐书单</b> 近百本书单，覆盖经济学、心理学、社会学——产品经理的知识底盘。</p><p class="ex"><i>例</i>《经济学原理》《思考，快与慢》《影响力》：经济学帮你算账，心理学帮你懂人性。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-34">
  <div class="card-top"><span class="card-no">NO.34</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/4723970/" target="_blank" rel="noopener">豆瓣 7.6 · 9827人评价</a></div>
  <h3>《人人都是产品经理》</h3>
  <p class="meta">苏杰 · 电子工业出版社（博文视点） · 2010</p>
  <p class="lede">阿里出身的苏杰，用一个真实项目的完整经历，带你走完从需求到上线的全过程——中国产品经理的入门圣经。</p>
  <div class="thesis"><p>苏杰是阿里、淘宝早期的产品经理。2010年出版时，中文世界几乎没有讲“产品经理怎么做”的书。</p>
<p>核心观点：产品经理首先是一种思维方式——凡事先问“为谁解决什么问题”。书里给了一套完整方法：需求怎么来、做什么、怎么做、怎么协作。</p>
<p>它经典在“真实”：全书围绕一个真实项目展开，像连续剧。“少做就是多做”“BRD/MRD/PRD”成了产品圈基础词汇。产品社区“人人都是产品经理”名字就来自这本书。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 人人都是产品经理：产品思维是一种通用思维</b> 产品经理不只是岗位，更是思维方式：先想为谁解决什么问题，再想方案，最后想怎么验证。装修带娃做PPT，本质都是做产品。</p><p class="ex"><i>例</i>去K歌嫌点歌面板排序不合理、装修抢着当项目经理排工期——这就是产品思维。</p></li>
<li><p><b>2. 少做就是多做：砍需求是最大的勇气</b> 资源永远不够，100个需求只能做10个。把10个做到极致，别把100个做成半吊子。吸引用户的只是一两个闪光点。</p><p class="ex"><i>例</i>淘宝“自动上架”：团队讨论两周越加越多，最后一个个砍掉——“想到了又砍掉”和“没想到”完全不同。</p></li>
<li><p><b>3. 一个需求的奋斗史：商业需求→用户需求→产品需求</b> 三层链条：商业需求（公司要什么）、用户需求（用户真要什么）、产品需求（我们到底做什么）。新人最大的毛病是跳过前两层直接画原型。</p><p class="ex"><i>例</i>淘宝自动上架：老板要提升卖家活跃度→发现“商品总被下架”是真痛点→做成自动上架功能。</p></li>
<li><p><b>4. BRD、MRD、PRD：三种文档写给三种人</b> BRD给老板看（为什么做、值不值），MRD讲市场用户，PRD给开发看（具体怎么做）。写之前先想清楚听众是谁。</p><p class="ex"><i>例</i>拼团功能：BRD是“拼团带来30%新用户，要20人天”；PRD精确到按钮放第几屏、退款异常流程。</p></li>
<li><p><b>5. 用户调研：别听用户说什么，看用户做什么</b> 用户说的和做的经常两回事。调研不是收集“想要什么功能”，而是理解“他在什么场景遇到什么麻烦”。</p><p class="ex"><i>例</i>用户说收藏“没习惯”；跟他聊才发现他靠翻聊天记录找内容——真需求是“快速找回看过的内容”。</p></li>
<li><p><b>6. 四两拨千斤：好钢用在刀刃上</b> 资源永远不够，把有限开发资源押在商业价值最高的几个需求上。20%核心需求吃掉80%资源，剩下的砍。</p><p class="ex"><i>例</i>“魔方计划”：故意在BRD里放一两个可砍的需求，让老板砍完有占便宜感，不好意思再砍你真正想保的。</p></li>
<li><p><b>7. 产品经理的自我修养：爱、执行力、同理心</b> 技术文档流程都能学，难的是心法：爱自己的产品、超强执行力、同理心。产品经理是“无冕之王”，全靠影响力把事推成。</p><p class="ex"><i>例</i>“有爱”：半夜想到一个bug爬起来记下来；“同理心”：钻进用户、开发、老板的脑子，用三种语言说话。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第1章：写给-1到3岁的产品经理</b> 产品经理到底是干什么的：什么样的人适合做，新人最常见的困惑。</p><p class="ex"><i>例</i>看到难用App第一反应是“改成那样会不会更好”——你骨子里就是个产品经理。</p></li>
<li><p><b>第2章：一个需求的奋斗史</b> 全书最精彩：一个真实需求从诞生到上线的完整过程。</p><p class="ex"><i>例</i>跟着淘宝案例走一遍：商业需求→用户需求→产品需求，你就知道需求是怎么“奋斗”出来的。</p></li>
<li><p><b>第3章：项目的坎坷之路</b> 需求确定之后：写BRD、开产品会争资源、项目管理、写PRD。</p><p class="ex"><i>例</i>“魔方计划”：两个老产品整合成一个，BRD怎么写让老板点头，资源评估精确到“人天”。</p></li>
<li><p><b>第4章：产品经理的自我修养</b> 产品经理的心法：爱、执行力、同理心，以及职业成长路径。</p><p class="ex"><i>例</i>定期“体检”：这个月有没有真正理解用户？有没有为KPI做短视功能？</p></li>
<li><p><b>附录：用户调研问卷实例</b> 一份可直接套用的用户调研问卷模板，附完整实例。</p><p class="ex"><i>例</i>从“你用过我们的产品吗”到“最希望改进什么”，照着抄就能用。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-35">
  <div class="card-top"><span class="card-no">NO.35</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/4243770/" target="_blank" rel="noopener">豆瓣 8.5 · 4174人评价</a></div>
  <h3>《创新者的窘境》</h3>
  <p class="meta">The Innovator's Dilemma · 克莱顿·克里斯坦森 · 中信出版社 · 2010</p>
  <p class="lede">为什么管理越优秀、越听客户话的大公司，越容易被新技术干掉？哈佛教授用三个行业的真实历史回答这个问题。</p>
  <div class="thesis"><p>克莱顿·克里斯坦森是哈佛商学院教授，“颠覆性创新”理论创始人。1997年出版，“窘境”就是那个两难：管理越好，离死亡越近。</p>
<p>核心论点：大公司被颠覆恰恰因为“良好的管理”——倾听主流客户、追逐高利润、用财务流程筛项目，这些全对的原则在破坏性技术面前全错了。</p>
<p>经典在第一次用三个行业真实历史（硬盘、挖掘机、钢铁）讲透创新：“延续性创新”大公司擅长，“破坏性创新”总栽在这儿。“颠覆式创新”成了创业者口头禅，连比尔·盖茨都说每份提案都自称“颠覆性”。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 两种技术：延续性技术是把好的做得更好，破坏性技术是另起炉灶</b> 延续性技术是把现有东西做得更好（手机像素1000万到1亿）；破坏性技术另起炉灶，起初更差更便宜更简单（早期数码相机不如胶片）。大公司擅长前者，总栽在后者。</p><p class="ex"><i>例</i>数码相机刚出来像素低又贵，专业摄影师看不上；但它一路向上，“够用”那天胶片一夜之间没了。</p></li>
<li><p><b>2. 价值网：困住大公司的那张网</b> 公司被客户、供应商、成本结构、利润要求织成的网困住，决定了它能看到什么、愿意做什么。破坏性技术在网里永远像亏本买卖。</p><p class="ex"><i>例</i>诺基亚不是不知道智能手机要来，是它的价值网不允许转身：运营商要信号好待机长，股东要确定回报。</p></li>
<li><p><b>3. 最反常识的结论：正是“良好的管理”导致了失败</b> 倾听客户、追逐好市场、算投入产出比——商学院全对的原则，在破坏性技术面前全错：主流客户永远说不需要，财务模型永远算出不划算。</p><p class="ex"><i>例</i>硬盘巨头希捷：认真听IBM的话做大容量，新技术利润率低“不值得投”——每一步都正确，却错过了小尺寸硬盘。</p></li>
<li><p><b>4. 破坏性技术的剧本：从低端切入，沿轨迹上移，吃掉主流</b> 固定剧本：在低端或全新市场落脚，靠便宜简单够用活下来；沿性能轨迹一路向上；“够用”那天主流客户成批倒戈。赢家是进步最快的。</p><p class="ex"><i>例</i>14寸硬盘的老大看不上8寸，8寸的老大看不上5.25寸——每一代都被“看不上的小东西”从下面掀翻。</p></li>
<li><p><b>5. 新市场测不出来，只能试出来</b> 破坏性技术面向的市场一开始不存在，传统调研和商业计划书全部失效。别做宏大预测，小规模试错、快速迭代。</p><p class="ex"><i>例</i>2007年问商务人士要不要iPhone，99%说黑莓好好的；但极客觉得能上网装App真酷——市场是试出来的，不是调研出来的。</p></li>
<li><p><b>6. 药方：给破坏性业务一个独立的小组织</b> 独立的成本结构、独立的考核标准、独立的客户，去服务边缘市场。让组织匹配任务，而不是任务削足适履。</p><p class="ex"><i>例</i>IBM做PC成立独立小团队放佛罗里达，远离总部高利润率绑架；塞进老部门的新业务永远抢不过资源，最后被“优化”掉。</p></li>
<li><p><b>7. 客户说“不需要”，恰恰是破坏性技术的典型特征</b> 主流客户只能告诉你“把现在的东西做得更好”，永远不会为性能更差的新东西投票。“不需要”不是它不行的证据。</p><p class="ex"><i>例</i>柯达问专业摄影师要不要数码相机：“像素这么渣谁用”；但普通人觉得“能立刻看到照片真方便”先用了——等像素追上来，柯达来不及了。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分：为什么伟大的公司会失败</b> 硬盘行业完整兴衰史：每一代老大都被自己看不上的小技术干掉。</p><p class="ex"><i>例</i>1970-80年代：14寸看不上8寸，8寸看不上5.25寸——读完第一次觉得“历史在重复”。</p></li>
<li><p><b>第二部分：价值网——困住大公司的那张网</b> “价值网”：客户、成本和利润结构决定了公司能做什么、不能做什么。</p><p class="ex"><i>例</i>液压挖掘机力气小只能挖小水沟，但便宜灵活越做越好，最后连大型矿山都用液压的。</p></li>
<li><p><b>第三部分：破坏性技术的规律</b> 破坏性技术的固定剧本：低端切入，沿性能轨迹上移，“够用”时吃掉主流。</p><p class="ex"><i>例</i>小尺寸硬盘性能提升比主流需求涨得还快，“够用”那天主流客户整批倒戈。</p></li>
<li><p><b>第四部分：怎么办——让组织去匹配任务</b> 药方：想抓住破坏性技术，给它独立小组织，独立成本结构和考核。</p><p class="ex"><i>例</i>新业务塞老部门：按利润率考核永远“不达标”被砍；独立小团队按“学到了什么”考核，反而活下来。</p></li>
<li><p><b>结语：给管理者的忠告</b> 破坏性创新不是管理失败，是好管理的副产品；关键是看清自己的价值网。</p><p class="ex"><i>例</i>听到“新技术性能差、利润低、客户不想要”时，先问：是真不行，还是我的价值网让我觉得它不行。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-36">
  <div class="card-top"><span class="card-no">NO.36</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/27030507/" target="_blank" rel="noopener">豆瓣 7.4 · 5707人评价</a></div>
  <h3>《上瘾：让用户养成使用习惯的四大产品逻辑》</h3>
  <p class="meta">Hooked: How to Build Habit-Forming Products · 尼尔·埃亚尔 / 瑞安·胡佛 · 中信出版社 · 2017</p>
  <p class="lede">为什么你一无聊就想刷手机？作者把Facebook、Twitter、Pinterest们让人“上瘾”的套路，提炼成了一个四步循环模型。</p>
  <div class="thesis"><p>尼尔·埃亚尔在斯坦福教行为设计，也创过业。2014年出版，回答：为什么有些App一无聊就想点开，另一些用两次就删？</p>
<p>核心是“上瘾模型”：触发→行动→多变的酬赏→投入，四步循环。背后是斯金纳、福格等行为心理学实验的工程化应用。</p>
<p>经典在第一次把“用户习惯”讲成可操作手册：“触发是什么？酬赏够多变吗？用户投入了什么？”成了产品圈通用语言。作者也留了伦理题：帮用户还是害用户？用“操纵矩阵”自查。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. 上瘾模型四步：触发→行动→多变的酬赏→投入，无限循环</b> 四步无限循环：触发让你开始，行动是最简单的动作，多变酬赏给点不一样的甜头，投入让你付出点什么。投入加载下一次触发，循环往复，习惯养成。</p><p class="ex"><i>例</i>无聊打开抖音：无聊（触发）→点开下滑（行动）→不知道下一条是什么（多变酬赏）→点赞关注（投入，算法更懂你）。</p></li>
<li><p><b>2. 外部触发 vs 内部触发：最高境界是让情绪成为触发器</b> 外部触发是推送广告推荐；内部触发是你自己的情绪（无聊、孤独、想炫耀）。最高境界：无聊=刷抖音，晒生活=发朋友圈。情绪是最省钱的流量。</p><p class="ex"><i>例</i>微信：最早被朋友消息拉进去，后来“无聊就点开看看”——触发器从外部变成了情绪。</p></li>
<li><p><b>3. 福格行为模型：行动 = 动机 + 能力 + 触发，三者缺一不可</b> 行动发生要三者齐：有动机（想做）、有能力（够简单）、有触发（有个由头）。产品设计的大量工作，就是降低行动难度。</p><p class="ex"><i>例</i>抖音下滑：想看有意思的（动机）+手指一滑零成本（能力）+无聊（触发）。打开要点五六步，行动就发生不了。</p></li>
<li><p><b>4. 多变的酬赏：社交、猎物、自我，不确定性最抓人</b> 灵感来自斯金纳的鸽子实验：奖励不确定，行为更疯狂。三种酬赏：社交（点赞认同）、猎物（刷到新东西像寻宝）、自我（升级集满的成就感）。</p><p class="ex"><i>例</i>朋友圈：不知道谁会点赞说什么，忍不住反复点开看；淘宝“猜你喜欢”：每次刷新都不一样，像开盲盒。</p></li>
<li><p><b>5. 投入：用户付出越多，越离不开；投入会加载下一个触发</b> 让用户付出时间、数据、内容、社交关系。三个作用：储存价值（越用越好用）、沉没成本让人舍不得走、加载下一个触发。</p><p class="ex"><i>例</i>小红书关注200人收藏500篇笔记后，你还舍得换平台吗？发了帖就等点赞——这就是下一次触发。</p></li>
<li><p><b>6. 习惯养成后，就不需要外部触发了</b> 循环转够多圈，内部触发完全接管，用户主动回来。判断标准一句话：关掉所有推送，用户还会不会回来？</p><p class="ex"><i>例</i>现在的微信：99%不是被推送拉开的，是“想看看有没有人找我”。天天靠红包续命的产品，恰恰说明习惯没养成。</p></li>
<li><p><b>7. 操纵矩阵：用这套方法，是在帮用户还是在害用户？</b> 上瘾模型是中性的，刀能切菜也能伤人。设计前先自查：我在帮用户成为他想成为的人，还是在利用他的弱点榨时间？</p><p class="ex"><i>例</i>帮用户养成每天背单词 vs 让用户每天多刷2小时短视频——同一套手法，一边是帮，一边是害。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>开篇：习惯区</b> 什么是“习惯型产品”：让用户不假思索主动回来的产品；习惯是互联网最值钱的资产。</p><p class="ex"><i>例</i>Facebook成了、无数“类Facebook”死了：区别是有没有进入用户的“习惯区”。</p></li>
<li><p><b>第1步：触发</b> 外部触发怎么把用户拉进来，以及怎么转化成内部触发（情绪和需求）。</p><p class="ex"><i>例</i>拼多多“砍一刀”：朋友链接是外部触发；“想买东西别买贵了就想到拼多多”是内部触发。</p></li>
<li><p><b>第2步：行动</b> 用福格行为模型拆解行动：动机怎么撩拨、能力怎么做减法、触发怎么给。</p><p class="ex"><i>例</i>一键登录 vs 填10项注册：把能力门槛降到零，行动发生率天差地别。</p></li>
<li><p><b>第3步：多变的酬赏</b> 三种酬赏（社交/猎物/自我），以及为什么“不确定性”才是上瘾的灵魂。</p><p class="ex"><i>例</i>抖音信息流永远不知道下一条是什么——“开盲盒”的感觉就是多变酬赏。</p></li>
<li><p><b>第4步：投入</b> 让用户付出时间数据内容社交关系；投入储存价值、制造沉没成本、加载新触发。</p><p class="ex"><i>例</i>B站投币收藏关注：越用越懂你，换平台代价越高；发动态等点赞的心情就是下次触发。</p></li>
<li><p><b>实战：圣经App案例、习惯测试与伦理</b> 用“圣经App”完整演示模型落地：习惯测试+“操纵矩阵”伦理自查。</p><p class="ex"><i>例</i>圣经App用“每天读经打卡+连续X天勋章+完成进度”，把反人性的读经做成了习惯。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-37">
  <div class="card-top"><span class="card-no">NO.37</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/27593848/" target="_blank" rel="noopener">豆瓣 8.2 · 5546人评价</a></div>
  <h3>《增长黑客》</h3>
  <p class="meta">Hacking Growth · 肖恩·埃利斯、摩根·布朗 · 中信出版社 · 2017</p>
  <p class="lede">“增长黑客”发明人亲笔：用数据和一次次小实验，让用户量滚雪球一样涨起来。而不是砸钱买广告。</p>
  <div class="thesis"><p>2010 年，埃利斯帮 Dropbox 做增长。发现传统市场打法又贵又慢。提出“增长黑客”：横跨产品、技术、数据、营销，只为增长负责的团队。2017 年，他和摩根·布朗把这套方法写成这本书。</p>
<p>核心观点：增长不是玄学，是可复制的科学流程。先确认有人真心想要产品，再定全公司共盯的“北极星指标”。然后一周跑几个小实验：看数据、提想法、排优先级、做实验、复盘。</p>
<p>这套流程第一次把硅谷顶级公司的增长方法系统化，还定义了一个新工种。今天大厂的“用户增长部”，源头都在这本书。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. </b> 增长没人真正负责：产品归产品、市场归市场。增长团队把懂产品、会写代码、会看数据、懂营销的人拧在一起，只对增长负责。</p><p class="ex"><i>例</i>Facebook 早期，增长团队的工程师直接改新用户引导。分析师第二天就看得到留存变化，不用等市场部排期做广告。</p></li>
<li><p><b>2. </b> 产品没人爱之前，谈增长就是烧钱。土办法：问用户“产品明天没了你会有多失望”。超过 40% 说“非常失望”，再砸资源做增长。</p><p class="ex"><i>例</i>Dropbox 先拍了个 3 分钟演示视频。几万人排队留邮箱，才全力投入。反过来，很多 App 一买量用户就流失——产品还没让人“非用不可”。</p></li>
<li><p><b>3. </b> 增长团队最容易犯的错：每个人看的指标不一样。找一个最能代表“用户获得核心价值”的指标，全公司只盯它。它涨，增长才健康。</p><p class="ex"><i>例</i>Airbnb 的北极星是“入住的间夜数”。定对了这个数，团队不会为了 KPI 去刷一些没用的数据。</p></li>
<li><p><b>4. </b> 四步循环不停转：看数据找机会、头脑风暴。ICE 打分排优先级，再小流量测试复盘。关键是快和多：一周跑好几个实验，大部分会失败，成一个就净赚。</p><p class="ex"><i>例</i>LinkedIn 每周同时跑十几个实验：改邮件标题、换按钮颜色。90% 没效果，但涨 5% 转化的那个，一年就是几百万新增用户。</p></li>
<li><p><b>5. </b> 别每个渠道都浅尝辄止。先小成本测一批，找到“投入一块赚回三块”的，再把资源全砸进去。同时算清账：获客成本必须远低于用户终身价值。</p><p class="ex"><i>例</i>Airbnb 早期没钱打广告。它做了一键同步房源到 Craigslist 的工具，白嫖巨大流量。拼多多早期靠微信群“砍一刀”，几乎零成本获客。</p></li>
<li><p><b>6. </b> 下载不等于会用。“啊哈时刻”就是用户第一次觉得“这东西真好用”的瞬间。想尽办法让新用户尽快到达。</p><p class="ex"><i>例</i>Facebook 发现新用户 10 天内加满 7 个好友。留存大幅提升，于是整个新手引导都围绕“加好友”设计。</p></li>
<li><p><b>7. </b> 不做留存就砸钱获客，等于往漏桶里倒水。留存做到位，再用病毒循环加速：让老用户自发带来新用户。分享动作要对分享者有好处，还要顺手。</p><p class="ex"><i>例</i>Dropbox“邀请好友、双方各得 2G 空间”。老用户为扩容拼命邀请，新用户为空间乐意接受，一传十、十传百。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分 方法：第1章 搭建增长团队</b> 增长团队长什么样：跨职能、以增长为唯一目标，怎么招人、怎么定工作节奏。</p><p class="ex"><i>例</i>负责人最好直接向 CEO 汇报，每周只开增长会，只看数据和实验结果。</p></li>
<li><p><b>第2章 好产品是增长的根本</b> 产品市场匹配：用“失望度调查”（40% 法则），判断产品值不值得规模化。</p><p class="ex"><i>例</i>只有 15% 用户说“没了会非常失望”。结论很清楚：先回去打磨产品，别买量。</p></li>
<li><p><b>第3章 确定增长杠杆</b> 北极星指标：找到代表用户真正获得价值的指标，让全公司对齐。</p><p class="ex"><i>例</i>SaaS 公司盯“注册数”会刷低质量注册。改成盯“完成核心操作的付费团队数”，大家立刻知道该干什么。</p></li>
<li><p><b>第4章 快节奏试验</b> 增长实验的完整流程：想法来源、ICE 打分排优先级、实验设计、复盘沉淀。</p><p class="ex"><i>例</i>攒了 50 个想法不可能全做，ICE 打分先上影响力大、把握大、好做的；失败的实验也要写复盘。</p></li>
<li><p><b>第二部分 实战：第5-8章 获客、激活、留存、变现</b> 按用户旅程拆四章：获客讲渠道测试与规模化，激活讲啊哈时刻。留存讲三个阶段，变现讲定价与收入实验。</p><p class="ex"><i>例</i>获客讲 Airbnb 蹭流量。激活讲 Facebook 的“10 天 7 好友”。留存讲“初期留存决定长期留存”，变现讲实验找最优定价。</p></li>
<li><p><b>第9章 良性循环：维持并加速增长</b> 病毒传播和口碑：设计让用户自发拉新的机制，让增长自己转起来。</p><p class="ex"><i>例</i>Hotmail 在每封邮件底下加一句“免费邮箱，点击注册”。18 个月做到 1200 万用户，一分钱广告没花。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-38">
  <div class="card-top"><span class="card-no">NO.38</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/26278639/" target="_blank" rel="noopener">豆瓣 8.2 · 2300人评价</a></div>
  <h3>《精益数据分析》</h3>
  <p class="meta">Lean Analytics · 阿利斯泰尔·克罗尔、本杰明·约斯科维茨 · 人民邮电出版社（图灵） · 2013</p>
  <p class="lede">教创业者看数据的书：别再盯虚荣指标了，每个阶段只看一个最重要的数。</p>
  <div class="thesis"><p>2013 年，克罗尔和约斯科维茨写了这本书。《精益创业》火了之后，人人都说 MVP 加快速迭代。但没人讲清：迭代时到底看什么数据？这本书补上这一块。</p>
<p>核心有三层。第一，创业者天生会骗自己，需要数据“打脸”。虚荣指标看着爽、指导不了行动。可执行指标告诉你下一步干什么。第二，别搞“数据驱动”，要搞“数据启迪”：数据是参谋，人才是司令。第三，先用“精益画布”一页纸讲清商业模式。再对照“六种商业模式乘以五个阶段”，每个阶段只盯一个指标。</p>
<p>它把数据分析从大公司 BI 部门手里解放出来，变成创业者每天能用的工具。书里 30 多个真实案例，每个结论都配“这个数当时是多少、算好算坏”。是少见的“带刻度”的数据书。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. </b> 创业者大多很会“说谎”：没证据先说服自己“点子一定能成”。数据的第一个作用不是“证明我对”，而是“及时发现我错”，撞南墙之前掉头。</p><p class="ex"><i>例</i>Airbnb 先派人去纽约亲手给几十套房源拍照。订单是平均水平的 2 到 3 倍。假设被证实了才规模化——用最小成本让数据“验货”。</p></li>
<li><p><b>2. </b> 虚荣指标听着爽、指导不了行动：总注册用户、公众号粉丝数。可执行指标告诉你“下一步干什么”：付费转化率、次日留存。这个数字变了，你知道该做什么吗？不知道，就是虚荣指标。</p><p class="ex"><i>例</i>“我微信加了 5000 个好友”不如“我上周复购率 35%”有价值。数字掉了就知道：该搞会员活动、推新品了。</p></li>
<li><p><b>3. </b> 好指标三条硬标准：一眼能看懂，不用解释半天；能跟过去、跟同行比；尽量用比率而不是绝对数——绝对数会骗人，比率不会。</p><p class="ex"><i>例</i>“新增 1 万用户”听着不错，但如果是花 100 万买来的呢？换成“获客成本”这个比率，立刻现形。</p></li>
<li><p><b>4. </b> 数据是参谋，不是司令。数据告诉你“发生了什么”，“该怎么办”需要人的判断。数据有滞后、有盲区，最重要的东西（用户真实动机）根本不在数据里。</p><p class="ex"><i>例</i>数据说用户就爱看 15 秒搞笑视频，完全数据驱动，产品会越做越单调；但判断力告诉你：用户也需要有深度的内容。</p></li>
<li><p><b>5. </b> 用“精益画布”代替几十页商业计划书：一页纸、九个格子。写清解决什么问题、给谁解决、怎么赚钱。想法一变，十分钟擦掉重写，逼着暴露最关键的假设。</p><p class="ex"><i>例</i>想开社区咖啡店。画布写完立刻看出最危险的假设是“真有人愿意付 299 月卡吗”。那就先发 100 张问卷，别先砸钱装修。</p></li>
<li><p><b>6. </b> 创业公司经历五个阶段：移情、黏性、病毒性、营收、规模化。每个阶段只盯一个最重要的指标。人的注意力有限，盯十个等于没盯；早期盯收入就是找死。</p><p class="ex"><i>例</i>做 SaaS，黏性阶段就死盯“周活跃率”，别管收入；到了营收阶段，再盯“每月经常性收入”。</p></li>
<li><p><b>7. </b> 别看“整体留存率”，要按用户注册时间分群看。1 月来的留存 30%，6 月来的只有 10%。平均看着还行，真相是产品越改越差。平均数会撒谎，分群才能看到真相。</p><p class="ex"><i>例</i>在线教育 App 整体次日留存 35% 看着不错。按渠道一分：自然用户留存 50%，买量来的只有 15%。买的流量全是垃圾，钱白花了。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第一部分 别再撒谎了（第1-4章）：为什么创业者需要数据</b> 创业者为什么会自欺欺人，数据是用来制衡妄想的；怎么设计记分板，以及数据驱动和数据启迪的区别。</p><p class="ex"><i>例</i>Airbnb 用人肉跑腿验证专业摄影能让订单翻倍：先验证，再投入。</p></li>
<li><p><b>第2章 分数板的设计：好指标长什么样</b> 好指标三条标准：可理解、可比较、是比率。分清虚荣指标和可执行指标的区别。</p><p class="ex"><i>例</i>看“总用户数”是虚荣的，看“每周活跃用户增长率”才是可执行的。后者掉了，你知道要去抓留存还是拉新。</p></li>
<li><p><b>第4章 数据驱动 vs 数据启迪</b> 数据的正确姿势：让数据给你启发，但别让数据替你做决定。</p><p class="ex"><i>例</i>数据告诉你“用户在周五晚上最活跃”。但“要不要为周五专门做活动”，得用人来判断——数据是参谋，人是司令。</p></li>
<li><p><b>第二部分 找到正确的指标：六种商业模式</b> 全书最厚的部分：六种生意，每种配五个发展阶段的关键指标。电子商务、SaaS、免费移动应用、媒体网站、用户生成内容、双边市场。</p><p class="ex"><i>例</i>做电商就看电子商务那章：移情阶段看验证了几个痛点，黏性阶段看复购率。营收阶段看客单价——直接照抄作业。</p></li>
<li><p><b>第三部分 指标的合理范围：好坏的刻度线</b> 光知道看什么指标还不够，还得知道“多少算好”。给每种商业模式的每个指标划基准线。</p><p class="ex"><i>例</i>SaaS 月流失率 5% 算优秀，10% 算危险。相当于给你的数据配了一把尺子。</p></li>
<li><p><b>第四部分 把精益分析装进组织</b> 怎么让数据文化落地：从创始人到一线员工，人人会看数、敢质疑、做实验。</p><p class="ex"><i>例</i>要求每个提案带上“要验证的假设、看什么指标、失败了怎么办”。开会不许说“我觉得”，必须说“数据显示”。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-39">
  <div class="card-top"><span class="card-no">NO.39</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/4743056/" target="_blank" rel="noopener">豆瓣 8.1 · 609人评价</a></div>
  <h3>《用户故事与敏捷方法》</h3>
  <p class="meta">User Stories Applied: For Agile Software Development · 迈克·科恩 · 清华大学出版社 · 2004</p>
  <p class="lede">敏捷开发写需求的“圣经”：别写几十页没人看的文档了。一张小卡片加面对面交谈，再写下验收标准，就够了。</p>
  <div class="thesis"><p>2004 年，敏捷教练迈克·科恩写了这本书。当时很多团队嘴上“敏捷”，实际还是瀑布那套。产品经理憋几个月写巨详细的需求文档，做完发现用户根本不想要。</p>
<p>核心方法是“用户故事”：一张小卡片，正面只写一句话。句式是：作为谁、想要什么、以便于得到什么价值。卡片只是“提醒”，细节靠团队“交谈”聊出来。聊完把“怎么算做完”写成“验收标准”来“确认”。卡片加交谈加确认，就是著名的 3C。INVEST 六原则：独立、可协商、有价值、可估算、小、可测试。</p>
<p>后半本讲怎么用：故事点估算、排优先级、发布计划、迭代计划。用速率和燃尽图跟踪进度。今天几乎所有敏捷团队写需求的规矩，都出自这本书。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. </b> 完整用户故事有三部分：卡片——小卡片写一句话，只是个提醒；交谈——产品、开发、测试把细节聊透，这是最重要的；确认——把“做到什么程度算完”写成验收标准。卡片故意简略，就是逼大家开口聊。</p><p class="ex"><i>例</i>“点赞功能”卡片只写“作为刷视频的用户，我想双击点赞，以便表达喜欢”。开会一聊：点赞失败怎么办、连点三次算几次。边界情况全暴露了，文档永远写不出这么全。</p></li>
<li><p><b>2. </b> 三项缺一不可：“作为谁”逼你想清楚用户是谁；“我想要什么”说功能。“以便于什么”说背后的价值——最重要，能帮你砍掉很多没用的需求。写不出“以便于”，需求本身就没想明白。</p><p class="ex"><i>例</i>外卖 App：“作为加班族，我想按销量排序，以便找到靠谱的店不踩雷。”看到“以便于”就知道，核心是“帮用户避雷”，设计时就要突出销量和评分。</p></li>
<li><p><b>3. </b> 好故事六个标准，首字母拼成 INVEST。独立（能单独上线）、可协商（细节可谈）。有价值（对用户有价值）、可估算（能估出工作量）。小（一个迭代内做完）、可测试（做完能验证）。拿这六条一卡，烂需求立刻现形。</p><p class="ex"><i>例</i>“作为用户，我想有个好看的首页”——违反可测试和有价值。改成“作为新用户，我想在首页看到猜你喜欢，以便快速找到感兴趣的内容”。配上“首屏加载小于 2 秒”，才算合格。</p></li>
<li><p><b>4. </b> 写故事之前先回答“用户是谁”。把用户分成几类典型角色，起名字、编背景、贴照片上墙。以后讨论需求就问：“宝妈李姐会用这个功能吗？”</p><p class="ex"><i>例</i>在线教育：“鸡娃宝妈”看学习报告，“自律大学生”看打卡排名。给“考证的打工人”推 15 分钟微课——角色不同，需求完全不同。</p></li>
<li><p><b>5. </b> 多少扯皮都源于“做完了”但“不是我想要的”。开工前，产品经理和团队把验收测试写下来：一条条可验证的标准。这是给开发的“施工图”、测试的“考卷”、产品的“收货单”。不能是“体验流畅”这种空话。</p><p class="ex"><i>例</i>登录功能验收：密码输错 3 次，账号锁定 15 分钟并提示；错误提示不告诉你是账号错还是密码错（防撞库）。开发照着写，测试照着测，谁都没话说。</p></li>
<li><p><b>6. </b> 估“这个功能要几天”十有八九不准，人天会被开会、请假吃掉。用“故事点”：找个熟悉的小故事当“1 个点”，新的跟它比大小。常用斐波那契数列（1、2、3、5、8、13）。数字越大越不精确，逼着把大故事拆小。</p><p class="ex"><i>例</i>“做个静态页面”等于 1 个点，“带搜索的商品列表页”可能是 5 个点。“整个支付流程”是 13 个点——13 太大了，必须拆。估出来的不是“几天”，而是团队一个迭代能消化多少点。</p></li>
<li><p><b>7. </b> 刚收集来的需求往往巨大无比，叫“史诗”，比如“用户管理系统”。史诗不能直接进迭代，必须拆成一个个能在 1 到 2 周内做完的故事。拆的原则是“切蛋糕”：每一刀都是完整可用的功能。不是“这周做数据库、下周做界面”那种切法。</p><p class="ex"><i>例</i>“在线支付”切蛋糕：第一刀“支持支付宝付款”（界面到支付全通）。第二刀“加上微信支付”，第三刀“加上退款”。每一刀上线用户立刻能用。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>第I部分 起步：第1章 概览</b> 用户故事是什么、为什么需要它：软件需求本质是沟通问题。故事等于卡片加交谈加确认。</p><p class="ex"><i>例</i>“按文档做完了，用户说不是他想要的”——就是因为文档代替不了交谈。故事卡只是约大家来聊天的“饭局邀请函”。</p></li>
<li><p><b>第2章 编写故事、第7章 优秀准则</b> 故事的标准写法、INVEST 六原则、“切蛋糕”式拆分。</p><p class="ex"><i>例</i>“作为求职者，我想保存搜索条件，以便下次直接看新职位”。主语、功能、价值齐了。再用 INVEST 检查一遍，不合格的打回去重写。</p></li>
<li><p><b>第3-5章：用户角色建模、搜集故事、用户代理</b> 需求从哪来：先给用户画像（角色建模），再用访谈、问卷、观察搜集故事。见不到真实用户时，找“用户代理”合作。</p><p class="ex"><i>例</i>做医疗软件见不到医生，就去跟医药代表、客服聊。实在不行，让团队成员“扮演”医生走一遍流程——总比坐在办公室编需求强。</p></li>
<li><p><b>第6章 用户故事验收测试</b> 讲“确认”：在写代码之前就把验收标准定下来，由客户定义“什么算做完”。</p><p class="ex"><i>例</i>“优惠券”验收：满 100 减 10 的券。99 元不能用，100 元能用。退货后券要返还——提前写下来，开发和测试就不用猜了。</p></li>
<li><p><b>第II部分 估算和计划（第8-11章）</b> 故事点估算、排优先级、发布计划、迭代计划，以及用速率和燃尽图跟踪进度。</p><p class="ex"><i>例</i>发布计划：按优先级把故事排进待办列表，用团队的历史速率一算。“双十一前能做完哪些”一目了然——比拍脑袋定截止日期靠谱。</p></li>
<li><p><b>第IV部分 完整实例：付款管理项目</b> 全书最实在的部分：拿一个真实的付款管理项目，从头到尾演示。怎么写故事、怎么估、怎么排计划、怎么迭代。</p><p class="ex"><i>例</i>跟着这个案例走一遍：一个“史诗”怎么被拆成十几个小故事。哪些先进第一个迭代，燃尽图怎么画——相当于一次带教实习。</p></li>
    </ul>
  </details>
</article>

<article class="card" id="pv3-book-40">
  <div class="card-top"><span class="card-no">NO.40</span><span class="dchip">产品经理</span><a class="card-rating" href="https://book.douban.com/subject/1017180/" target="_blank" rel="noopener">豆瓣 8.2 · 9578人评价</a></div>
  <h3>《定位》</h3>
  <p class="meta">Positioning: The Battle for Your Mind · 艾·里斯、杰克·特劳特 · 中国财政经济出版社 · 1981</p>
  <p class="lede">营销学“圣经”：别再死磕“我的产品更好”。商战打的是用户脑子里的位置——谁先占住一个词，谁就赢。</p>
  <div class="thesis"><p>1981 年，广告人艾·里斯和杰克·特劳特出版了《定位》。当时营销界信奉“产品为王”“创意至上”。他俩泼了一盆冷水：信息爆炸的社会里，用户心智容量极其有限。它讨厌复杂、很难改变。营销的战场不在市场、不在渠道，而在潜在顾客的心智里。核心打法就几招。第一，成为第一：“更好”不如“更早”，人们只记得第一。第二，当不了第一，就开创一个新品类当第一。七喜打不过可口可乐和百事，就发明“非可乐”品类。第三，每个品类在心智里只有几个“阶梯位”。想挤上去，得用一个词“钉”住，比如沃尔沃等于安全。第四，必要时“重新定位”对手：不夸自己，而是把对手钉在不利位置上。</p>
<p>2001 年，美国营销学会把它评为“有史以来对美国营销影响最大的观念”。从王老吉的“怕上火”到瓜子二手车的“直卖网”，背后都是这套思想。</p></div>
  <details class="fold">
    <summary>核心观点 · 7<span class="chev">›</span></summary>
    <ul><li><p><b>1. </b> 全书总纲：营销不是“产品之战”，是“心智之战”。产品好不好实验室能测出来，但用户买不买取决于他脑子里怎么想。传播过度的社会里，心智为了自保变得简单粗暴。记不住的、太复杂的，一律过滤掉。</p><p class="ex"><i>例</i>加多宝没聊“我的凉茶配方多正宗”，直接在你脑子里钉了一个词。“怕上火，喝王老吉”——以后你吃火锅、熬夜，第一个蹦出来的就是它。</p></li>
<li><p><b>2. </b> 人只记得第一：第一个登上月球的阿姆斯特朗人人知道，第二个是谁？没几个人说得出来。一旦第一名在心智里扎了根，后来者再好也只是“更好的第二名”。用户通常只买第一名。</p><p class="ex"><i>例</i>可口可乐是“可乐第一”，百事再努力也只能当“第二可乐”。与其在红海跟老大拼刺刀，不如找个没人的山头先插旗。</p></li>
<li><p><b>3. </b> 第一名的位置被占了，硬挤挤不进去。解法是换赛道：自己定义一个新品类，在这个新品类里当第一。新品类的名字越简单、越跟老品类对立，效果越好。</p><p class="ex"><i>例</i>七喜打不过可口可乐和百事，就发明了“非可乐”。把饮料分成“可乐型”和“非可乐型”，自己在新品类里当老大。</p></li>
<li><p><b>4. </b> 用户的心智像架梯子，每个品类都是一架梯子。每架梯子上只有几个位置，越往上越难挤。营销的任务就是让品牌尽量往上爬。最忌讳“定位模糊”——用户想不起来你是干嘛的，等于没定位。</p><p class="ex"><i>例</i>提到“安全”你想到沃尔沃，提到“驾驶乐趣”你想到宝马。反过来，很多品牌的广告语是“高品质生活”。哪个品类都能用，等于谁的心智都没占住。</p></li>
<li><p><b>5. </b> 名字是钉入心智的钉子，好名字让人一听就知道你是干嘛的、跟谁不一样。原则：简单、好记、最好自带品类信息。最忌讳生僻字、拗口音译，或者一个名字横跨好几个不相关的品类。</p><p class="ex"><i>例</i>“瓜子二手车直卖网”，名字直接告诉你“我是干嘛的、跟中介有什么区别”。“饿了么”一听就是外卖。反过来，有些公司起个英文缩写，用户记了三年还不知道你是干嘛的。</p></li>
<li><p><b>6. </b> 最“狠”的一招：不王婆卖瓜，而是把竞争对手“重新定位”到不利位置。方法不是攻击对手产品，而是利用用户心里对老大的固有印象，轻轻推一把。关键是引起共鸣：说的必须是用户心里隐隐觉得对的事。</p><p class="ex"><i>例</i>七喜说自己是“非可乐”，潜台词是“可乐等于含咖啡因、不够健康”。把可口可乐和百事一起钉在了“可乐阵营”里。</p></li>
<li><p><b>7. </b> 书的最后把定位拉回个人：找工作、做职业规划，本质也是抢位置。方法一样：先搞清楚自己的独特价值，再想清楚抢哪个位置。然后用最简单的词让人记住，长期坚持。</p><p class="ex"><i>例</i>两个产品经理，一个简历写“3 年产品经验，负责过 App”。另一个写“从 0 到 1 做过百万用户的社交 App，专精增长”。后者一下钉住了“增长型产品经理”的位置。</p></li>
    </ul>
  </details>
  <details class="fold">
    <summary>全书结构<span class="chev">›</span></summary>
    <ul><li><p><b>开篇：定位是什么、心智备受骚扰（第1-2章）</b> 定位的基本概念：心智为什么是营销的终极战场。传播过度如何让用户的大脑变得排外、怕复杂。</p><p class="ex"><i>例</i>一个人一年要接触几十万条广告。大脑为了自保，只接收跟已有认知相符的信息。“酒香”再香，也得先挤进心智里。</p></li>
<li><p><b>切入心智：心智的小阶梯（第3-4章）</b> 心智的工作方式：每个品类在脑子里都是一架小梯子，位置有限；切入心智要简单，要借力已有的认知。</p><p class="ex"><i>例</i>“怕上火，喝王老吉”只用了 7 个字。它借了“上火”这个人人懂的概念，一下把凉茶钉进了饮料的梯子。</p></li>
<li><p><b>领导者与追随者的定位（第6-7章）</b> 第一名和第二名该怎么打：领导者守住位置、封死对手上位的路；追随者别硬碰硬，要找空位。</p><p class="ex"><i>例</i>可口可乐作为领导者，最好的策略是“正宗可乐”；百事作为追随者，打“新一代的选择”抢年轻人——各打各的，不正面拼刺刀。</p></li>
<li><p><b>重新定位竞争对手（第8章）</b> 全书最精彩的一章：怎么把对手钉在不利位置上，借力打力。</p><p class="ex"><i>例</i>七喜的“非可乐”没花一分钱攻击可口可乐。它只是重新定义了战场，把两大可乐巨头装进了“可乐型”这个筐里。</p></li>
<li><p><b>名字的威力与品牌延伸的陷阱（第9-13章）</b> 名字怎么起、品牌为什么不能乱延伸：一个名字在用户脑子里只能代表一件事。贪多必失。</p><p class="ex"><i>例</i>施乐想从复印机延伸到计算机。用户脑子里的“复印机”印象太深，计算机业务惨败。名字一旦钉死，很难再钉第二件事。</p></li>
<li><p><b>给公司、国家、产品、服务定位（第14-20章）</b> 把定位方法用到各种对象上：企业名、多元化公司、国家形象。银行、教堂——万物皆可定位。</p><p class="ex"><i>例</i>连国家都能定位：提到瑞士你想到手表和银行，提到德国你想到汽车和严谨。国家形象也是多年定位的结果。</p></li>
<li><p><b>为自己和前程定位：六步建立定位（第21-22章）</b> 把定位用在个人职业上，总结建立定位的六个步骤。认清现状、找准位置、选定对手、准备资源、长期坚持、表里如一。</p><p class="ex"><i>例</i>求职时别说“我要找一份有发展的工作”（等于没定位）。要说“我要成为母婴品类最懂增长的产品经理”——位置越具体，越容易被记住。</p></li>
    </ul>
  </details>

<script>
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
const scopes=['pv1','pv2','pv3'];
const tpls=[document.getElementById('t1'),document.getElementById('t2'),document.getElementById('t3')];
let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){stage.innerHTML='';stage.className=scopes[i];requestAnimationFrame(()=>{stage.innerHTML=tpls[i].innerHTML;});}
function setActive(i){if(i<0||i>=3)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',(e)=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=3)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%3);else if(e.key==='ArrowLeft')setActive((current+2)%3);else if(e.key==='r'||e.key==='R')mount(current);});

</script>
